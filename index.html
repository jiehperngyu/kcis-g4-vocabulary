<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KCIS G4 Learning</title>
<style>
:root{--bg:#f4f8fc;--paper:#fff;--ink:#203044;--muted:#6d7b8a;--blue:#3f78ad;--dark:#2d5f8f;--pale:#dceaf6;--line:#dce5ee;--shadow:0 8px 22px rgba(36,49,58,.08)}
*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,"SF Pro Rounded","PingFang TC",system-ui,sans-serif;background:linear-gradient(#f8fbff,#edf4fa);color:var(--ink)}
.wrap{max-width:1180px;margin:auto;padding:24px 18px 60px}header{background:linear-gradient(135deg,#315f8c,#5d91c2);color:#fff;border-radius:26px;padding:25px 28px;box-shadow:var(--shadow)}
h1{margin:0;font-size:clamp(30px,5vw,46px)}header p{margin:7px 0 0;opacity:.92}.tabs,.subtabs,.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:17px 0}
button{border:0;border-radius:999px;padding:10px 15px;background:#fff;color:var(--ink);font-weight:800;cursor:pointer;box-shadow:0 3px 10px #00000012}button.active,.primary{background:var(--blue);color:#fff}
.library{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.unit{background:#fff;border:1px solid #315f8c1a;border-radius:18px;padding:17px;box-shadow:var(--shadow)}
.unit h3{margin:0 0 12px;font-size:18px}.unit-actions{display:flex;gap:7px;flex-wrap:wrap}.unit-actions button{font-size:13px;padding:8px 11px;background:#eef5fb;color:var(--dark)}
.unit-actions button.active{background:var(--blue);color:#fff}.panel{background:#fff;border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-top:14px}.hidden{display:none!important}
.back{margin-bottom:12px}.mode-title{font-size:26px;font-weight:900;margin:5px 0 4px}.hint{color:var(--muted);font-size:14px;margin-bottom:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filters button{font-size:13px;background:#eef5fb}.filters button.active{background:var(--blue);color:#fff}
.vocab-list{display:grid;gap:11px}.vocab{display:grid;grid-template-columns:minmax(220px,30%) 1fr;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.wordside{padding:16px;background:#f3f8fd}.word{font-size:26px;font-weight:900}.pos{font-size:13px;color:var(--muted)}.zh{font-size:17px;color:var(--dark);font-weight:800;margin-top:4px}
.detail{padding:15px;line-height:1.55}.example{background:#f5f8fb;padding:10px;border-radius:11px;margin-top:8px}.tag{font-size:11px;background:var(--pale);display:inline-block;padding:4px 7px;border-radius:999px;margin-bottom:7px}
.speak{padding:5px 8px;margin-left:6px;box-shadow:none;background:var(--pale)}.quiz{max-width:850px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{text-align:left;border:2px solid var(--line)}
.correct{background:#edf7f0!important;border-color:#4d8a63!important}.wrong{background:#fbefef!important;border-color:#b95f5f!important}.question{font-size:22px;font-weight:900;margin:16px 0}.score{font-weight:900;color:var(--dark)}
.read-note{padding:22px;background:#fff8dc;border-radius:16px;line-height:1.7}.esl-head{font-size:20px;font-weight:900;margin-bottom:12px}
@media(max-width:720px){.vocab{grid-template-columns:1fr}.choices{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<header><h1>KCIS G4 Learning</h1><p>Reading：課文 × Vocabulary × Quiz　｜　ESL Vocabulary Practice</p></header>
<nav class="tabs"><button class="top active" data-page="reading">📚 Reading</button><button class="top" data-page="esl">✏️ ESL</button></nav>
<section id="home"></section><section id="study" class="hidden"></section>
</div><script>
let words=[],page="reading",activeTitle="",activeMode="vocab",quizSet=[],qi=0,correct=0,answered=0;
const titleAliases={"From Minn of the Mississippi":"from Minn of the Mississippi","from Butterfly Eyes and Other Secrets of the Meadow":"from Butterfly Eyes","Feathers, Not Just for Flying":"Feathers, Not just for fling"};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function base(g){return g.replace(/-skills vocab$/,"").replace(/-P[12]$/,"")}
function isESL(g){return g.startsWith("ESL2 Lesson")}
function readingTitles(){return [...new Set(words.filter(w=>!isESL(w.group)).map(w=>base(w.group)))]}
function groupsFor(t){return [...new Set(words.filter(w=>base(w.group)===t).map(w=>w.group))]}
function renderHome(){
 const h=document.getElementById("home"),s=document.getElementById("study");s.classList.add("hidden");h.classList.remove("hidden");
 if(page==="reading"){h.innerHTML='<div class="library">'+readingTitles().map(t=>`<article class="unit"><h3>${esc(t)}</h3><div class="unit-actions"><button onclick="openUnit('${esc(t).replace(/'/g,"\\'")}','read')">📖 Read</button><button onclick="openUnit('${esc(t).replace(/'/g,"\\'")}','vocab')">📝 Vocabulary</button><button onclick="openUnit('${esc(t).replace(/'/g,"\\'")}','quiz')">🎯 Quiz</button></div></article>`).join("")+'</div>'}
 else{const gs=[...new Set(words.filter(w=>isESL(w.group)).map(w=>w.group))];h.innerHTML='<div class="library">'+gs.map(g=>`<article class="unit"><h3>${esc(g)}</h3><div class="unit-actions"><button onclick="openESL('${esc(g).replace(/'/g,"\\'")}','vocab')">📝 Vocabulary</button><button onclick="openESL('${esc(g).replace(/'/g,"\\'")}','quiz')">🎯 Quiz</button></div></article>`).join("")+'</div>'}
}
function openUnit(t,m){activeTitle=t;activeMode=m;showStudy()} function openESL(g,m){activeTitle=g;activeMode=m;showStudy()}
function pool(){return page==="reading"?words.filter(w=>base(w.group)===activeTitle):words.filter(w=>w.group===activeTitle)}
function showStudy(){
 document.getElementById("home").classList.add("hidden");const s=document.getElementById("study");s.classList.remove("hidden");
 const modes=page==="reading"?["read","vocab","quiz"]:["vocab","quiz"];
 s.innerHTML=`<button class="back" onclick="renderHome()">← 回到${page==="reading"?" Reading Library":" ESL"}</button><div class="mode-title">${esc(activeTitle)}</div><div class="subtabs">${modes.map(m=>`<button class="${m===activeMode?"active":""}" onclick="switchMode('${m}')">${m==="read"?"📖 Read":m==="vocab"?"📝 Vocabulary":"🎯 Quiz"}</button>`).join("")}</div><div id="modeBody"></div>`;
 renderMode();
}
function switchMode(m){activeMode=m;showStudy()}
function renderMode(){
 if(activeMode==="vocab")renderVocab();else if(activeMode==="quiz")startQuiz();else renderRead();
}
function renderRead(){
 const b=document.getElementById("modeBody");
 b.innerHTML=`<div class="read-note"><b>📖 課文閱讀模式</b><br>這篇文章的 Vocabulary 已經與同一個 Reading unit 整合。完整課文與逐段朗讀資料正在從原 Reading Library 移入同一個資料來源；在完成資料搬移前，Vocabulary 與 Quiz 已先依文章整合，不會建立第二套重複單字。</div>`;
}
function renderVocab(){
 const p=pool(),gs=page==="reading"?groupsFor(activeTitle):[activeTitle];const b=document.getElementById("modeBody");
 b.innerHTML=(page==="reading"?`<div class="filters"><button class="active" onclick="drawVocab('all',this)">全部 ${p.length}</button>${gs.map(g=>`<button onclick="drawVocab('${esc(g).replace(/'/g,"\\'")}',this)">${esc(g.replace(activeTitle+"-",""))}</button>`).join("")}</div>`:"")+'<div id="vlist" class="vocab-list"></div>';
 drawVocab("all");
}
function drawVocab(g,btn){
 if(btn){document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));btn.classList.add("active")}
 const p=pool().filter(w=>g==="all"||w.group===g),root=document.getElementById("vlist");
 root.innerHTML=p.map(w=>`<article class="vocab"><div class="wordside"><div class="tag">${esc(w.group)}</div><div><span class="word">${esc(w.word)}</span><button class="speak" data-t="${esc(w.word)}" onclick="say(this.dataset.t,.9)">🔊</button></div><div class="pos">${esc(w.pos)}</div><div class="zh">${esc(w.zh)}</div></div><div class="detail"><b>English:</b> ${esc(w.en)} <button class="speak" data-t="${esc(w.en)}" onclick="say(this.dataset.t,.85)">🔊</button><div class="example"><b>Example:</b> ${esc(w.example)} <button class="speak" data-t="${esc(w.example)}" onclick="say(this.dataset.t,.85)">🔊</button><br><b>中文：</b>${esc(w.exzh)}</div></div></article>`).join("");
}
function startQuiz(){quizSet=[...pool()].sort(()=>Math.random()-.5);qi=correct=answered=0;drawQ()}
function drawQ(){
 const b=document.getElementById("modeBody");if(!quizSet.length){b.innerHTML="<p>這個分類目前沒有 Quiz 單字。</p>";return}
 if(qi>=quizSet.length){b.innerHTML=`<div class="panel quiz"><div class="question">🎉 完成！</div><div class="score">Final Score: ${correct} / ${answered}</div><br><button class="primary" onclick="startQuiz()">再測一次</button></div>`;return}
 const w=quizSet[qi],all=pool(),wrong=all.filter(x=>x.word!==w.word).sort(()=>Math.random()-.5).slice(0,3),cs=[w,...wrong].sort(()=>Math.random()-.5);
 b.innerHTML=`<div class="panel quiz"><div class="score">Score: ${correct} / ${answered}　 Question ${qi+1} / ${quizSet.length}</div><div class="question">Which word means “${esc(w.en)}”?</div><div class="choices">${cs.map(c=>`<button class="choice" data-w="${esc(c.word)}" onclick="ans(this,'${esc(w.word).replace(/'/g,"\\'")}')">${esc(c.word)}</button>`).join("")}</div><div id="fb"></div></div>`;
}
function ans(btn,target){if(document.querySelector(".choice.correct,.choice.wrong"))return;answered++;document.querySelectorAll(".choice").forEach(x=>{if(x.dataset.w===target)x.classList.add("correct")});if(btn.dataset.w===target){correct++;fb.textContent="✅ Correct!"}else{btn.classList.add("wrong");fb.textContent="❌ 正確答案是 "+target}setTimeout(()=>{qi++;drawQ()},700)}
let voice=null;function loadV(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/samantha/i.test(v.name))||vs.find(v=>/^en-US$/i.test(v.lang||""))||vs.find(v=>(v.lang||"").startsWith("en"))}if("speechSynthesis"in window){loadV();speechSynthesis.onvoiceschanged=loadV}
function say(t,r){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=r;if(voice)u.voice=voice;speechSynthesis.speak(u)}
document.querySelectorAll(".top").forEach(b=>b.onclick=()=>{document.querySelectorAll(".top").forEach(x=>x.classList.remove("active"));b.classList.add("active");page=b.dataset.page;renderHome()});
fetch("./vocabulary.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{words=d;renderHome()}).catch(()=>home.innerHTML='<div class="panel">資料載入失敗，請重新整理。</div>');
</script></body></html>
