<script>const DATA={"units": [{"n": 1, "title": "Echidna 1｜What Kind of Animal?", "range": "Echidna §1–4", "cards": [{"kind": "article", "text": "The Weird and Wonderful Echidna", "sub": "第一篇｜by Mike Jung"}, {"id": "e1", "kind": "para", "label": "Paragraph 1", "text": "Australia is home to some of the most unique animals on Earth. Kangaroos and koalas live here. A giant bird called the emu does too. Of all the creatures that live in Australia, the echidna is one of the strangest. This small creature makes its home in Australia and also on the island of New Guinea.", "u": [[38, 44], [144, 153], [226, 234]], "conn": [], "vocab": [[0, 9, "r1-0"], [38, 44, "v1-0"], [63, 72, "r1-6"], [77, 83, "r1-6"], [119, 122, "r1-3"], [144, 153, "v9-12"], [167, 176, "r1-0"], [182, 189, "r1-2"], [226, 234, "v9-12"], [253, 262, "r1-0"], [289, 299, "r1-1"]], "qs": [{"id": "e1-3", "tag": "T", "label": "THINKING", "ans": "介紹主題：echidna 是澳洲最奇特的動物之一", "tap": [], "choice": null, "groups": 1, "prompt": "第一段的作用是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">介紹主題：echidna 是澳洲最奇特的動物之一<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">說明 echidna 吃什麼<\/button><\/span>"}, {"id": "e1-4", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ [Australia]　[New Guinea]", "tap": ["Australia", "New Guinea"], "choice": null, "groups": 0, "prompt": "在文章裡點出兩個地名 [ ]。"}], "labs": []}, {"id": "e2", "kind": "para", "label": "Paragraph 2", "text": "The echidna is also known by its common name, the spiny anteater. The name describes two of the echidna's amazing traits. All echidnas have spines. Some eat ants. But those are only two of the traits of this strange and wonderful creature.", "u": [[230, 238]], "conn": [[163, 166]], "vocab": [[4, 11, "r1-2"], [50, 55, "v1-2"], [56, 64, "r1-4"], [96, 103, "r1-2"], [114, 120, "v1-3"], [126, 133, "r1-2"], [140, 146, "v1-4"], [193, 199, "v1-3"], [230, 238, "v9-12"]], "qs": [{"id": "e2-1", "tag": "W", "label": "WORD", "ans": "① have spines（有刺）　② eat ants（吃螞蟻）", "tap": ["have spines", "eat ants"], "choice": null, "groups": 0, "prompt": "<b>spiny anteater<\/b> 這個名字說出 echidna 的哪兩個 traits？① All echidnas <span class=\"slot\" data-s=\"0\">？<\/span> ② Some <span class=\"slot\" data-s=\"1\">？<\/span>"}, {"id": "e2-3", "tag": "T", "label": "THINKING", "ans": "後面還會介紹更多特徵", "tap": [], "choice": null, "groups": 1, "prompt": "<b>But those are only two of the traits<\/b>：作者在暗示 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">後面還會介紹更多特徵<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">echidna 只有兩個特徵<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "unique / creatures / spiny / traits / spines；spine → spiny"], ["purple", "THINKING LAB", "開頭先介紹主題（echidna），再用名字 spiny anteater 預告兩個特徵：有刺、吃螞蟻。"]], "group": ["e1", "e2"]}, {"id": "e3", "kind": "para", "label": "Paragraph 3", "text": "If you met an echidna, you might have a hard time figuring out what kind of animal it is. To begin with, the echidna has a beak. But it doesn't have feathers and it doesn't fly, so it's not a bird. The echidna lays soft eggs like a snake does, but the echidna is not a reptile. The echidna is a mammal.", "u": [[295, 301]], "conn": [[0, 2], [178, 180]], "vocab": [[14, 21, "r1-2"], [50, 62, "v1-5"], [109, 116, "r1-2"], [123, 127, "v1-6"], [149, 157, "r1-7"], [202, 209, "r1-2"], [252, 259, "r1-2"], [269, 276, "v1-7"], [282, 289, "r1-2"], [295, 301, "v6-9"]], "qs": [{"id": "e3-3", "tag": "T", "label": "THINKING", "ans": "a beak；soft eggs；a mammal", "tap": ["a beak", "soft eggs", "a mammal"], "choice": null, "groups": 0, "prompt": "echidna 有 <span class=\"slot\" data-s=\"0\">？<\/span>，像鳥；會生 <span class=\"slot\" data-s=\"1\">？<\/span>，像蛇；但牠其實是 <span class=\"slot\" data-s=\"2\">？<\/span>。"}, {"id": "e3-4", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ The echidna is a mammal.", "tap": ["The echidna is a mammal"], "choice": null, "groups": 0, "mode": "sentence", "prompt": "畫出：這一段的答案句（echidna 到底是什麼動物）。"}], "labs": []}, {"id": "e4", "kind": "para", "label": "Paragraph 4", "text": "The echidna belongs to a group of mammals known as monotremes. They are the only mammals on Earth that lay eggs. There are only two kinds of monotremes. One is the echidna, and the other is the platypus. Monotremes have lived on Earth longer than any other mammals. Several adaptations have helped them to thrive.", "u": [[34, 41], [51, 61], [81, 88], [141, 151], [153, 156], [177, 186], [204, 214], [257, 264], [274, 285]], "conn": [], "vocab": [[4, 11, "r1-2"], [34, 41, "v6-9"], [51, 61, "v1-11"], [81, 88, "v6-9"], [141, 151, "v1-11"], [164, 171, "r1-2"], [194, 202, "r1-5"], [204, 214, "v1-11"], [257, 264, "v6-9"], [274, 285, "v6-7"], [306, 312, "v1-10"]], "qs": [{"id": "e4-1", "tag": "W", "label": "WORD", "ans": "lay eggs（會生蛋的哺乳類）", "tap": ["lay eggs"], "choice": null, "groups": 0, "prompt": "<b>monotremes<\/b> 的定義在下一句：They are the only mammals on Earth that <span class=\"slot\" data-s=\"0\">？<\/span>"}, {"id": "e4-4", "tag": "T", "label": "THINKING", "ans": "echidna 的各種 adaptations", "tap": [], "choice": null, "groups": 1, "prompt": "最後一句 Several adaptations have helped them to thrive：作者接下來會寫 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">echidna 的各種 adaptations<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">echidna 的家人<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "beak / reptile / mammal / monotremes / adaptations / thrive"], ["purple", "THINKING LAB", "作者用「像…但不是…」一步步排除：不是鳥、不是爬蟲類，而是會生蛋的哺乳類 monotreme。"]], "group": ["e3", "e4"]}], "gist": {"opts": ["The echidna is a kind of bird that cannot fly.", "The echidna is a strange egg-laying mammal from Australia, and its adaptations help it thrive.", "Kangaroos and koalas are the most unique animals in Australia."], "ok": 1}, "quiz": [{"w": "unique", "opts": ["to grow strong and do very well", "being the only one of its kind", "living things, especially animals"], "ok": 1}, {"w": "creatures", "opts": ["living things, especially animals", "being the only one of its kind", "to grow strong and do very well"], "ok": 0}, {"w": "spiny", "opts": ["thinking about something until you understand it", "an animal with hair or fur that feeds its babies milk", "covered with sharp spines"], "ok": 2}, {"w": "traits", "opts": ["being the only one of its kind", "special qualities of an animal or a person", "body parts or ways of acting that help an animal live in its home"], "ok": 1}, {"w": "spines", "opts": ["living things, especially animals", "special qualities of an animal or a person", "sharp, pointed parts that stick out of an animal's body"], "ok": 2}, {"w": "figuring out", "opts": ["thinking about something until you understand it", "an animal with dry, scaly skin, like a snake or a turtle", "being the only one of its kind"], "ok": 0}, {"w": "beak", "opts": ["an animal with dry, scaly skin, like a snake or a turtle", "the hard, pointed mouth of a bird", "mammals that lay eggs, like the echidna and the platypus"], "ok": 1}, {"w": "reptile", "opts": ["an animal with hair or fur that feeds its babies milk", "covered with sharp spines", "an animal with dry, scaly skin, like a snake or a turtle"], "ok": 2}, {"w": "mammal", "opts": ["an animal with hair or fur that feeds its babies milk", "thinking about something until you understand it", "mammals that lay eggs, like the echidna and the platypus"], "ok": 0}, {"w": "adaptations", "opts": ["special qualities of an animal or a person", "an animal with dry, scaly skin, like a snake or a turtle", "body parts or ways of acting that help an animal live in its home"], "ok": 2}, {"w": "thrive", "opts": ["body parts or ways of acting that help an animal live in its home", "to grow strong and do very well", "being the only one of its kind"], "ok": 1}, {"w": "monotremes", "opts": ["covered with sharp spines", "mammals that lay eggs, like the echidna and the platypus", "special qualities of an animal or a person"], "ok": 1}], "say": "The echidna is not a bird because it has no feathers and cannot fly.", "pause": ["echidna 是什麼動物：有 beak 但不是鳥，會生蛋但不是爬蟲類，是會生蛋的哺乳類（monotreme）。", "beak、spines、soft eggs；和 platypus 一樣是 monotreme。"]}, {"n": 2, "title": "Echidna 2｜An Amazing Beak", "range": "Echidna §5–9 ＋ 圖說", "cards": [{"id": "e5", "kind": "para", "label": "Paragraph 5", "text": "The echidna's beak is a rare feature among mammals. It's also a fabulously adapted tool for finding food. Echidnas live in forested areas and feed on insects, worms, and other tiny creatures.", "u": [[24, 28], [43, 50], [181, 190]], "conn": [], "vocab": [[24, 28, "v2-0"], [29, 36, "v2-1"], [43, 50, "v1-8"], [64, 74, "r2-0"], [75, 82, "v2-2"], [142, 149, "v2-3"], [150, 157, "r2-2"], [159, 164, "r2-2"], [181, 190, "v1-1"]], "qs": [{"id": "e5-1", "tag": "W", "label": "WORD", "ans": "很少見；沒有 beak", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\">The echidna's beak is a <b>rare<\/b> feature among mammals：rare 是<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">很少見<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很常見<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">因為大部分 mammals<\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">沒有 beak<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">都有 beak<\/button><\/span><\/div>"}, {"id": "e5-3", "tag": "W", "label": "WORD", "ans": "以…為食", "tap": [], "choice": null, "groups": 1, "prompt": "Echidnas … <b>feed on<\/b> insects, worms, and other tiny creatures：feed on = <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">以…為食<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">餵別人<\/button><\/span>"}], "labs": []}, {"id": "e6", "kind": "para", "label": "Paragraph 6", "text": "An echidna's beak is long and pointy. However, the beak doesn't have two halves that open, like a bird's beak. Instead, the echidna uses its beak as a digging tool. It pokes and prods to find its prey. The echidna's beak is tough. In fact, it's strong enough to break open a rotten log or dig into the soil in search of a tasty meal.", "u": [], "conn": [[38, 45], [111, 118], [231, 238]], "vocab": [[30, 36, "v2-4"], [168, 183, "r2-1"], [196, 200, "v2-5"], [224, 229, "v2-6"], [275, 281, "v2-7"], [302, 306, "v2-8"]], "qs": [{"id": "e6-4", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ long；pointy；tough", "tap": ["long", "pointy", "tough"], "choice": null, "groups": 0, "prompt": "畫出：描寫 beak 樣子的三個形容詞。"}], "labs": [["green", "WORD LINKS", "rare / feature / adapted / feed on / pointy / prey / tough / rotten / soil"], ["purple", "THINKING LAB", "這兩段都在描述 beak：它很少見，像一把挖掘工具，用來找食物。"]], "group": ["e5", "e6"]}, {"id": "e7", "kind": "para", "label": "Paragraph 7", "text": "The most amazing thing about the echidna's beak is something you can't see. The beak has sensors inside it. The sensors detect electrical signals given off by living creatures. That means an echidna can locate prey without seeing, hearing, or touching it. It's a kind of mammal superpower!", "u": [[89, 96], [112, 119], [166, 175], [271, 277]], "conn": [[177, 187]], "vocab": [[89, 96, "v8-9"], [112, 119, "v8-9"], [120, 126, "v2-10"], [127, 145, "v2-11"], [146, 155, "v2-12"], [166, 175, "v1-1"], [203, 209, "v2-13"], [210, 214, "v2-5"], [271, 277, "v1-8"], [278, 288, "r2-3"]], "qs": [{"id": "e7-1", "tag": "W", "label": "WORD", "ans": "偵測到", "tap": [], "choice": null, "groups": 1, "prompt": "The sensors <b>detect<\/b> electrical signals：detect = <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">偵測到<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">製造<\/button><\/span>"}, {"id": "e7-4", "tag": "R", "label": "WRITER", "ans": "很厲害、很有趣", "tap": [], "choice": null, "groups": 1, "prompt": "It's a kind of mammal <b>superpower<\/b>!：作者用 superpower，是想讓讀者覺得 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">很厲害、很有趣<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很可怕<\/button><\/span>"}, {"id": "e7-5", "tag": "T", "label": "THINKING", "ans": "beak 裡面有 sensors", "tap": [], "choice": null, "groups": 1, "prompt": "這段是 description：作者先說 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">beak 裡面有 sensors<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">echidna 住在哪裡<\/button><\/span>，再說 sensors 能做什麼。"}], "labs": []}, {"id": "ecap", "kind": "cap", "label": "圖說 Caption", "text": "The three species of long-beaked echidna are found exclusively on the island of New Guinea.", "u": [], "conn": [], "vocab": [[10, 17, "v2-14"], [21, 32, "r2-4"], [51, 62, "v2-15"]], "qs": [{"id": "ecap-1", "tag": "W", "label": "WORD", "ans": "只在新幾內亞", "tap": [], "choice": null, "groups": 1, "prompt": "found <b>exclusively<\/b> on the island of New Guinea：意思是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">只在新幾內亞<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">新幾內亞和澳洲都有<\/button><\/span>"}, {"id": "ecap-2", "tag": "R", "label": "WRITER", "ans": "§9", "tap": [], "choice": {"opts": ["9", "5", "7"], "ok": 0}, "groups": 0, "prompt": "這段圖說和第 <span class=\"slot\">？<\/span> 段的最後一句一模一樣。"}], "labs": [["green", "WORD LINKS", "sensors / detect / electrical signals / given off / locate；species / exclusively"], ["purple", "THINKING LAB", "課本的 description 範例：先介紹特徵（sensors），再說明作用（不用看、聽、摸就能找到獵物）。"]], "group": ["e7", "ecap"]}, {"id": "e8", "kind": "para", "label": "Paragraph 8", "text": "An echidna's mouth is small, and it has no teeth. The echidna uses its beak to crush a worm or insect into tiny pieces. Then it takes the pieces into its mouth and swallows them.", "u": [], "conn": [[120, 124]], "vocab": [[79, 84, "v2-16"], [164, 172, "v2-17"]], "qs": [{"id": "e8-1", "tag": "T", "label": "THINKING", "ans": "small；has no teeth（沒有牙齒）", "tap": ["small", "has no teeth"], "choice": null, "groups": 0, "prompt": "為什麼 echidna 要先用 beak 把蟲壓碎？因為牠的嘴 <span class=\"slot\" data-s=\"0\">？<\/span>，而且 <span class=\"slot\" data-s=\"1\">？<\/span>。"}, {"id": "e8-3", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ ① crush a worm or insect into tiny pieces　② take the pieces into its mouth　③ swallow them", "tap": [], "choice": {"opts": ["① swallow it → ② crush it → ③ take it into its mouth", "① take it into its mouth → ② chew it with its teeth → ③ swallow it", "① crush it into tiny pieces → ② take the pieces into its mouth → ③ swallow them"], "ok": 2}, "groups": 0, "prompt": "用 ① ② ③ 在原文標出 echidna 吃東西的三個步驟。"}], "labs": []}, {"id": "e9", "kind": "para", "label": "Paragraph 9", "text": "Scientists classify echidnas according to beak length. There are short-beaked echidnas and long-beaked echidnas. The one species of short-beaked echidna lives throughout Australia and on New Guinea. The three species of long-beaked echidna are found exclusively on the island of New Guinea.", "u": [], "conn": [], "vocab": [[11, 19, "v2-18"], [29, 41, "v2-19"], [65, 77, "r2-4"], [91, 102, "r2-4"], [121, 128, "v2-14"], [132, 144, "r2-4"], [159, 169, "v2-20"], [209, 216, "v2-14"], [220, 231, "r2-4"], [250, 261, "v2-15"]], "qs": [{"id": "e9-1", "tag": "W", "label": "WORD", "ans": "beak length（嘴的長度）", "tap": ["beak length"], "choice": null, "groups": 0, "prompt": "Scientists <b>classify<\/b> echidnas <b>according to<\/b> beak length：科學家用什麼來分類？<span class=\"slot\" data-s=\"0\">？<\/span>"}, {"id": "e9-2", "tag": "T", "label": "THINKING", "ans": "1 種；3 種", "tap": [], "choice": {"opts": ["2；2", "3；1", "1；3"], "ok": 2}, "groups": 0, "prompt": "short-beaked echidna 有 <span class=\"slot\">？<\/span> 種；long-beaked echidna 有 <span class=\"slot\">？<\/span> 種。"}, {"id": "e9-3", "tag": "T", "label": "THINKING", "ans": "long-beaked echidnas", "tap": [], "choice": null, "groups": 1, "prompt": "哪一種只住在 New Guinea？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">long-beaked echidnas<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">short-beaked echidnas<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "crush / swallows / classify / according to / throughout"], ["purple", "THINKING LAB", "§8 是步驟（sequence），§9 是分類（classification）：資訊文常用這兩種方法整理資訊。"]], "group": ["e8", "e9"]}], "gist": {"opts": ["The echidna's tough beak is a digging tool, and the sensors inside it help the echidna find food.", "The echidna uses sharp teeth to eat insects.", "There is only one kind of echidna in the world."], "ok": 0}, "quiz": [{"w": "rare", "opts": ["makes food go down the throat", "not common; not often found", "a group of the same kind of animals or plants"], "ok": 1}, {"w": "feature", "opts": ["to notice or find something", "strong and hard to break", "an important part or quality of something"], "ok": 2}, {"w": "adapted", "opts": ["changed to be just right for a job or a place", "not common; not often found", "having a sharp end"], "ok": 0}, {"w": "feed on", "opts": ["a group of the same kind of animals or plants", "parts that notice things like heat, light, or movement", "to eat as food"], "ok": 2}, {"w": "pointy", "opts": ["an animal that is hunted for food", "to find where something is", "having a sharp end"], "ok": 2}, {"w": "prey", "opts": ["old and going bad", "an animal that is hunted for food", "having a sharp end"], "ok": 1}, {"w": "tough", "opts": ["to put things into groups", "strong and hard to break", "tiny bits of electricity that living things give off"], "ok": 1}, {"w": "rotten", "opts": ["old and going bad", "a group of the same kind of animals or plants", "to notice or find something"], "ok": 0}, {"w": "soil", "opts": ["in every part of a place", "having a sharp end", "the top layer of earth where plants grow"], "ok": 2}, {"w": "sensors", "opts": ["parts that notice things like heat, light, or movement", "tiny bits of electricity that living things give off", "makes food go down the throat"], "ok": 0}, {"w": "detect", "opts": ["to notice or find something", "based on", "sent out, like light, heat, or a smell"], "ok": 0}, {"w": "electrical signals", "opts": ["tiny bits of electricity that living things give off", "an important part or quality of something", "to press hard and break into small pieces"], "ok": 0}, {"w": "given off", "opts": ["old and going bad", "sent out, like light, heat, or a smell", "to find where something is"], "ok": 1}, {"w": "locate", "opts": ["to find where something is", "old and going bad", "makes food go down the throat"], "ok": 0}, {"w": "species", "opts": ["a group of the same kind of animals or plants", "the top layer of earth where plants grow", "changed to be just right for a job or a place"], "ok": 0}, {"w": "exclusively", "opts": ["to put things into groups", "in every part of a place", "only in one place or for one thing"], "ok": 2}, {"w": "crush", "opts": ["the top layer of earth where plants grow", "to press hard and break into small pieces", "parts that notice things like heat, light, or movement"], "ok": 1}, {"w": "swallows", "opts": ["makes food go down the throat", "to notice or find something", "an animal that is hunted for food"], "ok": 0}, {"w": "classify", "opts": ["to put things into groups", "not common; not often found", "to notice or find something"], "ok": 0}, {"w": "according to", "opts": ["not common; not often found", "a group of the same kind of animals or plants", "based on"], "ok": 2}, {"w": "throughout", "opts": ["an important part or quality of something", "only in one place or for one thing", "in every part of a place"], "ok": 2}], "say": "The echidna can find prey without seeing it because its beak has sensors.", "pause": ["echidna 的 beak：很少見，像挖掘工具，裡面有 sensors，不用看就能找到獵物。", "breaking open rotten logs、digging into the soil、sensors、crushing food。"]}, {"n": 3, "title": "Echidna 3｜Spines and Fur", "range": "Echidna §10–13", "cards": [{"id": "e10", "kind": "para", "label": "Paragraph 10", "text": "If you were to see an echidna in person, the first thing you might notice is its coat of spines. The spines are short and hollow. They are made of keratin, the same material that makes up your hair and fingernails.", "u": [], "conn": [], "vocab": [[122, 128, "v3-0"], [147, 154, "r3-0"], [165, 173, "v3-1"], [179, 187, "v3-2"], [202, 213, "r3-3"]], "qs": [{"id": "e10-1", "tag": "R", "label": "WRITER", "ans": "像外套一樣蓋滿全身", "tap": [], "choice": null, "groups": 1, "prompt": "its <b>coat<\/b> of spines：coat 在這裡是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">像外套一樣蓋滿全身<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">真的外套<\/button><\/span>"}, {"id": "e10-2", "tag": "W", "label": "WORD", "ans": "中空的", "tap": [], "choice": null, "groups": 1, "prompt": "The spines are short and <b>hollow<\/b>：hollow = <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">中空的<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很重的<\/button><\/span>"}, {"id": "e10-4", "tag": "T", "label": "THINKING", "ans": "用讀者熟悉的東西，讓 keratin 容易懂", "tap": [], "choice": null, "groups": 1, "prompt": "作者為什麼提到 your hair and fingernails？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">用讀者熟悉的東西，讓 keratin 容易懂<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">說明人也有刺<\/button><\/span>"}], "labs": []}, {"id": "e11", "kind": "para", "label": "Paragraph 11", "text": "An echidna's spines are like a coat of armor. They protect the echidna from predators such as the dingo, a kind of wild dog. When a predator approaches, an echidna rolls itself up into a ball. The ball appears to be nothing but spines. Predators usually think twice before chomping down.", "u": [], "conn": [[24, 28], [86, 93], [125, 129]], "vocab": [[39, 44, "v3-3"], [76, 85, "v3-4"], [98, 103, "r3-1"], [141, 151, "v3-5"], [236, 245, "v3-4"], [254, 265, "v3-6"], [273, 286, "r3-2"]], "qs": [{"id": "e11-1", "tag": "R", "label": "WRITER", "ans": "比喻（simile）；保護", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\">spines are <b>like a coat of armor<\/b>：這是<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">比喻（simile）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">事實<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">armor 的作用是<\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">保護<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">裝飾<\/button><\/span><\/div>"}, {"id": "e11-4", "tag": "W", "label": "WORD", "ans": "猶豫要不要咬", "tap": [], "choice": null, "groups": 1, "prompt": "Predators usually <b>think twice<\/b> before chomping down：掠食者會 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">猶豫要不要咬<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">馬上咬下去<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "hollow / material / makes up / armor / predators / approaches / think twice"], ["purple", "THINKING LAB", "spines 的第一個作用像盔甲：掠食者靠近 → 捲成球 → 掠食者不敢咬（cause → effect）。"]], "group": ["e10", "e11"]}, {"id": "e12", "kind": "para", "label": "Paragraph 12", "text": "In addition, the echidna's spines play another important role. They serve as camouflage to help the animal hide from predators. The spines are colored with sections of white, black, and brown. The spines blend well with the surrounding colors of rocks, soil, and dead leaves.", "u": [], "conn": [[0, 11]], "vocab": [[77, 87, "v3-8"], [117, 126, "v3-4"], [204, 209, "v3-9"], [224, 235, "v3-10"]], "qs": [{"id": "e12-2", "tag": "W", "label": "WORD", "ans": "幫動物躲起來", "tap": [], "choice": null, "groups": 1, "prompt": "They serve as <b>camouflage<\/b>：camouflage 的作用是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">幫動物躲起來<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">幫動物變大<\/button><\/span>"}, {"id": "e12-3", "tag": "T", "label": "THINKING", "ans": "armor（保護）；camouflage（偽裝）", "tap": [], "choice": {"opts": ["food（食物）；armor（保護）", "armor（保護）；camouflage（偽裝）", "camouflage（偽裝）；armor（保護）"], "ok": 1}, "groups": 0, "prompt": "spines 的第一個作用（§11）是 <span class=\"slot\">？<\/span>；第二個作用（§12）是 <span class=\"slot\">？<\/span>。"}, {"id": "e12-4", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ rocks, soil, and dead leaves", "tap": ["rocks, soil, and dead leaves"], "choice": null, "groups": 0, "prompt": "畫出：spines 和哪些東西的顏色 blend？"}], "labs": []}, {"id": "e13", "kind": "para", "label": "Paragraph 13", "text": "Like all other mammals, the echidna also has fur, though some echidnas are furrier than others. The amount of fur depends upon where the echidnas live. Echidnas occupy a range of habitats, from the chillier regions of Australia to warmer, drier places in New Guinea. The ones in colder areas tend to have more fur. Those in warmer climates have less.", "u": [[15, 22]], "conn": [[0, 4], [50, 56]], "vocab": [[15, 22, "v1-8"], [75, 82, "r3-4"], [114, 126, "v3-11"], [161, 167, "v3-12"], [168, 178, "v3-13"], [179, 187, "v3-14"], [198, 206, "r3-5"], [207, 214, "v3-15"], [331, 339, "v3-16"]], "qs": [{"id": "e13-3", "tag": "T", "label": "THINKING", "ans": "where the echidnas live（住在哪裡）；比較多", "tap": [], "choice": {"opts": ["how old they are", "what they eat", "where they live"], "ok": 2}, "groups": 1, "prompt": "毛的多少取決於 <span class=\"slot\">？<\/span>。住在比較冷的地方，毛 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">比較多<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">比較少<\/button><\/span>。"}], "labs": [["green", "WORD LINKS", "play a role / camouflage / blend / surrounding / depends upon / occupy / a range of / habitats / regions / climates"], ["purple", "THINKING LAB", "spines 的第二個作用是偽裝；毛的多少跟著氣候變：這也是 adaptation。"]], "group": ["e12", "e13"]}], "gist": {"opts": ["The echidna's spines are soft, so dingoes like to eat them.", "Echidnas grow new spines every winter.", "The echidna's spines protect it like armor and help it hide, and its fur changes with the climate."], "ok": 2}, "quiz": [{"w": "hollow", "opts": ["the natural homes of animals or plants", "many different kinds of", "empty inside"], "ok": 2}, {"w": "material", "opts": ["a hard covering that protects the body", "what something is made of", "to have a job or a part in something"], "ok": 1}, {"w": "makes up", "opts": ["forms the parts of something", "to live in or fill a place", "a hard covering that protects the body"], "ok": 0}, {"w": "armor", "opts": ["a hard covering that protects the body", "empty inside", "colors or shapes that help an animal hide"], "ok": 0}, {"w": "predators", "opts": ["animals that hunt and eat other animals", "to mix in so you cannot tell things apart", "empty inside"], "ok": 0}, {"w": "approaches", "opts": ["large areas of land", "comes near", "is decided by"], "ok": 1}, {"w": "think twice", "opts": ["to think carefully before doing something", "forms the parts of something", "is decided by"], "ok": 0}, {"w": "play a role", "opts": ["to have a job or a part in something", "animals that hunt and eat other animals", "is decided by"], "ok": 0}, {"w": "camouflage", "opts": ["colors or shapes that help an animal hide", "large areas of land", "what something is made of"], "ok": 0}, {"w": "blend", "opts": ["large areas of land", "is decided by", "to mix in so you cannot tell things apart"], "ok": 2}, {"w": "surrounding", "opts": ["what something is made of", "all around something", "to mix in so you cannot tell things apart"], "ok": 1}, {"w": "depends upon", "opts": ["the usual weather in a place over a long time", "is decided by", "the natural homes of animals or plants"], "ok": 1}, {"w": "occupy", "opts": ["large areas of land", "to live in or fill a place", "colors or shapes that help an animal hide"], "ok": 1}, {"w": "a range of", "opts": ["to live in or fill a place", "many different kinds of", "the usual weather in a place over a long time"], "ok": 1}, {"w": "habitats", "opts": ["to have a job or a part in something", "the natural homes of animals or plants", "all around something"], "ok": 1}, {"w": "regions", "opts": ["large areas of land", "the usual weather in a place over a long time", "colors or shapes that help an animal hide"], "ok": 0}, {"w": "climates", "opts": ["what something is made of", "to have a job or a part in something", "the usual weather in a place over a long time"], "ok": 2}], "say": "Predators leave the echidna alone because its spines are like armor.", "pause": ["spines 的兩個作用（盔甲、偽裝），以及毛的多少跟著氣候變。", "rolling into a ball、the dingo、white, black, and brown spines、more fur in colder places。"]}, {"n": 4, "title": "Echidna 4｜Tongue and Claws", "range": "Echidna §14–21", "cards": [{"id": "e14", "kind": "para", "label": "Paragraph 14", "text": "If you think the echidna's beak and spines are incredible, wait until you see its tongue! The echidna's tongue is a simply amazing tool. And it's perfectly adapted to capture the kinds of prey the echidna needs.", "u": [], "conn": [[0, 2]], "vocab": [[47, 57, "v4-0"], [167, 174, "v4-1"]], "qs": [{"id": "e14-1", "tag": "R", "label": "WRITER", "ans": "吸引讀者繼續讀下一個特徵", "tap": [], "choice": null, "groups": 1, "prompt": "<b>If you think … wait until you see its tongue!<\/b>：作者用這句 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">吸引讀者繼續讀下一個特徵<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">結束文章<\/button><\/span>"}, {"id": "e14-2", "tag": "T", "label": "THINKING", "ans": "its tongue（舌頭）", "tap": ["its tongue"], "choice": null, "groups": 0, "prompt": "前面介紹了 beak 和 spines，這一段開始介紹 <span class=\"slot\" data-s=\"0\">？<\/span>。"}, {"id": "e14-3", "tag": "W", "label": "WORD", "ans": "抓住", "tap": [], "choice": null, "groups": 1, "prompt": "perfectly adapted to <b>capture<\/b> the kinds of prey：capture = <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">抓住<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">放走<\/button><\/span>"}], "labs": []}, {"id": "e15", "kind": "para", "label": "Paragraph 15", "text": "There are two different kinds of echidna tongues. That's because different kinds of echidnas eat different kinds of food. One type of echidna has a long sticky tongue; the other type has a short tongue that is covered with hooks.", "u": [[168, 177]], "conn": [[50, 64]], "vocab": [[153, 159, "v4-2"], [223, 228, "v4-3"]], "qs": [{"id": "e15-3", "tag": "T", "label": "THINKING", "ans": "① a long sticky tongue　② a short tongue covered with hooks", "tap": [], "choice": {"opts": ["a short tongue；a tongue with teeth", "a forked tongue；a hard tongue", "a long sticky tongue；a short tongue covered with hooks"], "ok": 2}, "groups": 0, "prompt": "兩種舌頭：① <span class=\"slot\">？<\/span>　② <span class=\"slot\">？<\/span>"}], "labs": [["green", "WORD LINKS", "incredible / capture / sticky / hooks"], ["purple", "THINKING LAB", "新特徵：舌頭。不同的 echidna 吃不同的食物，所以舌頭也不同（cause → effect）。"]], "group": ["e14", "e15"]}, {"id": "e16", "kind": "para", "label": "Paragraph 16", "text": "It may seem backward, but the short-beaked echidna has a long, sticky tongue. The tongue is extremely flexible. It's great for grabbing ants, termites, and other tiny prey. The short-beaked echidna is expert at flicking its tongue into the nooks and crannies where those animals live.", "u": [], "conn": [[22, 25]], "vocab": [[63, 69, "v4-2"], [102, 110, "v4-4"], [127, 135, "v4-5"], [142, 150, "r4-0"], [211, 219, "r4-1"], [240, 258, "v4-6"]], "qs": [{"id": "e16-2", "tag": "W", "label": "WORD", "ans": "很容易彎曲", "tap": [], "choice": null, "groups": 1, "prompt": "The tongue is extremely <b>flexible<\/b>：flexible = <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">很容易彎曲<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很硬<\/button><\/span>"}, {"id": "e16-3", "tag": "T", "label": "THINKING", "ans": "ants, termites, and other tiny prey", "tap": ["ants, termites, and other tiny prey"], "choice": null, "groups": 0, "prompt": "short-beaked echidna 吃什麼？<span class=\"slot\" data-s=\"0\">？<\/span>"}], "labs": []}, {"id": "e17", "kind": "para", "label": "Paragraph 17", "text": "The long-beaked echidna doesn't eat ants at all. In fact, worms are its only prey. But its tongue is perfectly adapted for worm catching. The long-beaked echidna probes the soil with its beak. When it finds a worm, it sticks out its tongue. The tiny hooks on the tongue hook into the earthworm. Then the echidna pulls its tongue back into its mouth, and the earthworm becomes lunch!", "u": [], "conn": [[49, 56], [193, 197], [295, 299]], "vocab": [[162, 168, "r4-2"], [218, 228, "v4-7"], [250, 255, "v4-3"], [284, 293, "r4-3"], [358, 367, "r4-3"]], "qs": [{"id": "e17-2", "tag": "W", "label": "WORD", "ans": "hooks 是名詞（鉤子）；hook 是動詞（鉤住）", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\">The tiny <b>hooks<\/b> on the tongue <b>hook<\/b> into the earthworm：第一個字是<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">hooks 是名詞（鉤子）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">hooks 是動詞<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">第二個字是<\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">hook 是動詞（鉤住）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">hook 是名詞<\/button><\/span><\/div>"}, {"id": "e17-3", "tag": "T", "label": "THINKING", "ans": "sticks out its tongue；pulls its tongue back into its mouth", "tap": ["sticks out its tongue", "pulls its tongue back into its mouth"], "choice": null, "groups": 0, "prompt": "long-beaked echidna 抓蟲的順序：probes the soil → <span class=\"slot\" data-s=\"0\">？<\/span> → the hooks hook into the earthworm → <span class=\"slot\" data-s=\"1\">？<\/span>"}], "labs": [["green", "WORD LINKS", "flexible / grabbing / nooks and crannies / sticks out"], ["purple", "THINKING LAB", "短嘴配長舌（吃螞蟻）；長嘴配有鉤的短舌（只吃蟲）。兩種 adaptation 的比較。"]], "group": ["e16", "e17"]}, {"kind": "brk", "text": "☕ 休息點｜可以在這裡分兩次做。下次從 Paragraph 18 開始。"}, {"id": "e18", "kind": "para", "label": "Paragraph 18", "text": "When it comes to predators, the echidna has another secret weapon: its claws. When an echidna is startled or attacked, it hides by doing something no other mammal in the world can do. It digs itself straight down into the ground.", "u": [[156, 162]], "conn": [[78, 82]], "vocab": [[52, 65, "r4-5"], [71, 76, "v4-8"], [97, 105, "v4-9"], [156, 162, "v1-8"]], "qs": [{"id": "e18-2", "tag": "R", "label": "WRITER", "ans": "武器", "tap": [], "choice": null, "groups": 1, "prompt": "<b>secret weapon<\/b>：作者把 claws 比成 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">武器<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">食物<\/button><\/span>"}, {"id": "e18-3", "tag": "T", "label": "THINKING", "ans": "It digs itself straight down into the ground.", "tap": ["digs itself straight down into the ground"], "choice": null, "groups": 0, "prompt": "echidna 被嚇到時，做了一件別的 mammal 都做不到的事：<span class=\"slot\" data-s=\"0\">？<\/span>"}], "labs": []}, {"id": "e19", "kind": "para", "label": "Paragraph 19", "text": "How does the echidna pull off this trick? The claws play a big role. Tough and heavy, they can move a lot of dirt in a short amount of time. Other adaptations help the claws do their job.", "u": [[147, 158]], "conn": [], "vocab": [[21, 29, "v4-10"], [46, 51, "v4-8"], [109, 113, "r4-4"], [147, 158, "v1-9"], [168, 173, "v4-8"]], "qs": [{"id": "e19-1", "tag": "R", "label": "WRITER", "ans": "帶出下面的解釋", "tap": [], "choice": null, "groups": 1, "prompt": "<b>How does the echidna pull off this trick?<\/b>：作者用問句 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">帶出下面的解釋<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">考讀者<\/button><\/span>"}, {"id": "e19-3", "tag": "T", "label": "THINKING", "ans": "其他幫忙挖洞的特徵", "tap": [], "choice": null, "groups": 1, "prompt": "Other adaptations help the claws：下一段會介紹 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">其他幫忙挖洞的特徵<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">echidna 的食物<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "claws / startled / pull off"], ["purple", "THINKING LAB", "claws 是祕密武器：被嚇到 → 直直挖進土裡。"]], "group": ["e18", "e19"]}, {"id": "e20", "kind": "para", "label": "Paragraph 20", "text": "First of all, the echidna has a strong skeleton. Second, the echidna might be small, but it's incredibly muscular. Those muscles can pull hard to dig very fast!", "u": [], "conn": [[0, 12], [49, 55], [85, 88]], "vocab": [[39, 47, "v4-11"], [105, 113, "v4-12"], [121, 128, "v4-13"]], "qs": [{"id": "e20-2", "tag": "T", "label": "THINKING", "ans": "① a strong skeleton　② strong muscles（incredibly muscular）", "tap": [], "choice": {"opts": ["soft spines；a sticky tongue", "sharp teeth；a long tail", "a strong skeleton；strong muscles"], "ok": 2}, "groups": 0, "prompt": "幫 claws 挖洞的兩個 adaptations：① <span class=\"slot\">？<\/span>　② <span class=\"slot\">？<\/span>"}], "labs": []}, {"id": "e21", "kind": "para", "label": "Paragraph 21", "text": "When a predator approaches, the claws, skeleton, and muscles of the echidna go to work. In seconds, the small mammal can burrow almost completely into the earth! Once the echidna is dug in, its camouflage spines make it very hard to see. And because the only part that's exposed is spines, many predators will pass it by.", "u": [[110, 116], [121, 127]], "conn": [[0, 4], [242, 249]], "vocab": [[32, 37, "v4-8"], [39, 47, "v4-11"], [53, 60, "v4-13"], [110, 116, "v1-8"], [121, 127, "v7-1"], [271, 278, "v4-15"], [310, 320, "v4-16"]], "qs": [{"id": "e21-1", "tag": "W", "label": "WORD", "ans": "開始動起來", "tap": [], "choice": null, "groups": 1, "prompt": "the claws, skeleton, and muscles <b>go to work<\/b>：go to work 在這裡是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">開始動起來<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">去上班<\/button><\/span>"}, {"id": "e21-4", "tag": "T", "label": "THINKING", "ans": "cause-and-effect 結構；發生什麼事、造成什麼結果", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\">課本說 §21 用的是<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">cause-and-effect 結構<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">description 結構<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">因為它一步一步說明<\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">發生什麼事、造成什麼結果<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">echidna 長什麼樣子<\/button><\/span><\/div>"}], "labs": [["green", "WORD LINKS", "skeleton / muscular / muscles / burrow / exposed / pass it by"], ["purple", "THINKING LAB", "§21 是 cause and effect：掠食者靠近 → 挖進土裡 → 只露出 spines → 掠食者走開。"]], "group": ["e20", "e21"]}], "gist": {"opts": ["All echidnas have the same short tongue with hooks.", "The echidna's tongue fits the food it eats, and its strong claws let it dig into the ground to escape.", "The echidna fights predators with its sharp teeth."], "ok": 1}, "quiz": [{"w": "incredible", "opts": ["so amazing that it is hard to believe", "sharp, curved nails on an animal's feet", "to catch"], "ok": 0}, {"w": "capture", "opts": ["all the bones of a body", "to catch", "taking hold of something quickly"], "ok": 1}, {"w": "sticky", "opts": ["suddenly surprised or scared", "able to stick to things", "able to bend easily"], "ok": 1}, {"w": "hooks", "opts": ["having big, strong muscles", "curved pieces that catch and hold things", "taking hold of something quickly"], "ok": 1}, {"w": "flexible", "opts": ["taking hold of something quickly", "curved pieces that catch and hold things", "able to bend easily"], "ok": 2}, {"w": "grabbing", "opts": ["curved pieces that catch and hold things", "to dig a hole and go into it", "taking hold of something quickly"], "ok": 2}, {"w": "nooks and crannies", "opts": ["curved pieces that catch and hold things", "small, hidden spaces", "so amazing that it is hard to believe"], "ok": 1}, {"w": "sticks out", "opts": ["small, hidden spaces", "pushes out from the body", "curved pieces that catch and hold things"], "ok": 1}, {"w": "claws", "opts": ["to manage to do something hard", "sharp, curved nails on an animal's feet", "having big, strong muscles"], "ok": 1}, {"w": "startled", "opts": ["to go past without stopping", "small, hidden spaces", "suddenly surprised or scared"], "ok": 2}, {"w": "pull off", "opts": ["to manage to do something hard", "to dig a hole and go into it", "to catch"], "ok": 0}, {"w": "skeleton", "opts": ["all the bones of a body", "curved pieces that catch and hold things", "able to bend easily"], "ok": 0}, {"w": "muscular", "opts": ["so amazing that it is hard to believe", "to catch", "having big, strong muscles"], "ok": 2}, {"w": "muscles", "opts": ["small, hidden spaces", "body parts that help you move and pull", "curved pieces that catch and hold things"], "ok": 1}, {"w": "burrow", "opts": ["taking hold of something quickly", "small, hidden spaces", "to dig a hole and go into it"], "ok": 2}, {"w": "exposed", "opts": ["to go past without stopping", "not covered; easy to see", "so amazing that it is hard to believe"], "ok": 1}, {"w": "pass it by", "opts": ["suddenly surprised or scared", "taking hold of something quickly", "to go past without stopping"], "ok": 2}], "say": "Many predators pass the echidna by because only its spines are showing.", "pause": ["兩種舌頭配合不同的食物；claws、skeleton、muscles 讓 echidna 很快挖進土裡躲起來。", "sticky tongue（ants, termites）、hooked tongue（worms）、digging straight down。"]}, {"n": 5, "title": "Echidna 5｜Hidden Muscles and a Cool Body", "range": "Echidna §22–28", "cards": [{"id": "e22", "kind": "para", "label": "Paragraph 22", "text": "What's the echidna's most amazing adaptation? Some people might think it is the beak. Others might vote for the spines or the echidna's digging ability. But the echidna has another amazing adaptation that you can't see. It's a special layer of muscle that wraps around the echidna's whole body.", "u": [[34, 44], [46, 50], [86, 92], [189, 199]], "conn": [], "vocab": [[34, 44, "v1-9"], [144, 151, "v5-0"], [189, 199, "v1-9"], [235, 240, "v5-1"], [256, 268, "v5-2"]], "qs": [{"id": "e22-1", "tag": "R", "label": "WRITER", "ans": "帶出新的特徵", "tap": [], "choice": null, "groups": 1, "prompt": "<b>What's the echidna's most amazing adaptation?<\/b>：作者用問句開頭，是為了 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">帶出新的特徵<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">結束文章<\/button><\/span>"}, {"id": "e22-3", "tag": "T", "label": "THINKING", "ans": "a special layer of muscle that wraps around its whole body", "tap": [], "choice": {"opts": ["a special layer of muscle around its whole body", "a hidden second tongue", "sensors inside its spines"], "ok": 0}, "groups": 0, "prompt": "作者說的那個看不到的 adaptation 是 <span class=\"slot\">？<\/span>"}], "labs": []}, {"id": "e23", "kind": "para", "label": "Paragraph 23", "text": "This muscle layer makes the echidna's body very strong. And even more important, it allows the echidna to change its shape. It can roll itself up into a ball. Or it can flatten itself to the thickness of a spiny pancake.", "u": [], "conn": [[60, 79], [159, 161]], "vocab": [[12, 17, "v5-1"], [84, 90, "v5-3"], [169, 176, "v5-4"], [191, 200, "v5-5"], [212, 219, "r5-5"]], "qs": [{"id": "e23-3", "tag": "R", "label": "WRITER", "ans": "有刺的鬆餅；容易想像", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\">the thickness of a <b>spiny pancake<\/b>：作者把扁扁的 echidna 比成<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">有刺的鬆餅<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">一顆球<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">讓讀者<\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">容易想像<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">覺得害怕<\/button><\/span><\/div>"}], "labs": []}, {"id": "e24", "kind": "para", "label": "Paragraph 24", "text": "That extreme flexibility comes in handy. The echidna can squish itself flat to squeeze into a hiding spot when a predator lurks. It can turn itself into a ball of spines to protect itself from a hungry dingo.", "u": [[0, 4]], "conn": [], "vocab": [[5, 12, "v5-6"], [13, 24, "v5-7"], [25, 39, "v5-8"], [57, 63, "r5-0"], [79, 91, "v5-9"], [122, 127, "r5-1"]], "qs": [{"id": "e24-2", "tag": "W", "label": "WORD", "ans": "派得上用場", "tap": [], "choice": null, "groups": 1, "prompt": "comes in handy = <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">派得上用場<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">拿在手上<\/button><\/span>"}, {"id": "e24-3", "tag": "T", "label": "THINKING", "ans": "① squeeze into a hiding spot　② protect itself from a hungry dingo", "tap": ["squeeze into a hiding spot", "protect itself from a hungry dingo"], "choice": null, "groups": 0, "prompt": "flexibility 的兩個用處：① 壓扁 → <span class=\"slot\" data-s=\"0\">？<\/span>　② 捲成球 → <span class=\"slot\" data-s=\"1\">？<\/span>"}], "labs": [["green", "WORD LINKS", "ability / layer / wraps around / allows / flatten / thickness / extreme / flexibility / comes in handy / squeeze into"], ["purple", "THINKING LAB", "看不到的 adaptation：肌肉層 → 能改變形狀 → 擠進洞裡或捲成球保護自己（cause → effect）。"]], "group": ["e22", "e23", "e24"]}, {"id": "e25", "kind": "para", "label": "Paragraph 25", "text": "The echidna has one more unique feature. The echidna's body temperature is about 85 to 89 degrees Fahrenheit. (In case you are wondering, your own body temperature is a toasty 98.6 degrees Fahrenheit.) That means the echidna has a lower body temperature than any other mammal.", "u": [[25, 31], [269, 275]], "conn": [[16, 24], [202, 212]], "vocab": [[25, 31, "v1-0"], [55, 71, "v5-10"], [98, 108, "r5-2"], [147, 163, "v5-10"], [169, 175, "r5-3"], [189, 199, "r5-2"], [237, 253, "v5-10"], [269, 275, "v1-8"]], "qs": [{"id": "e25-2", "tag": "R", "label": "WRITER", "ans": "補充：用讀者自己的體溫來比較", "tap": [], "choice": null, "groups": 1, "prompt": "括號 ( ) 裡的句子是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">補充：用讀者自己的體溫來比較<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">新的重點<\/button><\/span>"}, {"id": "e25-3", "tag": "T", "label": "THINKING", "ans": "85–89；98.6；低", "tap": [], "choice": {"opts": ["98.6；85–89", "70–75；98.6", "85–89；98.6"], "ok": 2}, "groups": 1, "prompt": "echidna 的體溫約 <span class=\"slot\">？<\/span>°F；你的體溫是 <span class=\"slot\">？<\/span>°F。所以 echidna 的體溫比所有 mammals 都 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">低<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">高<\/button><\/span>"}], "labs": []}, {"id": "e26", "kind": "para", "label": "Paragraph 26", "text": "Scientists think that a cool body temperature might help the echidna live longer. Surprisingly, echidnas live as long as 45 years in the wild. Other small mammals don't live nearly as long. When they need to, echidnas can turn down their body temperature even lower than normal. When they do this, all their body functions, such as breathing, heart rate, and digestion, slow down too. This state is called torpor, and it's a bit like hibernation.", "u": [[155, 162]], "conn": [[82, 94], [324, 331]], "vocab": [[29, 45, "v5-10"], [130, 141, "v5-11"], [155, 162, "v1-8"], [238, 254, "v5-10"], [313, 322, "v5-12"], [343, 353, "v5-13"], [359, 368, "v5-14"], [390, 395, "v5-15"], [406, 412, "r5-4"], [434, 445, "v5-16"]], "qs": [{"id": "e26-2", "tag": "W", "label": "WORD", "ans": "這件事讓人驚訝", "tap": [], "choice": null, "groups": 1, "prompt": "<b>Surprisingly<\/b>, echidnas live as long as 45 years：Surprisingly 表示 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">這件事讓人驚訝<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">這件事很普通<\/button><\/span>"}, {"id": "e26-4", "tag": "W", "label": "WORD", "ans": "slow down；hibernation（冬眠）", "tap": ["slow down", "hibernation"], "choice": null, "groups": 0, "prompt": "This state is called <b>torpor<\/b>：體溫降低，身體功能都 <span class=\"slot\" data-s=\"0\">？<\/span>，有點像 <span class=\"slot\" data-s=\"1\">？<\/span>"}], "labs": [["green", "WORD LINKS", "body temperature / in the wild / functions / heart rate / digestion / state / hibernation"], ["purple", "THINKING LAB", "最後一個特徵：體溫低。科學家推測這讓 echidna 活得久（可以到 45 年）。"]], "group": ["e25", "e26"]}, {"id": "e27", "kind": "para", "label": "Paragraph 27", "text": "When in torpor, the echidna uses less energy. So it needs less food. This is useful during the winter, when prey is harder to find. It's also helpful during times of crisis, such as when a forest fire occurs.", "u": [], "conn": [[46, 48], [174, 181]], "vocab": [[8, 14, "r5-4"], [38, 44, "v5-17"], [166, 172, "v5-18"], [189, 200, "r5-6"], [201, 207, "v5-19"]], "qs": [{"id": "e27-2", "tag": "T", "label": "THINKING", "ans": "① during the winter, when prey is harder to find　② during times of crisis, such as a forest fire", "tap": [], "choice": {"opts": ["in summer, when food is everywhere；when it is very hungry", "in winter, when prey is harder to find；in a crisis, such as a forest fire", "in the morning；when it lays eggs"], "ok": 1}, "groups": 0, "prompt": "torpor 在哪兩種時候有用？① <span class=\"slot\">？<\/span>　② <span class=\"slot\">？<\/span>"}, {"id": "e27-3", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ When in torpor, the echidna uses less energy. So it needs less food.", "tap": ["When in torpor, the echidna uses less energy. So it needs less food"], "choice": null, "groups": 0, "mode": "sentence", "prompt": "畫出 §27 的因果：torpor → less energy → less food。"}], "labs": []}, {"id": "e28", "kind": "para", "label": "Paragraph 28", "text": "Scientists think this trait is one reason that the echidna has managed to survive. But it's just one of the adaptations that makes the tiny, spiny echidna one of the most amazing creatures on Earth.", "u": [[17, 27], [108, 119], [179, 188]], "conn": [[83, 86]], "vocab": [[63, 73, "v5-20"], [74, 81, "v5-21"], [108, 119, "v1-9"], [179, 188, "v1-1"]], "qs": [{"id": "e28-2", "tag": "T", "label": "THINKING", "ans": "結論：很多 adaptations 讓 echidna 活下來", "tap": [], "choice": null, "groups": 1, "prompt": "最後一段是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">結論：很多 adaptations 讓 echidna 活下來<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">另一個新的特徵<\/button><\/span>"}, {"id": "e28-3", "tag": "R", "label": "WRITER", "ans": "好記又有趣", "tap": [], "choice": null, "groups": 1, "prompt": "結尾的 the <b>tiny, spiny<\/b> echidna：這兩個押韻的字讓結尾 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">好記又有趣<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很嚴肅<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "energy / crisis / occurs / managed to / survive"], ["purple", "THINKING LAB", "torpor → 少用能量 → 少吃東西 → 冬天和災難時也活得下來。結論：很多 adaptations 讓 echidna survive。"]], "group": ["e27", "e28"]}], "gist": {"opts": ["A hidden muscle layer and a low body temperature are two more adaptations that help the echidna survive.", "The echidna's body is warmer than any other mammal's.", "Echidnas sleep all year because they never need food."], "ok": 0}, "quiz": [{"w": "ability", "opts": ["the power or skill to do something", "to stay alive", "breaking down food in the body"], "ok": 0}, {"w": "layer", "opts": ["lets something happen", "the jobs that parts of a body do", "one level of something that covers another"], "ok": 2}, {"w": "wraps around", "opts": ["one level of something that covers another", "the jobs that parts of a body do", "covers something by going all the way around it"], "ok": 2}, {"w": "allows", "opts": ["happens", "lets something happen", "the jobs that parts of a body do"], "ok": 1}, {"w": "flatten", "opts": ["living in nature, not in a zoo", "was able to do something hard", "to make something flat"], "ok": 2}, {"w": "thickness", "opts": ["how thick something is", "a long, deep sleep through the winter", "happens"], "ok": 0}, {"w": "extreme", "opts": ["was able to do something hard", "covers something by going all the way around it", "very great; as far as it can go"], "ok": 2}, {"w": "flexibility", "opts": ["breaking down food in the body", "to make something flat", "being able to bend easily"], "ok": 2}, {"w": "comes in handy", "opts": ["is useful", "the power or skill to do something", "how fast the heart beats"], "ok": 0}, {"w": "squeeze into", "opts": ["to push into a small space", "a long, deep sleep through the winter", "to make something flat"], "ok": 0}, {"w": "body temperature", "opts": ["how warm or cold a body is", "lets something happen", "to make something flat"], "ok": 0}, {"w": "in the wild", "opts": ["living in nature, not in a zoo", "lets something happen", "how fast the heart beats"], "ok": 0}, {"w": "functions", "opts": ["living in nature, not in a zoo", "the jobs that parts of a body do", "the condition something is in"], "ok": 1}, {"w": "heart rate", "opts": ["how fast the heart beats", "is useful", "to push into a small space"], "ok": 0}, {"w": "digestion", "opts": ["is useful", "how thick something is", "breaking down food in the body"], "ok": 2}, {"w": "state", "opts": ["being able to bend easily", "covers something by going all the way around it", "the condition something is in"], "ok": 2}, {"w": "hibernation", "opts": ["a long, deep sleep through the winter", "the power or skill to do something", "to push into a small space"], "ok": 0}, {"w": "energy", "opts": ["living in nature, not in a zoo", "the power that living things need to move and grow", "being able to bend easily"], "ok": 1}, {"w": "crisis", "opts": ["a time of great danger or trouble", "a long, deep sleep through the winter", "happens"], "ok": 0}, {"w": "occurs", "opts": ["happens", "the jobs that parts of a body do", "being able to bend easily"], "ok": 0}, {"w": "managed to", "opts": ["how thick something is", "covers something by going all the way around it", "was able to do something hard"], "ok": 2}, {"w": "survive", "opts": ["breaking down food in the body", "to stay alive", "the power that living things need to move and grow"], "ok": 1}], "say": "The echidna needs less food because torpor makes it use less energy.", "pause": ["看不到的肌肉層讓 echidna 改變形狀；低體溫和 torpor 讓牠少用能量、活得久。", "spiny pancake、ball of spines、85–89°F、45 years、torpor。"]}, {"n": 6, "title": "Platypus 1｜A Most Unlikely Mammal", "range": "Platypus §1–5", "cards": [{"kind": "article", "text": "The Very Peculiar Platypus", "sub": "第二篇"}, {"id": "p1", "kind": "para", "label": "Paragraph 1", "text": "In the late 1700s, British scientists got their first glimpse of a platypus. Or rather, they received a platypus \"specimen\" that someone had sent from Australia. At first, they thought it was a joke. It looked as if someone had stitched a duck's bill and webbed feet to the skin of an otter or beaver.", "u": [[114, 122]], "conn": [[77, 86], [210, 215]], "vocab": [[19, 26, "r6-0"], [54, 61, "v6-0"], [114, 122, "v6-1"], [228, 236, "v6-2"], [255, 266, "v6-3"], [285, 290, "r6-1"], [294, 300, "r6-2"]], "qs": [{"id": "p1-3", "tag": "T", "label": "THINKING", "ans": "a duck's bill and webbed feet；an otter or beaver", "tap": ["a duck's bill and webbed feet", "an otter or beaver"], "choice": null, "groups": 0, "prompt": "科學家為什麼以為是開玩笑？因為看起來像有人把 <span class=\"slot\" data-s=\"0\">？<\/span> 縫在 <span class=\"slot\" data-s=\"1\">？<\/span> 的皮上。"}], "labs": []}, {"id": "p2", "kind": "para", "label": "Paragraph 2", "text": "The platypus does look as if it were put together by a mad scientist. However, its seemingly strange collection of features and adaptations helps the platypus to survive in its Australian home.", "u": [[101, 111]], "conn": [[70, 77]], "vocab": [[55, 68, "r6-3"], [83, 92, "v6-4"], [101, 111, "v6-5"], [115, 123, "v6-6"], [128, 139, "v6-7"], [162, 169, "v6-8"]], "qs": [{"id": "p2-1", "tag": "R", "label": "WRITER", "ans": "像拼起來的，很奇怪", "tap": [], "choice": null, "groups": 1, "prompt": "put together by a <b>mad scientist<\/b>：作者用這個畫面，讓讀者覺得 platypus <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">像拼起來的，很奇怪<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很危險<\/button><\/span>"}, {"id": "p2-3", "tag": "T", "label": "THINKING", "ans": "主旨（main idea）", "tap": [], "choice": null, "groups": 1, "prompt": "§2 是整篇的 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">主旨（main idea）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">一個小細節<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "glimpse / specimen / stitched / webbed feet / seemingly / features / adaptations / survive / collection"], ["purple", "THINKING LAB", "開頭用一個真實的歷史故事吸引讀者，§2 才說出主旨：奇怪的特徵其實幫 platypus 生存。"]], "group": ["p1", "p2"]}, {"kind": "head", "text": "A Most Unlikely Mammal"}, {"id": "p3", "kind": "para", "label": "Paragraph 3", "text": "The platypus is a mammal, just like a mouse or a dog. It is a warm-blooded animal with a backbone, and it is covered with fur.", "u": [[18, 24]], "conn": [[26, 35]], "vocab": [[18, 24, "v1-8"], [62, 74, "v6-10"], [89, 97, "v6-11"]], "qs": [{"id": "p3-1", "tag": "R", "label": "WRITER", "ans": "最不像哺乳類的哺乳類", "tap": [], "choice": null, "groups": 1, "prompt": "小標題 <b>A Most Unlikely Mammal<\/b> 的意思是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">最不像哺乳類的哺乳類<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">最常見的哺乳類<\/button><\/span>"}, {"id": "p3-2", "tag": "T", "label": "THINKING", "ans": "warm-blooded；has a backbone；covered with fur", "tap": [], "choice": {"opts": ["cold-blooded；has a backbone；is covered with scales", "warm-blooded；has a backbone；is covered with fur", "warm-blooded；has no backbone；has feathers"], "ok": 1}, "groups": 0, "prompt": "platypus 是 mammal 的三個證據：① <span class=\"slot\">？<\/span> ② <span class=\"slot\">？<\/span> ③ <span class=\"slot\">？<\/span>"}], "labs": []}, {"id": "p4", "kind": "para", "label": "Paragraph 4", "text": "The average platypus is about 18 inches long, from nose to tail. It weighs anywhere from 1.5 to around 5 pounds. Males are generally larger than females. A platypus may live 13 or more years in the wild and 20 or more in captivity.", "u": [[133, 139]], "conn": [], "vocab": [[4, 11, "v6-12"], [33, 39, "r6-6"], [105, 111, "r6-6"], [191, 202, "v6-13"], [221, 230, "v6-14"]], "qs": [{"id": "p4-1", "tag": "T", "label": "THINKING", "ans": "18；1.5；5；13；20", "tap": ["18", "1.5", "5", "13", "20"], "choice": null, "groups": 0, "prompt": "數字整理：長約 <span class=\"slot\" data-s=\"0\">？<\/span> inches；重 <span class=\"slot\" data-s=\"1\">？<\/span> 到約 <span class=\"slot\" data-s=\"2\">？<\/span> pounds；野外活 <span class=\"slot\" data-s=\"3\">？<\/span> 年以上，圈養 <span class=\"slot\" data-s=\"4\">？<\/span> 年以上。"}, {"id": "p4-3", "tag": "T", "label": "THINKING", "ans": "久", "tap": [], "choice": null, "groups": 1, "prompt": "platypus 在 captivity 裡活得比在野外 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">久<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">短<\/button><\/span>"}], "labs": []}, {"id": "p5", "kind": "para", "label": "Paragraph 5", "text": "A platypus spends as much as 10 hours a day in the water. Therefore, lakes, rivers, and streams are always part of a platypus's habitat. A platypus usually forages, or hunts for food, at night. It swims underwater in search of insects, shellfish, and worms. A single dive usually lasts for a minute or two. While underwater, the platypus collects food from the river bottom and stores it in cheek pouches.", "u": [[156, 163]], "conn": [[58, 67], [165, 167]], "vocab": [[128, 135, "v6-15"], [156, 163, "v6-16"], [236, 245, "r6-4"], [378, 384, "v6-17"], [391, 404, "r6-5"]], "qs": [{"id": "p5-2", "tag": "W", "label": "WORD", "ans": "forages 的意思（context clue）", "tap": [], "choice": null, "groups": 1, "prompt": "A platypus usually <b>forages, or hunts for food<\/b>：or 後面是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">forages 的意思（context clue）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">另一個動作<\/button><\/span>"}, {"id": "p5-3", "tag": "T", "label": "THINKING", "ans": "in its cheek pouches（頰囊）", "tap": [], "choice": {"opts": ["in its burrow", "in its cheek pouches", "in its webbed feet"], "ok": 1}, "groups": 0, "prompt": "platypus 在水裡找到的食物，先放在哪裡？<span class=\"slot\">？<\/span>"}, {"id": "p5-4", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ insects, shellfish, and worms", "tap": ["insects, shellfish, and worms"], "choice": null, "groups": 0, "prompt": "畫出：platypus 吃的三種食物。"}], "labs": [["green", "WORD LINKS", "mammal / warm-blooded / backbone / average / in the wild / captivity / habitat / forages / stores"], ["purple", "THINKING LAB", "小標題下先證明它是 mammal，再用數字和習性描述它（description）。"]], "group": ["p3", "p4", "p5"]}], "gist": {"opts": ["British scientists made the first platypus as a joke.", "The platypus is a kind of duck that lives in Australia.", "The platypus looks like it was put together from different animals, but it is a mammal whose features help it survive."], "ok": 2}, "quiz": [{"w": "glimpse", "opts": ["an animal with fur or hair that feeds its babies milk", "a quick look", "being kept by people, like in a zoo"], "ok": 1}, {"w": "specimen", "opts": ["one animal or plant kept so scientists can study it", "feet with skin between the toes, good for swimming", "keeping the same body heat whether it is cold or hot"], "ok": 0}, {"w": "stitched", "opts": ["looks for food", "sewed together with a needle and thread", "feet with skin between the toes, good for swimming"], "ok": 1}, {"w": "webbed feet", "opts": ["feet with skin between the toes, good for swimming",
