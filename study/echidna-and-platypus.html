zoo"], "ok": 2}, {"w": "habitat", "opts": ["usual or normal in size or amount", "the natural home of an animal", "sewed together with a needle and thread"], "ok": 1}, {"w": "forages", "opts": ["keeps something to use later", "looks for food", "an animal with fur or hair that feeds its babies milk"], "ok": 1}, {"w": "stores", "opts": ["keeps something to use later", "looks for food", "a group of things gathered together"], "ok": 0}], "say": "Water is always part of the platypus's habitat because it spends up to 10 hours a day in the water.", "pause": ["platypus 看起來像拼起來的，但它是哺乳類，奇怪的特徵幫助它生存。", "the 1700s specimen、warm-blooded、backbone、fur、18 inches、10 hours in the water。"]}, {"n": 7, "title": "Platypus 2｜Like Other Mammals…but Not Quite", "range": "Platypus §6–8", "cards": [{"id": "p6", "kind": "para", "label": "Paragraph 6", "text": "When not looking for food, the platypus shelters in its burrow. A platypus burrow is usually built in the bank of a river or stream. Sometimes, a platypus uses rocky spots along the edge of the water as shelter. At times, it may make its burrow under logs or among the roots of a tree for protection.", "u": [[0, 25], [56, 62], [75, 81], [238, 244]], "conn": [], "vocab": [[40, 48, "v7-0"], [56, 62, "v4-14"], [75, 81, "v4-14"], [106, 110, "v7-2"], [203, 210, "r7-4"], [238, 244, "v4-14"], [269, 274, "r7-5"]], "qs": [{"id": "p6-2", "tag": "W", "label": "WORD", "ans": "河岸", "tap": [], "choice": null, "groups": 1, "prompt": "the <b>bank<\/b> of a river or stream：bank = <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">河岸<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">銀行<\/button><\/span>"}, {"id": "p6-3", "tag": "T", "label": "THINKING", "ans": "the bank of a river or stream；rocky spots along the water；under logs or among tree roots", "tap": [], "choice": {"opts": ["under the sea, in nests, on mountains", "a river bank, rocky spots by the water, under logs or tree roots", "in trees, in caves, in the desert"], "ok": 1}, "groups": 0, "prompt": "platypus 會在哪裡躲起來？寫出三個地方：<span class=\"slot\">？<\/span>"}, {"id": "p6-4", "tag": "R", "label": "WRITER", "ans": "description（描述住在哪裡）", "tap": [], "choice": null, "groups": 1, "prompt": "這一段的寫法是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">description（描述住在哪裡）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">cause and effect<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "shelters / burrow / bank"], ["purple", "THINKING LAB", "描述住的地方：都靠近水，也都可以躲起來。"]], "group": ["p6"]}, {"id": "p7", "kind": "para", "label": "Paragraph 7", "text": "In terms of size, traits, and behavior, the platypus is much like other mammals. But this is where the similarities end.", "u": [[0, 11], [72, 79], [81, 120]], "conn": [], "vocab": [[0, 11, "v7-3"], [18, 24, "v7-4"], [30, 38, "v7-5"], [72, 79, "v1-8"], [103, 115, "v7-6"]], "qs": [{"id": "p7-3", "tag": "W", "label": "WORD", "ans": "differences", "tap": [], "choice": {"opts": ["differences", "same", "similarity"], "ok": 0}, "groups": 0, "prompt": "similarities 的反義字是 <span class=\"slot\">？<\/span>"}], "labs": []}, {"id": "p8", "kind": "para", "label": "Paragraph 8", "text": "The platypus is a special kind of mammal called a monotreme. The only other monotreme is the echidna, also called the spiny anteater. Like the platypus, the echidna is found in Australia, though echidnas also live in New Guinea. All other mammals give birth to live young. However, monotremes lay eggs. This is just one of many characteristics that make the platypus unusual.", "u": [[34, 40], [50, 59], [76, 85], [239, 246], [282, 292]], "conn": [[134, 138], [188, 194], [273, 280]], "vocab": [[34, 40, "v1-8"], [50, 59, "v1-11"], [76, 85, "v1-11"], [93, 100, "r7-1"], [118, 132, "r7-2"], [157, 164, "r7-1"], [195, 202, "r7-1"], [217, 227, "r7-3"], [239, 246, "v1-8"], [247, 260, "v7-8"], [282, 292, "v1-11"], [328, 343, "v7-9"]], "qs": [{"id": "p8-1", "tag": "T", "label": "THINKING", "ans": "the platypus；the echidna", "tap": ["the platypus", "the echidna"], "choice": null, "groups": 0, "prompt": "和 Echidna §4 連起來：monotremes 只有兩種，就是 <span class=\"slot\" data-s=\"0\">？<\/span> 和 <span class=\"slot\" data-s=\"1\">？<\/span>。"}, {"id": "p8-4", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ However, monotremes lay eggs.（Echidna §4：They are the only mammals on Earth that lay eggs.）", "tap": [], "choice": {"opts": ["7", "13", "4"], "ok": 2}, "groups": 0, "prompt": "畫出：兩篇文章都說到的同一件事。Echidna 是在第 <span class=\"slot\">？<\/span> 段說的。"}], "labs": [["green", "WORD LINKS", "in terms of / traits / behavior / similarities / similar / give birth to / characteristics"], ["purple", "THINKING LAB", "這裡是兩篇交會的地方：Platypus §8 和 Echidna §4 都說 monotremes 會生蛋。把兩篇的資訊合起來，就是 synthesize。"]], "group": ["p7", "p8"]}], "gist": {"opts": ["The platypus lives in burrows near the water and is like other mammals in many ways, but it lays eggs like the echidna.", "The platypus lives in trees and never goes into the water.", "All mammals lay eggs, so the platypus is not special."], "ok": 0}, "quiz": [{"w": "shelters", "opts": ["the way an animal or a person acts", "a hole that an animal digs to live in", "stays in a safe place"], "ok": 2}, {"w": "burrow", "opts": ["almost the same", "a hole that an animal digs to live in", "ways that things are alike"], "ok": 1}, {"w": "bank", "opts": ["the land along the side of a river", "almost the same", "when talking about"], "ok": 0}, {"w": "in terms of", "opts": ["when talking about", "stays in a safe place", "to have a baby"], "ok": 0}, {"w": "traits", "opts": ["stays in a safe place", "special qualities", "to have a baby"], "ok": 1}, {"w": "behavior", "opts": ["the way an animal or a person acts", "the land along the side of a river", "special qualities that make something what it is"], "ok": 0}, {"w": "similarities", "opts": ["special qualities", "ways that things are alike", "to have a baby"], "ok": 1}, {"w": "similar", "opts": ["a hole that an animal digs to live in", "stays in a safe place", "almost the same"], "ok": 2}, {"w": "give birth to", "opts": ["a hole that an animal digs to live in", "ways that things are alike", "to have a baby"], "ok": 2}, {"w": "characteristics", "opts": ["special qualities that make something what it is", "the land along the side of a river", "to have a baby"], "ok": 0}], "say": "The platypus is unusual because it lays eggs instead of giving birth to live young.", "pause": ["platypus 住在水邊的洞穴；它在很多方面像其他哺乳類，但和 echidna 一樣會生蛋。", "river bank、rocky spots、logs and roots、monotremes、lays eggs。"]}, {"n": 8, "title": "Platypus 3｜Ducklike Features", "range": "Platypus §9–11", "cards": [{"kind": "head", "text": "Ducklike Features"}, {"id": "p9", "kind": "para", "label": "Paragraph 9", "text": "The platypus's ducklike bill is its most notable feature. And its webbed feet are just as striking. Its bill and feet make it look more like a strange bird than a mammal.", "u": [[41, 48], [163, 169]], "conn": [[82, 89]], "vocab": [[15, 23, "r8-3"], [41, 48, "v8-0"], [90, 98, "v8-1"], [163, 169, "v1-8"]], "qs": [{"id": "p9-1", "tag": "W", "label": "WORD", "ans": "像…的", "tap": [], "choice": null, "groups": 1, "prompt": "<b>ducklike<\/b> bill：-like 的意思是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">像…的<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">不喜歡<\/button><\/span>"}, {"id": "p9-3", "tag": "T", "label": "THINKING", "ans": "一隻奇怪的鳥", "tap": [], "choice": null, "groups": 1, "prompt": "bill 和 feet 讓 platypus 看起來比較像 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">一隻奇怪的鳥<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">一條魚<\/button><\/span>"}], "labs": []}, {"id": "p10", "kind": "para", "label": "Paragraph 10", "text": "However, these features play important roles in survival. Because the platypus hunts for food underwater, swimming skills are vital to survival. A platypus's webbed feet make it an excellent swimmer. Using a rowing motion—first one front foot, then the other—the animal moves easily through the water. It can also hover in one spot, even against the current, while it searches for something to eat.", "u": [[48, 56], [135, 143]], "conn": [[0, 7], [58, 65]], "vocab": [[24, 44, "v8-2"], [48, 56, "v9-19"], [126, 131, "v8-3"], [135, 143, "v9-19"], [181, 198, "r8-4"], [208, 221, "r8-0"], [314, 319, "v8-4"], [350, 357, "v8-5"]], "qs": [{"id": "p10-4", "tag": "W", "label": "WORD", "ans": "停在原地；水流", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\">It can also <b>hover<\/b> in one spot, even against the <b>current<\/b>：hover<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">停在原地<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">游走<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">current<\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">水流<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">現在<\/button><\/span><\/div>"}], "labs": [["green", "WORD LINKS", "notable / striking / play important roles / vital / hover / current / survival"], ["purple", "THINKING LAB", "看起來奇怪的 webbed feet，其實讓它游得很好：外表 → 作用（feature → survival）。"]], "group": ["p9", "p10"]}, {"id": "p11", "kind": "para", "label": "Paragraph 11", "text": "Underwater, a platypus closes its eyes, ears, and nostrils. But how can the animal find food? Here is where the platypus's extraordinary bill comes into play. Unlike a duck's hard bill, a platypus's bill is rubbery. It serves as the platypus's sense organ when under the water. The bill has sensors that pick up electrical signals from prey.", "u": [[244, 249], [291, 298]], "conn": [[159, 165]], "vocab": [[50, 58, "v8-6"], [123, 136, "v8-7"], [142, 157, "v8-8"], [207, 214, "r8-1"], [244, 255, "r8-2"], [291, 298, "v2-9"], [304, 311, "v8-10"], [312, 330, "v8-11"], [336, 340, "v8-12"]], "qs": [{"id": "p11-1", "tag": "R", "label": "WRITER", "ans": "帶出答案：bill", "tap": [], "choice": null, "groups": 1, "prompt": "<b>But how can the animal find food?<\/b>：作者用問句 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">帶出答案：bill<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">考讀者<\/button><\/span>"}, {"id": "p11-3", "tag": "T", "label": "THINKING", "ans": "sensors；electrical signals", "tap": ["sensors", "electrical signals"], "choice": null, "groups": 0, "prompt": "Synthesize：platypus 的 bill 和 echidna 的 beak 都有 <span class=\"slot\" data-s=\"0\">？<\/span>，能偵測獵物的 <span class=\"slot\" data-s=\"1\">？<\/span>（Echidna §7）。"}, {"id": "p11-4", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ eyes, ears, and nostrils", "tap": ["eyes, ears, and nostrils"], "choice": null, "groups": 0, "prompt": "畫出：platypus 在水裡關起來的三個部位。"}], "labs": [["green", "WORD LINKS", "nostrils / extraordinary / comes into play / sensors / pick up / electrical signals / prey / sense"], ["purple", "THINKING LAB", "眼睛、耳朵、鼻孔都關起來，靠 bill 的 sensors 找食物。和 echidna 的 beak 一樣。"]], "group": ["p11"]}], "gist": {"opts": ["The platypus finds food with its big eyes underwater.", "The platypus's webbed feet make it a great swimmer, and its rubbery bill uses sensors to find prey underwater.", "The platypus's bill is hard, just like a duck's bill."], "ok": 1}, "quiz": [{"w": "notable", "opts": ["to stay in one place in the air or water", "have important jobs", "important and easy to notice"], "ok": 2}, {"w": "striking", "opts": ["very easy to notice because it is unusual", "important and easy to notice", "very important; needed to live"], "ok": 0}, {"w": "play important roles", "opts": ["have important jobs", "to notice or receive", "tiny bits of electricity given off by living things"], "ok": 0}, {"w": "vital", "opts": ["very unusual and special", "starts to be used or to matter", "very important; needed to live"], "ok": 2}, {"w": "hover", "opts": ["one of the ways the body learns about the world, like seeing or hearing", "have important jobs", "to stay in one place in the air or water"], "ok": 2}, {"w": "current", "opts": ["have important jobs", "tiny bits of electricity given off by living things", "water moving in one direction"], "ok": 2}, {"w": "nostrils", "opts": ["water moving in one direction", "very easy to notice because it is unusual", "the two holes in the nose"], "ok": 2}, {"w": "extraordinary", "opts": ["to stay in one place in the air or water", "very unusual and special", "water moving in one direction"], "ok": 1}, {"w": "comes into play", "opts": ["an animal that is hunted for food", "starts to be used or to matter", "very important; needed to live"], "ok": 1}, {"w": "sensors", "opts": ["one of the ways the body learns about the world, like seeing or hearing", "parts that notice things like heat, light, or movement", "to stay in one place in the air or water"], "ok": 1}, {"w": "pick up", "opts": ["to notice or receive", "parts that notice things like heat, light, or movement", "water moving in one direction"], "ok": 0}, {"w": "electrical signals", "opts": ["important and easy to notice", "tiny bits of electricity given off by living things", "very easy to notice because it is unusual"], "ok": 1}, {"w": "prey", "opts": ["an animal that is hunted for food", "one of the ways the body learns about the world, like seeing or hearing", "starts to be used or to matter"], "ok": 0}, {"w": "sense", "opts": ["starts to be used or to matter", "one of the ways the body learns about the world, like seeing or hearing", "to notice or receive"], "ok": 1}], "say": "The platypus can find food underwater because its bill has sensors.", "pause": ["webbed feet 讓 platypus 很會游泳；rubbery bill 的 sensors 讓它在水裡找到食物。", "rowing motion、hover against the current、closes its eyes, ears, and nostrils、sensors。"]}, {"n": 9, "title": "Platypus 4｜Eggs, Poison, and an Oddity", "range": "Platypus §12–17", "cards": [{"kind": "head", "text": "Eggs Like a Reptile"}, {"id": "p12", "kind": "para", "label": "Paragraph 12", "text": "Platypus eggs aren't like the hard, oval eggs that most birds lay. Instead, platypus eggs are similar to the round, leathery eggs that reptiles such as lizards and turtles lay. The leathery shells are flexible. They are less likely to break during incubation than a hard-shelled egg would be.", "u": [[94, 101]], "conn": [[67, 74]], "vocab": [[36, 40, "v9-0"], [94, 101, "v7-7"], [116, 124, "v9-1"], [135, 143, "v9-2"], [152, 159, "r9-6"], [164, 171, "r9-6"], [181, 189, "v9-1"], [201, 209, "v9-3"], [248, 258, "r9-0"]], "qs": [{"id": "p12-2", "tag": "T", "label": "THINKING", "ans": "hard；oval；round；leathery", "tap": ["hard", "oval", "round", "leathery"], "choice": null, "groups": 0, "prompt": "比較：鳥蛋是 <span class=\"slot\" data-s=\"0\">？<\/span>、<span class=\"slot\" data-s=\"1\">？<\/span>；platypus 蛋是 <span class=\"slot\" data-s=\"2\">？<\/span>、<span class=\"slot\" data-s=\"3\">？<\/span>。"}, {"id": "p12-3", "tag": "T", "label": "THINKING", "ans": "孵蛋時比較不容易破", "tap": [], "choice": null, "groups": 1, "prompt": "leathery shells 有什麼好處？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">孵蛋時比較不容易破<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">比較好吃<\/button><\/span>"}, {"id": "p12-4", "tag": "R", "label": "WRITER", "ans": "soft eggs, like a snake does", "tap": [], "choice": {"opts": ["no eggs; it has live young", "hard, oval eggs, like a bird's", "soft eggs, like a snake's"], "ok": 2}, "groups": 0, "prompt": "Synthesize：Echidna §3 說 echidna 生的是 <span class=\"slot\">？<\/span>。"}], "labs": []}, {"id": "p13", "kind": "para", "label": "Paragraph 13", "text": "The female platypus lays one to three eggs. She lays the eggs in a deep burrow and incubates them for about 10 days. When the baby platypuses hatch, they are naked and blind. Only the female platypus cares for the young. Like other mammals, the female platypus feeds milk to her young. When the platypuses are three to four months old, they leave the burrow. At that point, they have a full coat of fur. They have to learn how to swim and find food for themselves.", "u": [[72, 78], [142, 147], [232, 239], [351, 357]], "conn": [[221, 225]], "vocab": [[72, 78, "v4-14"], [83, 92, "v9-4"], [142, 147, "v9-5"], [158, 173, "r9-5"], [232, 239, "v1-8"], [351, 357, "v4-14"]], "qs": [{"id": "p13-1", "tag": "T", "label": "THINKING", "ans": "1–3；10；3–4", "tap": [], "choice": {"opts": ["5–6；30；12", "1–3；10；3–4", "1–3；100；1"], "ok": 1}, "groups": 0, "prompt": "數字整理：一次生 <span class=\"slot\">？<\/span> 顆蛋；孵大約 <span class=\"slot\">？<\/span> 天；寶寶 <span class=\"slot\">？<\/span> 個月大時離開洞穴。"}, {"id": "p13-2", "tag": "W", "label": "WORD", "ans": "沒有毛、看不見", "tap": [], "choice": null, "groups": 1, "prompt": "When the baby platypuses <b>hatch<\/b>, they are naked and blind：寶寶剛孵出來時 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">沒有毛、看不見<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很大、很強壯<\/button><\/span>"}, {"id": "p13-4", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ ① lays eggs in a deep burrow　② incubates them about 10 days　③ babies hatch, naked and blind, and drink milk　④ leave the burrow at 3–4 months with fur", "tap": [], "choice": {"opts": ["① lay eggs → ② leave the burrow → ③ babies hatch → ④ incubate", "① babies hatch → ② lay eggs → ③ leave the burrow → ④ drink milk", "① lay eggs in a burrow → ② incubate about 10 days → ③ babies hatch and drink milk → ④ leave the burrow at 3–4 months"], "ok": 2}, "groups": 0, "prompt": "用 ① ② ③ ④ 標出 platypus 寶寶長大的順序。"}], "labs": [["green", "WORD LINKS", "oval / leathery / reptiles / flexible / incubates / hatch / similar"], ["purple", "THINKING LAB", "像爬蟲類一樣生軟殼蛋，又像哺乳類一樣餵奶：兩種特徵混在一起。"]], "group": ["p12", "p13"]}, {"kind": "head", "text": "Platypus Poison"}, {"id": "p14", "kind": "para", "label": "Paragraph 14", "text": "The male platypus has a particular feature that the female does not share. Like some species of insects, spiders, and snakes, the male platypus has venom. Sharp spurs on the heels of its hind feet deliver the venom, which is produced by a special gland in the male's thigh. Given a choice, a platypus dives underwater to escape a predator. Or it dashes down a burrow. But if there is no choice, a male platypus uses its spurs to protect itself.", "u": [[216, 221], [360, 366]], "conn": [[274, 288], [368, 393]], "vocab": [[24, 34, "v9-6"], [85, 92, "v9-7"], [148, 153, "v9-8"], [161, 166, "r9-1"], [197, 204, "v9-9"], [209, 214, "v9-8"], [247, 252, "r9-2"], [267, 272, "r9-3"], [330, 338, "v9-10"], [346, 352, "v9-11"], [360, 366, "v4-14"], [420, 425, "r9-1"]], "qs": [{"id": "p14-1", "tag": "T", "label": "THINKING", "ans": "male（公的）", "tap": [], "choice": null, "groups": 1, "prompt": "哪一種 platypus 有 venom？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">male（公的）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">female（母的）<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "particular / species / venom / deliver / predator / dashes"], ["purple", "THINKING LAB", "只有公的有毒：先逃（潛水、躲洞），沒辦法才用毒刺保護自己。"]], "group": ["p14"]}, {"kind": "head", "text": "A Well-Adapted Oddity"}, {"id": "p15", "kind": "para", "label": "Paragraph 15", "text": "The platypus might be the oddest-looking creature on Earth. It seems to be part duck, otter, and beaver. And part snake and spider, too. It's a hodgepodge of strange features that don't seem to belong together.", "u": [[41, 49]], "conn": [], "vocab": [[41, 49, "v1-1"], [144, 154, "r9-4"]], "qs": [{"id": "p15-1", "tag": "W", "label": "WORD", "ans": "奇怪的東西", "tap": [], "choice": null, "groups": 1, "prompt": "小標題 <b>A Well-Adapted Oddity<\/b>：oddity 來自 odd（奇怪），意思是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">奇怪的東西<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">普通的東西<\/button><\/span>"}, {"id": "p15-2", "tag": "T", "label": "THINKING", "ans": "duck, otter, beaver, snake, and spider", "tap": [], "choice": {"opts": ["bird, dog, mouse, lizard, and ant", "duck, fish, frog, cat, and bee", "duck, otter, beaver, snake, and spider"], "ok": 2}, "groups": 0, "prompt": "platypus 看起來像哪五種動物？<span class=\"slot\">？<\/span>"}, {"id": "p15-3", "tag": "W", "label": "WORD", "ans": "大雜燴（混在一起）", "tap": [], "choice": null, "groups": 1, "prompt": "a <b>hodgepodge<\/b> of strange features：hodgepodge = <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">大雜燴（混在一起）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">一種動物<\/button><\/span>"}], "labs": []}, {"id": "p16", "kind": "para", "label": "Paragraph 16", "text": "It shares the basic features of all mammals. But, unlike other mammals, the platypus does not give birth to live young. It lays leathery eggs instead. The duckbill and webbed feet make it well suited for its habitat. And, similar to a spider or snake, a platypus can defend itself with venom.", "u": [[36, 43], [63, 70], [222, 229]], "conn": [[50, 56]], "vocab": [[36, 43, "v1-8"], [63, 70, "v1-8"], [128, 136, "v9-1"], [188, 199, "v9-13"], [222, 229, "v7-7"], [267, 273, "v9-14"], [286, 291, "v9-8"]], "qs": [{"id": "p16-1", "tag": "R", "label": "WRITER", "ans": "把前面小標題的重點再整理一次（summary）", "tap": [], "choice": null, "groups": 1, "prompt": "§16 是在 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">把前面小標題的重點再整理一次（summary）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">加入新的資訊<\/button><\/span>"}, {"id": "p16-2", "tag": "T", "label": "THINKING", "ans": "Eggs Like a Reptile；Ducklike Features；Platypus Poison", "tap": [], "choice": {"opts": ["Ducklike Features；Eggs Like a Reptile；Platypus Poison", "Eggs Like a Reptile；Ducklike Features；Platypus Poison", "Platypus Poison；Ducklike Features；Eggs Like a Reptile"], "ok": 1}, "groups": 0, "prompt": "對照小標題：lays leathery eggs →「<span class=\"slot\">？<\/span>」；duckbill and webbed feet →「<span class=\"slot\">？<\/span>」；venom →「<span class=\"slot\">？<\/span>」"}, {"id": "p16-3", "tag": "W", "label": "WORD", "ans": "和…相似", "tap": [], "choice": null, "groups": 1, "prompt": "<b>similar to<\/b> a spider or snake：similar to = <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">和…相似<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">和…不同<\/button><\/span>"}], "labs": []}, {"id": "p17", "kind": "para", "label": "Paragraph 17", "text": "The platypus looks like an animal made up of spare parts. But these seemingly unlikely adaptations allow the platypus to find food, protect itself, and reproduce successfully. This ensures the survival of these fascinating creatures.", "u": [[176, 180], [193, 201], [223, 232]], "conn": [], "vocab": [[45, 56, "v9-15"], [152, 161, "v9-16"], [181, 188, "v9-17"], [193, 201, "v9-19"], [211, 222, "v9-18"], [223, 232, "v1-1"]], "qs": [{"id": "p17-1", "tag": "R", "label": "WRITER", "ans": "用備用零件拼成的動物", "tap": [], "choice": null, "groups": 1, "prompt": "<b>made up of spare parts<\/b>：作者把 platypus 比成 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">用備用零件拼成的動物<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">一隻普通的動物<\/button><\/span>，和 §2 的 mad scientist 互相呼應。"}, {"id": "p17-2", "tag": "T", "label": "THINKING", "ans": "find food；protect itself；reproduce", "tap": ["find food", "protect itself", "reproduce"], "choice": null, "groups": 0, "prompt": "adaptations 讓 platypus 能做哪三件事？① <span class=\"slot\" data-s=\"0\">？<\/span> ② <span class=\"slot\" data-s=\"1\">？<\/span> ③ <span class=\"slot\" data-s=\"2\">？<\/span>"}, {"id": "p17-4", "tag": "T", "label": "THINKING", "ans": "adaptations 幫助動物生存", "tap": [], "choice": null, "groups": 1, "prompt": "Synthesize：Echidna §28 和 Platypus §17 的結論都在說 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">adaptations 幫助動物生存<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">動物都很危險<\/button><\/span>"}], "labs": [["green", "WO <script>
(function(){
  var KEY = "ep-web-v1", store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) {}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
  store.done = store.done || {};
  var VOC = DATA.voc, main = document.getElementById("main"), tabsEl = document.getElementById("tabs");
  function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function norm(s){ return s.toLowerCase().replace(/[’]/g, "'").replace(/[“”]/g, '"'); }
  function ranges(text, phrase){
    var out = [], t = norm(text), p = norm(phrase).trim(); if (!p) return out;
    var i = t.indexOf(p); while (i >= 0){ out.push([i, i + p.length]); i = t.indexOf(p, i + 1); }
    return out;
  }
  function clearMarks(){
    document.querySelectorAll(".w.found,.w.sel,.w.miss,.w.hov").forEach(function(x){ x.classList.remove("found", "sel", "miss", "hov"); });
  }
  var lastQ = null;
  document.addEventListener("click", function(e){
    var box = e.target.closest(".q");
    if (box && box !== lastQ){ clearMarks(); lastQ = box; }
  }, true);
  function sentences(text){
    var out = [], start = 0, re = /[.!?]["”’)]*(?=\s|$)|:(?=\s+[A-Z])|\n/g, m;
    while ((m = re.exec(text))){ var end = m.index + m[0].length; if (text.slice(start, end).trim()) out.push([start, end]); start = end; }
    if (text.slice(start).trim()) out.push([start, text.length]);
    return out;
  }
  function speak(word){
    try { var u = new SpeechSynthesisUtterance(word); u.lang = "en-US"; u.rate = .85; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
  }

  // ---------- passage ----------
  function renderPassage(card){
    var box = el("div", "ptext"), text = card.text, re = /[A-Za-z0-9§][A-Za-z0-9'’\-]*/g, last = 0, m;
    function cls(a, b){
      var c = [];
      card.vocab.forEach(function(r){ if (a < r[1] && b > r[0]) c.push(VOC[r[2]].star ? "vs" : "vr"); });
      return c;
    }
    var conn = card.conn || [];
    var phrases = conn.map(function(r){ return [r[0], r[1], 1]; }).concat(card.vocab.filter(function(r){ return /\s/.test(text.slice(r[0], r[1])); }).map(function(r){ return [r[0], r[1], 0]; }));
    while ((m = re.exec(text))){
      if (m.index > last) box.appendChild(document.createTextNode(text.slice(last, m.index)));
      var a0 = m.index, b0 = m.index + m[0].length, ph = phrases.filter(function(r){ return r[0] === a0; })[0];
      if (ph){ b0 = ph[1]; re.lastIndex = b0; }
      var s = el("span", "w " + (ph && ph[2] ? "cn" : cls(a0, b0).join(" ")));
      s.textContent = text.slice(a0, b0); s.dataset.a = a0; s.dataset.b = b0; s.tabIndex = 0;
      box.appendChild(s); last = b0;
    }
    if (last < text.length) box.appendChild(document.createTextNode(text.slice(last)));
    return box;
  }

  function wordBox(box, key){
    var v = VOC[key];
    box.className = "wordbox";
    box.innerHTML = '<div class="wb-top"><span class="wb-w"></span><span class="wb-pos"></span><button type="button" class="say">▶ 聽</button></div>' +
      '<div class="wb-zh"></div>' + (v.en ? '<div class="wb-en"></div>' : "") + (v.grow ? '<div class="wb-grow"><span class="gl">讓字長大</span>' + v.grow + "</div>" : "");
    box.querySelector(".wb-w").textContent = v.w; box.querySelector(".wb-pos").textContent = v.pos;
    box.querySelector(".wb-zh").textContent = v.zh; if (v.en) box.querySelector(".wb-en").textContent = v.en;
    box.querySelector(".say").onclick = function(){ speak(v.w.replace("…", "")); };
  }

  // ---------- one paragraph desk ----------
  function renderCard(card, unit){
    if (card.kind === "brk") return el("div", "brk", card.text);
    if (card.kind === "article"){ var ar = el("div", "article"); ar.appendChild(el("span", null, "")).textContent = card.sub; ar.appendChild(document.createTextNode(card.text)); return ar; }
    if (card.kind === "head"){ var hd = el("div", "subhead"); hd.textContent = card.text; return hd; }
    var desk = el("div", "desk"), left = el("div", "leftcol"), panel = el("div", "panel");
    desk.id = "c-" + card.id;
    left.appendChild(el("div", "plabel", card.label + "<small>點字看意思</small>"));
    var ptext = renderPassage(card); left.appendChild(ptext);
    var bar = el("div", "tapbar"); bar.hidden = true; left.appendChild(bar);
    var wb = el("div", "wordbox empty", "點文章裡畫底線或點線的字，這裡會出現它的意思和字族。");
    panel.appendChild(wb);
    var active = null;

    function setActive(q){
      if (active){ active.box.classList.remove("active"); }
      active = q;
      ptext.classList.toggle("tapping", !!q);
      ptext.classList.toggle("sentmode", !!(q && q.d.mode === "sentence"));
      ptext.querySelectorAll(".hov").forEach(function(x){ x.classList.remove("hov"); });
      if (q){
        q.box.classList.add("active"); bar.hidden = false;
        bar.innerHTML = "<span>第 " + q.num + " 題：" + (q.d.mode === "sentence" ? "點一下，選整句話" : "在文章裡點出答案") + "（點錯會變紅）</span>";
        var c = el("button", null, "先不要"); c.type = "button"; c.onclick = function(){ setActive(null); };
        bar.appendChild(c);
        if (window.matchMedia("(max-width:760px)").matches) ptext.scrollIntoView({block: "center", behavior: "smooth"});
      } else bar.hidden = true;
    }

    var SENTS = sentences(card.text);
    function sentOf(a){ return SENTS.filter(function(r){ return a >= r[0] && a < r[1]; })[0]; }
    function wordsIn(r){ return Array.prototype.filter.call(ptext.querySelectorAll(".w"), function(x){ return +x.dataset.a < r[1] && +x.dataset.b > r[0]; }); }
    ptext.addEventListener("mouseover", function(e){
      if (!active || active.d.mode !== "sentence") return;
      var w = e.target.closest(".w"); ptext.querySelectorAll(".hov").forEach(function(x){ x.classList.remove("hov"); });
      if (w){ var r = sentOf(+w.dataset.a); if (r) wordsIn(r).forEach(function(x){ x.classList.add("hov"); }); }
    });
    ptext.addEventListener("click", function(e){
      var w = e.target.closest(".w"); if (!w) return;
      var a = +w.dataset.a, b = +w.dataset.b;
      if (active && active.d.mode === "sentence"){
        var r = sentOf(a); if (!r) return;
        var ws = wordsIn(r), ok = tapAnswer(active, r[0], r[1], null, true);
        if (ok){ ws.forEach(function(x){ x.classList.add("found"); x.classList.remove("hov"); }); }
        else ws.forEach(function(x){ x.classList.remove("miss"); void x.offsetWidth; x.classList.add("miss"); });
        return;
      }
      if (active){ tapAnswer(active, a, b, w); return; }
      var hit = card.vocab.filter(function(r){ return a < r[1] && b > r[0]; })[0];
      clearMarks(); lastQ = null;
      if (hit){
        ptext.querySelectorAll(".w").forEach(function(x){ if (+x.dataset.a < hit[1] && +x.dataset.b > hit[0]) x.classList.add("sel"); });
        wordBox(wb, hit[2]);
      }
    });
    ptext.addEventListener("keydown", function(e){ if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("w")){ e.preventDefault(); e.target.click(); } });

    function markRange(r, cls){
      ptext.querySelectorAll(".w").forEach(function(x){ if (+x.dataset.a < r[1] && +x.dataset.b > r[0]) x.classList.add(cls); });
    }
    function tapAnswer(q, a, b, w, quiet){
      var hitT = -1;
      q.targets.forEach(function(t, ti){
        if (q.got[ti]) return;
        if (t.r.some(function(r){ return a < r[1] && b > r[0]; })) hitT = hitT < 0 ? ti : hitT;
      });
      if (hitT < 0){ if (w){ w.classList.remove("miss"); void w.offsetWidth; w.classList.add("miss"); } q.miss++; return false; }
      q.got[hitT] = 1;
      var r = q.targets[hitT].r.filter(function(r){ return a < r[1] && b > r[0]; })[0];
      markRange(r, "found");
      var slot = q.box.querySelector('.slot[data-s="' + hitT + '"]'); if (slot){ slot.textContent = q.targets[hitT].t; slot.classList.add("got"); }
      if (q.got.every(Boolean)){ setActive(null); q.part(); }
      return true;
    }

    // questions
    var qObjs = [];
    card.qs.forEach(function(qd, idx){
      var box = el("div", "q"), q = {d: qd, box: box, num: idx + 1, need: 0, have: 0, miss: 0};
      box.innerHTML = '<div class="qh"><span class="tag t-' + qd.tag + '">' + qd.label + '</span><span class="qn">' + (idx + 1) + '</span><span class="qstate"></span></div><div class="qp">' + qd.prompt + "</div>";
      var id = qd.id;
      function finish(){
        box.classList.add("done");
        box.querySelector(".qstate").textContent = q.miss ? "✓ 完成" : "✓ 一次就對";
        if (!box.querySelector(".ansline")) box.appendChild(el("div", "ansline", "<b>參考答案</b>" + qd.ans));
        if (!store.done[id]){ store.done[id] = q.miss ? 2 : 1; save(); }
        checkLabs(); progress();
      }
      q.part = function(){ q.have++; if (q.have >= q.need) finish(); };
      // inline option groups
      box.querySelectorAll(".og").forEach(function(g){
        q.need++;
        g.addEventListener("click", function(e){
          var b = e.target.closest(".opt"); if (!b || g.dataset.ok) return;
          if (b.dataset.ok === "1"){ b.classList.add("right"); g.dataset.ok = 1; g.querySelectorAll(".opt").forEach(function(x){ x.disabled = true; }); q.part(); }
          else { b.classList.add("wrong"); b.disabled = true; q.miss++; }
        });
      });
      // generated choice
      if (qd.choice){
        q.need++;
        var ch = el("div", "choice");
        qd.choice.opts.forEach(function(o, i){
          var b = el("button", "opt"); b.type = "button"; b.textContent = o;
          b.onclick = function(){
            if (ch.dataset.ok) return;
            if (i === qd.choice.ok){ b.classList.add("right"); ch.dataset.ok = 1; ch.querySelectorAll(".opt").forEach(function(x){ x.disabled = true; });
              var slots = box.querySelectorAll(".slot"), parts = o.split("；");
              slots.forEach(function(s, k){ s.textContent = parts[k] || ""; s.classList.add("got"); });
              q.part(); }
            else { b.classList.add("wrong"); b.disabled = true; q.miss++; }
          };
          ch.appendChild(b);
        });
        box.appendChild(ch);
      }
      // tap in passage
      if (qd.tap && qd.tap.length){
        q.need++;
        q.targets = qd.tap.map(function(t){ return {t: t, r: ranges(card.text, t)}; });
        q.got = q.targets.map(function(){ return 0; });
        var tb = el("button", "tapbtn", "到文章裡點答案（共 " + qd.tap.length + " 個）"); tb.type = "button";
        tb.onclick = function(){ if (!box.classList.contains("done")) setActive(q); };
        box.appendChild(tb);
        q.box.addEventListener("click", function(e){ if (e.target === tb) return; });
        var oldPart = q.part;
        q.part = function(){ tb.hidden = true; oldPart(); };
        // when the tap part is the last one, tapAnswer calls q.part through the tap path
      }
      if (qd.reveal){
        q.need++;
        var rb = el("button", "revealbtn", "想好了，看答案"); rb.type = "button";
        rb.onclick = function(){ rb.hidden = true; q.part(); };
        box.appendChild(rb);
      }
      if (q.need === 0) q.need = 1;
      // restore
      if (store.done[id]){
        q.miss = store.done[id] === 2 ? 1 : 0;
        box.querySelectorAll(".og").forEach(function(g){ g.dataset.ok = 1; g.querySelectorAll(".opt").forEach(function(x){ x.disabled = true; if (x.dataset.ok === "1") x.classList.add("right"); }); });
        var chd = box.querySelector(".choice");
        if (chd){ chd.dataset.ok = 1; chd.querySelectorAll(".opt").forEach(function(x, i){ x.disabled = true; if (i === qd.choice.ok) x.classList.add("right"); });
          var parts = qd.choice.opts[qd.choice.ok].split("；"); box.querySelectorAll(".slot").forEach(function(s, k){ s.textContent = parts[k] || ""; s.classList.add("got"); }); }
        if (q.targets){ q.targets.forEach(function(t, k){ q.got[k] = 1; var s = box.querySelector('.slot[data-s="' + k + '"]'); if (s){ s.textContent = t.t; s.classList.add("got"); } }); }
        box.querySelectorAll(".tapbtn,.revealbtn").forEach(function(x){ x.hidden = true; });
        q.have = q.need; box.classList.add("done");
        box.querySelector(".qstate").textContent = q.miss ? "✓ 完成" : "✓ 一次就對";
        box.appendChild(el("div", "ansline", "<b>參考答案</b>" + qd.ans));
      }
      qObjs.push(q); panel.appendChild(box);
    });

    // Lab (shown after the whole group is done)
    var labBox = null;
    function checkLabs(){
      if (!card.labs.length) return;
      var all = (card.group || [card.id]).every(function(cid){
        var c = unit.cards.filter(function(x){ return x.id === cid; })[0];
        return c.qs.every(function(qd){ return store.done[qd.id]; });
      });
      labBox.innerHTML = all ? "<p>為什麼？Lab 解說</p>" + card.labs.map(function(l){ return '<div class="lab ' + l[0] + '"><b>' + l[1] + "</b>" + l[2] + "</div>"; }).join("")
                             : "做完這一組的題目，這裡會出現 Lab 解說。";
      labBox.className = all ? "labs" : "locked";
    }
    if (card.labs.length){ labBox = el("div", "locked"); panel.appendChild(labBox); checkLabs(); document.addEventListener("am-progress", checkLabs); }
    desk.appendChild(left); desk.appendChild(panel);
    return desk;
  }

  // ---------- simple MCQ (main idea, quiz) ----------
  function mcq(opts, ok, onDone, id){
    var box = el("div", "mc");
    opts.forEach(function(o, i){
      var b = el("button", "opt", '<span class="wl">' + "abc"[i] + "</span><span></span>"); b.type = "button";
      b.lastChild.textContent = o;
      b.onclick = function(){
        if (box.dataset.ok) return;
        if (i === ok){ b.classList.add("right"); box.dataset.ok = 1; box.querySelectorAll(".opt").forEach(function(x){ x.disabled = true; });
          if (!store.done[id]){ store.done[id] = box.dataset.miss ? 2 : 1; save(); } onDone && onDone(); progress(); }
        else { b.classList.add("wrong"); b.disabled = true; box.dataset.miss = 1; }
      };
      if (store.done[id]){ b.disabled = true; if (i === ok) b.classList.add("right"); }
      box.appendChild(b);
    });
    if (store.done[id]) box.dataset.ok = 1;
    return box;
  }

  var STEPS = [["1", "精讀", "Close Read"], ["2", "大意", "Main Idea"], ["3", "單字小考", "Word Check"], ["4", "說出來", "Say It"]];
  function renderUnit(u){
    var wrap = el("div", "unit"); wrap.id = "unit-" + u.n; wrap.dataset.unit = u.n; wrap.hidden = true;
    wrap.innerHTML = '<header class="uhead"><span class="badge">Unit ' + u.n + "</span><h2></h2><p class=\"range\"></p><nav class=\"steps\">" +
      STEPS.map(function(s){ return '<a href="#u' + u.n + "-s" + s[0] + '"><b>' + s[0] + "</b>" + s[1] + "</a>"; }).join("") + "</nav></header>";
    wrap.querySelector("h2").textContent = u.title; wrap.querySelector(".range").textContent = u.range;
    function step(n, inner, how){
      var s = el("section", "step"); s.id = "u" + u.n + "-s" + n;
      var st = STEPS[n - 1]; s.appendChild(el("h3", null, '<span class="sn">' + st[0] + "</span>" + st[1] + "<em>" + st[2] + "</em>"));
      if (how) s.appendChild(el("p", "howto", how));
      s.appendChild(inner); wrap.appendChild(s); return s;
    }
    var cr = el("div");
    u.cards.forEach(function(c){ cr.appendChild(renderCard(c, u)); });
    step(1, cr, "先讀左邊的段落。不懂的字點一下看意思。右邊的題目用點的作答：選項直接點；黃色按鈕的題目要到文章裡點出答案。");
    var g = el("div"); g.appendChild(el("p", null, "<b>上面 " + u.range + " 主要在講什麼？</b>")); g.appendChild(mcq(u.gist.opts, u.gist.ok, null, "g" + u.n));
    step(2, g);
    var qz = el("div"), grid = el("div", "qgrid"), sc = el("p", "score");
    function score(){ var got = u.quiz.filter(function(_, i){ return store.done["z" + u.n + "-" + i] === 1; }).length; sc.innerHTML = "一次就答對：<b>" + got + "</b> / " + u.quiz.length; }
    u.quiz.forEach(function(z, i){ var c = el("div", "qz"); c.appendChild(el("b", null, (i + 1) + ". ")); c.firstChild.appendChild(document.createTextNode(z.w)); c.appendChild(mcq(z.opts, z.ok, score, "z" + u.n + "-" + i)); grid.appendChild(c); });
    qz.appendChild(grid); qz.appendChild(sc); score();
    step(3, qz, "選出每個字的英文意思。第一次就點對才算分。");
    var talk = el("div");
    talk.innerHTML = '<ul class="talk"><li><label><input type="checkbox"> 這一節主要解釋什麼？</label></li><li><label><input type="checkbox"> 作者用了哪些細節或例子？</label></li><li><label><input type="checkbox"> 用 because / so 說一個因果</label></li></ul>' +
      '<details class="ex"><summary>說完了，看範例</summary><p><b>主要解釋</b>　' + u.pause[0] + "</p><p><b>動物例子</b>　" + u.pause[1] + "</p><p><b>because / so</b>　</p></details>";
    talk.querySelector(".ex p:last-child").appendChild(document.createTextNode(u.say));
    step(4, talk, "說給爸爸或媽媽聽。");
    var nx = el("div", "unext");
    nx.innerHTML = u.n < DATA.units.length ? '<a class="btn" href="#unit-' + (u.n + 1) + '">下一個 Unit →</a>' : '<p class="btn" style="display:inline-block">九個 Unit 都完成了！</p>';
    wrap.appendChild(nx);
    return wrap;
  }

  DATA.units.forEach(function(u){
    var t = el("a", "utab", "<b>Unit " + u.n + "</b><span></span><i></i>"); t.href = "#unit-" + u.n; t.dataset.u = u.n;
    t.querySelector("span").textContent = u.title; tabsEl.appendChild(t);
    main.appendChild(renderUnit(u));
  });

  function progress(){
    DATA.units.forEach(function(u){
      var ids = [];
      u.cards.forEach(function(c){ (c.qs || []).forEach(function(q){ ids.push(q.id); }); });
      ids.push("g" + u.n); u.quiz.forEach(function(_, i){ ids.push("z" + u.n + "-" + i); });
      var done = ids.filter(function(i){ return store.done[i]; }).length;
      var bar = tabsEl.querySelector('[data-u="' + u.n + '"] i'); if (bar) bar.style.width = Math.round(done / ids.length * 100) + "%";
    });
    document.dispatchEvent(new Event("am-progress"));
  }

  function route(){
    var h = location.hash.replace("#", ""), m = h.match(/^u(\d+)-s\d+$/) || h.match(/^unit-(\d+)$/);
    var n = m ? m[1] : (store.unit || "1");
    document.querySelectorAll(".unit").forEach(function(x){ x.hidden = x.dataset.unit !== String(n); });
    tabsEl.querySelectorAll(".utab").forEach(function(x){ x.classList.toggle("on", x.dataset.u === String(n)); });
    store.unit = String(n); save();
    var target = h && document.getElementById(h); if (target) target.scrollIntoView({block: "start"});
  }
  window.addEventListener("hashchange", route);

  document.getElementById("reset").addEventListener("click", function(){
    if (this.dataset.sure !== "1"){ this.dataset.sure = "1"; this.textContent = "再按一次就清除全部"; return; }
    store = {done: {}}; save(); location.reload();
  });
  progress(); route();
})();
</script>
