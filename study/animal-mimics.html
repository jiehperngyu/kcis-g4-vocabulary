 0, "mode": "sentence", "prompt": "在文章裡點出：說「這些特徵有什麼用」的那一句。"}], "labs": [["green", "WORD LINKS", "predator / prey；adapt / adapted / adaptation；species 單複數同形"], ["purple", "THINKING LAB", "定義 → 動物面臨生存壓力 → 某些特徵有助於避開掠食者。"]], "group": ["p1"]}, {"id": "p2", "kind": "para", "label": "Paragraph 2", "text": "Mimics copy the appearance, action, or sound of another animal that predators fear or do not like to eat. The animals they copy are called models. Let's learn more about these copycats in nature.", "u": [[16, 26], [139, 145], [176, 184]], "conn": [], "vocab": [[0, 6, "v1-5"], [16, 26, "v1-6"], [68, 77, "v1-0"], [139, 145, "r1-0"], [176, 184, "v1-7"]], "qs": [{"id": "p2-3", "tag": "W", "label": "WORD", "ans": "they = mimics；models 是「被模仿的」", "tap": ["mimics"], "choice": null, "groups": 1, "prompt": "The animals <b>they<\/b> copy：they 指 <span class=\"slot\" data-s=\"0\">？<\/span>；models 是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"0\">去模仿的<\/button><button type=\"button\" class=\"opt\" data-ok=\"1\">被模仿的<\/button><\/span>"}, {"id": "p2-4", "tag": "T", "label": "THINKING", "ans": "介紹更多大自然裡的例子", "tap": [], "choice": null, "groups": 1, "prompt": "作者先下定義，最後一句說接下來要做什麼？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">介紹更多大自然裡的例子<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">結束這篇文章<\/button><\/span>"}], "labs": []}, {"id": "cap2", "kind": "cap", "label": "圖說 Caption", "text": "The caterpillar of the spicebush swallowtail butterfly looks like a snake or lizard because of the shape of its back and the eyespots.", "u": [[125, 133]], "conn": [[84, 91]], "vocab": [[4, 15, "r1-2"], [23, 44, "r1-1"], [77, 83, "r1-3"]], "qs": [{"id": "cap2-2", "tag": "R", "label": "WRITER", "ans": "mimic = caterpillar（毛毛蟲）；model = snake；lizard（snake 和 lizard 順序可對調）", "tap": ["caterpillar", "snake", "lizard"], "choice": null, "groups": 0, "prompt": "這張照片裡，mimic 是 <span class=\"slot\" data-s=\"0\">？<\/span>，model 是 <span class=\"slot\" data-s=\"1\">？<\/span> 或 <span class=\"slot\" data-s=\"2\">？<\/span>。"}], "labs": [["green", "WORD LINKS", "mimic (v./n.) / mimicry (n.)；model 在此是「被模者」"], ["purple", "THINKING LAB", "作者先下定義，再用 examples 展開；注意模者與 model 的角色。"]], "group": ["p2", "cap2"]}], "gist": {"opts": ["How animals find food in different places.", "How some animals look, act, or sound like other animals to stay safe.", "Why predators are bigger than prey."], "ok": 1}, "quiz": [{"w": "predators", "opts": ["animals that copy how another animal looks, acts, or sounds", "animals that hunt and eat other animals", "an animal that is hunted by another animal"], "ok": 1}, {"w": "prey", "opts": ["an animal that is hunted by another animal", "animals that hunt and eat other animals", "animals that copy how another animal looks, acts, or sounds"], "ok": 0}, {"w": "adapted", "opts": ["changed over time to fit a place or a need", "animals or people who copy others", "a group of living things that are the same kind"], "ok": 0}, {"w": "features", "opts": ["animals that hunt and eat other animals", "parts of something that make it look or act a certain way", "animals that copy how another animal looks, acts, or sounds"], "ok": 1}, {"w": "species", "opts": ["animals that hunt and eat other animals", "an animal that is hunted by another animal", "a group of living things that are the same kind"], "ok": 2}, {"w": "mimics", "opts": ["animals that copy how another animal looks, acts, or sounds", "parts of something that make it look or act a certain way", "animals that hunt and eat other animals"], "ok": 0}, {"w": "appearance", "opts": ["parts of something that make it look or act a certain way", "how someone or something looks", "animals or people who copy others"], "ok": 1}, {"w": "copycats", "opts": ["parts of something that make it look or act a certain way", "an animal that is hunted by another animal", "animals or people who copy others"], "ok": 2}], "say": "Predators leave the caterpillar alone because it looks like a snake.", "pause": ["解釋什麼是 mimicry（擬態）：動物模仿另一種動物的外表、動作或聲音，來騙過掠食者、保護自己。", "spicebush swallowtail 的毛毛蟲（看起來像蛇或蜥蜴）。"]}, {"n": 2, "title": "Batesian Mimicry", "range": "原文 §3–6 ＋ 2 段圖說", "cards": [{"id": "p3", "kind": "para", "label": "Paragraph 3", "text": "There are different kinds of mimicry. One kind is called Batesian mimicry. It is named after Henry Walter Bates, a naturalist. He discovered that some weaker animals adapted to their environment by copying or looking like dangerous animals. These weaker animals often have no defenses, such as stingers or poisons. Instead, they look very much like other animals that do, and so their enemies leave them alone.", "u": [[57, 73], [183, 194], [276, 284]], "conn": [[315, 322]], "vocab": [[29, 36, "v2-0"], [57, 73, "r2-0"], [93, 111, "r2-1"], [115, 125, "r2-2"], [183, 194, "v2-1"], [276, 284, "v2-2"], [294, 302, "r2-3"]], "qs": [{"id": "p3-4", "tag": "W", "label": "WORD", "ans": "do = have defenses（有防禦能力）", "tap": [], "choice": {"opts": ["have defenses", "leave them alone", "copy dangerous animals"], "ok": 0}, "groups": 0, "prompt": "other animals that <b>do<\/b>：這個 do 是在 do 什麼？（往前一句找）<span class=\"slot\">？<\/span>"}, {"id": "p3-5", "tag": "T", "label": "THINKING", "ans": "較弱、沒有防禦的動物模仿危險的動物", "tap": [], "choice": null, "groups": 1, "prompt": "作者用這段告訴我們，Batesian mimicry 是：<br><span class=\"og vert\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"0\">有毒的動物模仿無害的動物<\/button><button type=\"button\" class=\"opt\" data-ok=\"1\">較弱、沒有防禦的動物模仿危險的動物<\/button><\/span>"}, {"id": "p3-6", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ These weaker animals often have no defenses, such as stingers or poisons.", "tap": ["These weaker animals often have no defenses, such as stingers or poisons"], "choice": null, "groups": 0, "mode": "sentence", "prompt": "在文章裡點出：哪一句說這些動物「沒有防禦」？"}], "labs": [["green", "WORD LINKS", "defend / defense(s)；poison / poisonous"], ["purple", "THINKING LAB", "Batesian：較弱、缺乏防禦能力的動物模仿危險動物；不是牠自己真的有毒。"]], "group": ["p3"]}, {"id": "p4", "kind": "para", "label": "Paragraph 4", "text": "One example of Batesian mimicry is the hoverfly. Over time this fly has adapted to have yellow and black stripes like a bee. Animals know that a bee will sting them, so they leave this kind of fly alone.", "u": [[39, 47], [72, 79], [105, 112], [154, 159]], "conn": [[166, 168]], "vocab": [[15, 31, "r2-0"], [39, 47, "r2-4"], [105, 112, "v2-3"], [154, 159, "v2-4"]], "qs": [{"id": "p4-3", "tag": "W", "label": "WORD", "ans": "不去招惹", "tap": [], "choice": null, "groups": 1, "prompt": "<b>leave … alone<\/b>：<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">不去招惹<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">把牠單獨留下<\/button><\/span>"}, {"id": "p4-4", "tag": "T", "label": "THINKING", "ans": "因為牠長得像蜜蜂，掠食者怕被螫，所以不吃牠", "tap": [], "choice": null, "groups": 1, "prompt": "作者為什麼舉 hoverfly 當例子？<br><span class=\"og vert\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"0\">因為牠很會螫人<\/button><button type=\"button\" class=\"opt\" data-ok=\"1\">因為牠長得像蜜蜂，掠食者怕被螫，所以不吃牠<\/button><\/span>"}, {"id": "p4-5", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ Animals know that a bee will sting them, so they leave this kind of fly alone.", "tap": ["Animals know that a bee will sting them, so they leave this kind of fly alone"], "choice": null, "groups": 0, "mode": "sentence", "prompt": "在文章裡點出：說明「掠食者為什麼不吃 hoverfly」的那一句。"}], "labs": []}, {"id": "cap4", "kind": "cap", "label": "圖說 Caption", "text": "The hoverfly, or flower fly, not only looks like a bee or wasp, but it also drinks nectar, as bees do. These flies cannot sting, as bees do, though.", "u": [], "conn": [[29, 37], [64, 67], [71, 75], [91, 93], [129, 131]], "vocab": [[4, 12, "r2-4"], [122, 127, "v2-4"]], "qs": [{"id": "cap4-2", "tag": "R", "label": "WRITER", "ans": "cannot；假裝危險", "tap": ["cannot"], "choice": null, "groups": 1, "prompt": "這段圖說有一件<b>正文沒寫<\/b>、而且很重要的事：These flies <span class=\"slot\" data-s=\"0\">？<\/span> sting.<br>這讓你更確定 hoverfly 是：<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"0\">真的危險<\/button><button type=\"button\" class=\"opt\" data-ok=\"1\">假裝危險<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "adapt / adapted；sting / stung / stung；stripe / stripes"], ["purple", "THINKING LAB", "食蚜蠅像蜜蜂 → 掠食者擔心被螫 → 避開食蚜蠅。"]], "group": ["p4", "cap4"]}, {"id": "p5", "kind": "para", "label": "Paragraph 5", "text": "Coral, king, and milk snakes are excellent examples of Batesian mimicry. Coral snakes are poisonous. King and milk snakes are not. Coral snakes have colorful scales in bands of black, red, and yellow. The yellow bands always touch the red ones. These colors announce the snakes' deadly poison. Some king and milk snakes also have bands of red, black, and yellow, but they are arranged in a different order.", "u": [[90, 99], [158, 164], [168, 173], [212, 217], [279, 285], [330, 335], [376, 384]], "conn": [[363, 366]], "vocab": [[0, 5, "r2-5"], [7, 11, "r2-5"], [17, 28, "r2-5"], [55, 71, "r2-0"], [73, 78, "r2-5"], [90, 99, "v2-5"], [101, 105, "r2-5"], [110, 121, "r2-5"], [131, 136, "r2-5"], [158, 164, "v2-6"], [168, 173, "v2-7"], [212, 217, "v2-7"], [279, 285, "v2-8"], [299, 303, "r2-5"], [308, 319, "r2-5"], [330, 335, "v2-7"], [376, 384, "v2-9"]], "qs": [{"id": "p5-1", "tag": "W", "label": "WORD", "ans": "bands（色帶）", "tap": ["bands"], "choice": null, "groups": 0, "prompt": "The yellow bands always touch the red <b>ones<\/b>：ones 指的是 <span class=\"slot\" data-s=\"0\">？<\/span>"}, {"id": "p5-3", "tag": "W", "label": "WORD", "ans": "讓人一看就知道", "tap": [], "choice": null, "groups": 1, "prompt": "These colors <b>announce<\/b> the snakes' deadly poison. announce 在這裡是：<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"0\">在廣播裡宣布消息<\/button><button type=\"button\" class=\"opt\" data-ok=\"1\">讓人一看就知道<\/button><\/span>"}, {"id": "p5-4", "tag": "T", "label": "THINKING", "ans": "顏色相似，不代表一定有毒", "tap": [], "choice": null, "groups": 1, "prompt": "作者比較珊瑚蛇和王蛇、奶蛇的花紋，是想告訴我們：<br><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"0\">紅、黃、黑的蛇全都有毒<\/button><button type=\"button\" class=\"opt\" data-ok=\"1\">顏色相似，不代表一定有毒<\/button><\/span>"}, {"id": "p5-5", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ King and milk snakes are not.", "tap": ["King and milk snakes are not"], "choice": null, "groups": 0, "mode": "sentence", "prompt": "在文章裡點出：說「king and milk snakes 沒有毒」的那一句。"}], "labs": [["green", "WORD LINKS", "poison (n.) / poisonous (adj.)；arrange / arranged / arrangement"], ["purple", "THINKING LAB", "比較珊瑚蛇與王蛇、奶蛇的花紋；不能把顏色相似當作一定有毒。"]], "group": ["p5"]}, {"id": "p6", "kind": "para", "label": "Paragraph 6", "text": "It is not always easy to tell these snakes apart. A predator will often leave king or milk snakes alone because it sees their colors and believes that they are poisonous, too.", "u": [[25, 48]], "conn": [[104, 111]], "vocab": [[25, 48, "v2-10"], [78, 82, "r2-5"], [86, 97, "r2-5"], [160, 169, "v2-5"]], "qs": [{"id": "p6-1", "tag": "W", "label": "WORD", "ans": "分辨", "tap": [], "choice": null, "groups": 1, "prompt": "<b>tell … apart<\/b>：<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"0\">告訴別人<\/button><button type=\"button\" class=\"opt\" data-ok=\"1\">分辨<\/button><\/span>"}, {"id": "p6-4", "tag": "T", "label": "THINKING", "ans": "參考：因為牠們長得像有毒的珊瑚蛇，掠食者以為牠們也有毒，就不吃牠們。", "tap": [], "choice": {"opts": ["因為牠們真的有毒", "因為牠們長得像有毒的珊瑚蛇，掠食者以為牠們也有毒，就不吃牠們", "因為牠們跑得很快，掠食者追不到"], "ok": 1}, "groups": 0, "prompt": "king snake 和 milk snake 沒有毒，為什麼還能活下來？用一句中文說：<span class=\"slot\">？<\/span>"}], "labs": []}, {"id": "cap6", "kind": "cap", "label": "圖說 Caption", "text": "This king snake (above) has adapted its coloring as a defense. Predators see bands like those of the coral snake (below) and leave the snake alone.", "u": [], "conn": [[49, 51]], "vocab": [[5, 9, "r2-5"], [54, 61, "v2-2"], [77, 82, "v2-7"], [101, 106, "r2-5"]], "qs": [{"id": "cap6-2", "tag": "W", "label": "WORD", "ans": "those = bands（色帶）", "tap": ["bands"], "choice": null, "groups": 0, "prompt": "bands like <b>those<\/b> of the coral snake：those 指的是 <span class=\"slot\" data-s=\"0\">？<\/span>"}], "labs": [["green", "WORD LINKS", "tell … apart = 分辨；color / coloring"], ["purple", "THINKING LAB", "相似外觀使掠食者誤判；找出文章提供的因果證據。"]], "group": ["p6", "cap6"]}], "gist": {"opts": ["Harmless animals look like dangerous animals, so predators leave them alone.", "Dangerous animals hunt harmless animals at night.", "Snakes change color in different places."], "ok": 0}, "quiz": [{"w": "mimicry", "opts": ["put things in a certain order", "when one animal looks, acts, or sounds like another animal", "stripes or rings of color around something"], "ok": 1}, {"w": "environment", "opts": ["able to make you sick or kill you if you eat or touch it", "long, thin lines of color", "all the living things and conditions around an animal or plant"], "ok": 2}, {"w": "defenses", "opts": ["ways that an animal keeps itself safe", "when one animal looks, acts, or sounds like another animal", "all the living things and conditions around an animal or plant"], "ok": 0}, {"w": "stripes", "opts": ["stripes or rings of color around something", "able to make you sick or kill you if you eat or touch it", "long, thin lines of color"], "ok": 2}, {"w": "sting", "opts": ["ways that an animal keeps itself safe", "stripes or rings of color around something", "to hurt by pushing a sharp point into the skin"], "ok": 2}, {"w": "poisonous", "opts": ["long, thin lines of color", "able to make you sick or kill you if you eat or touch it", "ways that an animal keeps itself safe"], "ok": 1}, {"w": "scales", "opts": ["put things in a certain order", "small, hard, thin plates that cover a fish or snake", "able to make you sick or kill you if you eat or touch it"], "ok": 1}, {"w": "bands", "opts": ["stripes or rings of color around something", "small, hard, thin plates that cover a fish or snake", "to hurt by pushing a sharp point into the skin"], "ok": 0}, {"w": "deadly", "opts": ["to see how two things are different", "ways that an animal keeps itself safe", "able to kill"], "ok": 2}, {"w": "arranged", "opts": ["put things in a certain order", "able to make you sick or kill you if you eat or touch it", "able to kill"], "ok": 0}, {"w": "tell … apart", "opts": ["able to make you sick or kill you if you eat or touch it", "when one animal looks, acts, or sounds like another animal", "to see how two things are different"], "ok": 2}], "say": "Predators leave the hoverfly alone because it looks like a bee.", "pause": ["Batesian mimicry：較弱、沒有防禦的動物看起來像危險的動物，所以掠食者不敢吃牠。", "hoverfly（像蜜蜂）；king snake 和 milk snake（像有毒的珊瑚蛇）。"]}, {"n": 3, "title": "Müllerian Mimicry", "range": "原文 §7–10 ＋ 2 段圖說", "cards": [{"id": "p7", "kind": "para", "label": "Paragraph 7", "text": "Another type of mimicry is called Müllerian mimicry. It is named after Fritz Müller, a German zoologist. Müllerian mimicry occurs when animals from different species look alike and are either poisonous or bad tasting. Generally these animals are brightly colored. The colors are a warning sign to predators that the animals should be left alone.", "u": [[34, 51], [105, 129], [281, 293]], "conn": [], "vocab": [[34, 51, "r3-0"], [71, 83, "r3-1"], [94, 103, "r3-2"], [105, 122, "r3-0"], [123, 129, "v3-0"], [281, 293, "v3-1"]], "qs": [{"id": "p7-4", "tag": "T", "label": "THINKING", "ans": "Müllerian 的動物真的有毒或很難吃", "tap": [], "choice": null, "groups": 1, "prompt": "Müllerian 和 Batesian 最大的不同：<br><span class=\"og vert\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">Müllerian 的動物真的有毒或很難吃<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">Müllerian 的動物都沒有防禦<\/button><\/span>"}, {"id": "p7-5", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ The colors are a warning sign to predators that the animals should be left alone.", "tap": ["The colors are a warning sign to predators that the animals should be left alone"], "choice": null, "groups": 0, "mode": "sentence", "prompt": "在文章裡點出：說「顏色是一種警告」的那一句。"}], "labs": [["green", "WORD LINKS", "occur / occurs / occurred；warning / warn"], ["purple", "THINKING LAB", "Müllerian：具有危險性或不好吃的不同物種，呈現相似警戒訊號。"]], "group": ["p7"]}, {"id": "p8", "kind": "para", "label": "Paragraph 8", "text": "Monarch and viceroy butterflies are good examples of Müllerian mimicry. Their colors and the markings on their wings look alike. The monarch is poisonous and the viceroy tastes very bad. A bird that has tried either one will likely stay away from both.", "u": [[93, 101], [209, 219], [225, 241]], "conn": [], "vocab": [[0, 7, "r3-3"], [12, 19, "r3-3"], [53, 70, "r3-0"], [93, 101, "v3-2"], [133, 140, "r3-3"], [162, 169, "r3-3"], [225, 231, "v3-6"], [232, 241, "v3-7"]], "qs": [{"id": "p8-1", "tag": "W", "label": "WORD", "ans": "斑紋", "tap": [], "choice": null, "groups": 1, "prompt": "<b>markings<\/b> on their wings：<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">斑紋<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">分數<\/button><\/span>"}, {"id": "p8-2", "tag": "E", "label": "✎ EVIDENCE", "ans": "poisonous；tastes very bad", "tap": ["poisonous", "tastes very bad"], "choice": null, "groups": 0, "prompt": "在文章裡點出 monarch 和 viceroy「真的是」怎樣。monarch is <span class=\"slot\" data-s=\"0\">？<\/span>；viceroy <span class=\"slot\" data-s=\"1\">？<\/span>"}, {"id": "p8-4", "tag": "W", "label": "WORD", "ans": "monarch；viceroy；很可能", "tap": ["monarch", "viceroy"], "choice": null, "groups": 1, "prompt": "<b>either one<\/b> 指 <span class=\"slot\" data-s=\"0\">？<\/span> 或 <span class=\"slot\" data-s=\"1\">？<\/span>；<b>likely<\/b> = <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">很可能<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">不可能<\/button><\/span>"}, {"id": "p8-5", "tag": "T", "label": "THINKING", "ans": "因為牠們長得像，鳥記住了不好的經驗", "tap": [], "choice": null, "groups": 1, "prompt": "為什麼鳥吃過一隻，兩種都不吃了？<br><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">因為牠們長得像，鳥記住了不好的經驗<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">因為鳥吃飽了<\/button><\/span>"}], "labs": []}, {"id": "cap8", "kind": "cap", "label": "圖說 Caption", "text": "The bad-tasting viceroy, shown here, mimics the poisonous monarch. Birds that have tasted one butterfly with this coloring are unlikely to try another one.", "u": [[37, 43], [48, 57]], "conn": [], "vocab": [[16, 23, "r3-3"], [58, 65, "r3-3"]], "qs": [{"id": "cap8-1", "tag": "R", "label": "WRITER", "ans": "Müllerian（兩種都有防禦）", "tap": [], "choice": null, "groups": 1, "prompt": "圖說說 viceroy <b>mimics<\/b> the monarch。可是兩隻都有防禦（一個有毒，一個難吃），所以屬於 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"0\">Batesian<\/button><button type=\"button\" class=\"opt\" data-ok=\"1\">Müllerian<\/button><\/span>"}, {"id": "cap8-2", "tag": "W", "label": "WORD", "ans": "不太可能", "tap": [], "choice": null, "groups": 1, "prompt": "<b>unlikely<\/b> = un + likely：<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">不太可能<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很可能<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "mark / marking(s)；likely / unlikely"], ["purple", "THINKING LAB", "鳥類從不愉快經驗學到避開相似花紋的蝴蝶。"]], "group": ["p8", "cap8"]}, {"id": "p9", "kind": "para", "label": "Paragraph 9", "text": "Another good example of Müllerian mimicry is the poison dart frog, in South America and Central America, and the Mantella frog, from Madagascar: The bright colors of both species warn predators of their toxic, or poisonous, skin. The frogs are small but highly poisonous. Their enemies generally stay far away from them and any other frogs with bright colors.", "u": [[149, 162], [203, 208], [213, 222], [261, 270], [345, 358]], "conn": [], "vocab": [[24, 41, "r3-0"], [49, 65, "r3-4"], [70, 83, "r3-5"], [88, 103, "r3-5"], [113, 126, "r3-4"], [133, 143, "r3-5"], [203, 208, "v3-3"]], "qs": [{"id": "p9-1", "tag": "W", "label": "WORD", "ans": "換句話解釋 toxic", "tap": [], "choice": null, "groups": 1, "prompt": "their <b>toxic, or poisonous,<\/b> skin：這裡的 or 是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">換句話解釋 toxic<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">兩個選一個<\/button><\/span>　← 這叫 context clue（上下文線索）"}, {"id": "p9-3", "tag": "W", "label": "WORD", "ans": "the frogs（青蛙）", "tap": ["the frogs"], "choice": null, "groups": 0, "prompt": "<b>Their<\/b> enemies：Their 指的是 <span class=\"slot\" data-s=\"0\">？<\/span>"}, {"id": "p9-4", "tag": "T", "label": "THINKING", "ans": "warning sign 警告掠食者", "tap": [], "choice": null, "groups": 1, "prompt": "兩種青蛙鮮豔的顏色有什麼作用？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">warning sign 警告掠食者<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">吸引同伴<\/button><\/span>"}, {"id": "p9-5", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ [South America]　[Central America]　[Mantella frog]　[Madagascar]", "tap": ["South America", "Central America", "Mantella frog", "Madagascar"], "choice": null, "groups": 0, "prompt": "把 4 個地名或名稱框起來 [ ]。"}], "labs": [["green", "WORD LINKS", "toxin (n.) / toxic (adj.) / poisonous (adj.)"], ["purple", "THINKING LAB", "鮮豔顏色作為 warning sign；區分特徵（亮色）和作用（警告）。"]], "group": ["p9"]}, {"id": "p10", "kind": "para", "label": "Paragraph 10", "text": "The indigenous people who live in the rain forest sometimes use the frog's toxin when they go hunting. They rub the tips of their arrows or darts on the skin of one or two frogs. This is why the frogs are known as poison dart or poison arrow frogs.", "u": [[4, 14], [75, 80]], "conn": [], "vocab": [[4, 14, "v3-4"], [38, 49, "r3-7"], [75, 80, "v3-5"], [140, 145, "r3-6"]], "qs": [{"id": "p10-1", "tag": "W", "label": "WORD", "ans": "原住民；毒素", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\"><b>indigenous<\/b> people<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">原住民<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">觀光客<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">the frog's <b>toxin<\/b><\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">毒素<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">顏色<\/button><\/span><\/div>"}, {"id": "p10-4", "tag": "T", "label": "THINKING", "ans": "青蛙名字的由來", "tap": [], "choice": null, "groups": 1, "prompt": "這段告訴我們 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">青蛙名字的由來<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">青蛙吃什麼<\/button><\/span>"}], "labs": []}, {"id": "cap10", "kind": "cap", "label": "圖說 Caption", "text": "Though not all poison dart frogs look alike, they all have brightly colored skin. These bright colors let predators know the animal is poisonous.", "u": [[135, 144]], "conn": [], "vocab": [[15, 31, "r3-4"]], "qs": [{"id": "cap10-2", "tag": "R", "label": "WRITER", "ans": "不是所有箭毒蛙都長一樣，但都有鮮豔的皮膚", "tap": [], "choice": null, "groups": 1, "prompt": "這段圖說補充了正文沒說的事：<br><span class=\"og vert\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">不是所有箭毒蛙都長一樣，但都有鮮豔的皮膚<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">箭毒蛙住在沙漠<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "toxin 毒素；poison dart frog 複合名詞"], ["purple", "THINKING LAB", "原住民使用毒素是具體事例；不是所有箭毒蛙都長得完全一樣。"]], "group": ["p10", "cap10"]}], "gist": {"opts": ["Harmless animals hide in the rain forest.", "People hunt butterflies and frogs.", "Dangerous animals look alike, so predators learn to stay away from all of them."], "ok": 2}, "quiz": [{"w": "occurs", "opts": ["belonging to a place from the very beginning", "probably going to happen", "happens"], "ok": 2}, {"w": "warning sign", "opts": ["to keep a distance from something", "something that tells you to be careful", "spots, stripes, or patterns on an animal"], "ok": 1}, {"w": "markings", "opts": ["to keep a distance from something", "spots, stripes, or patterns on an animal", "probably going to happen"], "ok": 1}, {"w": "toxic", "opts": ["poisonous", "to keep a distance from something", "probably going to happen"], "ok": 0}, {"w": "indigenous", "opts": ["to keep a distance from something", "poisonous", "belonging to a place from the very beginning"], "ok": 2}, {"w": "toxin", "opts": ["a poison made by a living thing", "belonging to a place from the very beginning", "happens"], "ok": 0}, {"w": "likely", "opts": ["a poison made by a living thing", "poisonous", "probably going to happen"], "ok": 2}, {"w": "stay away", "opts": ["poisonous", "happens", "to keep a distance from something"], "ok": 2}], "say": "Birds stay away from viceroys because they look like poisonous monarchs.", "pause": ["Müllerian mimicry：兩種真的有毒或很難吃的動物長得很像，一起警告掠食者。", "monarch 和 viceroy 蝴蝶；poison dart frog 和 Mantella frog。"]}, {"n": 4, "title": "Self-Mimicry", "range": "原文 §11–17 ＋ 3 段圖說", "cards": [{"id": "p11", "kind": "para", "label": "Paragraph 11", "text": "Have you ever looked at a caterpillar and wondered which end was its head? Some animals have a type of defense called self-mimicry. These creatures often have body parts that mimic other parts of their own bodies. Some of these animals have markings called eyespots.", "u": [[118, 130], [257, 265]], "conn": [], "vocab": [[118, 130, "v4-0"], [257, 265, "v4-1"]], "qs": [{"id": "p11-2", "tag": "W", "label": "WORD", "ans": "自己", "tap": [], "choice": {"opts": ["自己", "很多", "別人"], "ok": 0}, "groups": 0, "prompt": "<b>self<\/b>-mimicry：self- 的意思是 <span class=\"slot\">？<\/span>"}, {"id": "p11-4", "tag": "T", "label": "THINKING", "ans": "自己身體的其他部位", "tap": [], "choice": null, "groups": 1, "prompt": "self-mimicry 是模仿 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"0\">其他動物<\/button><button type=\"button\" class=\"opt\" data-ok=\"1\">自己身體的其他部位<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "self- 字首表示「自己」；mimic / mimicry"], ["purple", "THINKING LAB", "提出問題吸引讀者；self-mimicry 指身體部位模仿自己的其他部位。"]], "group": ["p11"]}, {"id": "p12", "kind": "para", "label": "Paragraph 12", "text": "Self-mimicry is not used only by prey. Sometimes Predators, such as frogmouth catfish, use self-mimicry, too. A frogmouth catfish has something on its tongue that looks like food other fish like to eat. The catfish lies very still, sticking out its long tongue. When a small fish approaches the \"food,\" the catfish quickly eats the fish!", "u": [[68, 85], [112, 129], [280, 290]], "conn": [[262, 266]], "vocab": [[0, 12, "v4-0"], [68, 85, "r4-0"], [91, 103, "v4-0"], [112, 129, "r4-0"], [280, 290, "v4-2"]], "qs": [{"id": "p12-2", "tag": "W", "label": "WORD", "ans": "它不是真的食物，是舌頭上的東西", "tap": [], "choice": null, "groups": 1, "prompt": "the <b>\"food\"<\/b> 為什麼有引號？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">它不是真的食物，是舌頭上的東西<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">作者打錯了<\/button><\/span>"}, {"id": "p12-4", "tag": "T", "label": "THINKING", "ans": "predator；抓獵物", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\">frogmouth catfish 是<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">predator<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">prey<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">牠用擬態來<\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"0\">逃走<\/button><button type=\"button\" class=\"opt\" data-ok=\"1\">抓獵物<\/button><\/span><\/div>"}], "labs": []}, {"id": "cap12", "kind": "cap", "label": "圖說 Caption", "text": "The longlure frogfish hides itself among sponges and moves a body part that looks like food. When a fish swims over for lunch, it gets eaten instead!", "u": [], "conn": [[93, 97]], "vocab": [[4, 21, "r4-1"]], "qs": [{"id": "cap12-1", "tag": "R", "label": "WRITER", "ans": "food（食物）", "tap": ["food"], "choice": null, "groups": 0, "prompt": "longlure frogfish 和 §12 的 catfish 有什麼一樣？牠們都動一個看起來像 <span class=\"slot\" data-s=\"0\">？<\/span> 的身體部位。"}, {"id": "cap12-2", "tag": "W", "label": "WORD", "ans": "the fish（小魚）", "tap": [], "choice": null, "groups": 1, "prompt": "<b>it<\/b> gets eaten instead：it 指的是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">the fish（小魚）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">the frogfish<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "approach (v.) 接近；prey / predator"], ["purple", "THINKING LAB", "重要例外：擬態不只幫獵物逃生，也能幫掠食者捕食。"]], "group": ["p12", "cap12"]}, {"kind": "brk", "text": "☕ 休息點｜可以在這裡分兩次做。下次從 Paragraph 13 開始。"}, {"id": "p13", "kind": "para", "label": "Paragraph 13", "text": "Some species of butterflies, moths, fish, frogs, and caterpillars have large circles on their bodies. These circles are called eyespots because they look like eyes.", "u": [[127, 135]], "conn": [[136, 143]], "vocab": [[127, 135, "v4-1"]], "qs": [{"id": "p13-2", "tag": "W", "label": "WORD", "ans": "複數", "tap": [], "choice": null, "groups": 1, "prompt": "<b>Some species<\/b> of butterflies：species 在這裡是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">複數<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">單數<\/button><\/span>（單複數同形）"}, {"id": "p13-3", "tag": "T", "label": "THINKING", "ans": "長什麼樣子", "tap": [], "choice": null, "groups": 1, "prompt": "這一段作者先說眼斑 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">長什麼樣子<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">怎麼使用<\/button><\/span>，下兩段才說它的功能。"}], "labs": [["green", "WORD LINKS", "species 單複數同形；eyespot = eye + spot"], ["purple", "THINKING LAB", "先介紹眼斑的外觀定義，再說明功能。"]], "group": ["p13"]}, {"id": "p14", "kind": "para", "label": "Paragraph 14", "text": "Predators generally like to approach their prey without being seen. Eyespots confuse predators and they come toward their prey from the wrong side. The prey sees them coming and has time to escape.", "u": [[77, 84], [190, 196]], "conn": [], "vocab": [[68, 76, "v4-1"], [77, 84, "v4-3"], [190, 196, "v4-4"]], "qs": [{"id": "p14-2", "tag": "W", "label": "WORD", "ans": "they = predators；them = predators", "tap": ["predators", "predators"], "choice": null, "groups": 0, "prompt": "<b>they<\/b> come toward their prey：they 指 <span class=\"slot\" data-s=\"0\">？<\/span>；The prey sees <b>them<\/b>：them 指 <span class=\"slot\" data-s=\"1\">？<\/span>"}, {"id": "p14-3", "tag": "W", "label": "WORD", "ans": "使困惑；逃脫", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\"><b>confuse<\/b><\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">使困惑<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">嚇跑<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\"><b>escape<\/b><\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">逃脫<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">靠近<\/button><\/span><\/div>"}, {"id": "p14-4", "tag": "T", "label": "THINKING", "ans": "confuse；wrong；escapes", "tap": [], "choice": {"opts": ["scare；same；sleeps", "help；right；is eaten", "confuse；wrong；escapes"], "ok": 2}, "groups": 0, "prompt": "因果鏈：eyespots <span class=\"slot\">？<\/span> predators → predators come from the <span class=\"slot\">？<\/span> side → the prey <span class=\"slot\">？<\/span>"}, {"id": "p14-5", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ The prey sees them coming and has time to escape.", "tap": ["The prey sees them coming and has time to escape"], "choice": null, "groups": 0, "mode": "sentence", "prompt": "在文章裡點出：說「獵物有時間逃走」的那一句。"}], "labs": [["green", "WORD LINKS", "confuse / confused / confusing；escape (v./n.)"], ["purple", "THINKING LAB", "眼斑誤導攻擊方向 → 獵物發現掠食者 → 有機會逃跑。"]], "group": ["p14"]}, {"id": "p15", "kind": "para", "label": "Paragraph 15", "text": "Eyespots can keep animals safe in another way, too. Some animals, such as Io moths, hawk-moth caterpillars, and false-eyed frogs, have markings that look like the eyes of a big animal. These \"eyes\" scare away predators.", "u": [[135, 143], [198, 208]], "conn": [], "vocab": [[0, 8, "v4-1"], [74, 82, "r4-2"], [84, 106, "r4-3"], [112, 128, "r4-4"], [198, 208, "v4-5"]], "qs": [{"id": "p15-3", "tag": "W", "label": "WORD", "ans": "不是真的眼睛；嚇跑", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\">These <b>\"eyes\"<\/b> 為什麼有引號？<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">不是真的眼睛<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">是很大的眼睛<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\"><b>scare away<\/b><\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">嚇跑<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">害怕<\/button><\/span><\/div>"}, {"id": "p15-4", "tag": "T", "label": "THINKING", "ans": "a big animal（大型動物）", "tap": ["a big animal"], "choice": null, "groups": 0, "prompt": "掠食者看到這些「眼睛」，會以為那是 <span class=\"slot\" data-s=\"0\">？<\/span> 的眼睛。"}], "labs": []}, {"id": "cap15", "kind": "cap", "label": "圖說 Caption", "text": "The owl butterfly gets its name from the large eyespots on its wings, which look like the eyes of an owl.", "u": [[47, 55]], "conn": [], "vocab": [[4, 17, "r4-5"], [47, 55, "v4-1"]], "qs": [{"id": "cap15-1", "tag": "R", "label": "WRITER", "ans": "翅膀上很大的眼斑（eyespots），看起來像貓頭鷹的眼睛；§15（看起來像大型動物的眼睛）", "tap": [], "choice": {"opts": ["翅膀上很大的眼斑，看起來像貓頭鷹的眼睛", "牠住在貓頭鷹的窩裡", "牠會像貓頭鷹一樣叫"], "ok": 0}, "groups": 1, "prompt": "owl butterfly 的名字從哪裡來？<span class=\"slot\">？<\/span><br>這是哪一種用法？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"0\">§14 讓掠食者搞錯方向<\/button><button type=\"button\" class=\"opt\" data-ok=\"1\">§15 看起來像大動物的眼睛<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "scare / scared / scary；scare away = 嚇跑"], ["purple", "THINKING LAB", "眼斑的另一種功能：看起來像大型動物的眼睛，嚇退掠食者。"]], "group": ["p15", "cap15"]}, {"id": "p16", "kind": "para", "label": "Paragraph 16", "text": "Let's take a closer look at the animals that mimic another body part. This form of mimicry helps animals draw attention away from important body parts, such as the head. Predators will likely bite a part of the body that will not hurt the prey as much.", "u": [[105, 129]], "conn": [[244, 251]], "vocab": [[105, 129, "v4-6"]], "qs": [{"id": "p16-1", "tag": "W", "label": "WORD", "ans": "把注意力移開", "tap": [], "choice": null, "groups": 1, "prompt": "<b>draw attention away from<\/b>：<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">把注意力移開<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">畫畫<\/button><\/span>"}, {"id": "p16-4", "tag": "T", "label": "THINKING", "ans": "不重要（不致命）的；輕", "tap": [], "choice": {"opts": ["重要；重", "不重要；重", "不重要；輕"], "ok": 2}, "groups": 0, "prompt": "這種擬態讓掠食者咬 <span class=\"slot\">？<\/span> 的地方，獵物受的傷比較 <span class=\"slot\">？<\/span>。"}], "labs": [["green", "WORD LINKS", "draw attention away from：轉移注意力"], ["purple", "THINKING LAB", "擬態將攻擊引向非要害，降低傷害。"]], "group": ["p16"]}, {"id": "p17", "kind": "para", "label": "Paragraph 17", "text": "There are some snakes that have tails that look like their heads or heads that look like their tails. This mimicry saves the snake because a bird trying to eat the snake might not bite the head. The bird could also miss catching the snake if it starts moving in the opposite direction from what the bird expected.", "u": [[266, 284], [304, 312]], "conn": [[239, 241]], "vocab": [[266, 284, "v4-7"], [304, 312, "v4-8"]], "qs": [{"id": "p17-3", "tag": "W", "label": "WORD", "ans": "頭", "tap": [], "choice": null, "groups": 1, "prompt": "<b>what the bird expected<\/b>：鳥以為牠看到的是蛇的 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">頭<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">尾巴<\/button><\/span>，所以猜錯方向。"}, {"id": "p17-4", "tag": "T", "label": "THINKING", "ans": "① 頭　② 相反（opposite）", "tap": [], "choice": {"opts": ["頭；相同", "尾巴；相同", "頭；相反"], "ok": 2}, "groups": 0, "prompt": "頭尾相似的兩個好處：① 鳥不會咬到 <span class=\"slot\">？<\/span>　② 蛇往 <span class=\"slot\">？<\/span> 的方向跑，鳥抓不到。"}], "labs": []}, {"id": "cap17", "kind": "cap", "label": "圖說 Caption", "text": "Can you tell which end is the head on this caterpillar? With luck, a bird will not be able to spot the head easily either!", "u": [], "conn": [], "vocab": [], "qs": [{"id": "cap17-1", "tag": "R", "label": "WRITER", "ans": "§11（Have you ever looked at a caterpillar and wondered which end was its head?）", "tap": [], "choice": {"opts": ["§15", "§13", "§11"], "ok": 2}, "groups": 0, "prompt": "圖說用問句 Can you tell which end is the head? 開頭，和第幾段的開頭很像？§ <span class=\"slot\">？<\/span>"}], "labs": [["green", "WORD LINKS", "opposite / opposite direction；expect / expected"], ["purple", "THINKING LAB", "頭尾相似 → 掠食者攻擊錯誤部位／預測錯誤方向。"]], "group": ["p17", "cap17"]}], "gist": {"opts": ["Animals copy other animals.", "An animal has a body part that looks like something else, such as eyes, a head, or food.", "Predators change their colors."], "ok": 1}, "quiz": [{"w": "self-mimicry", "opts": ["when an animal copies a part of its own body", "to get away from danger", "round marks that look like eyes"], "ok": 0}, {"w": "eyespots", "opts": ["to make people look at something else", "round marks that look like eyes", "to make someone not understand or not know what to do"], "ok": 1}, {"w": "approaches", "opts": ["to frighten an animal so it goes away", "comes near", "round marks that look like eyes"], "ok": 1}, {"w": "confuse", "opts": ["to make people look at something else", "to make someone not understand or not know what to do", "comes near"], "ok": 1}, {"w": "escape", "opts": ["comes near", "round marks that look like eyes", "to get away from danger"], "ok": 2}, {"w": "scare away", "opts": ["round marks that look like eyes", "the other way", "to frighten an animal so it goes away"], "ok": 2}, {"w": "draw attention away from", "opts": ["round marks that look like eyes", "to make people look at something else", "when an animal copies a part of its own body"], "ok": 1}, {"w": "opposite direction", "opts": ["to make someone not understand or not know what to do", "the other way", "round marks that look like eyes"], "ok": 1}, {"w": "expected", "opts": ["to get away from danger", "thought something would happen", "to frighten an animal so it goes away"], "ok": 1}], "say": "The prey can escape because eyespots confuse predators.", "pause": ["Self-mimicry：動物身體的某個部位看起來像別的東西（眼睛、頭、食物），用來混淆、嚇退掠食者，或引誘獵物。", "frogmouth catfish（舌頭像食物）；owl butterfly、Io moth（眼斑）；頭尾相似的蛇。"]}, {"n": 5, "title": "Survival &amp; Conclusion", "range": "原文 §18–19 ＋ Crazy Copycat Facts!", "cards": [{"id": "p18", "kind": "para", "label": "Paragraph 18", "text": "Mimicry helps an animal live longer in its habitat, which is the goal of most animals. Over time, animals that looked like something that scared off or confused predators lived. The animals that did not have these special colors or markings did not.", "u": [[43, 50], [65, 69], [138, 148]], "conn": [], "vocab": [[43, 50, "v5-0"], [65, 69, "v5-1"], [138, 148, "v5-2"]], "qs": [{"id": "p18-2", "tag": "W", "label": "WORD", "ans": "動物住的地方；目標", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\"><b>habitat<\/b><\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">動物住的地方<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">動物的顏色<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\"><b>goal<\/b><\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">目標<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">球門<\/button><\/span><\/div>"}, {"id": "p18-5", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ live longer；lived", "tap": ["live longer", "lived"], "choice": null, "groups": 0, "prompt": "survival 的線索：在 §18 畫出 2 個意思是「活下來」的字詞。"}], "labs": [["green", "WORD LINKS", "habitat 棲息地 / environment 環境；goal 目標"], ["purple", "THINKING LAB", "結論前段：有利於躲避掠食者的特徵可能提高存活機會。"]], "group": ["p18"]}, {"id": "p19", "kind": "para", "label": "Paragraph 19", "text": "At the same time, the predators have adapted, too. They have learned which animals might hurt them and they stay away from those animals. Changing when the environment changes is key to a species' survival over time. Mimicry is just one of the many tools animals have adapted to live in our ever-changing natural world!", "u": [[197, 205], [291, 304]], "conn": [[0, 16]], "vocab": [[156, 167, "v5-5"], [197, 205, "v5-3"], [291, 304, "v5-4"]], "qs": [{"id": "p19-2", "tag": "W", "label": "WORD", "ans": "They = the predators", "tap": ["the predators"], "choice": null, "groups": 0, "prompt": "<b>They<\/b> have learned which animals might hurt them：They 指 <span class=\"slot\" data-s=\"0\">？<\/span>"}, {"id": "p19-4", "tag": "W", "label": "WORD", "ans": "不斷變化的", "tap": [], "choice": null, "groups": 1, "prompt": "<b>ever-changing<\/b> = <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">不斷變化的<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">永不改變的<\/button><\/span>"}, {"id": "p19-5", "tag": "T", "label": "THINKING", "ans": "許多工具中的一種", "tap": [], "choice": null, "groups": 1, "prompt": "最後一句說 mimicry 是動物 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">許多工具中的一種<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">唯一的方法<\/button><\/span>"}], "labs": []}, {"id": "facts2", "kind": "img", "label": "Crazy Copycat Facts!", "text": "1. Mimicry happens in both plants and animals.\n2. Certain ant-eating spiders mimic ants and this makes it easier for them to enter an ant colony.\n3. Some birds, such as parrots and mockingbirds, mimic other birds' songs and sometimes other sounds, such as car alarms or voices.\n4. Most mimics are insects, such as butterflies and moths, but mimicry also appears in spiders, snakes, frogs, fish, and other animals.\n5. Chances of staying safe from predators increase when there are more models than mimics in a group.\n6. Hoverflies, which look like honeybees, even make a sound like a bee makes when predators are near.\n7. A few rhymes have been made up to help people tell the difference between coral snakes and their mimics. One example is, \"If red touches yellow, avoid this fellow.\"\n8. Hawk-moth caterpillars tuck in their heads, bend their bodies, show off their eyespots, and mimic snakes. They even wiggle from side to side to look more like a snake!\n", "u": [[3, 10], [77, 82], [195, 200], [286, 291], [341, 348], [446, 455], [485, 491], [497, 502], [598, 607], [718, 723], [766, 771], [867, 875], [881, 886]], "conn": [[337, 340], [465, 469], [593, 597]], "vocab": [[134, 144, "r5-1"], [169, 176, "r5-0"], [181, 193, "r5-0"], [627, 633, "r5-2"], [766, 771, "r5-3"]], "qs": [{"id": "facts2-1", "tag": "R", "label": "WRITER", "ans": "Fact 1 —　2 —　3 —　4 —　5 B　6 B　7 B　8 S（寫 B 也可以，因為牠模仿蛇）　（— 表示都不是）", "tap": [], "choice": null, "groups": 0, "reveal": 1, "prompt": "作者用 8 個 numbered facts 補充例子。在每個 fact 旁邊寫：<b>B<\/b>（Batesian）、<b>M<\/b>（Müllerian）、<b>S<\/b>（Self-mimicry）或 <b>—<\/b>（都不是）。"}, {"id": "facts2-2", "tag": "W", "label": "WORD", "ans": "紅色碰黃色的（珊瑚蛇）", "tap": [], "choice": null, "groups": 1, "prompt": "Fact 7：If red touches yellow, <b>avoid<\/b> this fellow. 這句在說哪一種蛇有毒？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">紅色碰黃色的（珊瑚蛇）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">紅色碰黑色的<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "survive (v.) / survival (n.)；ever-changing 複合形容詞"], ["purple", "THINKING LAB", "文章結論：掠食者也會適應；生物與環境持續改變。"]], "group": ["p19", "facts2"]}], "gist": {"opts": ["How     // questions
    var qObjs = [];
    card.qs.forEach(function(qd, idx){
      var box = el("div", "q"), q = {d: qd, box: box, num: idx + 1, need: 0, have: 0, miss: 0};
      box.innerHTML = '<div class="qh"><span class="tag t-' + qd.tag + '">' + qd.label + '</span><span class="qn">' + (idx + 1) + '</span><span class="qstate"></span></div><div class="qp">' + qd.prompt + "</div>";
      var id = qd.id;
      function finish(){
        box.classList.add("done");
        box.querySelector(".qstate").textContent = q.miss ? "✓ 完成" : "✓ 一次就對";
        if (!box.querySelector(".ansline")) box.appendChild(el("div", "ansline", "<b>參考答案</b>" + qd.ans));
        if (!store.done[id]){ store.done[id] = q.miss ? 2 : 1; save(); }
        checkLabs(); progress();
      }
      q.part = function(){ q.have++; if (q.have >= q.need) finish(); };
      // inline option groups
      box.querySelectorAll(".og").forEach(function(g){
        q.need++;
        g.addEventListener("click", function(e){
          var b = e.target.closest(".opt"); if (!b || g.dataset.ok) return;
          if (b.dataset.ok === "1"){ b.classList.add("right"); g.dataset.ok = 1; g.querySelectorAll(".opt").forEach(function(x){ x.disabled = true; }); q.part(); }
          else { b.classList.add("wrong"); b.disabled = true; q.miss++; }
        });
      });
      // generated choice
      if (qd.choice){
        q.need++;
        var ch = el("div", "choice");
        qd.choice.opts.forEach(function(o, i){
          var b = el("button", "opt"); b.type = "button"; b.textContent = o;
          b.onclick = function(){
            if (ch.dataset.ok) return;
            if (i === qd.choice.ok){ b.classList.add("right"); ch.dataset.ok = 1; ch.querySelectorAll(".opt").forEach(function(x){ x.disabled = true; });
              var slots = box.querySelectorAll(".slot"), parts = o.split("；");
              slots.forEach(function(s, k){ s.textContent = parts[k] || ""; s.classList.add("got"); });
              q.part(); }
            else { b.classList.add("wrong"); b.disabled = true; q.miss++; }
          };
          ch.appendChild(b);
        });
        box.appendChild(ch);
      }
      // tap in passage
      if (qd.tap && qd.tap.length){
        q.need++;
        q.targets = qd.tap.map(function(t){ return {t: t, r: ranges(card.text, t)}; });
        q.got = q.targets.map(function(){ return 0; });
        var tb = el("button", "tapbtn", "到文章裡點答案（共 " + qd.tap.length + " 個）"); tb.type = "button";
        tb.onclick = function(){ if (!box.classList.contains("done")) setActive(q); };
        box.appendChild(tb);
        q.box.addEventListener("click", function(e){ if (e.target === tb) return; });
        var oldPart = q.part;
        q.part = function(){ tb.hidden = true; oldPart(); };
        // when the tap part is the last one, tapAnswer calls q.part through the tap path
      }
      if (qd.reveal){
        q.need++;
        var rb = el("button", "revealbtn", "想好了，看答案"); rb.type = "button";
        rb.onclick = function(){ rb.hidden = true; q.part(); };
        box.appendChild(rb);
      }
      if (q.need === 0) q.need = 1;
      // restore
      if (store.done[id]){
        q.miss = store.done[id] === 2 ? 1 : 0;
        box.querySelectorAll(".og").forEach(function(g){ g.dataset.ok = 1; g.querySelectorAll(".opt").forEach(function(x){ x.disabled = true; if (x.dataset.ok === "1") x.classList.add("right"); }); });
        var chd = box.querySelector(".choice");
        if (chd){ chd.dataset.ok = 1; chd.querySelectorAll(".opt").forEach(function(x, i){ x.disabled = true; if (i === qd.choice.ok) x.classList.add("right"); });
          var parts = qd.choice.opts[qd.choice.ok].split("；"); box.querySelectorAll(".slot").forEach(function(s, k){ s.textContent = parts[k] || ""; s.classList.add("got"); }); }
        if (q.targets){ q.targets.forEach(function(t, k){ q.got[k] = 1; var s = box.querySelector('.slot[data-s="' + k + '"]'); if (s){ s.textContent = t.t; s.classList.add("got"); } }); }
        box.querySelectorAll(".tapbtn,.revealbtn").forEach(function(x){ x.hidden = true; });
        q.have = q.need; box.classList.add("done");
        box.querySelector(".qstate").textContent = q.miss ? "✓ 完成" : "✓ 一次就對";
        box.appendChild(el("div", "ansline", "<b>參考答案</b>" + qd.ans));
      }
      qObjs.push(q); panel.appendChild(box);
    });

    // Lab (shown after the whole group is done)
    var labBox = null;
    function checkLabs(){
      if (!card.labs.length) return;
      var all = (card.group || [card.id]).every(function(cid){
        var c = unit.cards.filter(function(x){ return x.id === cid; })[0];
        return c.qs.every(function(qd){ return store.done[qd.id]; });
      });
      labBox.innerHTML = all ? "<p>為什麼？Lab 解說</p>" + card.labs.map(function(l){ return '<div class="lab ' + l[0] + '"><b>' + l[1] + "</b>" + l[2] + "</div>"; }).join("")
                             : "做完這一組的題目，這裡會出現 Lab 解說。";
      labBox.className = all ? "labs" : "locked";
    }
    if (card.labs.length){ labBox = el("div", "locked"); panel.appendChild(labBox); checkLabs(); document.addEventListener("am-progress", checkLabs); }
    desk.appendChild(left); desk.appendChild(panel);
    return desk;
  }

  // ---------- simple MCQ (main idea, quiz) ----------
  function mcq(opts, ok, onDone, id){
    var box = el("div", "mc");
    opts.forEach(function(o, i){
      var b = el("button", "opt", '<span class="wl">' + "abc"[i] + "</span><span></span>"); b.type = "button";
      b.lastChild.textContent = o;
      b.onclick = function(){
        if (box.dataset.ok) return;
        if (i === ok){ b.classList.add("right"); box.dataset.ok = 1; box.querySelectorAll(".opt").forEach(function(x){ x.disabled = true; });
          if (!store.done[id]){ store.done[id] = box.dataset.miss ? 2 : 1; save(); } onDone && onDone(); progress(); }
        else { b.classList.add("wrong"); b.disabled = true; box.dataset.miss = 1; }
      };
      if (store.done[id]){ b.disabled = true; if (i === ok) b.classList.add("right"); }
      box.appendChild(b);
    });
    if (store.done[id]) box.dataset.ok = 1;
    return box;
  }

  var STEPS = [["1", "精讀", "Close Read"], ["2", "大意", "Main Idea"], ["3", "單字小考", "Word Check"], ["4", "說出來", "Say It"]];
  function renderUnit(u){
    var wrap = el("div", "unit"); wrap.id = "unit-" + u.n; wrap.dataset.unit = u.n; wrap.hidden = true;
    wrap.innerHTML = '<header class="uhead"><span class="badge">Unit ' + u.n + "</span><h2></h2><p class=\"range\"></p><nav class=\"steps\">" +
      STEPS.map(function(s){ return '<a href="#u' + u.n + "-s" + s[0] + '"><b>' + s[0] + "</b>" + s[1] + "</a>"; }).join("") + "</nav></header>";
    wrap.querySelector("h2").textContent = u.title; wrap.querySelector(".range").textContent = u.range;
    function step(n, inner, how){
      var s = el("section", "step"); s.id = "u" + u.n + "-s" + n;
      var st = STEPS[n - 1]; s.appendChild(el("h3", null, '<span class="sn">' + st[0] + "</span>" + st[1] + "<em>" + st[2] + "</em>"));
      if (how) s.appendChild(el("p", "howto", how));
      s.appendChild(inner); wrap.appendChild(s); return s;
    }
    var cr = el("div");
    u.cards.forEach(function(c){ cr.appendChild(renderCard(c, u)); });
    step(1, cr, "先讀左邊的段落。不懂的字點一下看意思。右邊的題目用點的作答：選項直接點；黃色按鈕的題目要到文章裡點出答案。");
    var g = el("div"); g.appendChild(el("p", null, "<b>上面 " + u.range + " 主要在講什麼？</b>")); g.appendChild(mcq(u.gist.opts, u.gist.ok, null, "g" + u.n));
    step(2, g);
    var qz = el("div"), grid = el("div", "qgrid"), sc = el("p", "score");
    function score(){ var got = u.quiz.filter(function(_, i){ return store.done["z" + u.n + "-" + i] === 1; }).length; sc.innerHTML = "一次就答對：<b>" + got + "</b> / " + u.quiz.length; }
    u.quiz.forEach(function(z, i){ var c = el("div", "qz"); c.appendChild(el("b", null, (i + 1) + ". ")); c.firstChild.appendChild(document.createTextNode(z.w)); c.appendChild(mcq(z.opts, z.ok, score, "z" + u.n + "-" + i)); grid.appendChild(c); });
    qz.appendChild(grid); qz.appendChild(sc); score();
    step(3, qz, "選出每個字的英文意思。第一次就點對才算分。");
    var talk = el("div");
    talk.innerHTML = '<ul class="talk"><li><label><input type="checkbox"> 這一節主要解釋什麼？</label></li><li><label><input type="checkbox"> 作者用了哪個（哪些）動物例子？</label></li><li><label><input type="checkbox"> 用 because / so 說一個因果</label></li></ul>' +
      '<details class="ex"><summary>說完了，看範例</summary><p><b>主要解釋</b>　' + u.pause[0] + "</p><p><b>動物例子</b>　" + u.pause[1] + "</p><p><b>because / so</b>　</p></details>";
    talk.querySelector(".ex p:last-child").appendChild(document.createTextNode(u.say));
    step(4, talk, "說給爸爸或媽媽聽。");
    var nx = el("div", "unext");
    nx.innerHTML = u.n < DATA.units.length ? '<a class="btn" href="#unit-' + (u.n + 1) + '">下一個 Unit →</a>' : '<p class="btn" style="display:inline-block">五個 Unit 都完成了！</p>';
    wrap.appendChild(nx);
    return wrap;
  }

  DATA.units.forEach(function(u){
    var t = el("a", "utab", "<b>Unit " + u.n + "</b><span></span><i></i>"); t.href = "#unit-" + u.n; t.dataset.u = u.n;
    t.querySelector("span").textContent = u.title; tabsEl.appendChild(t);
    main.appendChild(renderUnit(u));
  });

  function progress(){
    DATA.units.forEach(function(u){
      var ids = [];
      u.cards.forEach(function(c){ (c.qs || []).forEach(function(q){ ids.push(q.id); }); });
      ids.push("g" + u.n); u.quiz.forEach(function(_, i){ ids.push("z" + u.n + "-" + i); });
      var done = ids.filter(function(i){ return store.done[i]; }).length;
      var bar = tabsEl.querySelector('[data-u="' + u.n + '"] i'); if (bar) bar.style.width = Math.round(done / ids.length * 100) + "%";
    });
    document.dispatchEvent(new Event("am-progress"));
  }

  function route(){
    var h = location.hash.replace("#", ""), m = h.match(/^u(\d+)-s\d+$/) || h.match(/^unit-(\d+)$/);
    var n = m ? m[1] : (store.unit || "1");
    document.querySelectorAll(".unit").forEach(function(x){ x.hidden = x.dataset.unit !== String(n); });
    tabsEl.querySelectorAll(".utab").forEach(function(x){ x.classList.toggle("on", x.dataset.u === String(n)); });
    store.unit = String(n); save();
    var target = h && document.getElementById(h); if (target) target.scrollIntoView({block: "start"});
  }
  window.addEventListener("hashchange", route);

  document.getElementById("reset").addEventListener("click", function(){
    if (this.dataset.sure !== "1"){ this.dataset.sure = "1"; this.textContent = "再按一次就清除全部"; return; }
    store = {done: {}}; save(); location.reload();
  });
  progress(); route();
})();
</script>
