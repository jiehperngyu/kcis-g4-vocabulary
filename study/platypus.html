<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Very Peculiar Platypus 互動自學</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: unit tabs on top; each paragraph is a two-column "reading desk": the passage (tappable words) on the left, a word panel + questions on the right. Stacks on phones. */
:root{
  --bg:#f4f7f3; --paper:#ffffff; --ink:#1d2a24; --muted:#5b6b64; --line:#d6e2da;
  --leaf:#2f6f4e; --leaf-tint:#e3efe7; --panel:#f0f4f1;
  --red:#c8452f; --yellow:#e8b730; --black:#1b1b1b; --hl:#fff1b8;
  --ok:#2c8650; --ok-bg:#d9f0e0; --no:#c0472f; --no-bg:#fbe1da;
  --t-L:#a96400; --t-W:#2f6f4e; --t-T:#3c5f9c; --t-R:#8a4fa3; --t-E:#c0472f;
  --display:"Baloo 2","Andika",ui-rounded,system-ui,sans-serif;
  --body:"Andika","PingFang TC","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131915; --paper:#1b231f; --ink:#e6eee8; --muted:#9cb0a5; --line:#33443b;
  --leaf:#7cc79a; --leaf-tint:#22362b; --panel:#1f2924; --hl:#4b4220;
  --ok:#7cd49a; --ok-bg:#1e3a29; --no:#f0907a; --no-bg:#3e2520;
  --t-L:#f0b45a; --t-W:#7cc79a; --t-T:#8fb1ee; --t-R:#cfa0e4; --t-E:#f0907a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131915; --paper:#1b231f; --ink:#e6eee8; --muted:#9cb0a5; --line:#33443b;
  --leaf:#7cc79a; --leaf-tint:#22362b; --panel:#1f2924; --hl:#4b4220;
  --ok:#7cd49a; --ok-bg:#1e3a29; --no:#f0907a; --no-bg:#3e2520;
  --t-L:#f0b45a; --t-W:#7cc79a; --t-T:#8fb1ee; --t-R:#cfa0e4; --t-E:#f0907a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 60px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto}
.band{height:8px;background:repeating-linear-gradient(90deg,var(--red) 0 34px,var(--yellow) 34px 44px,var(--black) 44px 70px,var(--yellow) 70px 80px);border-radius:4px}
.hero{padding-block:20px 4px}
.hero small{color:var(--muted);letter-spacing:.04em}
.hero h1{font-family:var(--display);font-weight:800;color:var(--leaf);font-size:clamp(30px,6vw,44px);line-height:1.05;margin:4px 0}
.hero p{margin:0;color:var(--muted);max-width:62ch}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:14px 0 8px;padding-bottom:4px;scrollbar-width:thin}
.utab{flex:1 0 150px;text-decoration:none;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;position:relative;overflow:hidden}
.utab b{font-family:var(--display);color:var(--leaf);display:block}
.utab span{font-size:13px;color:var(--muted);line-height:1.3;display:block}
.utab.on{border-color:var(--leaf);box-shadow:inset 0 0 0 1.5px var(--leaf)}
.utab i{position:absolute;left:0;bottom:0;height:4px;background:var(--leaf);width:0;transition:width .3s}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);margin:6px 0 14px}
.legend span b{font-weight:700}
.k-star{border-bottom:2.5px dotted var(--leaf);color:var(--ink)}
.k-rec{border-bottom:2px dotted var(--muted)}
.uhead h2{font-family:var(--display);font-size:clamp(24px,4.4vw,32px);margin:4px 0 0;line-height:1.15;text-wrap:balance}
.badge{display:inline-block;background:var(--leaf);color:var(--paper);font-family:var(--display);font-weight:800;border-radius:10px;padding:2px 12px}
.range{color:var(--muted);margin:2px 0 4px}
.steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;background:var(--bg);padding-block:8px;scrollbar-width:none}
.steps a{flex:0 0 auto;text-decoration:none;color:var(--ink);background:var(--leaf-tint);border-radius:999px;padding:4px 12px;font-size:14px}
.steps a b{font-family:var(--display);color:var(--leaf);margin-right:4px}
.step{margin:22px 0;scroll-margin-top:58px}
.step>h3{font-family:var(--display);font-size:24px;margin:0 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step>h3 em{font-style:normal;font-family:var(--body);font-size:15px;color:var(--muted);font-weight:400}
.sn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:16px}
.howto{font-size:15px;color:var(--muted);margin:0 0 10px;max-width:70ch}
/* reading desk */
.desk{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin:0 0 22px;align-items:start}
.leftcol{position:sticky;top:58px;min-width:0}
.ptext{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:12px 16px;font-size:18px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}
.ptext.tapping{border-color:var(--yellow);box-shadow:0 0 0 4px var(--hl)}
.plabel{font-family:var(--display);color:var(--leaf);font-weight:800;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
.plabel small{font-family:var(--body);font-weight:400;color:var(--muted)}
.w{cursor:pointer;border-radius:4px}
.w:hover{background:var(--hl)}
.u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;font-weight:700}
.vs{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;font-weight:700}
.vr{border-bottom:2px dotted var(--muted)}
.cn{border:2px solid var(--red);border-radius:5px;padding:0 3px}
.readbtn{font:inherit;font-size:13px;font-weight:700;color:var(--leaf);background:var(--leaf-tint);border:0;border-radius:999px;padding:2px 12px;cursor:pointer}
.readbtn.on{background:var(--leaf);color:var(--paper)}
.w.reading{background:var(--hl);box-shadow:0 2px 0 var(--yellow)}
.w.sel{background:var(--leaf-tint);color:var(--leaf)}
.w.found{background:var(--ok-bg);color:var(--ok)}
.ptext.sentmode .w{border-radius:0}.w.hov{background:var(--hl)}
.w.miss{background:var(--no-bg);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.tapbar{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 12px;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.tapbar button{font:inherit;font-size:14px;background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer}
.panel{min-width:0;display:grid;gap:10px}
.wordbox{background:var(--paper);border:1.5px solid var(--leaf);border-radius:14px;padding:10px 14px}
.wordbox.empty{border-style:dashed;color:var(--muted);font-size:15px}
.wb-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wb-w{font-family:var(--display);font-size:24px;color:var(--leaf);line-height:1.1}
.wb-pos{color:var(--muted);font-size:14px}
.say{margin-left:auto;font:inherit;font-size:13px;color:var(--leaf);background:var(--leaf-tint);border:0;border-radius:999px;padding:2px 10px;cursor:pointer}
.wb-zh{font-weight:700;margin-top:2px}
.wb-en{color:var(--muted);font-size:15px}
.wb-grow{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:15px}
.wb-grow b{color:var(--leaf)}
.wb-grow .gl{display:block;font-size:12px;letter-spacing:.06em;color:var(--leaf);font-weight:700}
.q{background:var(--panel);border-radius:12px;padding:10px 12px;border:1.5px solid transparent}
.q.active{border-color:var(--yellow)}
.q.done{border-color:var(--ok)}
.qh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.tag{font-size:12px;font-weight:700;letter-spacing:.05em;border-left:4px solid currentColor;padding:1px 8px;border-radius:0 6px 6px 0;background:var(--paper)}
.t-L{color:var(--t-L)}.t-W{color:var(--t-W)}.t-T{color:var(--t-T)}.t-R{color:var(--t-R)}.t-E{color:var(--t-E)}
.qn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:13px}
.qstate{margin-left:auto;font-size:13px;font-weight:700}
.q.done .qstate{color:var(--ok)}
.qp{font-size:16px}
.og{display:inline-flex;flex-wrap:wrap;gap:6px;vertical-align:middle;border:1.5px dashed var(--line);border-radius:14px;padding:4px 6px;margin:2px 0}
.og .opt{margin:0}
.og.vert{display:grid;gap:4px;margin-top:6px;width:100%}
.pair{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:6px 0}
.pair .pl{flex:1 1 200px;min-width:0}
.pair .og{flex:0 1 auto;max-width:100%}
.pair+.pair{border-top:1px dotted var(--line)}
.pl{font-weight:700}
.pl::after{content:"　→ 選一個";font-weight:400;font-size:13px;color:var(--muted)}
.ptail{margin-top:4px}
@media (max-width:560px){.pair .pl{flex-basis:100%}}
.opt{font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:3px 12px;margin:4px 6px 0 0;cursor:pointer;text-align:left;line-height:1.4}
.og.vert .opt,.choice .opt{border-radius:10px;margin:0;width:100%}
.opt:hover{border-color:var(--leaf)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--no);background:var(--no-bg);color:var(--no);text-decoration:line-through}
.opt[disabled]{cursor:default}
.choice{display:grid;gap:6px;margin-top:8px}
.slot{display:inline-block;min-width:2.4em;text-align:center;border-bottom:2px solid var(--ink);padding:0 4px;color:var(--muted)}
.slot.got{color:var(--ok);font-weight:700;border-color:var(--ok)}
.tapbtn,.revealbtn{font:inherit;font-size:14px;font-weight:700;color:var(--ink);background:var(--hl);border:1.5px solid var(--yellow);border-radius:999px;padding:3px 12px;margin-top:8px;cursor:pointer}
.ansline{margin-top:6px;font-size:14px;color:var(--ok)}
.ansline b{margin-right:6px}
.labs{background:var(--paper);border-radius:12px;padding:8px 12px;border:1.5px solid var(--line)}
.labs p{margin:0 0 4px;font-weight:700}
.lab{border-left:5px solid var(--line);border-radius:0 8px 8px 0;padding:4px 10px;margin:6px 0;font-size:15px}
.lab b{display:block;font-size:12px;letter-spacing:.05em}
.lab.green{border-color:var(--t-W)}.lab.green b{color:var(--t-W)}
.lab.orange{border-color:var(--t-L)}.lab.orange b{color:var(--t-L)}
.lab.purple{border-color:var(--t-T)}.lab.purple b{color:var(--t-T)}
.locked{font-size:14px;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px;padding:8px 12px}
.article{margin:0 0 16px;padding:10px 16px;border-radius:12px;background:var(--leaf);color:var(--paper);font-family:var(--display);font-size:22px;font-weight:800;line-height:1.2}
.article span{display:block;font-family:var(--body);font-size:13px;font-weight:400;opacity:.85}
.subhead{font-family:var(--display);font-size:20px;font-weight:800;color:var(--leaf);border-bottom:2px solid var(--leaf-tint);margin:0 0 12px}
.brk{border:2px dashed var(--leaf);color:var(--leaf);text-align:center;border-radius:10px;padding:8px;margin:0 0 22px;font-weight:700}
.mc{display:grid;gap:6px}
.mc .opt{border-radius:10px;margin:0;display:flex;gap:8px;width:100%}
.wl{display:inline-grid;place-items:center;flex:0 0 22px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--leaf);color:var(--leaf);font-size:13px;font-weight:700}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.qz>b{display:block;font-family:var(--display);font-size:20px;margin-bottom:4px}
.score{font-size:18px;margin-top:12px}.score b{color:var(--leaf);font-size:24px;font-family:var(--display)}
.talk{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.talk label{display:flex;gap:8px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.talk input{width:20px;height:20px;accent-color:var(--leaf);margin-top:3px}
details.ex{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;margin-top:10px}
details.ex summary{cursor:pointer;font-weight:700;color:var(--leaf)}
.unext{margin:26px 0 0;text-align:right}
.btn{font:inherit;font-weight:700;color:var(--paper);background:var(--leaf);border:0;border-radius:999px;padding:8px 18px;cursor:pointer;text-decoration:none;display:inline-block}
.foot{font-size:13px;color:var(--muted)}
.reset{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,.w:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
@media (max-width:760px){.desk{grid-template-columns:1fr}.leftcol{position:static}.ptext{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* thinking tools & concept charts: tap a card, then tap the slot it belongs in */
.board [hidden]{display:none!important}
.board{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
.board.done{border-color:var(--ok)}
.board h4{font-family:var(--display);color:var(--leaf);margin:0 0 2px;font-size:19px}
.board .bhow{font-size:15px;color:var(--muted);margin:0 0 8px}
.tbwrap{overflow-x:auto}
.tb{border-collapse:collapse;width:100%;font-size:15px}
.tb th{background:var(--leaf-tint);text-align:left;padding:6px 8px;border:1px solid var(--line);font-weight:700}
.tb td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.tb td.auto{color:var(--ink)}
.tb td.auto.lock{color:var(--muted);font-size:13px;font-style:italic}
.drop{display:block;width:100%;min-height:40px;border:2px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);
  font:inherit;font-size:14px;cursor:pointer;padding:6px 8px;text-align:left}
.drop:hover,.board.picking .drop:not(.filled){border-color:var(--leaf);color:var(--leaf)}
.drop.filled{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ink);cursor:default}
.drop.no{border-color:var(--no);background:var(--no-bg);animation:shake .3s}
.tline{line-height:2.4;margin:4px 0}
.tline .drop{display:inline-block;width:auto;min-width:96px;min-height:0;padding:2px 10px;vertical-align:middle;margin:0 4px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.bin{border:1.5px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.bin h5{margin:0;font-size:15px;color:var(--leaf)}
.bin .chip{background:var(--ok-bg);border:1.5px solid var(--ok);border-radius:10px;padding:4px 8px;font-size:14px}
.bin .drop{min-height:44px;text-align:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding:10px 0 6px;border-top:1px dotted var(--line);
  position:sticky;bottom:0;z-index:2;background:var(--paper);max-height:42vh;overflow-y:auto}
.board.done .bank{position:static}
.bank::before{content:"卡片：先點一張，再點要放的格子";flex-basis:100%;font-size:13px;color:var(--muted)}
.card{font:inherit;font-size:14px;text-align:left;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;
  padding:6px 10px;cursor:pointer;max-width:100%}
.card.picked{border-color:var(--leaf);background:var(--leaf-tint);box-shadow:0 0 0 2px var(--leaf)}
.card.wrong{animation:shake .3s;border-color:var(--no)}
.card.extra{opacity:.45;text-decoration:line-through;cursor:default}
.bdone{display:none;margin:8px 0 0;color:var(--ok);font-weight:700}
.board.done .bdone{display:block}
.board.done .bank::before{content:"劃掉的卡是用不到的"}
.utab.sum b{color:var(--t-T)}
.utab.rev b{color:var(--t-R)}
.utab.skl b{color:var(--t-L)}
.secthead{font-family:var(--display);font-size:22px;color:var(--leaf);margin:26px 0 4px;border-bottom:2px solid var(--leaf-tint)}
.secthead span{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:400;margin-left:8px}
.paraout{display:none;margin:10px 0 0;padding:10px 12px;border-left:4px solid var(--ok);background:var(--ok-bg);border-radius:8px}
.board.done .paraout{display:block}
.paraout p{margin:0 0 6px}
.model{font-size:15px;background:var(--panel);border-radius:10px;padding:8px 10px;margin:0 0 8px}
.stars{font-size:22px;letter-spacing:2px;color:var(--yellow)}
.stars .off{color:var(--line)}
.gres{display:none;margin:8px 0 0;padding:8px 10px;border-radius:10px;background:var(--leaf-tint)}
.board.done .gres{display:block}
.board.game.done .bdone{display:none}
.gres .weak,.scoreboard .weak{color:var(--no);font-weight:700}
.again{font:inherit;font-size:14px;margin-left:8px;border:1.5px solid var(--leaf);color:var(--leaf);background:var(--paper);border-radius:999px;padding:3px 12px;cursor:pointer}
.scoreboard{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
.scoreboard b.big{font-family:var(--display);font-size:22px;color:var(--leaf)}
.tline .num{color:var(--muted)}
@media (max-width:560px){
  .tb tr:first-child{display:none}
  .tb,.tb tbody,.tb tr,.tb td{display:block;width:100%}
  .tb tr{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:4px 2px}
  .tb td{border:0;padding:4px 6px}
  .tb td[data-h]:not([data-h=""])::before{content:attr(data-h);display:block;font-size:12px;color:var(--muted);font-weight:700}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <p style="margin:12px 0 8px"><a href="../" style="color:var(--leaf);font-weight:700;text-decoration:none">← 回到 KCIS G4 Vocabulary</a></p>
    <div class="band"></div>
    <small>myView Literacy · Grade 4 · Week 5 · 第二篇</small>
    <h1>The Very Peculiar Platypus</h1>
    <p>點文章裡的字，右邊會出現意思和字族。每一題都用點的，點完馬上知道對不對。</p>
    <nav class="tabs" id="tabs" aria-label="Units"></nav>
    <div class="legend"><span><b style="text-decoration:underline;text-underline-offset:3px">粗體底線</b>＝要會的字（點了有意思、字族、發音）</span><span><span class="cn">紅框</span>＝連接字</span><span><span class="k-rec">灰色點線</span>＝認得就好（點了有意思）</span></div>
  </header>
  <main id="main"></main>

<script>const DATA={"units": [{"n": 6, "title": "Platypus 1｜A Most Unlikely Mammal", "range": "Platypus §1–5", "cards": [{"kind": "article", "text": "The Very Peculiar Platypus", "sub": "第二篇"}, {"id": "p1", "kind": "para", "label": "Paragraph 1", "text": "In the late 1700s, British scientists got their first glimpse of a platypus. Or rather, they received a platypus \"specimen\" that someone had sent from Australia. At first, they thought it was a joke. It looked as if someone had stitched a duck's bill and webbed feet to the skin of an otter or beaver.", "u": [[114, 122]], "conn": [[77, 86], [210, 215]], "vocab": [[19, 26, "r6-0"], [54, 61, "v6-0"], [114, 122, "v6-1"], [228, 236, "v6-2"], [255, 266, "v6-3"], [285, 290, "r6-1"], [294, 300, "r6-2"]], "qs": [{"id": "p1-3", "tag": "T", "label": "THINKING", "ans": "a duck's bill and webbed feet；an otter or beaver", "tap": ["a duck's bill and webbed feet", "an otter or beaver"], "choice": null, "groups": 0, "prompt": "科學家為什麼以為是開玩笑？因為看起來像有人把 <span class=\"slot\" data-s=\"0\">？<\/span> 縫在 <span class=\"slot\" data-s=\"1\">？<\/span> 的皮上。"}], "labs": []}, {"id": "p2", "kind": "para", "label": "Paragraph 2", "text": "The platypus does look as if it were put together by a mad scientist. However, its seemingly strange collection of features and adaptations helps the platypus to survive in its Australian home.", "u": [[101, 111]], "conn": [[70, 77]], "vocab": [[55, 68, "r6-3"], [83, 92, "v6-4"], [101, 111, "v6-5"], [115, 123, "v6-6"], [128, 139, "v6-7"], [162, 169, "v6-8"]], "qs": [{"id": "p2-1", "tag": "R", "label": "WRITER", "ans": "像拼起來的，很奇怪", "tap": [], "choice": null, "groups": 1, "prompt": "put together by a <b>mad scientist<\/b>：作者用這個畫面，讓讀者覺得 platypus <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">像拼起來的，很奇怪<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很危險<\/button><\/span>"}, {"id": "p2-3", "tag": "T", "label": "THINKING", "ans": "主旨（main idea）", "tap": [], "choice": null, "groups": 1, "prompt": "§2 是整篇的 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">主旨（main idea）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">一個小細節<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "glimpse / specimen / stitched / webbed feet / seemingly / features / adaptations / survive / collection"], ["purple", "THINKING LAB", "開頭用一個真實的歷史故事吸引讀者，§2 才說出主旨：奇怪的特徵其實幫 platypus 生存。"]], "group": ["p1", "p2"]}, {"kind": "head", "text": "A Most Unlikely Mammal"}, {"id": "p3", "kind": "para", "label": "Paragraph 3", "text": "The platypus is a mammal, just like a mouse or a dog. It is a warm-blooded animal with a backbone, and it is covered with fur.", "u": [[18, 24]], "conn": [[26, 35]], "vocab": [[18, 24, "v1-8"], [62, 74, "v6-10"], [89, 97, "v6-11"]], "qs": [{"id": "p3-1", "tag": "R", "label": "WRITER", "ans": "最不像哺乳類的哺乳類", "tap": [], "choice": null, "groups": 1, "prompt": "小標題 <b>A Most Unlikely Mammal<\/b> 的意思是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">最不像哺乳類的哺乳類<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">最常見的哺乳類<\/button><\/span>"}, {"id": "p3-2", "tag": "T", "label": "THINKING", "ans": "warm-blooded；has a backbone；covered with fur", "tap": [], "choice": {"opts": ["cold-blooded；has a backbone；is covered with scales", "warm-blooded；has a backbone；is covered with fur", "warm-blooded；has no backbone；has feathers"], "ok": 1}, "groups": 0, "prompt": "platypus 是 mammal 的三個證據：① <span class=\"slot\">？<\/span> ② <span class=\"slot\">？<\/span> ③ <span class=\"slot\">？<\/span>"}], "labs": []}, {"id": "p4", "kind": "para", "label": "Paragraph 4", "text": "The average platypus is about 18 inches long, from nose to tail. It weighs anywhere from 1.5 to around 5 pounds. Males are generally larger than females. A platypus may live 13 or more years in the wild and 20 or more in captivity.", "u": [[133, 139]], "conn": [], "vocab": [[4, 11, "v6-12"], [33, 39, "r6-6"], [105, 111, "r6-6"], [191, 202, "v6-13"], [221, 230, "v6-14"]], "qs": [{"id": "p4-1", "tag": "T", "label": "THINKING", "ans": "18；1.5；5；13；20", "tap": ["18", "1.5", "5", "13", "20"], "choice": null, "groups": 0, "prompt": "數字整理：長約 <span class=\"slot\" data-s=\"0\">？<\/span> inches；重 <span class=\"slot\" data-s=\"1\">？<\/span> 到約 <span class=\"slot\" data-s=\"2\">？<\/span> pounds；野外活 <span class=\"slot\" data-s=\"3\">？<\/span> 年以上，圈養 <span class=\"slot\" data-s=\"4\">？<\/span> 年以上。"}, {"id": "p4-3", "tag": "T", "label": "THINKING", "ans": "久", "tap": [], "choice": null, "groups": 1, "prompt": "platypus 在 captivity 裡活得比在野外 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">久<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">短<\/button><\/span>"}], "labs": []}, {"id": "p5", "kind": "para", "label": "Paragraph 5", "text": "A platypus spends as much as 10 hours a day in the water. Therefore, lakes, rivers, and streams are always part of a platypus's habitat. A platypus usually forages, or hunts for food, at night. It swims underwater in search of insects, shellfish, and worms. A single dive usually lasts for a minute or two. While underwater, the platypus collects food from the river bottom and stores it in cheek pouches.", "u": [[156, 163]], "conn": [[58, 67], [165, 167]], "vocab": [[128, 135, "v6-15"], [156, 163, "v6-16"], [236, 245, "r6-4"], [378, 384, "v6-17"], [391, 404, "r6-5"]], "qs": [{"id": "p5-2", "tag": "W", "label": "WORD", "ans": "forages 的意思（context clue）", "tap": [], "choice": null, "groups": 1, "prompt": "A platypus usually <b>forages, or hunts for food<\/b>：or 後面是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">forages 的意思（context clue）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">另一個動作<\/button><\/span>"}, {"id": "p5-3", "tag": "T", "label": "THINKING", "ans": "in its cheek pouches（頰囊）", "tap": [], "choice": {"opts": ["in its burrow", "in its cheek pouches", "in its webbed feet"], "ok": 1}, "groups": 0, "prompt": "platypus 在水裡找到的食物，先放在哪裡？<span class=\"slot\">？<\/span>"}, {"id": "p5-4", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ insects, shellfish, and worms", "tap": ["insects, shellfish, and worms"], "choice": null, "groups": 0, "prompt": "畫出：platypus 吃的三種食物。"}], "labs": [["green", "WORD LINKS", "mammal / warm-blooded / backbone / average / in the wild / captivity / habitat / forages / stores"], ["purple", "THINKING LAB", "小標題下先證明它是 mammal，再用數字和習性描述它（description）。"]], "group": ["p3", "p4", "p5"]}], "gist": {"opts": ["British scientists made the first platypus as a joke.", "The platypus is a kind of duck that lives in Australia.", "The platypus looks like it was put together from different animals, but it is a mammal whose features help it survive."], "ok": 2}, "quiz": [{"w": "glimpse", "opts": ["an animal with fur or hair that feeds its babies milk", "a quick look", "being kept by people, like in a zoo"], "ok": 1}, {"w": "specimen", "opts": ["one animal or plant kept so scientists can study it", "feet with skin between the toes, good for swimming", "keeping the same body heat whether it is cold or hot"], "ok": 0}, {"w": "stitched", "opts": ["looks for food", "sewed together with a needle and thread", "feet with skin between the toes, good for swimming"], "ok": 1}, {"w": "webbed feet", "opts": ["feet with skin between the toes, good for swimming", "keeping the same body heat whether it is cold or hot", "in a way that seems true but may not be"], "ok": 0}, {"w": "seemingly", "opts": ["in a way that seems true but may not be", "sewed together with a needle and thread", "a group of things gathered together"], "ok": 0}, {"w": "collection", "opts": ["a group of things gathered together", "being kept by people, like in a zoo", "body parts or ways of acting that help an animal live in its home"], "ok": 0}, {"w": "features", "opts": ["one animal or plant kept so scientists can study it", "important parts or qualities of something", "in a way that seems true but may not be"], "ok": 1}, {"w": "adaptations", "opts": ["the row of bones down the middle of the back", "body parts or ways of acting that help an animal live in its home", "an animal with fur or hair that feeds its babies milk"], "ok": 1}, {"w": "survive", "opts": ["being kept by people, like in a zoo", "to stay alive", "feet with skin between the toes, good for swimming"], "ok": 1}, {"w": "mammal", "opts": ["the row of bones down the middle of the back", "an animal with fur or hair that feeds its babies milk", "keeps something to use later"], "ok": 1}, {"w": "warm-blooded", "opts": ["keeping the same body heat whether it is cold or hot", "one animal or plant kept so scientists can study it", "looks for food"], "ok": 0}, {"w": "backbone", "opts": ["in a way that seems true but may not be", "usual or normal in size or amount", "the row of bones down the middle of the back"], "ok": 2}, {"w": "average", "opts": ["body parts or ways of acting that help an animal live in its home", "looks for food", "usual or normal in size or amount"], "ok": 2}, {"w": "in the wild", "opts": ["an animal with fur or hair that feeds its babies milk", "living in nature, not kept by people", "important parts or qualities of something"], "ok": 1}, {"w": "captivity", "opts": ["usual or normal in size or amount", "in a way that seems true but may not be", "being kept by people, like in a zoo"], "ok": 2}, {"w": "habitat", "opts": ["usual or normal in size or amount", "the natural home of an animal", "sewed together with a needle and thread"], "ok": 1}, {"w": "forages", "opts": ["keeps something to use later", "looks for food", "an animal with fur or hair that feeds its babies milk"], "ok": 1}, {"w": "stores", "opts": ["keeps something to use later", "looks for food", "a group of things gathered together"], "ok": 0}], "say": "Water is always part of the platypus's habitat because it spends up to 10 hours a day in the water.", "pause": ["platypus 看起來像拼起來的，但它是哺乳類，奇怪的特徵幫助它生存。", "the 1700s specimen、warm-blooded、backbone、fur、18 inches、10 hours in the water。"], "tools": [{"id": "t6a", "title": "Platypus 小檔案（Fact File）", "how": "把 §3–5 的事實整理成一張小檔案，像百科全書一樣。", "layout": "table", "head": ["Fact", "Answer"], "rows": [["How long is it?（§4）", {"s": "f1"}], ["How much does it weigh?（§4）", {"s": "f2"}], ["How long does it live?（§4）", {"s": "f3"}], ["How long is it in the water each day?（§5）", {"s": "f4"}], ["When does it forage?（§5）", {"s": "f5"}], ["Where does it keep food underwater?（§5）", {"s": "f6"}]], "cards": [{"t": "in its cheek pouches", "s": "f6", "w": null}, {"t": "about 18 inches, from nose to tail", "s": "f1", "w": null}, {"t": "as much as 10 hours a day", "s": "f4", "w": null}, {"t": "1.5 to about 5 pounds", "s": "f2", "w": null}, {"t": "at night", "s": "f5", "w": null}, {"t": "in its burrow", "s": null, "w": null}, {"t": "13 or more years in the wild; 20 or more in captivity", "s": "f3", "w": null}]}, {"id": "t6b", "title": "Synthesize｜連結第一篇", "how": "第一篇 Echidna §4 已經告訴我們什麼？", "layout": "line", "rows": [["platypus 和 echidna 都是", {"s": "x1"}, "。"]], "cards": [{"t": "birds", "s": null, "w": null}, {"t": "monotremes (mammals that lay eggs)", "s": "x1", "w": null}, {"t": "reptiles", "s": null, "w": null}]}], "disp": 1}, {"n": 7, "title": "Platypus 2｜Like Other Mammals…but Not Quite", "range": "Platypus §6–8", "cards": [{"id": "p6", "kind": "para", "label": "Paragraph 6", "text": "When not looking for food, the platypus shelters in its burrow. A platypus burrow is usually built in the bank of a river or stream. Sometimes, a platypus uses rocky spots along the edge of the water as shelter. At times, it may make its burrow under logs or among the roots of a tree for protection.", "u": [[0, 25], [56, 62], [75, 81], [238, 244]], "conn": [], "vocab": [[40, 48, "v7-0"], [56, 62, "v4-14"], [75, 81, "v4-14"], [106, 110, "v7-2"], [203, 210, "r7-4"], [238, 244, "v4-14"], [269, 274, "r7-5"]], "qs": [{"id": "p6-2", "tag": "W", "label": "WORD", though echidnas also live in New Guinea. All other mammals give birth to live young. However, monotremes lay eggs. This is just one of many characteristics that make the platypus unusual.", "u": [[34, 40], [50, 59], [76, 85], [239, 246], [282, 292]], "conn": [[134, 138], [188, 194], [273, 280]], "vocab": [[34, 40, "v1-8"], [50, 59, "v1-11"], [76, 85, "v1-11"], [93, 100, "r7-1"], [118, 132, "r7-2"], [157, 164, "r7-1"], [195, 202, "r7-1"], [217, 227, "r7-3"], [239, 246, "v1-8"], [247, 260, "v7-8"], [282, 292, "v1-11"], [328, 343, "v7-9"]], "qs": [{"id": "p8-1", "tag": "T", "label": "THINKING", "ans": "the platypus；the echidna", "tap": ["the platypus", "the echidna"], "choice": null, "groups": 0, "prompt": "和 Echidna §4 連起來：monotremes 只有兩種，就是 <span class=\"slot\" data-s=\"0\">？<\/span> 和 <span class=\"slot\" data-s=\"1\">？<\/span>。"}, {"id": "p8-4", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ However, monotremes lay eggs.（Echidna §4：They are the only mammals on Earth that lay eggs.）", "tap": [], "choice": {"opts": ["7", "13", "4"], "ok": 2}, "groups": 0, "prompt": "畫出：兩篇文章都說到的同一件事。Echidna 是在第 <span class=\"slot\">？<\/span> 段說的。"}], "labs": [["green", "WORD LINKS", "in terms of / traits / behavior / similarities / similar / give birth to / characteristics"], ["purple", "THINKING LAB", "這裡是兩篇交會的地方：Platypus §8 和 Echidna §4 都說 monotremes 會生蛋。把兩篇的資訊合起來，就是 synthesize。"]], "group": ["p7", "p8"]}], "gist": {"opts": ["The platypus lives in burrows near the water and is like other mammals in many ways, but it lays eggs like the echidna.", "The platypus lives in trees and never goes into the water.", "All mammals lay eggs, so the platypus is not special."], "ok": 0}, "quiz": [{"w": "shelters", "opts": ["the way an animal or a person acts", "a hole that an animal digs to live in", "stays in a safe place"], "ok": 2}, {"w": "burrow", "opts": ["almost the same", "a hole that an animal digs to live in", "ways that things are alike"], "ok": 1}, {"w": "bank", "opts": ["the land along the side of a river", "almost the same", "when talking about"], "ok": 0}, {"w": "in terms of", "opts": ["when talking about", "stays in a safe place", "to have a baby"], "ok": 0}, {"w": "traits", "opts": ["stays in a safe place", "special qualities", "to have a baby"], "ok": 1}, {"w": "behavior", "opts": ["the way an animal or a person acts", "the land along the side of a river", "special qualities that make something what it is"], "ok": 0}, {"w": "similarities", "opts": ["special qualities", "ways that things are alike", "to have a baby"], "ok": 1}, {"w": "similar", "opts": ["a hole that an animal digs to live in", "stays in a safe place", "almost the same"], "ok": 2}, {"w": "give birth to", "opts": ["a hole that an animal digs to live in", "ways that things are alike", "to have a baby"], "ok": 2}, {"w": "characteristics", "opts": ["special qualities that make something what it is", "the land along the side of a river", "to have a baby"], "ok": 0}], "say": "The platypus is unusual because it lays eggs instead of giving birth to live young.", "pause": ["platypus 住在水邊的洞穴；它在很多方面像其他哺乳類，但和 echidna 一樣會生蛋。", "river bank、rocky spots、logs and roots、monotremes、lays eggs。"], "tools": [{"id": "t7a", "title": "Platypus 和其他 mammals 比", "how": "哪裡一樣？哪裡不一樣？", "layout": "table", "head": ["Like other mammals", "Unlike other mammals"], "rows": [[{"s": "l1"}, {"s": "u1"}]], "cards": [{"t": "it has feathers", "s": null, "w": null}, {"t": "it lays eggs instead of giving birth to live young", "s": "u1", "w": null}, {"t": "warm-blooded, has a backbone and fur", "s": "l1", "w": null}]}, {"id": "t7b", "title": "Platypus 和 echidna 比", "how": "這一題要用到第一篇。", "layout": "table", "head": ["", "Platypus", "Echidna"], "rows": [["Group", {"s": "g1"}, {"s": "g2"}], ["Where it lives", {"s": "w1"}, {"s": "w2"}], ["Babies", {"s": "y1"}, {"s": "y2"}]], "cards": [{"t": "lays soft eggs", "s": "y2", "w": null}, {"t": "Australia and New Guinea (forests)", "s": "w2", "w": null}, {"t": "monotreme", "s": "g2", "w": null}, {"t": "monotreme", "s": "g1", "w": null}, {"t": "lays leathery eggs", "s": "y1", "w": null}, {"t": "Australia (near water)", "s": "w1", "w": null}]}], "disp": 2}, {"n": 8, "title": "Platypus 3｜Ducklike Features", "range": "Platypus §9–11", "cards": [{"kind": "head", "text": "Ducklike Features"}, {"id": "p9", "kind": "para", "label": "Paragraph 9", "text": "The platypus's ducklike bill is its most notable feature. And its webbed feet are just as striking. Its bill and feet make it look more like a strange bird than a mammal.", "u": [[41, 48], [163, 169]], "conn": [[82, 89]], "vocab": [[15, 23, "r8-3"], [41, 48, "v8-0"], [90, 98, "v8-1"], [163, 169, "v1-8"]], "qs": [{"id": "p9-1", "tag": "W", "label": "WORD", "ans": "像…的", "tap": [], "choice": null, "groups": 1, "prompt": "<b>ducklike<\/b> bill：-like 的意思是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">像…的<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">不喜歡<\/button><\/span>"}, {"id": "p9-3", "tag": "T", "label": "THINKING", "ans": "一隻奇怪的鳥", "tap": [], "choice": null, "groups": 1, "prompt": "bill 和 feet 讓 platypus 看起來比較像 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">一隻奇怪的鳥<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">一條魚<\/button><\/span>"}], "labs": []}, {"id": "p10", "kind": "para", "label": "Paragraph 10", "text": "However, these features play important roles in survival. Because the platypus hunts for food underwater, swimming skills are vital to survival. A platypus's webbed feet make it an excellent swimmer. Using a rowing motion—first one front foot, then the other—the animal moves easily through the water. It can also hover in one spot, even against the current, while it searches for something to eat.", "u": [[48, 56], [135, 143]], "conn": [[0, 7], [58, 65]], "vocab": [[24, 44, "v8-2"], [48, 56, "v9-19"], [126, 131, "v8-3"], [135, 143, "v9-19"], [181, 198, "r8-4"], [208, 221, "r8-0"], [314, 319, "v8-4"], [350, 357, "v8-5"]], "qs": [{"id": "p10-4", "tag": "W", "label": "WORD", "ans": "停在原地；水流", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\">It can also <b>hover<\/b> in one spot, even against the <b>current<\/b>：hover<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">停在原地<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">游走<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">current<\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">水流<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">現在<\/button><\/span><\/div>"}], "labs": [["green", "WORD LINKS", "notable / striking / play important roles / vital / hover / current / survival"], ["purple", "THINKING LAB", "看起來奇怪的 webbed feet，其實讓它游得很好：外表 → 作用（feature → survival）。"]], "group": ["p9", "p10"]}, {"id": "p11", "kind": "para", "label": "Paragraph 11", "text": "Underwater, a platypus closes its eyes, ears, and nostrils. But how can the animal find food? Here is where the platypus's extraordinary bill comes into play. Unlike a duck's hard bill, a platypus's bill is rubbery. It serves as the platypus's sense organ when under the water. The bill has sensors that pick up electrical signals from prey.", "u": [[244, 249], [291, 298]], "conn": [[159, 165]], "vocab": [[50, 58, "v8-6"], [123, 136, "v8-7"], [142, 157, "v8-8"], [207, 214, "r8-1"], [244, 255, "r8-2"], [291, 298, "v2-9"], [304, 311, "v8-10"], [312, 330, "v8-11"], [336, 340, "v8-12"]], "qs": [{"id": "p11-1", "tag": "R", "label": "WRITER", "ans": "帶出答案：bill", "tap": [], "choice": null, "groups": 1, "prompt": "<b>But how can the animal find food?<\/b>：作者用問句 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">帶出答案：bill<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">考讀者<\/button><\/span>"}, {"id": "p11-3", "tag": "T", "label": "THINKING", "ans": "sensors；electrical signals", "tap": ["sensors", "electrical signals"], "choice": null, "groups": 0, "prompt": "Synthesize：platypus 的 bill 和 echidna 的 beak 都有 <span class=\"slot\" data-s=\"0\">？<\/span>，能偵測獵物的 <span class=\"slot\" data-s=\"1\">？<\/span>（Echidna §7）。"}, {"id": "p11-4", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ eyes, ears, and nostrils", "tap": ["eyes, ears, and nostrils"], "choice": null, "groups": 0, "prompt": "畫出：platypus 在水裡關起來的三個部位。"}], "labs": [["green", "WORD LINKS", "nostrils / extraordinary / comes into play / sensors / pick up / electrical signals / prey / sense"], ["purple", "THINKING LAB", "眼睛、耳朵、鼻孔都關起來，靠 bill 的 sensors 找食物。和 echidna 的 beak 一樣。"]], "group": ["p11"]}], "gist": {"opts": ["The platypus finds food with its big eyes underwater.", "The platypus's webbed feet make it a great swimmer, and its rubbery bill uses sensors to find prey underwater.", "The platypus's bill is hard, just like a duck's bill."], "ok": 1}, "quiz": [{"w": "notable", "opts": ["to stay in one place in the air or water", "have important jobs", "important and easy to notice"], "ok": 2}, {"w": "striking", "opts": ["very easy to notice because it is unusual", "important and easy to notice", "very important; needed to live"], "ok": 0}, {"w": "play important roles", "opts": ["have important jobs", "to notice or receive", "tiny bits of electricity given off by living things"], "ok": 0}, {"w": "vital", "opts": ["very unusual and special", "starts to be used or to matter", "very important; needed to live"], "ok": 2}, {"w": "hover", "opts": ["one of the ways the body learns about the world, like seeing or hearing", "have important jobs", "to stay in one place in the air or water"], "ok": 2}, {"w": "current", "opts": ["have important jobs", "tiny bits of electricity given off by living things", "water moving in one direction"], "ok": 2}, {"w": "nostrils", "opts": ["water moving in one direction", "very easy to notice because it is unusual", "the two holes in the nose"], "ok": 2}, {"w": "extraordinary", "opts": ["to stay in one place in the air or water", "very unusual and special", "water moving in one direction"], "ok": 1}, {"w": "comes into play", "opts": ["an animal that is hunted for food", "starts to be used or to matter", "very important; needed to live"], "ok": 1}, {"w": "sensors", "opts": ["one of the ways the body learns about the world, like seeing or hearing", "parts that notice things like heat, light, or movement", "to stay in one place in the air or water"], "ok": 1}, {"w": "pick up", "opts": ["to notice or receive", "parts that notice things like heat, light, or movement", "water moving in one direction"], "ok": 0}, {"w": "electrical signals", "opts": ["important and easy to notice", "tiny bits of electricity given off by living things", "very easy to notice because it is unusual"], "ok": 1}, {"w": "prey", "opts": ["an animal that is hunted for food", "one of the ways the body learns about the world, like seeing or hearing", "starts to be used or to matter"], "ok": 0}, {"w": "sense", "opts": ["starts to be used or to matter", "one of the ways the body learns about the world, like seeing or hearing", "to notice or receive"], "ok": 1}], "say": "The platypus can find food underwater because its bill has sensors.", "pause": ["webbed feet 讓 platypus 很會游泳；rubbery bill 的 sensors 讓它在水裡找到食物。", "rowing motion、hover against the current、closes its eyes, ears, and nostrils、sensors。"], "tools": [{"id": "t8a", "title": "外表 → 作用", "how": "bill 和 webbed feet 長什麼樣？做什麼用？", "layout": "table", "head": ["Feature", "What it looks like", "What job it does", "§"], "rows": [["bill", {"s": "a1"}, {"s": "b1"}, {"s": "c1"}], ["webbed feet", {"s": "a2"}, {"s": "b2"}, {"s": "c2"}]], "cards": [{"t": "like a duck's bill, but rubbery", "s": "a1", "w": null}, {"t": "§10", "s": "c2", "w": null}, {"t": "a sense organ: its sensors pick up electrical signals from prey", "s": "b1", "w": null}, {"t": "make it an excellent swimmer; it can row and hover", "s": "b2", "w": null}, {"t": "webbed, like a duck's feet", "s": "a2", "w": null}, {"t": "§11", "s": "c1", "w": null}]}, {"id": "t8b", "title": "Echidna 的 beak vs. Platypus 的 bill", "how": "兩篇一起比較。", "layout": "table", "head": ["", "Echidna's beak", "Platypus's bill"], "rows": [["Hard or soft?", {"s": "h1"}, {"s": "h2"}], ["Has sensors?", {"s": "s1"}, {"s": "s2"}], ["Used for…", {"s": "u1"}, {"s": "u2"}]], "cards": [{"t": "no", "s": null, "w": null}, {"t": "tough (hard)", "s": "h1", "w": null}, {"t": "rubbery (soft)", "s": "h2", "w": null}, {"t": "finding prey underwater", "s": "u2", "w": null}, {"t": "yes", "s": "s1", "w": null}, {"t": "yes", "s": "s2", "w": null}, {"t": "digging and finding prey on land; crushing food", "s": "u1", "w": null}]}], "disp": 3}, {"n": 9, "title": "Platypus 4｜Eggs, Poison, and an Oddity", "range": "Platypus §12–17", "cards": [{"kind": "head", "text": "Eggs Like a Reptile"}, {"id": "p12", "kind": "para", "label": "Paragraph 12", "text": "Platypus eggs aren't like the hard, oval eggs that most birds lay. Instead, platypus eggs are similar to the round, leathery eggs that reptiles such as lizards and turtles lay. The leathery shells are flexible. They are less likely to break during incubation than a hard-shelled egg would be.", "u": [[94, 101]], "conn": [[67, 74]], "vocab": [[36, 40, "v9-0"], [94, 101, "v7-7"], [116, 124, "v9-1"], [135, 143, "v9-2"], [152, 159, "r9-6"], [164, 171, "r9-6"], [181, 189, "v9-1"], [201, 209, "v9-3"], [248, 258, "r9-0"]], "qs": [{"id": "p12-2", "tag": "T", "label": "THINKING", "ans": "hard；oval；round；leathery", "tap": ["hard", "oval", "round", "leathery"], "choice": null, "groups": 0, "prompt": "比較：鳥蛋是 <span class=\"slot\" data-s=\"0\">？<\/span>、<span class=\"slot\" data-s=\"1\">？<\/span>；platypus 蛋是 <span class=\"slot\" data-s=\"2\">？<\/span>、<span class=\"slot\" data-s=\"3\">？<\/span>。"}, {"id": "p12-3", "tag": "T", "label": "THINKING", "ans": "孵蛋時比較不容易破", "tap": [], "choice": null, "groups": 1, "prompt": "leathery shells 有什麼好處？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">孵蛋時比較不容易破<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">比較好吃<\/button><\/span>"}, {"id": "p12-4", "tag": "R", "label": "WRITER", "ans": "soft eggs, like a snake does", "tap": [], "choice": {"opts": ["no eggs; it has live young", "hard, oval eggs, like a bird's", "soft eggs, like a snake's"], "ok": 2}, "groups": 0, "prompt": "Synthesize：Echidna §3 說 echidna 生的是 <span class=\"slot\">？<\/span>。"}], "labs": []}, {"id": "p13", "kind": "para", "label": "Paragraph 13", "text": "The female platypus lays one to three eggs. She lays the eggs in a deep burrow and incubates them for about 10 days. When the baby platypuses hatch, they are naked and blind. Only the female platypus cares for the young. Like other mammals, the female platypus feeds milk to her young. When the platypuses are three to four months old, they leave the burrow. At that point, they have a full coat of fur. They have to learn how to swim and find food for themselves.", "u": [[72, 78], [142, 147], [232, 239], [351, 357]], "conn": [[221, 225]], "vocab": [[72, 78, "v4-14"], [83, 92, "v9-4"], [142, 147, "v9-5"], [158, 173, "r9-5"], [232, 239, "v1-8"], [351, 357, "v4-14"]], "qs": [{"id": "p13-1", "tag": "T", "label": "THINKING", "ans": "1–3；10；3–4", "tap": [], "choice": {"opts": ["5–6；30；12", "1–3；10；3–4", "1–3；100；1"], "ok": 1}, "groups": 0, "prompt": "數字整理：一次生 <span class=\"slot\">？<\/span> 顆蛋；孵大約 <span class=\"slot\">？<\/span> 天；寶寶 <span class=\"slot\">？<\/span> 個月大時離開洞穴。"}, {"id": "p13-2", "tag": "W", "label": "WORD", "ans": "沒有毛、看不見", "tap": [], "choice": null, "groups": 1, "prompt": "When the baby platypuses <b>hatch<\/b>, they are naked and blind：寶寶剛孵出來時 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">沒有毛、看不見<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很大、很強壯<\/button><\/span>"}, {"id": "p13-4", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ ① lays eggs in a deep burrow　② incubates them about 10 days　③ babies hatch, naked and blind, and drink milk　④ leave the burrow at 3–4 months with fur", "tap": [], "choice": {"opts": ["① lay eggs → ② leave the burrow → ③ babies hatch → ④ incubate", "① babies hatch → ② lay eggs → ③ leave the burrow → ④ drink milk", "① lay eggs in a burrow → ② incubate about 10 days → ③ babies hatch and drink milk → ④ leave the burrow at 3–4 months"], "ok": 2}, "groups": 0, "prompt": "用 ① ② ③ ④ 標出 platypus 寶寶長大的順序。"}], "labs": [["green", "WORD LINKS", "oval / leathery / reptiles / flexible / incubates / hatch / similar"], ["purple", "THINKING LAB", "像爬蟲類一樣生軟殼蛋，又像哺乳類一樣餵奶：兩種特徵混在一起。"]], "group": ["p12", "p13"]}, {"kind": "head", "text": "Platypus Poison"}, {"id": "p14", "kind": "para", "label": "Paragraph 14", "text": "The male platypus has a particular feature that the female does not share. Like some species of insects, spiders, and snakes, the male platypus has venom. Sharp spurs on the heels of its hind feet deliver the venom, which is produced by a special gland in the male's thigh. Given a choice, a platypus dives underwater to escape a predator. Or it dashes down a burrow. But if there is no choice, a male platypus uses its spurs to protect itself.", "u": [[216, 221], [360, 366]], "conn": [[274, 288], [368, 393]], "vocab": [[24, 34, "v9-6"], [85, 92, "v9-7"], [148, 153, "v9-8"], [161, 166, "r9-1"], [197, 204, "v9-9"], [209, 214, "v9-8"], [247, 252, "r9-2"], [267, 272, "r9-3"], [330, 338, "v9-10"], [346, 352, "v9-11"], [360, 366, "v4-14"], [420, 425, "r9-1"]], "qs": [{"id": "p14-1", "tag": "T", "label": "THINKING", "ans": "male（公的）", "tap": [], "choice": null, "groups": 1, "prompt": "哪一種 platypus 有 venom？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">male（公的）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">female（母的）<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "particular / species / venom / deliver / predator / dashes"], ["purple", "THINKING LAB", "只有公的有毒：先逃（潛水、躲洞），沒辦法才用毒刺保護自己。"]], "group": ["p14"]}, {"kind": "head", "text": "A Well-Adapted Oddity"}, {"id": "p15", "kind": "para", "label": "Paragraph 15", "text": "The platypus might be the oddest-looking creature on Earth. It seems to be part duck, otter, and beaver. And part snake and spider, too. It's a hodgepodge of strange features that don't seem to belong together.", "u": [[41, 49]], "conn": [], "vocab": [[41, 49, "v1-1"], [144, 154, "r9-4"]], "qs": [{"id": "p15-1", "tag": "W", "label": "WORD", "ans": "奇怪的東西", "tap": [], "choice": null, "groups": 1, "prompt": "小標題 <b>A Well-Adapted Oddity<\/b>：oddity 來自 odd（奇怪），意思是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">奇怪的東西<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">普通的東西<\/button><\/span>"}, {"id": "p15-2", "tag": "T", "label": "THINKING", "ans": "duck, otter, beaver, snake, and spider", "tap": [], "choice": {"opts": ["bird, dog, mouse, lizard, and ant", "duck, fish, frog, cat, and bee", "duck, otter, beaver, snake, and spider"], "ok": 2}, "groups": 0, "prompt": "platypus 看起來像哪五種動物？<span class=\"slot\">？<\/span>"}, {"id": "p15-3", "tag": "W", "label": "WORD", "ans": "大雜燴（混在一起）", "tap": [], "choice": null, "groups": 1, "prompt": "a <b>hodgepodge<\/b> of strange features：hodgepodge = <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">大雜燴（混在一起）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">一種動物<\/button><\/span>"}], "labs": []}, {"id": "p16", "kind": "para", "label": "Paragraph 16", "text": "It shares the basic features of all mammals. But, unlike other mammals, the platypus does not give birth to live young. It lays leathery eggs instead. The duckbill and webbed feet make it well suited for its habitat. And, similar to a spider or snake, a platypus can defend itself with venom.", "u": [[36, 43], [63, 70], [222, 229]], "conn": [[50, 56]], "vocab": [[36, 43, "v1-8"], [63, 70, "v1-8"], [128, 136, "v9-1"], [188, 199, "v9-13"], [222, 229, "v7-7"], [267, 273, "v9-14"], [286, 291, "v9-8"]], "qs": [{"id": "p16-1", "tag": "R", "label": "WRITER", "ans": "把前面小標題的重點再整理一次（summary）", "tap": [], "choice": null, "groups": 1, "prompt": "§16 是在 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">把前面小標題的重點再整理一次（summary）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">加入新的資訊<\/button><\/span>"}, {"id": "p16-2", "tag": "T", "label": "THINKING", "ans": "Eggs Like a Reptile；Ducklike Features；Platypus Poison", "tap": [], "choice": {"opts": ["Ducklike Features；Eggs Like a Reptile；Platypus Poison", "Eggs Like a Reptile；Ducklike Features；Platypus Poison", "Platypus Poison；Ducklike Features；Eggs Like a Reptile"], "ok": 1}, "groups": 0, "prompt": "對照小標題：lays leathery eggs →「<span class=\"slot\">？<\/span>」；duckbill and webbed feet →「<span class=\"slot\">？<\/span>」；venom →「<span class=\"slot\">？<\/span>」"}, {"id": "p16-3", "tag": "W", "label": "WORD", "ans": "和…相似", "tap": [], "choice": null, "groups": 1, "prompt": "<b>similar to<\/b> a spider or snake：similar to = <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">和…相似<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">和…不同<\/button><\/span>"}], "labs": []}, {"id": "p17", "kind": "para", "label": "Paragraph 17", "text": "The platypus looks like an animal made up of spare parts. But these seemingly unlikely adaptations allow the platypus to find food, protect itself, and reproduce successfully. This ensures the survival of these fascinating creatures.", "u": [[176, 180], [193, 201], [223, 232]], "conn": [], "vocab": [[45, 56, "v9-15"], [152, 161, "v9-16"], [181, 188, "v9-17"], [193, 201, "v9-19"], [211, 222, "v9-18"], [223, 232, "v1-1"]], "qs": [{"id": "p17-1", "tag": "R", "label": "WRITER", "ans": "用備用零件拼成的動物", "tap": [], "choice": null, "groups": 1, "prompt": "<b>made up of spare parts<\/b>：作者把 platypus 比成 <span class=\"og\" data-g=\"0\"><button type=\"button\         else { b.classList.add("wrong"); b.disabled = true; box.dataset.miss = 1; }
      };
      if (store.done[id]){ b.disabled = true; if (i === ok) b.classList.add("right"); }
      box.appendChild(b);
    });
    if (store.done[id]) box.dataset.ok = 1;
    return box;
  }

  var STEPS = [["1", "精讀", "Close Read"], ["2", "大意", "Main Idea"], ["3", "單字小考", "Word Check"], ["4", "說出來", "Say It"]];
  function renderUnit(u){
    var hasT = !!(u.tools && u.tools.length);
    var STEPS = hasT ? [["1", "精讀", "Close Read"], ["2", "大意", "Main Idea"], ["3", "單字小考", "Word Check"], ["4", "理解工具", "Organize"], ["5", "說出來", "Say It"]]
                     : [["1", "精讀", "Close Read"], ["2", "大意", "Main Idea"], ["3", "單字小考", "Word Check"], ["4", "說出來", "Say It"]];
    var wrap = el("div", "unit"); wrap.id = "unit-" + u.n; wrap.dataset.unit = u.n; wrap.hidden = true;
    wrap.innerHTML = '<header class="uhead"><span class="badge">Unit ' + u.disp + "</span><h2></h2><p class=\"range\"></p><nav class=\"steps\">" +
      STEPS.map(function(s){ return '<a href="#u' + u.n + "-s" + s[0] + '"><b>' + s[0] + "</b>" + s[1] + "</a>"; }).join("") + "</nav></header>";
    wrap.querySelector("h2").textContent = u.title; wrap.querySelector(".range").textContent = u.range;
    function step(n, inner, how){
      var s = el("section", "step"); s.id = "u" + u.n + "-s" + n;
      var st = STEPS[n - 1]; s.appendChild(el("h3", null, '<span class="sn">' + st[0] + "</span>" + st[1] + "<em>" + st[2] + "</em>"));
      if (how) s.appendChild(el("p", "howto", how));
      s.appendChild(inner); wrap.appendChild(s); return s;
    }
    var cr = el("div");
    u.cards.forEach(function(c){ cr.appendChild(renderCard(c, u)); });
    step(1, cr, "先讀左邊的段落。不懂的字點一下看意思。右邊的題目用點的作答：選項直接點；黃色按鈕的題目要到文章裡點出答案。");
    var g = el("div"); g.appendChild(el("p", null, "<b>上面 " + u.range + " 主要在講什麼？</b>")); g.appendChild(mcq(u.gist.opts, u.gist.ok, null, "g" + u.n));
    step(2, g);
    var qz = el("div"), grid = el("div", "qgrid"), sc = el("p", "score");
    function score(){ var got = u.quiz.filter(function(_, i){ return store.done["z" + u.n + "-" + i] === 1; }).length; sc.innerHTML = "一次就答對：<b>" + got + "</b> / " + u.quiz.length; }
    u.quiz.forEach(function(z, i){ var c = el("div", "qz"); c.appendChild(el("b", null, (i + 1) + ". ")); c.firstChild.appendChild(document.createTextNode(z.w)); c.appendChild(mcq(z.opts, z.ok, score, "z" + u.n + "-" + i)); grid.appendChild(c); });
    qz.appendChild(grid); qz.appendChild(sc); score();
    step(3, qz, "選出每個字的英文意思。第一次就點對才算分。");
    var talk = el("div");
    talk.innerHTML = '<ul class="talk"><li><label><input type="checkbox"> 這一節主要解釋什麼？</label></li><li><label><input type="checkbox"> 作者用了哪些細節或例子？</label></li><li><label><input type="checkbox"> 用 because / so 說一個因果</label></li></ul>' +
      '<details class="ex"><summary>說完了，看範例</summary><p><b>主要解釋</b>　' + u.pause[0] + "</p><p><b>動物例子</b>　" + u.pause[1] + "</p><p><b>because / so</b>　</p></details>";
    talk.querySelector(".ex p:last-child").appendChild(document.createTextNode(u.say));
    if (hasT){
      var tl = el("div"); u.tools.forEach(function(b){ tl.appendChild(renderBoard(b)); });
      step(4, tl, "把讀到的東西整理成表。先點下面的一張卡，再點它該放的格子。放錯會抖一下，再試一次就好。");
    }
    step(hasT ? 5 : 4, talk, "說給爸爸或媽媽聽。");
    var nx = el("div", "unext");
    var nextU = DATA.units[DATA.units.indexOf(u) + 1];
    nx.innerHTML = nextU ? '<a class="btn" href="#unit-' + nextU.n + '">下一個 Unit →</a>'
                 : (DATA.summary && DATA.summary.length ? '<a class="btn" href="#unit-summary">去總整理 →</a>' : DATA.review && DATA.review.length ? '<a class="btn" href="#unit-review">去總複習 →</a>' : '<p class="btn" style="display:inline-block">全部 Unit 都完成了！</p>');
    wrap.appendChild(nx);
    return wrap;
  }

  DATA.units.forEach(function(u){
    var t = el("a", "utab", "<b>Unit " + u.disp + "</b><span></span><i></i>"); t.href = "#unit-" + u.n; t.dataset.u = u.n;
    t.querySelector("span").textContent = u.title; tabsEl.appendChild(t);
    main.appendChild(renderUnit(u));
  });
  function extraTab(key, cls, label, sub, badge, h2, intro, boards){
    var t = el("a", "utab " + cls, "<b>" + label + "</b><span>" + sub + "</span><i></i>"); t.href = "#unit-" + key; t.dataset.u = key; tabsEl.appendChild(t);
    var w = el("div", "unit"); w.id = "unit-" + key; w.dataset.unit = key; w.hidden = true;
    w.innerHTML = '<header class="uhead"><span class="badge">' + badge + "</span><h2>" + h2 + '</h2><p class="range">' + intro + "</p></header>";
    main.appendChild(w); return w;
  }
  if (DATA.summary && DATA.summary.length){
    var sw = extraTab("summary", "sum", "總整理", "Concept Charts", "總整理", "Concept Charts", "把各個 Unit 讀到的東西整理成表。灰色的格子會在你做完那個 Unit 的理解工具後長出內容。");
    DATA.summary.forEach(function(b){ sw.appendChild(renderBoard(b)); });
    if (DATA.skills && DATA.skills.length){ sw.appendChild(el("div", "unext", '<a class="btn" href="#unit-skills">去技巧＋寫作 →</a>')); }
    else if (DATA.review && DATA.review.length){ var sn = el("div", "unext", '<a class="btn" href="#unit-review">去總複習 →</a>'); sw.appendChild(sn); }
  }
  if (DATA.skills && DATA.skills.length){
    var kw = extraTab("skills", "skl", "技巧＋寫作", "Reading & Writing", "技巧＋寫作", "Reading Skills ＆ Write Like a Thinker", "閱讀技巧和寫作練習，全部用點的。最後組一段話，再聽聽看。");
    DATA.skills.forEach(function(b){
      if (b.section){ var sh = el("h3", "secthead"); sh.textContent = b.section; if (b.sub){ var sp = el("span"); sp.textContent = b.sub; sh.appendChild(sp); } kw.appendChild(sh); }
      kw.appendChild(renderBoard(b));
    });
    if (DATA.review && DATA.review.length){ kw.appendChild(el("div", "unext", '<a class="btn" href="#unit-review">去總複習 →</a>')); }
  }
  var scoreBox = null;
  if (DATA.review && DATA.review.length){
    var rw = extraTab("review", "rev", "總複習", "Word List 小遊戲", "總複習", "Word List 小遊戲", "學校 Word List 一定要會的字。一關一關玩，第一次就放對，星星最多。");
    scoreBox = el("div", "scoreboard"); rw.appendChild(scoreBox);
    DATA.review.forEach(function(b){ rw.appendChild(renderBoard(b)); });
  }
  function paintScore(){
    if (!scoreBox) return;
    var got = 0, done = 0, weak = [];
    DATA.review.forEach(function(b){
      if (!store.done["t" + b.id]) return;
      done++; var ms = (store.miss && store.miss[b.id]) || [];
      got += ms.length === 0 ? 3 : ms.length <= 2 ? 2 : 1;
      ms.forEach(function(w){ if (weak.indexOf(w) < 0) weak.push(w); });
    });
    scoreBox.innerHTML = '<b class="big">★ ' + got + " / " + DATA.review.length * 3 + "</b>　完成 " + done + " / " + DATA.review.length + " 關" +
      (weak.length ? '<p style="margin:6px 0 0">還不熟的字（多唸幾次、再玩一次）：<span class="weak"></span></p>' : (done === DATA.review.length ? '<p style="margin:6px 0 0">全部的字都一次就放對了！</p>' : ""));
    if (weak.length) scoreBox.querySelector(".weak").textContent = weak.join("、");
  }
  document.addEventListener("am-progress", paintScore);

  function progress(){
    DATA.units.forEach(function(u){
      var ids = [];
      u.cards.forEach(function(c){ (c.qs || []).forEach(function(q){ ids.push(q.id); }); });
      (u.tools || []).forEach(function(b){ ids.push("t" + b.id); });
      ids.push("g" + u.n); u.quiz.forEach(function(_, i){ ids.push("z" + u.n + "-" + i); });
      var done = ids.filter(function(i){ return store.done[i]; }).length;
      var bar = tabsEl.querySelector('[data-u="' + u.n + '"] i'); if (bar) bar.style.width = Math.round(done / ids.length * 100) + "%";
    });
    if (DATA.summary && DATA.summary.length){
      var sd = DATA.summary.filter(function(b){ return store.done["t" + b.id]; }).length;
      var sb = tabsEl.querySelector('[data-u="summary"] i'); if (sb) sb.style.width = Math.round(sd / DATA.summary.length * 100) + "%";
    }
    if (DATA.skills && DATA.skills.length){
      var kd = DATA.skills.filter(function(b){ return store.done["t" + b.id]; }).length;
      var kb = tabsEl.querySelector('[data-u="skills"] i'); if (kb) kb.style.width = Math.round(kd / DATA.skills.length * 100) + "%";
    }
    if (DATA.review && DATA.review.length){
      var rd = DATA.review.filter(function(b){ return store.done["t" + b.id]; }).length;
      var rb = tabsEl.querySelector('[data-u="review"] i'); if (rb) rb.style.width = Math.round(rd / DATA.review.length * 100) + "%";
    }
    document.dispatchEvent(new Event("am-progress"));
  }

  function route(){
    var h = location.hash.replace("#", ""), m = h.match(/^u(\d+)-s\d+$/) || h.match(/^unit-(\d+|summary|skills|review)$/);
    var ok = function(x){ return ((x === "summary" || x === "skills" || x === "review") && !!document.getElementById("unit-" + x)) || DATA.units.some(function(u){ return String(u.n) === String(x); }); };
    var n = m && ok(m[1]) ? m[1] : (ok(store.unit) ? store.unit : String(DATA.units[0].n));
    document.querySelectorAll(".unit").forEach(function(x){ x.hidden = x.dataset.unit !== String(n); });
    tabsEl.querySelectorAll(".utab").forEach(function(x){ x.classList.toggle("on", x.dataset.u === String(n)); });
    store.unit = String(n); save();
    var target = h && document.getElementById(h); if (target) target.scrollIntoView({block: "start"});
  }
  window.addEventListener("hashchange", function(){ stopReading(); route(); });

  document.getElementById("reset").addEventListener("click", function(){
    if (this.dataset.sure !== "1"){ this.dataset.sure = "1"; this.textContent = "再按一次就清除全部"; return; }
    store = {done: {}}; save(); location.reload();
  });
  progress(); route();
})();
</script>

</body>
</html>
