<script>
(function(){
  var KEY = "minn-web-v1", store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) {}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
  store.done = store.done || {};
  var VOC = DATA.voc, main = document.getElementById("main"), tabsEl = document.getElementById("tabs");
  function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function norm(s){ return s.toLowerCase().replace(/[’]/g, "'").replace(/[“”]/g, '"'); }
  function ranges(text, phrase){
    var out = [], t = norm(text), p = norm(phrase).trim(); if (!p) return out;
    var i = t.indexOf(p); while (i >= 0){ out.push([i, i + p.length]); i = t.indexOf(p, i + 1); }
    return out;
  }
  function clearMarks(){
    document.querySelectorAll(".w.found,.w.sel,.w.miss,.w.hov").forEach(function(x){ x.classList.remove("found", "sel", "miss", "hov"); });
  }
  var lastQ = null;
  document.addEventListener("click", function(e){
    var box = e.target.closest(".q");
    if (box && box !== lastQ){ clearMarks(); lastQ = box; }
  }, true);
  function sentences(text){
    var out = [], start = 0, re = /[.!?]["”’)]*(?=\s|$)|:(?=\s+[A-Z])|\n/g, m;
    while ((m = re.exec(text))){ var end = m.index + m[0].length; if (text.slice(start, end).trim()) out.push([start, end]); start = end; }
    if (text.slice(start).trim()) out.push([start, text.length]);
    return out;
  }
  var voice = null;
  function pickVoice(){
    try { var vs = speechSynthesis.getVoices();
      voice = vs.filter(function(v){ return /samantha/i.test(v.name); })[0] || vs.filter(function(v){ return /^en-US$/i.test(v.lang || ""); })[0] || vs.filter(function(v){ return (v.lang || "").indexOf("en") === 0; })[0] || null;
    } catch (e) {}
  }
  if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  var reading = null; // {btn, box}
  function stopReading(){
    try { speechSynthesis.cancel(); } catch (e) {}
    if (reading){ reading.btn.classList.remove("on"); reading.btn.textContent = "▶ 朗讀這段";
      reading.box.querySelectorAll(".w.reading").forEach(function(x){ x.classList.remove("reading"); }); reading = null; }
  }
  function utter(text, rate){
    var u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = rate; if (voice) u.voice = voice; return u;
  }
  function speak(word){
    stopReading();
    try { speechSynthesis.speak(utter(word, .85)); } catch (e) {}
  }
  function readAloud(text, box, btn){
    if (reading && reading.btn === btn){ stopReading(); return; }
    stopReading();
    if (!("speechSynthesis" in window)){ btn.textContent = "這台裝置不能朗讀"; return; }
    var u = utter(text, .9);
    reading = {btn: btn, box: box}; btn.classList.add("on"); btn.textContent = "■ 停止";
    var words = Array.prototype.slice.call(box.querySelectorAll(".w"));
    u.onboundary = function(e){
      if (!reading || reading.box !== box) return;
      var i = e.charIndex;
      words.forEach(function(w){ w.classList.toggle("reading", +w.dataset.a <= i && i < +w.dataset.b); });
    };
    u.onend = u.onerror = function(){ if (reading && reading.box === box) stopReading(); };
    speechSynthesis.speak(u);
  }

  // ---------- passage ----------
  function renderPassage(card){
    var box = el("div", "ptext"), text = card.text, re = /[A-Za-z0-9§][A-Za-z0-9'’\-]*/g, last = 0, m;
    function cls(a, b){
      var c = [];
      card.vocab.forEach(function(r){ if (a < r[1] && b > r[0]) c.push(VOC[r[2]].star ? "vs" : "vr"); });
      return c;
    }
    var conn = card.conn || [];
    var phrases = conn.map(function(r){ return [r[0], r[1], 1]; }).concat(card.vocab.filter(function(r){ return /\s/.test(text.slice(r[0], r[1])); }).map(function(r){ return [r[0], r[1], 0]; }));
    while ((m = re.exec(text))){
      if (m.index > last) box.appendChild(document.createTextNode(text.slice(last, m.index)));
      var a0 = m.index, b0 = m.index + m[0].length, ph = phrases.filter(function(r){ return r[0] === a0; })[0];
      if (ph){ b0 = ph[1]; re.lastIndex = b0; }
      var s = el("span", "w " + (ph && ph[2] ? "cn" : cls(a0, b0).join(" ")));
      s.textContent = text.slice(a0, b0); s.dataset.a = a0; s.dataset.b = b0; s.tabIndex = 0;
      box.appendChild(s); last = b0;
    }
    if (last < text.length) box.appendChild(document.createTextNode(text.slice(last)));
    return box;
  }

  function wordBox(box, key){
    var v = VOC[key];
    box.className = "wordbox";
    box.innerHTML = '<div class="wb-top"><span class="wb-w"></span><span class="wb-pos"></span><button type="button" class="say">▶ 聽</button></div>' +
      '<div class="wb-zh"></div>' + (v.en ? '<div class="wb-en"></div>' : "") + (v.grow ? '<div class="wb-grow"><span class="gl">讓字長大</span>' + v.grow + "</div>" : "");
    box.querySelector(".wb-w").textContent = v.w; box.querySelector(".wb-pos").textContent = v.pos;
    box.querySelector(".wb-zh").textContent = v.zh; if (v.en) box.querySelector(".wb-en").textContent = v.en;
    box.querySelector(".say").onclick = function(){ speak(v.w.replace("…", "")); };
  }

  // ---------- one paragraph desk ----------
  function renderCard(card, unit){
    if (card.kind === "brk") return el("div", "brk", card.text);
    if (card.kind === "article"){ var ar = el("div", "article"); ar.appendChild(el("span", null, "")).textContent = card.sub; ar.appendChild(document.createTextNode(card.text)); return ar; }
    if (card.kind === "head"){ var hd = el("div", "subhead"); hd.textContent = card.text; return hd; }
    var desk = el("div", "desk"), left = el("div", "leftcol"), panel = el("div", "panel");
    desk.id = "c-" + card.id;
    var lab = el("div", "plabel", "<span>" + card.label + "</span>");
    var rb = el("button", "readbtn", "▶ 朗讀這段"); rb.type = "button"; lab.appendChild(rb);
    left.appendChild(lab);
    var ptext = renderPassage(card); left.appendChild(ptext);
    rb.onclick = function(){ readAloud(card.text, ptext, rb); };
    var bar = el("div", "tapbar"); bar.hidden = true; left.appendChild(bar);
    var wb = el("div", "wordbox empty", "點文章裡畫底線或點線的字，這裡會出現它的意思和字族。");
    panel.appendChild(wb);
    var active = null;

    function setActive(q){
      if (active){ active.box.classList.remove("active"); }
      active = q;
      ptext.classList.toggle("tapping", !!q);
      ptext.classList.toggle("sentmode", !!(q && q.d.mode === "sentence"));
      ptext.querySelectorAll(".hov").forEach(function(x){ x.classList.remove("hov"); });
      if (q){
        q.box.classList.add("active"); bar.hidden = false;
        bar.innerHTML = "<span>第 " + q.num + " 題：" + (q.d.mode === "sentence" ? "點一下，選整句話" : "在文章裡點出答案") + "（點錯會變紅）</span>";
        var c = el("button", null, "先不要"); c.type = "button"; c.onclick = function(){ setActive(null); };
        bar.appendChild(c);
        if (window.matchMedia("(max-width:760px)").matches) ptext.scrollIntoView({block: "center", behavior: "smooth"});
      } else bar.hidden = true;
    }

    var SENTS = sentences(card.text);
    function sentOf(a){ return SENTS.filter(function(r){ return a >= r[0] && a < r[1]; })[0]; }
    function wordsIn(r){ return Array.prototype.filter.call(ptext.querySelectorAll(".w"), function(x){ return +x.dataset.a < r[1] && +x.dataset.b > r[0]; }); }
    ptext.addEventListener("mouseover", function(e){
      if (!active || active.d.mode !== "sentence") return;
      var w = e.target.closest(".w"); ptext.querySelectorAll(".hov").forEach(function(x){ x.classList.remove("hov"); });
      if (w){ var r = sentOf(+w.dataset.a); if (r) wordsIn(r).forEach(function(x){ x.classList.add("hov"); }); }
    });
    ptext.addEventListener("click", function(e){
      var w = e.target.closest(".w"); if (!w) return;
      var a = +w.dataset.a, b = +w.dataset.b;
      if (active && active.d.mode === "sentence"){
        var r = sentOf(a); if (!r) return;
        var ws = wordsIn(r), ok = tapAnswer(active, r[0], r[1], null, true);
        if (ok){ ws.forEach(function(x){ x.classList.add("found"); x.classList.remove("hov"); }); }
        else ws.forEach(function(x){ x.classList.remove("miss"); void x.offsetWidth; x.classList.add("miss"); });
        return;
      }
      if (active){ tapAnswer(active, a, b, w); return; }
      var hit = card.vocab.filter(function(r){ return a < r[1] && b > r[0]; })[0];
      clearMarks(); lastQ = null;
      if (hit){
        ptext.querySelectorAll(".w").forEach(function(x){ if (+x.dataset.a < hit[1] && +x.dataset.b > hit[0]) x.classList.add("sel"); });
        wordBox(wb, hit[2]);
      }
    });
    ptext.addEventListener("keydown", function(e){ if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("w")){ e.preventDefault(); e.target.click(); } });

    function markRange(r, cls){
      ptext.querySelectorAll(".w").forEach(function(x){ if (+x.dataset.a < r[1] && +x.dataset.b > r[0]) x.classList.add(cls); });
    }
    function tapAnswer(q, a, b, w, quiet){
      var hitT = -1;
      q.targets.forEach(function(t, ti){
        if (q.got[ti]) return;
        if (t.r.some(function(r){ return a < r[1] && b > r[0]; })) hitT = hitT < 0 ? ti : hitT;
      });
      if (hitT < 0){ if (w){ w.classList.remove("miss"); void w.offsetWidth; w.classList.add("miss"); } q.miss++; return false; }
      q.got[hitT] = 1;
      var r = q.targets[hitT].r.filter(function(r){ return a < r[1] && b > r[0]; })[0];
      markRange(r, "found");
      var slot = q.box.querySelector('.slot[data-s="' + hitT + '"]'); if (slot){ slot.textContent = q.targets[hitT].t; slot.classList.add("got"); }
      if (q.got.every(Boolean)){ setActive(null); q.part(); }
      return true;
    }

    // questions
    var qObjs = [];
    card.qs.forEach(function(qd, idx){
      var box = el("div", "q"), q = {d: qd, box: box, num: idx + 1, need: 0, have: 0, miss: 0};
      box.innerHTML = '<div class="qh"><span class="tag t-' + qd.tag + '">' + qd.label + '</span><span class="qn">' + (idx + 1) + '</span><span class="qstate"></span></div><div class="qp">' + qd.prompt + "</div>";
      var id = qd.id;
      function finish(){
        box.classList.add("done");
        box.querySelector(".qstate").textContent = q.miss ? "✓ 完成" : "✓ 一次就對";
        if (!box.querySelector(".ansline")) box.appendChild(el("div", "ansline", "<b>參考答案</b>" + qd.ans));
        if (!store.done[id]){ store.done[id] = q.miss ? 2 : 1; save(); }
        checkLabs(); progress();
      }
      q.part = function(){ q.have++; if (q.have >= q.need) finish(); };
      // inline option groups
      box.querySelectorAll(".og").forEach(function(g){
        q.need++;
        g.addEventListener("click", function(e){
          var b = e.target.closest(".opt"); if (!b || g.dataset.ok) return;
          if (b.dataset.ok === "1"){ b.classList.add("right"); g.dataset.ok = 1; g.querySelectorAll(".opt").forEach(function(x){ x.disabled = true; }); q.part(); }
          else { b.classList.add("wrong"); b.disabled = true; q.miss++; }
        });
      });
      // generated choice
      if (qd.choice){
        q.need++;
        var ch = el("div", "choice");
        qd.choice.opts.forEach(function(o, i){
          var b = el("button", "opt"); b.type = "button"; b.textContent = o;
          b.onclick = function(){
            if (ch.dataset.ok) return;
            if (i === qd.choice.ok){ b.classList.add("right"); ch.dataset.ok = 1; ch.querySelectorAll(".opt").forEach(function(x){ x.disabled = true; });
              var slots = box.querySelectorAll(".slot"), parts = o.split("；");
              slots.forEach(function(s, k){ s.textContent = parts[k] || ""; s.classList.add("got"); });
              q.part(); }
            else { b.classList.add("wrong"); b.disabled = true; q.miss++; }
          };
          ch.appendChild(b);
        });
        box.appendChild(ch);
      }
      // tap in passage
      if (qd.tap && qd.tap.length){
        q.need++;
        q.targets = qd.tap.map(function(t){ return {t: t, r: ranges(card.text, t)}; });
        q.got = q.targets.map(function(){ return 0; });
        var tb = el("button", "tapbtn", "到文章裡點答案（共 " + qd.tap.length + " 個）"); tb.type = "button";
        tb.onclick = function(){ if (!box.classList.contains("done")) setActive(q); };
        box.appendChild(tb);
        q.box.addEventListener("click", function(e){ if (e.target === tb) return; });
        var oldPart = q.part;
        q.part = function(){ tb.hidden = true; oldPart(); };
        // when the tap part is the last one, tapAnswer calls q.part through the tap path
      }
      if (qd.reveal){
        q.need++;
        var rb = el("button", "revealbtn", "想好了，看答案"); rb.type = "button";
        rb.onclick = function(){ rb.hidden = true; q.part(); };
        box.appendChild(rb);
      }
      if (q.need === 0) q.need = 1;
      // restore
      if (store.done[id]){
        q.miss = store.done[id] === 2 ? 1 : 0;
        box.querySelectorAll(".og").forEach(function(g){ g.dataset.ok = 1; g.querySelectorAll(".opt").forEach(function(x){ x.disabled = true; if (x.dataset.ok === "1") x.classList.add("right"); }); });
        var chd = box.querySelector(".choice");
        if (chd){ chd.dataset.ok = 1; chd.querySelectorAll(".opt").forEach(function(x, i){ x.disabled = true; if (i === qd.choice.ok) x.classList.add("right"); });
          var parts = qd.choice.opts[qd.choice.ok].split("；"); box.querySelectorAll(".slot").forEach(function(s, k){ s.textContent = parts[k] || ""; s.classList.add("got"); }); }
        if (q.targets){ q.targets.forEach(function(t, k){ q.got[k] = 1; var s = box.querySelector('.slot[data-s="' + k + '"]'); if (s){ s.textContent = t.t; s.classList.add("got"); } }); }
        box.querySelectorAll(".tapbtn,.revealbtn").forEach(function(x){ x.hidden = true; });
        q.have = q.need; box.classList.add("done");
        box.querySelector(".qstate").textContent = q.miss ? "✓ 完成" : "✓ 一次就對";
        box.appendChild(el("div", "ansline", "<b>參考答案</b>" + qd.ans));
      }
      qObjs.push(q); panel.appendChild(box);
    });

    // Lab (shown after the whole group is done)
    var labBox = null;
    function checkLabs(){
      if (!card.labs.length) return;
      var all = (card.group || [card.id]).every(function(cid){
        var c = unit.cards.filter(function(x){ return x.id === cid; })[0];
        return c.qs.every(function(qd){ return store.done[qd.id]; });
      });
      labBox.innerHTML = all ? "<p>為什麼？Lab 解說</p>" + card.labs.map(function(l){ return '<div class="lab ' + l[0] + '"><b>' + l[1] + "</b>" + l[2] + "</div>"; }).join("")
                             : "做完這一組的題目，這裡會出現 Lab 解說。";
      labBox.className = all ? "labs" : "locked";
    }
    if (card.labs.length){ labBox = el("div", "locked"); panel.appendChild(labBox); checkLabs(); document.addEventListener("am-progress", checkLabs); }
    desk.appendChild(left); desk.appendChild(panel);
    return desk;
  }


  // ---------- thinking tools / concept charts (tap a card, then a slot) ----------
  store.tb = store.tb || {};
  function toolsDone(n){
    var u = DATA.units.filter(function(x){ return String(x.n) === String(n); })[0];
    return !!(u && u.tools && u.tools.length && u.tools.every(function(b){ return store.done["t" + b.id]; }));
  }
  function renderBoard(b){
    var box = el("div", "board"); box.appendChild(el("h4")); box.firstChild.textContent = b.title;
    if (b.how){ var hw = el("p", "bhow"); hw.textContent = b.how; box.appendChild(hw); }
    var slots = {}, autos = [], picked = null, miss = false;
    function dropBtn(id){ var d = el("button", "drop", "？　點這裡放"); d.type = "button"; d.dataset.s = id; slots[id] = d; return d; }
    if (b.layout === "bins"){
      var bins = el("div", "bins");
      b.head.forEach(function(h, i){ var bn = el("div", "bin"); bn.appendChild(el("h5")); bn.firstChild.textContent = h; bn.appendChild(dropBtn("b" + i)); bins.appendChild(bn); });
      box.appendChild(bins);
    } else if (b.layout === "line"){
      b.rows.forEach(function(row){
        var p = el("p", "tline");
        row.forEach(function(c){ if (typeof c === "string") p.appendChild(document.createTextNode(" " + c + " ")); else p.appendChild(dropBtn(c.s)); });
        box.appendChild(p);
      });
    } else {
      var tw = el("div", "tbwrap"), tb = el("table", "tb"), tr = el("tr");
      b.head.forEach(function(h){ var th = el("th"); th.textContent = h; tr.appendChild(th); });
      tb.appendChild(tr);
      b.rows.forEach(function(row){
        var r = el("tr");
        row.forEach(function(c, ci){
          var td = el("td"); td.dataset.h = b.head[ci] || "";
          if (typeof c === "string") td.textContent = c;
          else if (c.s) td.appendChild(dropBtn(c.s));
          else { td.className = "auto"; td.dataset.n = c.auto; td.dataset.t = c.t; autos.push(td); }
          r.appendChild(td);
        });
        tb.appendChild(r);
      });
      tw.appendChild(tb); box.appendChild(tw);
    }
    function paintAutos(){ autos.forEach(function(td){ var on = toolsDone(td.dataset.n); td.classList.toggle("lock", !on); var uu = DATA.units.filter(function(x){ return String(x.n) === String(td.dataset.n); })[0]; td.textContent = on ? td.dataset.t : "完成 Unit " + (uu ? uu.disp : td.dataset.n) + " 的理解工具後出現"; }); }
    if (autos.length){ paintAutos(); document.addEventListener("am-progress", paintAutos); }
    var bank = el("div", "bank"), cards = [];
    b.cards.forEach(function(c, i){
      var k = el("button", "card"); k.type = "button"; k.textContent = c.t;
      k.onclick = function(){
        if (k.disabled || box.classList.contains("done")) return;
        cards.forEach(function(x){ x.classList.remove("picked", "wrong"); });
        if (picked === i){ picked = null; box.classList.remove("picking"); return; }
        picked = i; k.classList.add("picked"); box.classList.add("picking");
      };
      cards.push(k); bank.appendChild(k);
    });
    box.appendChild(bank);
    var fin = el("p", "bdone", "✓ 完成！"); box.appendChild(fin);
    if (b.game){
      box.classList.add("game");
      var gres = el("div", "gres"); box.appendChild(gres);
      var paintGame = function(){
        var ms = (store.miss && store.miss[b.id]) || [], st = ms.length === 0 ? 3 : ms.length <= 2 ? 2 : 1;
        var weak = ms.filter(function(w, i){ return ms.indexOf(w) === i; });
        gres.innerHTML = '<span class="stars">' + "★★★".slice(0, st) + '<span class="off">' + "★★★".slice(st) + "</span></span> " +
          (ms.length ? "放錯 " + ms.length + " 次。還不熟的字：<span class=\"weak\"></span>" : "第一次就全部放對！");
        if (ms.length) gres.querySelector(".weak").textContent = weak.join("、");
        var ag = el("button", "again", "再玩一次"); ag.type = "button";
        ag.onclick = function(){ delete store.tb[b.id]; delete store.done["t" + b.id]; if (store.miss) delete store.miss[b.id]; save(); location.reload(); };
        gres.appendChild(ag);
      };
      document.addEventListener("am-progress", paintGame);
    }
    var placed = (store.tb[b.id] || []).slice();
    function base(id){ return id && id.indexOf(".") > 0 ? id.split(".")[0] : id; }
    var used = {};
    function fits(i, id){
      var c = b.cards[i];
      if (!c.s || used[id]) return false;
      if (c.s === id || (base(c.s) === base(id) && base(id) !== id)) return true;
      return b.cards.some(function(o){ return o.s === id && o.t === c.t; });
    }
    function place(i, id){
      var c = b.cards[i]; id = id || c.s; var d = slots[id];
      if (!(id.charAt(0) === "b" && d.parentNode.classList.contains("bin"))) used[id] = 1;
      if (c.s.charAt(0) === "b" && d.parentNode.classList.contains("bin")){
        var chip = el("div", "chip"); chip.textContent = c.t; d.parentNode.insertBefore(chip, d);
      } else { d.textContent = c.t; d.classList.add("filled"); d.disabled = true; }
      cards[i].hidden = true;
    }
    function checkDone(){
      var need = b.cards.filter(function(c){ return c.s; }).length;
      if (placed.length < need) return;
      box.classList.add("done"); box.classList.remove("picking");
      b.cards.forEach(function(c, i){ if (!c.s){ cards[i].classList.add("extra"); cards[i].disabled = true; } });
      if (!b.cards.some(function(c){ return !c.s; })) bank.hidden = true;
      Object.keys(slots).forEach(function(id){ if (id.charAt(0) === "b") slots[id].hidden = true; });
      if (!store.done["t" + b.id]){ store.done["t" + b.id] = miss ? 2 : 1; save(); progress(); }
    }
    Object.keys(slots).forEach(function(id){
      slots[id].onclick = function(){
        var d = slots[id];
        if (d.classList.contains("filled")) return;
        if (picked === null){ d.classList.add("no"); setTimeout(function(){ d.classList.remove("no"); }, 400); return; }
        if (fits(picked, id)){
          place(picked, id); placed.push([picked, id]); store.tb[b.id] = placed; save();
          picked = null; box.classList.remove("picking"); checkDone();
        } else {
          miss = true; var k = cards[picked]; k.classList.remove("wrong"); void k.offsetWidth; k.classList.add("wrong");
          if (b.game){ store.miss = store.miss || {}; var ms = store.miss[b.id] = store.miss[b.id] || []; ms.push(b.cards[picked].w || b.cards[picked].t); save(); }
          d.classList.add("no"); setTimeout(function(){ d.classList.remove("no"); }, 400);
        }
      };
    });
    placed = placed.map(function(x){ return Array.isArray(x) ? x : [x, b.cards[x].s]; });
    placed.forEach(function(x){ place(x[0], x[1]); }); checkDone();
    return box;
  }

  // ---------- simple MCQ (main idea, quiz) ----------
  function mcq(opts, ok, onDone, id){
    var box = el("div", "mc");
    opts.forEach(function(o, i){
      var b = el("button", "opt", '<span class="wl">' + "abc"[i] + "</span><span></span>"); b.type = "button";
      b.lastChild.textContent = o;
      b.onclick = function(){
        if (box.dataset.ok) return;
        if (i === ok){ b.classList.add("right"); box.dataset.ok = 1; box.querySelectorAll(".opt").forEach(function(x){ x.disabled = true; });
          if (!store.done[id]){ store.done[id] = box.dataset.miss ? 2 : 1; save(); } onDone && onDone(); progress(); }
        else { b.classList.add("wrong"); b.disabled = true; box.dataset.miss = 1; }
      };
      if (store.done[id]){ b.disabled = true; if (i === ok) b.classList.add("right"); }
      box.appendChild(b);
    });
    if (store.done[id]) box.dataset.ok = 1;
    return box;
  }

  var STEPS = [["1", "精讀", "Close Read"], ["2", "大意", "Main Idea"], ["3", "單字小考", "Word Check"], ["4", "說出來", "Say It"]];
  function renderUnit(u){

    qz.appendChild(grid); qz.appendChild(sc); score();

    var talk = el("div");
    talk.innerHTML = '<ul class="talk"><li><label><input type="checkbox"> 這一節主要解釋什麼？</label></li><li><label><input type="checkbox"> 作者用了哪些細節或例子？</label></li><li><label><input type="checkbox"> 用 because / so 說一個因果</label></li></ul>' +
      '<details class="ex"><summary>說完了，看範例</summary><p><b>主要解釋</b>　' + u.pause[0] + "</p><p><b>動物例子</b>　" + u.pause[1] + "</p><p><b>because / so</b>　</p></details>";
    talk.querySelector(".ex p:last-child").appendChild(document.createTextNode(u.say));
    if (hasT){
      var tl = el("div"); u.tools.forEach(function(b){ tl.appendChild(renderBoard(b)); });
      step(4, tl, "把讀到的東西整理成表。先點下面的一張卡，再點它該放的格子。放錯會抖一下，再試一次就好。");
    }
    step(hasT ? 5 : 4, talk, "說給爸爸或媽媽聽。");
    var nx = el("div", "unext");
    var nextU = DATA.units[DATA.units.indexOf(u) + 1];
    nx.innerHTML = nextU ? '<a class="btn" href="#unit-' + nextU.n + '">下一個 Unit →</a>'
                 : (DATA.summary && DATA.summary.length ? '<a class="btn" href="#unit-summary">去總整理 →</a>' : DATA.review && DATA.review.length ? '<a class="btn" href="#unit-review">去總複習 →</a>' : '<p class="btn" style="display:inline-block">全部 Unit 都完成了！</p>');
    wrap.appendChild(nx);
    return wrap;
  }

  });
  function extraTab(key, cls, label, sub, badge, h2, intro, boards){
    var t = el("a", "utab " + cls, "<b>" + label + "</b><span>" + sub + "</span><i></i>"); t.href = "#unit-" + key; t.dataset.u = key; tabsEl.appendChild(t);
    var w = el("div", "unit"); w.id = "unit-" + key; w.dataset.unit = key; w.hidden = true;
    w.innerHTML = '<header class="uhead"><span class="badge">' + badge + "</span><h2>" + h2 + '</h2><p class="range">' + intro + "</p></header>";
    main.appendChild(w); return w;
  }
  if (DATA.summary && DATA.summary.length){
    var sw = extraTab("summary", "sum", "總整理", "Concept Charts", "總整理", "Concept Charts", "把各個 Unit 讀到的東西整理成表。灰色的格子會在你做完那個 Unit 的理解工具後長出內容。");
    DATA.summary.forEach(function(b){ sw.appendChild(renderBoard(b)); });
    if (DATA.review && DATA.review.length){ var sn = el("div", "unext", '<a class="btn" href="#unit-review">去總複習 →</a>'); sw.appendChild(sn); }
  }
  var scoreBox = null;
  if (DATA.review && DATA.review.length){
    var rw = extraTab("review", "rev", "總複習", "Word List 小遊戲", "總複習", "Word List 小遊戲", "學校 Word List 一定要會的字。一關一關玩，第一次就放對，星星最多。");
    scoreBox = el("div", "scoreboard"); rw.appendChild(scoreBox);
    DATA.review.forEach(function(b){ rw.appendChild(renderBoard(b)); });
  }
  function paintScore(){
    if (!scoreBox) return;
    var got = 0, done = 0, weak = [];
    DATA.review.forEach(function(b){
      if (!store.done["t" + b.id]) return;
      done++; var ms = (store.miss && store.miss[b.id]) || [];
      got += ms.length === 0 ? 3 : ms.length <= 2 ? 2 : 1;
      ms.forEach(function(w){ if (weak.indexOf(w) < 0) weak.push(w); });
    });
    scoreBox.innerHTML = '<b class="big">★ ' + got + " / " + DATA.review.length * 3 + "</b>　完成 " + done + " / " + DATA.review.length + " 關" +
      (weak.length ? '<p style="margin:6px 0 0">還不熟的字（多唸幾次、再玩一次）：<span class="weak"></span></p>' : (done === DATA.review.length ? '<p style="margin:6px 0 0">全部的字都一次就放對了！</p>' : ""));
    if (weak.length) scoreBox.querySelector(".weak").textContent = weak.join("、");
  }
  document.addEventListener("am-progress", paintScore);

  function progress(){
    DATA.units.forEach(function(u){
      var ids = [];
      u.cards.forEach(function(c){ (c.qs || []).forEach(function(q){ ids.push(q.id); }); });
      (u.tools || []).forEach(function(b){ ids.push("t" + b.id); });
      ids.push("g" + u.n); u.quiz.forEach(function(_, i){ ids.push("z" + u.n + "-" + i); });
      var done = ids.filter(function(i){ return store.done[i]; }).length;
      var bar = tabsEl.querySelector('[data-u="' + u.n + '"] i'); if (bar) bar.style.width = Math.round(done / ids.length * 100) + "%";
    });
    if (DATA.summary && DATA.summary.length){
      var sd = DATA.summary.filter(function(b){ return store.done["t" + b.id]; }).length;
      var sb = tabsEl.querySelector('[data-u="summary"] i'); if (sb) sb.style.width = Math.round(sd / DATA.summary.length * 100) + "%";
    }
    if (DATA.review && DATA.review.length){
      var rd = DATA.review.filter(function(b){ return store.done["t" + b.id]; }).length;
      var rb = tabsEl.querySelector('[data-u="review"] i'); if (rb) rb.style.width = Math.round(rd / DATA.review.length * 100) + "%";
    }
    document.dispatchEvent(new Event("am-progress"));
  }

  function route(){
    var h = location.hash.replace("#", ""), m = h.match(/^u(\d+)-s\d+$/) || h.match(/^unit-(\d+|summary|review)$/);
    var ok = function(x){ return ((x === "summary" || x === "review") && !!document.getElementById("unit-" + x)) || DATA.units.some(function(u){ return String(u.n) === String(x); }); };
    var n = m && ok(m[1]) ? m[1] : (ok(store.unit) ? store.unit : String(DATA.units[0].n));
    document.querySelectorAll(".unit").forEach(function(x){ x.hidden = x.dataset.unit !== String(n); });
    tabsEl.querySelectorAll(".utab").forEach(function(x){ x.classList.toggle("on", x.dataset.u === String(n)); });
    store.unit = String(n); save();
    var target = h && document.getElementById(h); if (target) target.scrollIntoView({block: "start"});
  }
  window.addEventListener("hashchange", function(){ stopReading(); route(); });

  document.getElementById("reset").addEventListener("click", function(){
    if (this.dataset.sure !== "1"){ this.dataset.sure = "1"; this.textContent = "再按一次就清除全部"; return; }
    store = {done: {}}; save(); location.reload();
  });
  progress(); route();
})();
</script>

</body>
</html>
