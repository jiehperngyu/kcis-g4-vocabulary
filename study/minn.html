<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minn of the Mississippi 互動自學</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: unit tabs on top; each paragraph is a two-column "reading desk": the passage (tappable words) on the left, a word panel + questions on the right. Stacks on phones. */
:root{
  --bg:#f4f7f3; --paper:#ffffff; --ink:#1d2a24; --muted:#5b6b64; --line:#d6e2da;
  --leaf:#2f6f4e; --leaf-tint:#e3efe7; --panel:#f0f4f1;
  --red:#c8452f; --yellow:#e8b730; --black:#1b1b1b; --hl:#fff1b8;
  --ok:#2c8650; --ok-bg:#d9f0e0; --no:#c0472f; --no-bg:#fbe1da;
  --t-L:#a96400; --t-W:#2f6f4e; --t-T:#3c5f9c; --t-R:#8a4fa3; --t-E:#c0472f;
  --display:"Baloo 2","Andika",ui-rounded,system-ui,sans-serif;
  --body:"Andika","PingFang TC","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131915; --paper:#1b231f; --ink:#e6eee8; --muted:#9cb0a5; --line:#33443b;
  --leaf:#7cc79a; --leaf-tint:#22362b; --panel:#1f2924; --hl:#4b4220;
  --ok:#7cd49a; --ok-bg:#1e3a29; --no:#f0907a; --no-bg:#3e2520;
  --t-L:#f0b45a; --t-W:#7cc79a; --t-T:#8fb1ee; --t-R:#cfa0e4; --t-E:#f0907a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131915; --paper:#1b231f; --ink:#e6eee8; --muted:#9cb0a5; --line:#33443b;
  --leaf:#7cc79a; --leaf-tint:#22362b; --panel:#1f2924; --hl:#4b4220;
  --ok:#7cd49a; --ok-bg:#1e3a29; --no:#f0907a; --no-bg:#3e2520;
  --t-L:#f0b45a; --t-W:#7cc79a; --t-T:#8fb1ee; --t-R:#cfa0e4; --t-E:#f0907a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 60px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto}
.band{height:8px;background:repeating-linear-gradient(90deg,var(--red) 0 34px,var(--yellow) 34px 44px,var(--black) 44px 70px,var(--yellow) 70px 80px);border-radius:4px}
.hero{padding-block:20px 4px}
.hero small{color:var(--muted);letter-spacing:.04em}
.hero h1{font-family:var(--display);font-weight:800;color:var(--leaf);font-size:clamp(30px,6vw,44px);line-height:1.05;margin:4px 0}
.hero p{margin:0;color:var(--muted);max-width:62ch}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:14px 0 8px;padding-bottom:4px;scrollbar-width:thin}
.utab{flex:1 0 150px;text-decoration:none;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;position:relative;overflow:hidden}
.utab b{font-family:var(--display);color:var(--leaf);display:block}
.utab span{font-size:13px;color:var(--muted);line-height:1.3;display:block}
.utab.on{border-color:var(--leaf);box-shadow:inset 0 0 0 1.5px var(--leaf)}
.utab i{position:absolute;left:0;bottom:0;height:4px;background:var(--leaf);width:0;transition:width .3s}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);margin:6px 0 14px}
.legend span b{font-weight:700}
.k-star{border-bottom:2.5px dotted var(--leaf);color:var(--ink)}
.k-rec{border-bottom:2px dotted var(--muted)}
.uhead h2{font-family:var(--display);font-size:clamp(24px,4.4vw,32px);margin:4px 0 0;line-height:1.15;text-wrap:balance}
.badge{display:inline-block;background:var(--leaf);color:var(--paper);font-family:var(--display);font-weight:800;border-radius:10px;padding:2px 12px}
.range{color:var(--muted);margin:2px 0 4px}
.steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;background:var(--bg);padding-block:8px;scrollbar-width:none}
.steps a{flex:0 0 auto;text-decoration:none;color:var(--ink);background:var(--leaf-tint);border-radius:999px;padding:4px 12px;font-size:14px}
.steps a b{font-family:var(--display);color:var(--leaf);margin-right:4px}
.step{margin:22px 0;scroll-margin-top:58px}
.step>h3{font-family:var(--display);font-size:24px;margin:0 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step>h3 em{font-style:normal;font-family:var(--body);font-size:15px;color:var(--muted);font-weight:400}
.sn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:16px}
.howto{font-size:15px;color:var(--muted);margin:0 0 10px;max-width:70ch}
/* reading desk */
.desk{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin:0 0 22px;align-items:start}
.leftcol{position:sticky;top:58px;min-width:0}
.ptext{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:12px 16px;font-size:18px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}
.ptext.tapping{border-color:var(--yellow);box-shadow:0 0 0 4px var(--hl)}
.plabel{font-family:var(--display);color:var(--leaf);font-weight:800;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
.plabel small{font-family:var(--body);font-weight:400;color:var(--muted)}
.w{cursor:pointer;border-radius:4px}
.w:hover{background:var(--hl)}
.u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;font-weight:700}
.vs{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;font-weight:700}
.vr{border-bottom:2px dotted var(--muted)}
.cn{border:2px solid var(--red);border-radius:5px;padding:0 3px}
.readbtn{font:inherit;font-size:13px;font-weight:700;color:var(--leaf);background:var(--leaf-tint);border:0;border-radius:999px;padding:2px 12px;cursor:pointer}
.readbtn.on{background:var(--leaf);color:var(--paper)}
.w.reading{background:var(--hl);box-shadow:0 2px 0 var(--yellow)}
.w.sel{background:var(--leaf-tint);color:var(--leaf)}
.w.found{background:var(--ok-bg);color:var(--ok)}
.ptext.sentmode .w{border-radius:0}.w.hov{background:var(--hl)}
.w.miss{background:var(--no-bg);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.tapbar{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 12px;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.tapbar button{font:inherit;font-size:14px;background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer}
.panel{min-width:0;display:grid;gap:10px}
.wordbox{background:var(--paper);border:1.5px solid var(--leaf);border-radius:14px;padding:10px 14px}
.wordbox.empty{border-style:dashed;color:var(--muted);font-size:15px}
.wb-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wb-w{font-family:var(--display);font-size:24px;color:var(--leaf);line-height:1.1}
.wb-pos{color:var(--muted);font-size:14px}
.say{margin-left:auto;font:inherit;font-size:13px;color:var(--leaf);background:var(--leaf-tint);border:0;border-radius:999px;padding:2px 10px;cursor:pointer}
.wb-zh{font-weight:700;margin-top:2px}
.wb-en{color:var(--muted);font-size:15px}
.wb-grow{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:15px}
.wb-grow b{color:var(--leaf)}
.wb-grow .gl{display:block;font-size:12px;letter-spacing:.06em;color:var(--leaf);font-weight:700}
.q{background:var(--panel);border-radius:12px;padding:10px 12px;border:1.5px solid transparent}
.q.active{border-color:var(--yellow)}
.q.done{border-color:var(--ok)}
.qh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.tag{font-size:12px;font-weight:700;letter-spacing:.05em;border-left:4px solid currentColor;padding:1px 8px;border-radius:0 6px 6px 0;background:var(--paper)}
.t-L{color:var(--t-L)}.t-W{color:var(--t-W)}.t-T{color:var(--t-T)}.t-R{color:var(--t-R)}.t-E{color:var(--t-E)}
.qn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:13px}
.qstate{margin-left:auto;font-size:13px;font-weight:700}
.q.done .qstate{color:var(--ok)}
.qp{font-size:16px}
.og{display:inline-flex;flex-wrap:wrap;gap:6px;vertical-align:middle;border:1.5px dashed var(--line);border-radius:14px;padding:4px 6px;margin:2px 0}
.og .opt{margin:0}
.og.vert{display:grid;gap:4px;margin-top:6px;width:100%}
.pair{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:6px 0}
.pair .pl{flex:1 1 200px;min-width:0}
.pair .og{flex:0 1 auto;max-width:100%}
.pair+.pair{border-top:1px dotted var(--line)}
.pl{font-weight:700}
.pl::after{content:"　→ 選一個";font-weight:400;font-size:13px;color:var(--muted)}
.ptail{margin-top:4px}
@media (max-width:560px){.pair .pl{flex-basis:100%}}
.opt{font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:3px 12px;margin:4px 6px 0 0;cursor:pointer;text-align:left;line-height:1.4}
.og.vert .opt,.choice .opt{border-radius:10px;margin:0;width:100%}
.opt:hover{border-color:var(--leaf)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--no);background:var(--no-bg);color:var(--no);text-decoration:line-through}
.opt[disabled]{cursor:default}
.choice{display:grid;gap:6px;margin-top:8px}
.slot{display:inline-block;min-width:2.4em;text-align:center;border-bottom:2px solid var(--ink);padding:0 4px;color:var(--muted)}
.slot.got{color:var(--ok);font-weight:700;border-color:var(--ok)}
.tapbtn,.revealbtn{font:inherit;font-size:14px;font-weight:700;color:var(--ink);background:var(--hl);border:1.5px solid var(--yellow);border-radius:999px;padding:3px 12px;margin-top:8px;cursor:pointer}
.ansline{margin-top:6px;font-size:14px;color:var(--ok)}
.ansline b{margin-right:6px}
.labs{background:var(--paper);border-radius:12px;padding:8px 12px;border:1.5px solid var(--line)}
.labs p{margin:0 0 4px;font-weight:700}
.lab{border-left:5px solid var(--line);border-radius:0 8px 8px 0;padding:4px 10px;margin:6px 0;font-size:15px}
.lab b{display:block;font-size:12px;letter-spacing:.05em}
.lab.green{border-color:var(--t-W)}.lab.green b{color:var(--t-W)}
.lab.orange{border-color:var(--t-L)}.lab.orange b{color:var(--t-L)}
.lab.purple{border-color:var(--t-T)}.lab.purple b{color:var(--t-T)}
.locked{font-size:14px;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px;padding:8px 12px}
.article{margin:0 0 16px;padding:10px 16px;border-radius:12px;background:var(--leaf);color:var(--paper);font-family:var(--display);font-size:22px;font-weight:800;line-height:1.2}
.article span{display:block;font-family:var(--body);font-size:13px;font-weight:400;opacity:.85}
.subhead{font-family:var(--display);font-size:20px;font-weight:800;color:var(--leaf);border-bottom:2px solid var(--leaf-tint);margin:0 0 12px}
.brk{border:2px dashed var(--leaf);color:var(--leaf);text-align:center;border-radius:10px;padding:8px;margin:0 0 22px;font-weight:700}
.mc{display:grid;gap:6px}
.mc .opt{border-radius:10px;margin:0;display:flex;gap:8px;width:100%}
.wl{display:inline-grid;place-items:center;flex:0 0 22px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--leaf);color:var(--leaf);font-size:13px;font-weight:700}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.qz>b{display:block;font-family:var(--display);font-size:20px;margin-bottom:4px}
.score{font-size:18px;margin-top:12px}.score b{color:var(--leaf);font-size:24px;font-family:var(--display)}
.talk{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.talk label{display:flex;gap:8px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.talk input{width:20px;height:20px;accent-color:var(--leaf);margin-top:3px}
details.ex{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;margin-top:10px}
details.ex summary{cursor:pointer;font-weight:700;color:var(--leaf)}
.unext{margin:26px 0 0;text-align:right}
.btn{font:inherit;font-weight:700;color:var(--paper);background:var(--leaf);border:0;border-radius:999px;padding:8px 18px;cursor:pointer;text-decoration:none;display:inline-block}
.foot{font-size:13px;color:var(--muted)}
.reset{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,.w:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
@media (max-width:760px){.desk{grid-template-columns:1fr}.leftcol{position:static}.ptext{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* thinking tools & concept charts: tap a card, then tap the slot it belongs in */
.board [hidden]{display:none!important}
.board{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
.board.done{border-color:var(--ok)}
.board h4{font-family:var(--display);color:var(--leaf);margin:0 0 2px;font-size:19px}
.board .bhow{font-size:15px;color:var(--muted);margin:0 0 8px}
.tbwrap{overflow-x:auto}
.tb{border-collapse:collapse;width:100%;font-size:15px}
.tb th{background:var(--leaf-tint);text-align:left;padding:6px 8px;border:1px solid var(--line);font-weight:700}
.tb td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.tb td.auto{color:var(--ink)}
.tb td.auto.lock{color:var(--muted);font-size:13px;font-style:italic}
.drop{display:block;width:100%;min-height:40px;border:2px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);
  font:inherit;font-size:14px;cursor:pointer;padding:6px 8px;text-align:left}
.drop:hover,.board.picking .drop:not(.filled){border-color:var(--leaf);color:var(--leaf)}
.drop.filled{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ink);cursor:default}
.drop.no{border-color:var(--no);background:var(--no-bg);animation:shake .3s}
.tline{line-height:2.4;margin:4px 0}
.tline .drop{display:inline-block;width:auto;min-width:96px;min-height:0;padding:2px 10px;vertical-align:middle;margin:0 4px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.bin{border:1.5px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.bin h5{margin:0;font-size:15px;color:var(--leaf)}
.bin .chip{background:var(--ok-bg);border:1.5px solid var(--ok);border-radius:10px;padding:4px 8px;font-size:14px}
.bin .drop{min-height:44px;text-align:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding:10px 0 6px;border-top:1px dotted var(--line);
  position:sticky;bottom:0;z-index:2;background:var(--paper);max-height:42vh;overflow-y:auto}
.board.done .bank{position:static}
.bank::before{content:"卡片：先點一張，再點要放的格子";flex-basis:100%;font-size:13px;color:var(--muted)}
.card{font:inherit;font-size:14px;text-align:left;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;
  padding:6px 10px;cursor:pointer;max-width:100%}
.card.picked{border-color:var(--leaf);background:var(--leaf-tint);box-shadow:0 0 0 2px var(--leaf)}
.card.wrong{animation:shake .3s;border-color:var(--no)}
.card.extra{opacity:.45;text-decoration:line-through;cursor:default}
.bdone{display:none;margin:8px 0 0;color:var(--ok);font-weight:700}
.board.done .bdone{display:block}
.board.done .bank::before{content:"劃掉的卡是用不到的"}
.utab.sum b{color:var(--t-T)}
.utab.rev b{color:var(--t-R)}
.stars{font-size:22px;letter-spacing:2px;color:var(--yellow)}
.stars .off{color:var(--line)}
.gres{display:none;margin:8px 0 0;padding:8px 10px;border-radius:10px;background:var(--leaf-tint)}
.board.done .gres{display:block}
.board.game.done .bdone{display:none}
.gres .weak,.scoreboard .weak{color:var(--no);font-weight:700}
.again{font:inherit;font-size:14px;margin-left:8px;border:1.5px solid var(--leaf);color:var(--leaf);background:var(--paper);border-radius:999px;padding:3px 12px;cursor:pointer}
.scoreboard{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
.scoreboard b.big{font-family:var(--display);font-size:22px;color:var(--leaf)}
.tline .num{color:var(--muted)}
@media (max-width:560px){
  .tb tr:first-child{display:none}
  .tb,.tb tbody,.tb tr,.tb td{display:block;width:100%}
  .tb tr{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:4px 2px}
  .tb td{border:0;padding:4px 6px}
  .tb td[data-h]:not([data-h=""])::before{content:attr(data-h);display:block;font-size:12px;color:var(--muted);font-weight:700}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <p style="margin:12px 0 8px"><a href="../" style="color:var(--leaf);font-weight:700;text-decoration:none">← 回到 KCIS G4 Vocabulary</a></p>
    <div class="band"></div>
    <small>myView Literacy · Grade 4 · Week 3 · from Minn of the Mississippi</small>
    <h1>Minn of the Mississippi</h1>
    <p>點文章裡的字，右邊會出現意思和字族。每一題都用點的，點完馬上知道對不對。</p>
    <nav class="tabs" id="tabs" aria-label="Units"></nav>
    <div class="legend"><span><b style="text-decoration:underline;text-underline-offset:3px">粗體底線</b>＝要會的字（點了有意思、字族、發音）</span><span><span class="cn">紅框</span>＝連接字</span><span><span class="k-rec">灰色點線</span>＝認得就好（點了有意思）</span></div>
  </header>
  <main id="main"></main>

<script>const DATA={"units": [{"n": 1, "title": "Small Turtle, Big River", "range": "原文 §1–4 ＋ 圖片標籤", "cards": [{"id": "p1", "kind": "para", "label": "Paragraph 1", "text": "Minn the turtle was rather small for this Mississippi! For miles she was a chip caught in rapids and falls. When her tiny rear leg tired, she would drift—until, WHACK! Then she would push away from the boulder, and paddle again. She fought to a shore, a brook, and a marsh. After a few weeks of life, Minn felt like a battered old turtle!", "u": [[90, 96], [148, 153], [202, 209], [215, 221], [254, 259], [267, 272], [318, 326]], "conn": [[274, 299]], "vocab": [[0, 4, "r1-0"], [42, 53, "r1-1"], [90, 96, "v1-0"], [101, 106, "r1-2"], [148, 153, "v1-1"], [202, 209, "v1-2"], [215, 221, "v1-3"], [245, 250, "r1-3"], [254, 259, "v1-4"], [267, 272, "v1-5"], [301, 305, "r1-0"], [318, 326, "v1-6"]], "qs": [{"id": "p1-1", "tag": "R", "label": "WRITER", "ans": "一片被急流推來推去的小碎片（比喻：Minn 太小，被水推著跑）", "tap": [], "choice": null, "groups": 1, "prompt": "For miles she was <b>a chip<\/b> caught in rapids and falls：作者把 Minn 比成什麼？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">一片被急流推來推去的小碎片<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">一塊很重的大石頭<\/button><\/span>"}, {"id": "p1-5", "tag": "W", "label": "WORD", "ans": "因為被急流打得傷痕累累，累得像老烏龜", "tap": [], "choice": null, "groups": 1, "prompt": "Minn felt like a <b>battered<\/b> old turtle：Minn 才出生幾個星期，為什麼覺得自己很「old」？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">因為被急流打得傷痕累累，累得像老烏龜<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">因為她真的活了很久<\/button><\/span>"}, {"id": "p1-6", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ rapids and falls；the boulder；a shore, a brook, and a marsh", "tap": ["rapids and falls", "the boulder", "a shore, a brook, and a marsh"], "choice": null, "groups": 0, "prompt": "在文章裡點出：告訴你「地點（setting）」的詞或片語。"}], "labs": [["green", "WORD LINKS", "rapids / boulder / marsh 都是水邊的地方；battered = 被打得傷痕累累"], ["purple", "THINKING LAB", "作者一開頭就交代 setting（急流）和問題（Minn 太小、被水推著跑）。"]], "group": ["p1"]}, {"id": "p2", "kind": "para", "label": "Paragraph 2", "text": "She came alive when a crawfish tweaked her side. Her angry, baby strike sent her enemy backward. Crows eyed its string of watery mud-clouds puffing along the brook. A raccoon family saw the mud-smoke, and came crawfish hunting. They sat in water, gazing at nothing, feeling under boulders. A sleek otter swirled by like a shadow.", "u": [[22, 30], [65, 71], [247, 253], [280, 288], [292, 297], [304, 311]], "conn": [], "vocab": [[22, 30, "v1-7"], [31, 38, "r1-10"], [65, 71, "v1-8"], [97, 102, "r1-4"], [158, 163, "v1-4"], [167, 174, "r1-5"], [210, 218, "v1-7"], [247, 253, "v1-9"], [280, 287, "v1-2"], [292, 297, "v1-10"], [298, 303, "r1-6"], [304, 311, "v1-11"]], "qs": [{"id": "p2-2", "tag": "W", "label": "WORD", "ans": "夾（捏）了她一下", "tap": [], "choice": null, "groups": 1, "prompt": "A crawfish <b>tweaked<\/b> her side：crawfish 對 Minn 做了什麼？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">夾（捏）了她一下<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">餵她吃東西<\/button><\/span>"}, {"id": "p2-3", "tag": "T", "label": "THINKING", "ans": "因為泥巴雲告訴牠們這裡有 crawfish 可以吃", "tap": [], "choice": null, "groups": 1, "prompt": "烏鴉和浣熊為什麼來到小溪邊？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">因為泥巴雲告訴牠們這裡有 crawfish 可以吃<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">因為牠們想找 Minn 玩<\/button><\/span>"}, {"id": "p2-4", "tag": "R", "label": "WRITER", "ans": "又快又安靜，一下就不見", "tap": [], "choice": null, "groups": 1, "prompt": "A sleek otter <b>swirled by like a shadow<\/b>：這是用 like 的比喻。水獺游過去的樣子：<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">又快又安靜，一下就不見<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">又慢又吵<\/button><\/span>"}, {"id": "p2-5", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ [crawfish]　[crows]　[raccoon]　[otter]", "tap": ["crawfish", "crows", "raccoon", "otter"], "choice": null, "groups": 0, "prompt": "在文章裡點出這一段出現的動物：[ ]（共 4 種）"}], "labs": []}, {"id": "lab1", "kind": "cap", "label": "圖說 Caption", "text": "MINK　·　OTTER　·　RACCOONS HUNTING FOR CRAWFISH", "u": [], "conn": [], "vocab": [[0, 4, "r1-7"], [7, 12, "r1-6"], [15, 22, "r1-5"], [36, 44, "v1-7"]], "qs": [{"id": "lab1-1", "tag": "R", "label": "WRITER", "ans": "第 2 段（A raccoon family … came crawfish hunting）", "tap": [], "choice": {"opts": ["1", "2", "4"], "ok": 1}, "groups": 0, "prompt": "圖上的 <b>RACCOONS HUNTING FOR CRAWFISH<\/b> 畫的是第 <span class=\"slot\">？<\/span> 段的事。"}, {"id": "lab1-2", "tag": "W", "label": "WORD", "ans": "otter（A sleek otter swirled by like a shadow）", "tap": [], "choice": null, "groups": 1, "prompt": "圖上有 <b>MINK<\/b> 和 <b>OTTER<\/b>。§2 裡出現的是哪一個？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"0\">mink<\/button><button type=\"button\" class=\"opt\" data-ok=\"1\">otter<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "crawfish / tweaked / swirled"], ["purple", "THINKING LAB", "setting 也是一條食物鏈：泥巴雲 → 引來烏鴉、浣熊、水獺。"]], "group": ["p2", "lab1"]}, {"id": "p3", "kind": "para", "label": "Paragraph 3", "text": "Ducks hurtled out of the sky—ripping the surface with spread feet skidding. To Minn they were monsters, hinged at the surface, plunging their heads straight down. They ate bugs and beetles, at times nibbling Minn's rubbery toes with iron-hard beaks. As the air of the wild-rice swamp grew cooler, the sky was fairly a-rustle with leaves and more flying birds. Now spearheads of ducks and long-necked geese flashed by; and a mile up in the clear blue, a ghostly, shimmering ribbon of wild white swans.", "u": [[6, 13], [127, 135], [199, 207], [215, 222], [453, 460], [462, 472]], "conn": [[360, 363]], "vocab": [[0, 5, "r1-8"], [6, 13, "v1-12"], [66, 74, "r1-11"], [79, 83, "r1-0"], [104, 110, "r1-12"], [127, 135, "v1-13"], [181, 188, "r1-9"], [199, 207, "v1-14"], [208, 212, "r1-0"], [215, 222, "v1-15"], [316, 324, "r1-13"], [364, 374, "r1-14"], [378, 383, "r1-8"], [400, 405, "r1-8"], [453, 460, "v1-16"], [462, 472, "v1-17"], [494, 499, "r1-8"]], "qs": [{"id": "p3-2", "tag": "R", "label": "WRITER", "ans": "Minn 的看法；掠食者", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\"><b>To Minn<\/b> they were monsters：這是<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">Minn 的看法<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">作者的看法<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">對小烏龜來說，鴨子是危險的<\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">掠食者<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">朋友<\/button><\/span><\/div>"}, {"id": "p3-3", "tag": "W", "label": "WORD", "ans": "一小口一小口地咬", "tap": [], "choice": null, "groups": 1, "prompt": "<b>nibbling<\/b> Minn's rubbery toes with iron-hard beaks：鴨子對 Minn 做什麼？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">一小口一小口地咬<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">用力吞下去<\/button><\/span>"}, {"id": "p3-4", "tag": "T", "label": "THINKING", "ans": "fall / autumn（秋天）", "tap": [], "choice": {"opts": ["summer（夏天）", "spring（春天）", "fall（秋天）"], "ok": 2}, "groups": 0, "prompt": "As the air of the wild-rice swamp grew <b>cooler<\/b>：空氣變涼，鳥一群群往南飛。這說明季節快要變成 <span class=\"slot\">？<\/span> 了。"}, {"id": "p3-5", "tag": "R", "label": "WRITER", "ans": "a ribbon（一條緞帶）", "tap": [], "choice": {"opts": ["a ribbon（一條緞帶）", "a monster（怪獸）", "a cloud（一朵雲）"], "ok": 0}, "groups": 0, "prompt": "a ghostly, shimmering <b>ribbon<\/b> of wild white swans：作者把一長排飛過去的天鵝比成 <span class=\"slot\">？<\/span>"}], "labs": [["green", "WORD LINKS", "hurtled / nibbling / shimmering（都是「怎麼動」的描寫字）"], ["purple", "THINKING LAB", "作者用鳥的動向告訴你 setting 在變：空氣變涼 → 秋天要來了。"]], "group": ["p3"]}, {"id": "p4", "kind": "para", "label": "Paragraph 4", "text": "Flocking crows dotted the trees, cawing, shouting, shrieking, shattering the silence. Some decided to stay on into winter, but not the old crow, whose air-trail southward lay above this marsh. He hated cold! With old cronies he flapped away.", "u": [[0, 8], [15, 21], [33, 39], [51, 60], [62, 72], [228, 235]], "conn": [[123, 126]], "vocab": [[0, 8, "v1-18"], [9, 14, "r1-4"], [15, 21, "v1-20"], [33, 39, "v1-19"], [51, 60, "v1-21"], [62, 72, "v1-22"], [186, 191, "v1-5"], [217, 224, "r1-15"], [228, 235, "v1-23"]], "qs": [{"id": "p4-1", "tag": "W", "label": "WORD", "ans": "shouting；shrieking；烏鴉大聲叫", "tap": ["shouting", "shrieking"], "choice": null, "groups": 1, "prompt": "<b>cawing<\/b>, shouting, shrieking：幫你猜 cawing 的線索是 <span class=\"slot\" data-s=\"0\">？<\/span> 和 <span class=\"slot\" data-s=\"1\">？<\/span>，所以 cawing 是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">烏鴉大聲叫<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">烏鴉睡覺<\/button><\/span>"}, {"id": "p4-4", "tag": "T", "label": "THINKING", "ans": "因為牠討厭冷，要往南飛", "tap": [], "choice": null, "groups": 1, "prompt": "He hated cold! 老烏鴉為什麼飛走？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">因為牠討厭冷，要往南飛<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">因為牠怕 Minn<\/button><\/span>"}, {"id": "p4-5", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ After a few weeks of life；the air … grew cooler；Some decided to stay on into winter", "tap": ["Some decided to stay on into winter"], "choice": null, "groups": 0, "mode": "sentence", "prompt": "在 §4 點出：告訴你「季節在改變」的句子（§1、§3 也有線索，回去找找看）。"}], "labs": [["green", "WORD LINKS", "flocking / cawing：用前後的 shouting, shrieking 猜字義"], ["purple", "THINKING LAB", "老烏鴉怕冷往南飛，是在為下一個 Unit 的冬天鋪路。"]], "group": ["p4"]}], "gist": {"opts": ["Minn makes friends with the raccoons and the ducks.", "Tiny Minn fights the fast river, and as fall begins, the birds fly south.", "Minn wins a race against the otter."], "ok": 1}, "quiz": [{"w": "rapids", "opts": ["making the loud, harsh sound that a crow makes", "very fast-moving parts of a river", "a very large rock"], "ok": 1}, {"w": "drift", "opts": ["to be carried slowly along by water or air", "very fast-moving parts of a river", "making the loud, harsh sound that a crow makes"], "ok": 0}, {"w": "boulder", "opts": ["looking at something for a long time", "pale and hard to see clearly, like a ghost", "a very large rock"], "ok": 2}, {"w": "paddle", "opts": ["to be carried slowly along by water or air", "to move through water by pushing with your arms, legs, or an oar", "shining with a soft, flickering light"], "ok": 1}, {"w": "brook", "opts": ["a very large rock", "a sudden, hard hit or attack", "a small stream"], "ok": 2}, {"w": "marsh", "opts": ["wet, soft land with grass and water", "taking small bites", "to be carried slowly along by water or air"], "ok": 0}, {"w": "battered", "opts": ["diving or dropping down very quickly", "hurt or damaged by being hit again and again", "taking small bites"], "ok": 1}, {"w": "crawfish", "opts": ["soft and stretchy like rubber", "wet, soft land with grass and water", "a small animal like a tiny lobster that lives in streams"], "ok": 2}, {"w": "strike", "opts": ["a sudden, hard hit or attack", "moved very fast and with a lot of force", "breaking suddenly into many small pieces"], "ok": 0}, {"w": "gazing", "opts": ["a small animal like a tiny lobster that lives in streams", "soft and stretchy like rubber", "looking at something for a long time"], "ok": 2}, {"w": "sleek", "opts": ["making the loud, harsh sound that a crow makes", "smooth, shiny, and slim", "to be carried slowly along by water or air"], "ok": 1}, {"w": "swirled", "opts": ["a small stream", "moved around and around in a circle", "hurt or damaged by being hit again and again"], "ok": 1}, {"w": "hurtled", "opts": ["a small animal like a tiny lobster that lives in streams", "smooth, shiny, and slim", "moved very fast and with a lot of force"], "ok": 2}, {"w": "plunging", "opts": ["diving or dropping down very quickly", "pale and hard to see clearly, like a ghost", "taking small bites"], "ok": 0}, {"w": "nibbling", "opts": ["taking small bites", "wet, soft land with grass and water", "shining with a soft, flickering light"], "ok": 0}, {"w": "rubbery", "opts": ["soft and stretchy like rubber", "to be carried slowly along by water or air", "a small animal like a tiny lobster that lives in streams"], "ok": 0}, {"w": "ghostly", "opts": ["were spread here and there over a place", "looking at something for a long time", "pale and hard to see clearly, like a ghost"], "ok": 2}, {"w": "shimmering", "opts": ["shining with a soft, flickering light", "a very large rock", "gathering together in a large group"], "ok": 0}, {"w": "flocking", "opts": ["moved around and around in a circle", "making the loud, harsh sound that a crow makes", "gathering together in a large group"], "ok": 2}, {"w": "cawing", "opts": ["taking small bites", "making the loud, harsh sound that a crow makes", "to move through water by pushing with your arms, legs, or an oar"], "ok": 1}, {"w": "dotted", "opts": ["moved around and around in a circle", "were spread here and there over a place", "diving or dropping down very quickly"], "ok": 1}, {"w": "shrieking", "opts": ["screaming in a high, loud voice", "a small animal like a tiny lobster that lives in streams", "breaking suddenly into many small pieces"], "ok": 0}, {"w": "shattering", "opts": ["pale and hard to see clearly, like a ghost", "breaking suddenly into many small pieces", "making the loud, harsh sound that a crow makes"], "ok": 1}, {"w": "flapped", "opts": ["moved wings quickly up and down", "a sudden, hard hit or attack", "taking small bites"], "ok": 0}], "say": "The river is fast and Minn is small, so the water pushes her around.", "pause": ["Minn 一開始的 setting 和問題：急流把小小的 Minn 推來推去；季節正要變成秋天，鳥都往南飛。", "crawfish、raccoon family、otter、ducks、crows、swans。"], "tools": [{"id": "t1a", "title": "Setting 偵探卡", "how": "故事在哪裡開始？季節正要變成什麼？把答案和證據段號放進格子。", "layout": "table", "head": ["Setting 問題", "答案", "證據 §"], "rows": [["Where does the story begin?", {"s": "a1"}, {"s": "p1"}], ["What time of year is coming?", {"s": "a2"}, {"s": "p2"}]], "cards": [{"t": "§1", "s": "p1", "w": null}, {"t": "§8", "s": null, "w": null}, {"t": "fall: the air gets cooler and birds fly south", "s": "a2", "w": null}, {"t": "§3–4", "s": "p2", "w": null}, {"t": "the Mississippi River (rapids and falls)", "s": "a1", "w": null}, {"t": "winter: snow covers the earth", "s": null, "w": null}]}, {"id": "t1b", "title": "環境 → 問題 → 行動", "how": "小說裡，環境一變，Minn 就要做出新的行動。", "layout": "table", "head": ["環境 Setting", "問題 Challenge", "Minn 的行動 Action"], "rows": [["rapids and falls（§1）", {"s": "c1"}, {"s": "d1"}], ["a crawfish in the brook（§2）", {"s": "c2"}, {"s": "d2"}]], "cards": [{"t": "a crawfish pinches her side", "s": "c2", "w": null}, {"t": "the fast water pushes tiny Minn around", "s": "c1", "w": null}, {"t": "she pushes away from the boulder and paddles to a shore", "s": "d1", "w": null}, {"t": "she makes friends with the otter", "s": null, "w": null}, {"t": "she strikes back and sends the crawfish backward", "s": "d2", "w": null}]}], "disp": 1}, {"n": 2, "title": "Winter Comes", "range": "原文 §5–8 ＋ 圖片標籤", "cards": [{"id": "p5", "kind": "para", "label": "Paragraph 5", "text": "Little Minn felt numb. A cold-blooded reptile, she depended on warmth of air or water to keep her active. Searching in a slow, dull way for something, she spent long moments staring at muddy bottom. She had a desire to dig in it. . . . Deeply. . . .", "u": [[17, 21], [25, 37], [38, 45], [51, 62], [209, 215]], "conn": [], "vocab": [[17, 21, "v2-0"], [25, 37, "v2-1"], [38, 45, "v2-2"], [51, 62, "v2-3"], [209, 215, "v2-4"]], "qs": [{"id": "p5-1", "tag": "W", "label": "WORD", "ans": "什麼都感覺不到（麻麻的）", "tap": [], "choice": null, "groups": 1, "prompt": "Little Minn felt <b>numb<\/b>：numb 是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">什麼都感覺不到（麻麻的）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很痛<\/button><\/span>"}, {"id": "p5-2", "tag": "T", "label": "THINKING", "ans": "warmth of air or water（空氣或水的溫暖）", "tap": ["warmth of air or water"], "choice": null, "groups": 0, "prompt": "Minn 是 cold-blooded reptile。天氣變冷，她的身體會麻木，因為她要靠 <span class=\"slot\" data-s=\"0\">？<\/span> 保持活動。"}, {"id": "p5-4", "tag": "W", "label": "WORD", "ans": "很想要（強烈的願望）；the muddy bottom（泥巴底部）", "tap": [], "choice": {"opts": ["the muddy bottom", "the big boulder", "the clear blue sky"], "ok": 0}, "groups": 1, "prompt": "She had a <b>desire<\/b> to dig in it：desire 是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">很想要（強烈的願望）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很害怕<\/button><\/span>；她想挖進去的是 <span class=\"slot\">？<\/span>"}, {"id": "p5-5", "tag": "T", "label": "THINKING", "ans": "因為泥巴底下比較不冷，才保得住命", "tap": [], "choice": null, "groups": 1, "prompt": "為什麼 Minn 想要「Deeply. . . .」挖得很深？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">因為泥巴底下比較不冷，才保得住命<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">因為她想找朋友<\/button><\/span>"}, {"id": "p5-6", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ Little Minn felt numb. / A cold-blooded reptile, she depended on warmth of air or water to keep her active.", "tap": ["Little Minn felt numb", "A cold-blooded reptile, she depended on warmth of air or water to keep her active"], "choice": null, "groups": 0, "mode": "sentence", "prompt": "在文章裡點出：說明「冷」讓 Minn 出現問題的句子。"}], "labs": [["green", "WORD LINKS", "numb（b 不發音）/ cold-blooded / reptile；desire = 強烈的願望"], ["purple", "THINKING LAB", "冷（setting）→ 身體麻木（問題）→ 想挖進泥巴（行動）：這是 plot 的因果。"]], "group": ["p5"]}, {"id": "p6", "kind": "para", "label": "Paragraph 6", "text": "Muskrats towed marsh-roots to their rounded houses. Beavers stored poplar poles for the tasty bark. Otter and mink fished in ice-fringed streams. Big-footed snowshoe rabbits changed their brown coats to white. Pine squirrels flickered like running flames in the trees.", "u": [[9, 14], [94, 98]], "conn": [], "vocab": [[0, 8, "r2-1"], [9, 14, "v2-5"], [15, 26, "r2-8"], [52, 59, "r2-2"], [67, 73, "r2-10"], [94, 98, "v2-6"], [125, 136, "r2-11"], [157, 173, "r2-3"], [210, 224, "r2-4"], [225, 234, "r2-12"]], "qs": [{"id": "p6-2", "tag": "W", "label": "WORD", "ans": "邊邊有冰的；冬天快到了", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\"><b>ice-fringed<\/b> streams：ice-fringed 是<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">邊邊有冰的<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很熱的<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">這告訴我們<\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">冬天快到了<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">夏天快到了<\/button><\/span><\/div>"}, {"id": "p6-3", "tag": "R", "label": "WRITER", "ans": "running flames（跑動的火焰）；顏色紅紅的、動得很快", "tap": ["running flames"], "choice": null, "groups": 1, "prompt": "Pine squirrels <b>flickered like running flames<\/b>：松鼠被比成 <span class=\"slot\" data-s=\"0\">？<\/span>。像的原因：<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">顏色紅紅的、動得很快<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很大很重<\/button><\/span>"}, {"id": "p6-4", "tag": "T", "label": "THINKING", "ans": "告訴讀者：冬天來了，每種動物都在適應", "tap": [], "choice": null, "groups": 1, "prompt": "作者為什麼一口氣列出這麼多動物在準備？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">告訴讀者：冬天來了，每種動物都在適應<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">說明這些動物是 Minn 的家人<\/button><\/span>"}, {"id": "p6-5", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ Big-footed snowshoe rabbits changed their brown coats to white.", "tap": ["Big-footed snowshoe rabbits changed their brown coats to white"], "choice": null, "groups": 0, "mode": "sentence", "prompt": "在文章裡點出：哪一句顯示動物的「身體」為冬天改變了？"}], "labs": []}, {"id": "lab2", "kind": "cap", "label": "圖說 Caption", "text": "MUSKRAT　·　BEAVER", "u": [], "conn": [], "vocab": [], "qs": [{"id": "lab2-1", "tag": "R", "label": "WRITER", "ans": "towed marsh-roots to their rounded houses；stored poplar poles for the tasty bark", "tap": [], "choice": {"opts": ["stored poplar poles for the tasty bark；towed marsh-roots to their rounded houses", "towed marsh-roots to their rounded houses；stored poplar poles for the tasty bark", "changed their coats to white；fished in ice-fringed streams"], "ok": 1}, "groups": 0, "prompt": "圖上的 <b>MUSKRAT<\/b> 和 <b>BEAVER<\/b> 都出現在 §6。牠們在冬天前做什麼？Muskrats <span class=\"slot\">？<\/span>；Beavers <span class=\"slot\">？<\/span>"}], "labs": [["green", "WORD LINKS", "ice-fringed = 邊邊有冰的；stored / changed 都是過去式"], ["purple", "THINKING LAB", "這一段沒有 Minn，卻是在寫 setting：冬天來了，所有動物都在適應。"]], "group": ["p6", "lab2"]}, {"id": "p7", "kind": "para", "label": "Paragraph 7", "text": "Then white flakes laid a pad over the earth to be stitched by everything moving, from mice to moose. New cold came; deeper snow. Life itself appeared to be chilled to an icy stop. Yet chipmunks and bears were only asleep. Frozen flies and mosquitoes were still living. While Minn, long since burrowed deep in the mud, was yet alive. . . .", "u": [[11, 17], [292, 300]], "conn": [[0, 4], [180, 183], [269, 274]], "vocab": [[11, 17, "v2-7"], [50, 58, "r2-13"], [94, 99, "r2-6"], [184, 193, "r2-5"], [239, 249, "r2-7"], [292, 300, "v2-8"]], "qs": [{"id": "p7-2", "tag": "R", "label": "WRITER", "ans": "一層厚厚的墊子或被子，蓋在地上", "tap": [], "choice": null, "groups": 1, "prompt": "white flakes <b>laid a pad<\/b> over the earth：作者把雪比成 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">一層厚厚的墊子或被子，蓋在地上<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">一座山<\/button><\/span>"}, {"id": "p7-4", "tag": "W", "label": "WORD", "ans": "很早就挖進泥巴深處；停下來想：她真的還活著嗎？", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\"><b>burrowed<\/b> deep in the mud<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">很早就挖進泥巴深處<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很早就爬到樹上<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">句子最後的「. . . .」是要讓你<\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">停下來想：她真的還活著嗎？<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">覺得故事結束了<\/button><\/span><\/div>"}, {"id": "p7-5", "tag": "T", "label": "THINKING", "ans": "泥巴下面比較不冷，才活得下去", "tap": [], "choice": null, "groups": 1, "prompt": "Minn 為什麼要 burrow deep in the mud？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">泥巴下面比較不冷，才活得下去<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">為了找更多食物<\/button><\/span>"}, {"id": "p7-6", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ Yet chipmunks and bears were only asleep. / Frozen flies and mosquitoes were still living.", "tap": ["Yet chipmunks and bears were only asleep", "Frozen flies and mosquitoes were still living"], "choice": null, "groups": 0, "mode": "sentence", "prompt": "在文章裡點出：哪些句子說有些動物「只是睡著、還活著」？"}], "labs": [["green", "WORD LINKS", "burrowed = 挖進去；chilled = 冷到的"], ["purple", "THINKING LAB", "別的動物都睡著，Minn 也躲進泥巴：環境太冷，所以她的行動是「躲起來」。"]], "group": ["p7"]}, {"id": "p8", "kind": "para", "label": "Paragraph 8", "text": "Minn slept through the winter, living on the air stored in her strong lungs. Now, beneath mud and water, she felt new spring warmth. Like a sleep-walker she dug her way out, floated to the surface, and breathed again. But floods hurled dazed Minn through the marsh and into the Mississippi. It was a week before she found a quiet new swamp.", "u": [[70, 75], [82, 89], [222, 228], [236, 241]], "conn": [[77, 80], [218, 221]], "vocab": [[70, 75, "v2-9"], [82, 89, "v2-10"], [140, 152, "r2-9"], [222, 228, "v2-11"], [236, 241, "v2-12"]], "qs": [{"id": "p8-3", "tag": "R", "label": "WRITER", "ans": "慢慢的、迷迷糊糊的", "tap": [], "choice": null, "groups": 1, "prompt": "<b>Like a sleep-walker<\/b> she dug her way out：像夢遊的人，表示 Minn 的動作 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">慢慢的、迷迷糊糊的<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">又快又有精神<\/button><\/span>"}, {"id": "p8-4", "tag": "W", "label": "WORD", "ans": "頭昏眼花、搞不清楚狀況", "tap": [], "choice": null, "groups": 1, "prompt": "<b>dazed<\/b> Minn：dazed 是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">頭昏眼花、搞不清楚狀況<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很開心<\/button><\/span>"}, {"id": "p8-5", "tag": "T", "label": "THINKING", "ans": "floods hurled Minn through the marsh and into the Mississippi；壞消息（新的問題）", "tap": [], "choice": {"opts": ["she found a warm, sunny rock", "she went back to sleep in the mud", "floods hurled her through the marsh and into the Mississippi"], "ok": 2}, "groups": 1, "prompt": "<b>But<\/b> floods hurled dazed Minn …：But 後面發生什麼事？<span class=\"slot\">？<\/span>　這是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"0\">好消息<\/button><button type=\"button\" class=\"opt\" data-ok=\"1\">壞消息（新的問題）<\/button><\/span>"}, {"id": "p8-6", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ new spring warmth；floated to the surface, and breathed again；floods", "tap": ["new spring warmth", "floated to the surface, and breathed again", "floods"], "choice": null, "groups": 0, "prompt": "在文章裡點出：哪些字說明季節從冬天變成春天？"}], "labs": []}, {"id": "lab3", "kind": "cap", "label": "圖說 Caption", "text": "BREATHING AGAIN!　·　UP FROM THE WINTER SLEEP", "u": [], "conn": [], "vocab": [], "qs": [{"id": "lab3-1", "tag": "R", "label": "WRITER", "ans": "先 UP FROM THE WINTER SLEEP（從泥巴裡挖出來）；後 BREATHING AGAIN!（浮上水面呼吸）", "tap": ["UP FROM THE WINTER SLEEP", "BREATHING AGAIN"], "choice": null, "groups": 0, "prompt": "圖上的 <b>UP FROM THE WINTER SLEEP<\/b> 和 <b>BREATHING AGAIN!<\/b> 畫的都是 §8。哪一張先、哪一張後？先：<span class=\"slot\" data-s=\"0\">？<\/span>；後：<span class=\"slot\" data-s=\"1\">？<\/span>"}], "labs": [["green", "WORD LINKS", "dazed = 頭昏眼花；floods = 洪水"], ["purple", "THINKING LAB", "春天本來是好事，But 一出現，洪水又帶來新問題：setting 又變了。"]], "group": ["p8", "lab3"]}], "gist": {"opts": ["Winter comes, so the animals get ready and Minn burrows into the mud. In spring a flood carries her away.", "Minn builds a house and stores food for winter.", "Minn teaches the rabbits to change their coats."], "ok": 0}, "quiz": [{"w": "numb", "opts": ["the two body parts in your chest that you breathe with", "not able to feel anything", "small, thin pieces, like bits of snow"], "ok": 1}, {"w": "cold-blooded", "opts": ["pulled something along behind", "needed something in order to live or work", "having a body temperature that changes with the air or water around it"], "ok": 2}, {"w": "reptile", "opts": ["an animal with dry, scaly skin, like a turtle or a snake", "not able to feel anything", "having a body temperature that changes with the air or water around it"], "ok": 0}, {"w": "depended on", "opts": ["confused and not able to think clearly", "needed something in order to live or work", "small, thin pieces, like bits of snow"], "ok": 1}, {"w": "desire", "opts": ["large amounts of water that cover land that is usually dry", "confused and not able to think clearly", "a strong wish for something"], "ok": 2}, {"w": "towed", "opts": ["the two body parts in your chest that you breathe with", "pulled something along behind", "an animal with dry, scaly skin, like a turtle or a snake"], "ok": 1}, {"w": "bark", "opts": ["an animal with dry, scaly skin, like a turtle or a snake", "needed something in order to live or work", "the hard outside covering of a tree"], "ok": 2}, {"w": "flakes", "opts": ["the two body parts in your chest that you breathe with", "small, thin pieces, like bits of snow", "pulled something along behind"], "ok": 1}, {"w": "burrowed", "opts": ["dug a hole and went into the ground", "the hard outside covering of a tree", "a strong wish for something"], "ok": 0}, {"w": "lungs", "opts": ["the two body parts in your chest that you breathe with", "under; below", "large amounts of water that cover land that is usually dry"], "ok": 0}, {"w": "beneath", "opts": ["under; below", "pulled something along behind", "dug a hole and went into the ground"], "ok": 0}, {"w": "floods", "opts": ["large amounts of water that cover land that is usually dry", "the two body parts in your chest that you breathe with", "pulled something along behind"], "ok": 0}, {"w": "dazed", "opts": ["confused and not able to think clearly", "not able to feel anything", "small, thin pieces, like bits of snow"], "ok": 0}], "say": "It got very cold, so Minn burrowed deep in the mud.", "pause": ["冬天變冷（setting）→ Minn 麻木、躲進泥巴（action）；春天洪水（floods）把她沖進密西西比河。", "muskrats、beavers、otter and mink、snowshoe rabbits、pine squirrels、chipmunks、bears。"], "tools": [{"id": "t2a", "title": "冷的因果鏈", "how": "照「因為…所以…」的順序放：冷 → 身體怎麼了 → 她做了什麼。", "layout": "table", "head": ["冷（§5–7）…", "→ 所以 Minn 的身體…", "→ 所以 Minn 做了什麼？"], "rows": [[{"s": "k1"}, {"s": "k2"}, {"s": "k3"}]], "cards": [{"t": "she wants to dig deep into the mud", "s": "k3", "w": null}, {"t": "the weather gets very cold", "s": "k1", "w": null}, {"t": "she feels warm and full of energy", "s": null, "w": null}, {"t": "she feels numb (she is cold-blooded)", "s": "k2", "w": null}]}, {"id": "t2b", "title": "季節 → 環境 → 行動", "how": "每個季節發生什麼事？Minn 在做什麼？在哪一段？", "layout": "table", "head": ["季節", "發生什麼事（Setting）", "Minn 在做什麼（Action）", "§"], "rows": [["late fall", {"s": "e1"}, {"s": "f1"}, {"s": "g1"}], ["winter", {"s": "e2"}, {"s": "f2"}, {"s": "g2"}], ["spring", {"s": "e3"}, {"s": "f3"}, {"s": "g3"}]], "cards": [{"t": "she sleeps deep in the mud, living on the air in her lungs", "s": "f2", "w": null}, {"t": "she is still and cold, getting ready", "s": "f1", "w": null}, {"t": "other animals get ready (rabbits turn white, beavers store food)", "s": "e1", "w": null}, {"t": "she digs out, breathes, and is washed into the Mississippi", "s": "f3", "w": null}, {"t": "§8", "s": "g3", "w": null}, {"t": "snow covers the earth; life seems to stop", "s": "e2", "w": null}, {"t": "§7–8", "s": "g2", "w": null}, {"t": "new spring warmth, then floods", "s": "e3", "w": null}, {"t": "§6", "s": "g1", "w": null}]}], "disp": 2}, {"n": 3, "title": "A Born Hunter on Land and in Water", "range": "原文 §9–12 ＋ 圖片標籤＋圖表", "cards": [{"id": "p9", "kind": "para", "label": "Paragraph 9", "text": "The food from her food-sac, together with a few beetles and grubs, had carried her through winter hibernation. Now she was thin, weak and hungry! Many a wiggling thing was snapped up to make Minn bigger. Some of her hunting was done by \"ambush.\" Under mud, unseen, her jaws snapped when food came near—and an unlucky snail or worm promptly vanished. Sometimes she hunted by walking along the swamp bottom. Several kinds of turtles are bottom-walkers, though awkward about it. Minn somehow balanced her weight so that enough of it held her down, and her rear-end limp did not matter. Slowly she walked through veils of green water like a River Spirit seeking forgotten things. Among swirling weeds, Minn with her stately, relentless tread was an ancient monster marching out of the past. Two inches of relentless monster. A born hunter.", "u": [[98, 109], [237, 243], [269, 273], [331, 339], [340, 348], [458, 465], [489, 497], [609, 614], [682, 690], [712, 719], [721, 731], [732, 737], [745, 752], [801, 811]], "conn": [[111, 114]], "vocab": [[18, 26, "r3-14"], [60, 65, "r3-0"], [98, 109, "v3-0"], [115, 117, "v3-16"], [237, 243, "v3-1"], [269, 273, "v3-2"], [317, 322, "r3-1"], [326, 330, "r3-2"], [331, 339, "v3-3"], [340, 348, "v3-4"], [360, 362, "v3-16"], [458, 465, "v3-5"], [489, 497, "v3-6"], [562, 566, "v3-26"], [590, 592, "v3-16"], [609, 614, "v3-7"], [637, 649, "r3-10"], [712, 719, "v3-8"], [721, 731, "v3-9"], [732, 737, "v3-10"], [745, 752, "r3-13"], [801, 811, "v3-9"]], "qs": [{"id": "p9-2", "tag": "T", "label": "THINKING", "ans": "冬眠結束後的現在；hungry（她又瘦又虛弱又餓）", "tap": ["hungry"], "choice": null, "groups": 1, "prompt": "<b>Now<\/b> she was thin, weak and hungry!：Now 表示 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">冬眠結束後的現在<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很久以前<\/button><\/span>。她的新問題是 <span class=\"slot\" data-s=\"0\">？<\/span>"}, {"id": "p9-3", "tag": "W", "label": "WORD", "ans": "unseen；躲起來突然咬", "tap": ["unseen"], "choice": null, "groups": 1, "prompt": "Some of her hunting was done by \"<b>ambush<\/b>.\" 後面一句在解釋 ambush：Under mud, <span class=\"slot\" data-s=\"0\">？<\/span>, her jaws snapped when food came near。所以 ambush 是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">躲起來突然咬<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">追著獵物跑<\/button><\/span>"}, {"id": "p9-5", "tag": "R", "label": "WRITER", "ans": "a River Spirit（河流精靈）；神祕又安靜", "tap": ["a River Spirit"], "choice": null, "groups": 1, "prompt": "Slowly she walked … <b>like a River Spirit<\/b> seeking forgotten things：作者把 Minn 比成 <span class=\"slot\" data-s=\"0\">？<\/span>。這讓 Minn 看起來 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">神祕又安靜<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">吵鬧又可愛<\/button><\/span>"}, {"id": "p9-6", "tag": "R", "label": "WRITER", "ans": "不完整的短句（句子片段），用來加強語氣；很小", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\">Two inches of relentless monster. <b>A born hunter.<\/b> 這兩句是<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">不完整的短句（句子片段），用來加強語氣<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">寫錯的句子<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">「Two inches」說明 Minn 其實<\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">很小<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很大<\/button><\/span><\/div>"}, {"id": "p9-7", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ Some of her hunting was done by \"ambush.\"；Sometimes she hunted by walking along the swamp bottom.", "tap": ["Some of her hunting was done by \"ambush.\"", "Sometimes she hunted by walking along the swamp bottom"], "choice": null, "groups": 0, "mode": "sentence", "prompt": "在文章裡點出：Minn 在水底狩獵的兩個方法（一個是 ambush，一個是 walking）。"}], "labs": []}, {"id": "lab4", "kind": "cap", "label": "圖說 Caption", "text": "BOTTOM-WALKING　·　AMBUSH", "u": [], "conn": [], "vocab": [[17, 23, "v3-1"]], "qs": [{"id": "lab4-1", "tag": "R", "label": "WRITER", "ans": "mud（泥巴）；bottom（底部）", "tap": [], "choice": {"opts": ["rocks；surface", "leaves；shore", "mud；bottom"], "ok": 2}, "groups": 0, "prompt": "圖上的 <b>AMBUSH<\/b> 和 <b>BOTTOM-WALKING<\/b> 在 §9 各對應哪一種狩獵方法？AMBUSH：躲在 <span class=\"slot\">？<\/span> 下面，等獵物靠近；BOTTOM-WALKING：沿著 swamp <span class=\"slot\">？<\/span> 走。"}], "labs": [["green", "WORD LINKS", "hibernation / ambush / relentless / ancient；swirling weeds"], ["purple", "THINKING LAB", "冬眠結束 → 又瘦又餓（問題）→ ambush 和走路狩獵（行動）。最後兩個短句，讓你一眼看見這隻 Minn 的個性。"]], "group": ["p9", "lab4"]}, {"id": "p10", "kind": "para", "label": "Paragraph 10", "text": "Minn's neighbors, the pert little terrapin, buttoned themselves to logs for hours, basking in the sun. Hot, dry sunlight discourages leeches and mossy growths, so the terrapin's shells were neatly smooth. Minn preferred watery shade to sun—and so leeches became her close company, and tiny plants upholstered her shell in green velvet. This mossy coating would be shed each year. As her shell grew, spreading outward, its top layer would peel off like shreds of snapshot film, leaving her smooth and clean. Minn was deaf—yet felt even faint vibrations. She was shy—but when she looked upon her world she saw clearly, and she knew one color from another. She had much common sense.", "u": [[83, 90], [121, 132], [297, 308], [328, 334], [347, 354], [364, 368], [452, 458], [541, 551], [667, 679]], "conn": [[160, 162]], "vocab": [[22, 26, "r3-15"], [34, 42, "r3-3"], [83, 90, "v3-11"], [121, 132, "v3-12"], [133, 140, "r3-4"], [167, 175, "r3-3"], [247, 254, "r3-4"], [297, 308, "v3-13"], [328, 334, "v3-14"], [347, 354, "v3-15"], [364, 368, "v3-16"], [452, 458, "v3-17"], [541, 551, "v3-18"], [667, 679, "v3-19"]], "qs": [{"id": "p10-3", "tag": "W", "label": "WORD", "ans": "像天鵝絨一樣覆蓋", "tap": [], "choice": null, "groups": 1, "prompt": "tiny plants <b>upholstered<\/b> her shell in green velvet：這是 context clue：前面寫 plants，後面寫 green velvet，所以 upholstered 是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">像天鵝絨一樣覆蓋<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">拿走<\/button><\/span>"}, {"id": "p10-4", "tag": "W", "label": "WORD", "ans": "可是；感覺水的震動", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\">Minn was deaf—<b>yet<\/b> felt even faint <b>vibrations<\/b>：Yet 的意思<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">可是<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">所以<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">deaf = 聽不到，所以她用<\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">感覺水的震動<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">眼睛<\/button><\/span><\/div><div class=\"ptail\">知道周圍的事<\/div>"}, {"id": "p10-5", "tag": "T", "label": "THINKING", "ans": "她又聾又害羞，卻看得清楚、分得出顏色", "tap": [], "choice": null, "groups": 1, "prompt": "作者說 Minn 「She had much common sense」。哪些句子是證據？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">她又聾又害羞，卻看得清楚、分得出顏色<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">她跟水蛭很要好<\/button><\/span>"}, {"id": "p10-6", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ Minn preferred watery shade to sun；terrapin … basking in the sun", "tap": ["Minn preferred watery shade to sun"], "choice": null, "groups": 0, "mode": "sentence", "prompt": "在文章裡點出：Minn 和 terrapin 不一樣的地方（一個喜歡陰影，另一個 buttoned themselves to logs, basking in the sun）。"}], "labs": [["green", "WORD LINKS", "upholstered / basking / vibrations；terrapin 和 Minn 對照"], ["purple", "THINKING LAB", "作者用 terrapin 和 Minn 對照，說明 Minn 的習慣（住在水中陰影）也是為了適應環境。"]], "group": ["p10"]}, {"id": "p11", "kind": "para", "label": "Paragraph 11", "text": "In high water, Minn had settled in a deep pool of the swamp. When floods ran away, the pool shrank to a shallow pond. The day came when Minn's back bulged above a drying puddle, baking in the sun. Terrapin gulped food in or out of water. But Minn, a snapper, could not swallow easily except under water—and there just wasn't enough water left!", "u": [[66, 72], [92, 98], [104, 111], [148, 154], [170, 176]], "conn": [[61, 65], [238, 241]], "vocab": [[66, 72, "v2-11"], [92, 98, "v3-20"], [104, 111, "v3-21"], [148, 154, "v3-22"], [170, 176, "v3-23"], [197, 205, "r3-3"], [206, 212, "r3-16"], [250, 257, "r3-5"]], "qs": [{"id": "p11-2", "tag": "W", "label": "WORD", "ans": "deep", "tap": ["deep"], "choice": null, "groups": 0, "prompt": "The pool shrank to a <b>shallow<\/b> pond：shallow 的反義字是 <span class=\"slot\" data-s=\"0\">？<\/span>"}, {"id": "p11-4", "tag": "T", "label": "THINKING", "ans": "因為她只有在水下才吞得下食物，水卻快乾了", "tap": [], "choice": null, "groups": 1, "prompt": "為什麼 Minn 在 shallow pond 裡有大麻煩？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">因為她只有在水下才吞得下食物，水卻快乾了<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">因為她不喜歡淺的水<\/button><\/span>"}, {"id": "p11-5", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ When floods ran away, the pool shrank to a shallow pond.　/　Minn's back bulged above a drying puddle, baking in the sun.", "tap": ["When floods ran away, the pool shrank to a shallow pond", "Minn's back bulged above a drying puddle, baking in the sun"], "choice": null, "groups": 0, "mode": "sentence", "prompt": "在文章裡點出：哪一句說明水池愈來愈小？"}], "labs": [["green", "WORD LINKS", "floods / shallow ↔ deep"], ["purple", "THINKING LAB", "setting 變了：水變淺 → Minn 吞不下東西 → 麻煩出現。"]], "group": ["p11"]}, {"id": "p12", "kind": "para", "label": "Paragraph 12", "text": "Minn had no intention of starving. She splashed through scum to a baked-clay bank, and limped away. Minn on land was different from Minn in water. In a swamp she lived calmly, snapping mainly to capture food. Here, her sensitive eyes disliked bright sun; she felt mean enough to snap at anything. A porcupine met her and she hissed like a viper. The big, bristling rodent backed up as she tottered past. When a fox put down an inquisitive nose, Minn lunged at it. Her shell was less than three inches; but her neck and tail were so long that almost eight inches of angry reptile snaked forward in that strike. Though she missed and fell on her chin, the fox was impressed. When Minn arose again, an armored warrior advancing, the fox switched his plume of a tail from the brush that held it, and thoughtfully trotted off into thick ferns. After all, he had eaten well, this morning!", "u": [[12, 21], [25, 33], [87, 93], [195, 202], [219, 228], [355, 364], [389, 397], [427, 438], [450, 456], [699, 706], [707, 714], [809, 816]], "conn": [[209, 213], [502, 505], [610, 616]], "vocab": [[12, 21, "v3-24"], [25, 33, "v3-25"], [35, 37, "v3-16"], [56, 60, "r3-17"], [87, 93, "v3-26"], [158, 160, "v3-16"], [195, 202, "v3-27"], [219, 228, "v3-28"], [255, 257, "v3-16"], [299, 308, "r3-6"], [321, 323, "v3-16"], [339, 344, "r3-9"], [355, 364, "v3-29"], [365, 371, "r3-8"], [385, 387, "v3-16"], [389, 397, "r3-18"], [411, 414, "r3-7"], [427, 438, "v3-30"], [450, 456, "v3-31"], [468, 470, "v3-16"], [617, 619, "v3-16"], [654, 657, "r3-7"], [699, 706, "v3-32"], [707, 714, "v3-33"], [730, 733, "r3-7"], [747, 752, "r3-19"], [809, 816, "v3-34"], [832, 837, "r3-20"]], "qs": [{"id": "p12-1", "tag": "T", "label": "THINKING", "ans": "She splashed through scum to a baked-clay bank, and limped away（離開乾掉的池子，上岸）", "tap": [], "choice": {"opts": ["stayed in the puddle and slept", "swam back to the Mississippi", "left the drying pond and went onto land"], "ok": 2}, "groups": 0, "prompt": "Minn had no intention of starving：她「不打算餓死」，所以她的行動是 <span class=\"slot\">？<\/span>"}, {"id": "p12-2", "tag": "T", "label": "THINKING", "ans": "水裡 calmly（冷靜）；陸上 mean（兇）", "tap": ["calmly", "mean"], "choice": null, "groups": 0, "prompt": "<b>Minn on land was different from Minn in water.<\/b> 水裡的 Minn：<span class=\"slot\" data-s=\"0\">？<\/span>；陸上的 Minn：<span class=\"slot\" data-s=\"1\">？<\/span>（用 calmly / mean 回答）"}, {"id": "p12-3", "tag": "R", "label": "WRITER", "ans": "比喻（simile）；又兇又防備", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\">she <b>hissed like a viper<\/b>：like 是<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">比喻（simile）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">真的是蛇<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">作者想讓你看到 Minn 在陸上<\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">又兇又防備<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很友善<\/button><\/span><\/div>"}, {"id": "p12-4", "tag": "W", "label": "WORD", "ans": "好奇地聞一聞；lunged（撲上去）", "tap": ["lunged at it"], "choice": null, "groups": 1, "prompt": "When a fox put down an <b>inquisitive<\/b> nose：fox 想 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">好奇地聞一聞<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">咬斷牠的腳<\/button><\/span>。Minn 的反應：<span class=\"slot\" data-s=\"0\">？<\/span>（lunged at it）"}, {"id": "p12-6", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ A porcupine met her and she hissed like a viper.　/　When a fox put down an inquisitive nose, Minn lunged at it.", "tap": ["A porcupine met her and she hissed like a viper", "When a fox put down an inquisitive nose, Minn lunged at it"], "choice": null, "groups": 0, "mode": "sentence", "prompt": "在文章裡點出：哪一個動作證明 Minn 在陸上變得有防備、有攻擊性？"}], "labs": []}, {"id": "pie", "kind": "img", "label": "圖表 Chart", "text": "A SNAPPER'S WATER-PIE FOR DINNER\n① FISH  34.2%\n② CARRION (DEAD THINGS)  19.6%\n③ OTHER VER'TE-BRATES (HAVING BACKBONES)  2.2%\n④ WATER PLANTS  36.2%\n⑤ IN-VER'TE-BRATES (WITHOUT BACKBONES, SUCH AS INSECTS, ETC.)  7.8%\nTOTAL PIE  100.0%", "u": [], "conn": [], "vocab": [[2, 9, "r3-5"], [49, 56, "r3-11"]], "qs": [{"id": "pie-1", "tag": "R", "label": "WRITER", "ans": "water plants 36.2%；fish 34.2%", "tap": ["water plants", "36.2", "fish", "34.2"], "choice": null, "groups": 0, "prompt": "圖表 <b>A SNAPPER'S WATER-PIE FOR DINNER<\/b>：數字最大的食物是 <span class=\"slot\" data-s=\"0\">？<\/span>（<span class=\"slot\" data-s=\"1\">？<\/span>%），第二大是 <span class=\"slot\" data-s=\"2\">？<\/span>（<span class=\"slot\" data-s=\"3\">？<\/span>%）。"}, {"id": "pie-2", "tag": "T", "label": "THINKING", "ans": "有植物也有動物；不完全一樣，圖表告訴我們她也吃很多水草", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\">五個數字加起來是 100.0%。Minn 這種 snapper 吃的東西<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">有植物也有動物<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">只吃魚<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">這跟 §9 的 hunting 一樣嗎？<\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">不完全一樣，圖表告訴我們她也吃很多水草<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">完全一樣<\/button><\/span><\/div>"}], "labs": [["green", "WORD LINKS", "inquisitive / tottered；limped"], ["purple", "THINKING LAB", "水裡 vs. 陸上：setting 變了，Minn 的個性（行動）也變了。圖表是用數字讀 Minn 的食物。"]], "group": ["p12", "pie"]}], "gist": {"opts": ["Minn goes to live with the terrapin on a log.", "A fox and a porcupine become Minn's friends.", "In her new swamp Minn hunts k=\"1\">搖搖擺擺地走<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很快地游<\/button><\/span>。她離 <span class=\"slot\" data-s=\"0\">？<\/span> 愈來愈遠"}, {"id": "p13-2", "tag": "R", "label": "WRITER", "ans": "擬人（personification）；丟下她不管", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\">Minn's water-world <b>deserted<\/b> her：作者把 water-world 寫成會「離開」的人，這叫<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">擬人（personification）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">事實<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">deserted<\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">丟下她不管<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">來找她<\/button><\/span><\/div>"}, {"id": "p13-5", "tag": "T", "label": "THINKING", "ans": "因為水沒了，小魚和蝌蚪困在泥巴裡，變成食物", "tap": [], "choice": null, "groups": 1, "prompt": "crows fell out of the sky to feast on flopping minnows and tadpoles：烏鴉為什麼來？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">因為水沒了，小魚和蝌蚪困在泥巴裡，變成食物<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">因為牠們想找 Minn<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "waddling / deserted；minnows / tadpoles"], ["purple", "THINKING LAB", "第二次水消失：Minn 的環境一再改變，故事進入高潮。"]], "group": ["p13"]}, {"id": "p14", "kind": "para", "label": "Paragraph 14", "text": "Minn scrambled to safety under draggled grass at the bank. She was confused. First, part of a wide swamp had shrunk to a puddle. Now a running brook had wandered away. Minn stared blankly about her. Then, seeming to get an idea, she started to walk. The gurgling brook had gasped, and then had run away downhill; yet Minn walked up—to a ridge of dead trees, sod and mud making a dam and a pond.", "u": [[5, 14], [31, 39], [180, 187], [337, 342], [379, 382]], "conn": [[77, 82], [129, 132], [199, 203], [313, 316]], "vocab": [[5, 14, "v4-4"], [31, 39, "r4-9"], [180, 187, "v4-5"], [273, 279, "r4-10"], [337, 342, "v4-6"], [358, 361, "r4-2"], [379, 382, "v4-7"]], "qs": [{"id": "p14-1", "tag": "W", "label": "WORD", "ans": "急忙爬過去；又濕又髒、垂著的", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\">Minn <b>scrambled<\/b> to safety under <b>draggled<\/b> grass：scrambled 是<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">急忙爬過去<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">慢慢走過去<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">draggled 是<\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">又濕又髒、垂著的<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">乾乾的<\/button><\/span><\/div>"}, {"id": "p14-3", "tag": "T", "label": "THINKING", "ans": "她的水世界一直消失", "tap": [], "choice": null, "groups": 1, "prompt": "Minn was <b>confused<\/b>。她為什麼困惑？因為 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">她的水世界一直消失<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">她迷路了<\/button><\/span>"}, {"id": "p14-6", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ to a ridge of dead trees, sod and mud making a dam and a pond", "tap": ["to a ridge of dead trees, sod and mud making a dam and a pond"], "choice": null, "groups": 0, "prompt": "在文章裡點出：Minn 最後走到什麼地方？（a ridge of dead trees, sod and mud）"}], "labs": [["green", "WORD LINKS", "scrambled / draggled / dam"], ["purple", "THINKING LAB", "Minn 不是逃走，而是往水流來的地方走：她「想到了辦法」，這是故事的轉折。"]], "group": ["p14"]}, {"id": "p15", "kind": "para", "label": "Paragraph 15", "text": "Boys who had built the dam in the brook called this place an \"Ole Swimmin' Hole.\" Their fathers just could not understand how a brook, choked with boulders, poles and clay, produced better swimming than clean lakes and beaches of this summer-resort land. The boys could not explain it either—except that—well, how could you feel that a long lake be
