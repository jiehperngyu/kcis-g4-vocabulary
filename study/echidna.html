<script>
(function(){
  var KEY = "ep-echidna-v1", store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) {}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
  store.done = store.done || {};
  var VOC = DATA.voc, main = document.getElementById("main"), tabsEl = document.getElementById("tabs");
  function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function norm(s){ return s.toLowerCase().replace(/[’]/g, "'").replace(/[“”]/g, '"'); }
  function ranges(text, phrase){
    var out = [], t = norm(text), p = norm(phrase).trim(); if (!p) return out;
    var i = t.indexOf(p); while (i >= 0){ out.push([i, i + p.length]); i = t.indexOf(p, i + 1); }
    return out;
  }
  function clearMarks(){
    document.querySelectorAll(".w.found,.w.sel,.w.miss,.w.hov").forEach(function(x){ x.classList.remove("found", "sel", "miss", "hov"); });
  }
  var lastQ = null;
  document.addEventListener("click", function(e){
    var box = e.target.closest(".q");
    if (box && box !== lastQ){ clearMarks(); lastQ = box; }
  }, true);
  function sentences(text){
    var out = [], start = 0, re = /[.!?]["”’)]*(?=\s|$)|:(?=\s+[A-Z])|\n/g, m;
    while ((m = re.exec(text))){ var end = m.index + m[0].length; if (text.slice(start, end).trim()) out.push([start, end]); start = end; }
    if (text.slice(start).trim()) out.push([start, text.length]);
    return out;
  }
  var voice = null;
  function pickVoice(){
    try { var vs = speechSynthesis.getVoices();
      voice = vs.filter(function(v){ return /samantha/i.test(v.name); })[0] || vs.filter(function(v){ return /^en-US$/i.test(v.lang || ""); })[0] || vs.filter(function(v){ return (v.lang || "").indexOf("en") === 0; })[0] || null;
    } catch (e) {}
  }
  if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  var reading = null; // {btn, box}
  function stopReading(){
    try { speechSynthesis.cancel(); } catch (e) {}
    if (reading){ reading.btn.classList.remove("on"); reading.btn.textContent = "▶ 朗讀這段";
      reading.box.querySelectorAll(".w.reading").forEach(function(x){ x.classList.remove("reading"); }); reading = null; }
  }
  function utter(text, rate){
    var u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = rate; if (voice) u.voice = voice; return u;
  }
  function speak(word){
    stopReading();
    try { speechSynthesis.speak(utter(word, .85)); } catch (e) {}
  }
  function readAloud(text, box, btn){
    if (reading && reading.btn === btn){ stopReading(); return; }
    stopReading();
    if (!("speechSynthesis" in window)){ btn.textContent = "這台裝置不能朗讀"; return; }
    var u = utter(text, .9);
    reading = {btn: btn, box: box}; btn.classList.add("on"); btn.textContent = "■ 停止";
    var words = Array.prototype.slice.call(box.querySelectorAll(".w"));
    u.onboundary = function(e){
      if (!reading || reading.box !== box) return;
      var i = e.charIndex;
      words.forEach(function(w){ w.classList.toggle("reading", +w.dataset.a <= i && i < +w.dataset.b); });
    };
    u.onend = u.onerror = function(){ if (reading && reading.box === box) stopReading(); };
    speechSynthesis.speak(u);
  }

  // ---------- passage ----------
  function renderPassage(card){
    var box = el("div", "ptext"), text = card.text, re = /[A-Za-z0-9§][A-Za-z0-9'’\-]*/g, last = 0, m;
    function cls(a, b){
      var c = [];
      card.vocab.forEach(function(r){ if (a < r[1] && b > r[0]) c.push(VOC[r[2]].star ? "vs" : "vr"); });
      return c;
    }
    var conn = card.conn || [];
    var phrases = conn.map(function(r){ return [r[0], r[1], 1]; }).concat(card.vocab.filter(function(r){ return /\s/.test(text.slice(r[0], r[1])); }).map(function(r){ return [r[0], r[1], 0]; }));
    while ((m = re.exec(text))){
      if (m.index > last) box.appendChild(document.createTextNode(text.slice(last, m.index)));
      var a0 = m.index, b0 = m.index + m[0].length, ph = phrases.filter(function(r){ return r[0] === a0; })[0];
      if (ph){ b0 = ph[1]; re.lastIndex = b0; }
      var s = el("span", "w " + (ph && ph[2] ? "cn" : cls(a0, b0).join(" ")));
      s.textContent = text.slice(a0, b0); s.dataset.a = a0; s.dataset.b = b0; s.tabIndex = 0;
      box.appendChild(s); last = b0;
    }
    if (last < text.length) box.appendChild(document.createTextNode(text.slice(last)));
    return box;
  }

  function wordBox(box, key){
    var v = VOC[key];
    box.className = "wordbox";
    box.innerHTML = '<div class="wb-top"><span class="wb-w"></span><span class="wb-pos"></span><button type="button" class="say">▶ 聽</button></div>' +
      '<div class="wb-zh"></div>' + (v.en ? '<div class="wb-en"></div>' : "") + (v.grow ? '<div class="wb-grow"><span class="gl">讓字長大</span>' + v.grow + "</div>" : "");
    box.querySelector(".wb-w").textContent = v.w; box.querySelector(".wb-pos").textContent = v.pos;
    box.querySelector(".wb-zh").textContent = v.zh; if (v.en) box.querySelector(".wb-en").textContent = v.en;
    box.querySelector(".say").onclick = function(){ speak(v.w.replace("…", "")); };
  }

  // ---------- one paragraph desk ----------
  function renderCard(card, unit){
    if (card.kind === "brk") return el("div", "brk", card.text);
    if (card.kind === "article"){ var ar = el("div", "article"); ar.appendChild(el("span", null, "")).textContent = card.sub; ar.appendChild(document.createTextNode(card.text)); return ar; }
    if (card.kind === "head"){ var hd = el("div", "subhead"); hd.textContent = card.text; return hd; }
    var desk = el("div", "desk"), left = el("div", "leftcol"), panel = el("div", "panel");
    desk.id = "c-" + card.id;
    var lab = el("div", "plabel", "<span>" + card.label + "</span>");
    var rb = el("button", "readbtn", "▶ 朗讀這段"); rb.type = "button"; lab.appendChild(rb);
    left.appendChild(lab);
    var ptext = renderPassage(card); left.appendChild(ptext);
    rb.onclick = function(){ readAloud(card.text, ptext, rb); };
    var bar = el("div", "tapbar"); bar.hidden = true; left.appendChild(bar);
    var wb = el("div", "wordbox empty", "點文章裡畫底線或點線的字，這裡會出現它的意思和字族。");
    panel.appendChild(wb);
    var active = null;

    function setActive(q){
      if (active){ active.box.classList.remove("active"); }
      active = q;
      ptext.classList.toggle("tapping", !!q);
      ptext.classList.toggle("sentmode", !!(q && q.d.mode === "sentence"));
      ptext.querySelectorAll(".hov").forEach(function(x){ x.classList.remove("hov"); });
      if (q){
        q.box.classList.add("active"); bar.hidden = false;
        bar.innerHTML = "<span>第 " + q.num + " 題：" + (q.d.mode === "sentence" ? "點一下，選整句話" : "在文章裡點出答案") + "（點錯會變紅）</span>";
        var c = el("button", null, "先不要"); c.type = "button"; c.onclick = function(){ setActive(null); };
        bar.appendChild(c);
        if (window.matchMedia("(max-width:760px)").matches) ptext.scrollIntoView({block: "center", behavior: "smooth"});
      } else bar.hidden = true;
    }

    var SENTS = sentences(card.text);
    function sentOf(a){ return SENTS.filter(function(r){ return a >= r[0] && a < r[1]; })[0]; }
    function wordsIn(r){ return Array.prototype.filter.call(ptext.querySelectorAll(".w"), function(x){ return +x.dataset.a < r[1] && +x.dataset.b > r[0]; }); }
    ptext.addEventListener("mouseover", function(e){
      if (!active || active.d.mode !== "sentence") return;
      var w = e.target.closest(".w"); ptext.querySelectorAll(".hov").forEach(function(x){ x.classList.remove("hov"); });
      if (w){ var r = sentOf(+w.dataset.a); if (r) wordsIn(r).forEach(function(x){ x.classList.add("hov"); }); }
    });
    ptext.addEventListener("click", function(e){
      var w = e.target.closest(".w"); if (!w) return;
      var a = +w.dataset.a, b = +w.dataset.b;
      if (active && active.d.mode === "sentence"){
        var r = sentOf(a); if (!r) return;
        var ws = wordsIn(r), ok = tapAnswer(active, r[0], r[1], null, true);
        if (ok){ ws.forEach(function(x){ x.classList.add("found"); x.classList.remove("hov"); }); }
        else ws.forEach(function(x){ x.classList.remove("miss"); void x.offsetWidth; x.classList.add("miss"); });

    DATA.review.forEach(function(b){
      if (!store.done["t" + b.id]) return;
      done++; var ms = (store.miss && store.miss[b.id]) || [];
      got += ms.length === 0 ? 3 : ms.length <= 2 ? 2 : 1;
      ms.forEach(function(w){ if (weak.indexOf(w) < 0) weak.push(w); });
    });
    scoreBox.innerHTML = '<b class="big">★ ' + got + " / " + DATA.review.length * 3 + "</b>　完成 " + done + " / " + DATA.review.length + " 關" +
      (weak.length ? '<p style="margin:6px 0 0">還不熟的字（多唸幾次、再玩一次）：<span class="weak"></span></p>' : (done === DATA.review.length ? '<p style="margin:6px 0 0">全部的字都一次就放對了！</p>' : ""));
    if (weak.length) scoreBox.querySelector(".weak").textContent = weak.join("、");
  }
  document.addEventListener("am-progress", paintScore);

  function progress(){
    DATA.units.forEach(function(u){
      var ids = [];
      u.cards.forEach(function(c){ (c.qs || []).forEach(function(q){ ids.push(q.id); }); });
      (u.tools || []).forEach(function(b){ ids.push("t" + b.id); });
      ids.push("g" + u.n); u.quiz.forEach(function(_, i){ ids.push("z" + u.n + "-" + i); });
      var done = ids.filter(function(i){ return store.done[i]; }).length;
      var bar = tabsEl.querySelector('[data-u="' + u.n + '"] i'); if (bar) bar.style.width = Math.round(done / ids.length * 100) + "%";
    });
    if (DATA.summary && DATA.summary.length){
      var sd = DATA.summary.filter(function(b){ return store.done["t" + b.id]; }).length;
      var sb = tabsEl.querySelector('[data-u="summary"] i'); if (sb) sb.style.width = Math.round(sd / DATA.summary.length * 100) + "%";
    }
    if (DATA.skills && DATA.skills.length){
      var kd = DATA.skills.filter(function(b){ return store.done["t" + b.id]; }).length;
      var kb = tabsEl.querySelector('[data-u="skills"] i'); if (kb) kb.style.width = Math.round(kd / DATA.skills.length * 100) + "%";
    }
    if (DATA.review && DATA.review.length){
      var rd = DATA.review.filter(function(b){ return store.done["t" + b.id]; }).length;
      var rb = tabsEl.querySelector('[data-u="review"] i'); if (rb) rb.style.width = Math.round(rd / DATA.review.length * 100) + "%";
    }
    document.dispatchEvent(new Event("am-progress"));
  }

  function route(){
    var h = location.hash.replace("#", ""), m = h.match(/^u(\d+)-s\d+$/) || h.match(/^unit-(\d+|summary|skills|review)$/);
    var ok = function(x){ return ((x === "summary" || x === "skills" || x === "review") && !!document.getElementById("unit-" + x)) || DATA.units.some(function(u){ return String(u.n) === String(x); }); };
    var n = m && ok(m[1]) ? m[1] : (ok(store.unit) ? store.unit : String(DATA.units[0].n));
    document.querySelectorAll(".unit").forEach(function(x){ x.hidden = x.dataset.unit !== String(n); });
    tabsEl.querySelectorAll(".utab").forEach(function(x){ x.classList.toggle("on", x.dataset.u === String(n)); });
    store.unit = String(n); save();
    var target = h && document.getElementById(h); if (target) target.scrollIntoView({block: "start"});
  }
  window.addEventListener("hashchange", function(){ stopReading(); route(); });

  document.getElementById("reset").addEventListener("click", function(){
    if (this.dataset.sure !== "1"){ this.dataset.sure = "1"; this.textContent = "再按一次就清除全部"; return; }
    store = {done: {}}; save(); location.reload();
  });
  progress(); route();
})();
</script>

</body>
</html>
