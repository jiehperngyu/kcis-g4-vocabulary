<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Weird and Wonderful Echidna 互動自學</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: unit tabs on top; each paragraph is a two-column "reading desk": the passage (tappable words) on the left, a word panel + questions on the right. Stacks on phones. */
:root{
  --bg:#f4f7f3; --paper:#ffffff; --ink:#1d2a24; --muted:#5b6b64; --line:#d6e2da;
  --leaf:#2f6f4e; --leaf-tint:#e3efe7; --panel:#f0f4f1;
  --red:#c8452f; --yellow:#e8b730; --black:#1b1b1b; --hl:#fff1b8;
  --ok:#2c8650; --ok-bg:#d9f0e0; --no:#c0472f; --no-bg:#fbe1da;
  --t-L:#a96400; --t-W:#2f6f4e; --t-T:#3c5f9c; --t-R:#8a4fa3; --t-E:#c0472f;
  --display:"Baloo 2","Andika",ui-rounded,system-ui,sans-serif;
  --body:"Andika","PingFang TC","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131915; --paper:#1b231f; --ink:#e6eee8; --muted:#9cb0a5; --line:#33443b;
  --leaf:#7cc79a; --leaf-tint:#22362b; --panel:#1f2924; --hl:#4b4220;
  --ok:#7cd49a; --ok-bg:#1e3a29; --no:#f0907a; --no-bg:#3e2520;
  --t-L:#f0b45a; --t-W:#7cc79a; --t-T:#8fb1ee; --t-R:#cfa0e4; --t-E:#f0907a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131915; --paper:#1b231f; --ink:#e6eee8; --muted:#9cb0a5; --line:#33443b;
  --leaf:#7cc79a; --leaf-tint:#22362b; --panel:#1f2924; --hl:#4b4220;
  --ok:#7cd49a; --ok-bg:#1e3a29; --no:#f0907a; --no-bg:#3e2520;
  --t-L:#f0b45a; --t-W:#7cc79a; --t-T:#8fb1ee; --t-R:#cfa0e4; --t-E:#f0907a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 60px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto}
.band{height:8px;background:repeating-linear-gradient(90deg,var(--red) 0 34px,var(--yellow) 34px 44px,var(--black) 44px 70px,var(--yellow) 70px 80px);border-radius:4px}
.hero{padding-block:20px 4px}
.hero small{color:var(--muted);letter-spacing:.04em}
.hero h1{font-family:var(--display);font-weight:800;color:var(--leaf);font-size:clamp(30px,6vw,44px);line-height:1.05;margin:4px 0}
.hero p{margin:0;color:var(--muted);max-width:62ch}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:14px 0 8px;padding-bottom:4px;scrollbar-width:thin}
.utab{flex:1 0 150px;text-decoration:none;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;position:relative;overflow:hidden}
.utab b{font-family:var(--display);color:var(--leaf);display:block}
.utab span{font-size:13px;color:var(--muted);line-height:1.3;display:block}
.utab.on{border-color:var(--leaf);box-shadow:inset 0 0 0 1.5px var(--leaf)}
.utab i{position:absolute;left:0;bottom:0;height:4px;background:var(--leaf);width:0;transition:width .3s}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);margin:6px 0 14px}
.legend span b{font-weight:700}
.k-star{border-bottom:2.5px dotted var(--leaf);color:var(--ink)}
.k-rec{border-bottom:2px dotted var(--muted)}
.uhead h2{font-family:var(--display);font-size:clamp(24px,4.4vw,32px);margin:4px 0 0;line-height:1.15;text-wrap:balance}
.badge{display:inline-block;background:var(--leaf);color:var(--paper);font-family:var(--display);font-weight:800;border-radius:10px;padding:2px 12px}
.range{color:var(--muted);margin:2px 0 4px}
.steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;background:var(--bg);padding-block:8px;scrollbar-width:none}
.steps a{flex:0 0 auto;text-decoration:none;color:var(--ink);background:var(--leaf-tint);border-radius:999px;padding:4px 12px;font-size:14px}
.steps a b{font-family:var(--display);color:var(--leaf);margin-right:4px}
.step{margin:22px 0;scroll-margin-top:58px}
.step>h3{font-family:var(--display);font-size:24px;margin:0 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step>h3 em{font-style:normal;font-family:var(--body);font-size:15px;color:var(--muted);font-weight:400}
.sn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:16px}
.howto{font-size:15px;color:var(--muted);margin:0 0 10px;max-width:70ch}
/* reading desk */
.desk{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin:0 0 22px;align-items:start}
.leftcol{position:sticky;top:58px;min-width:0}
.ptext{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:12px 16px;font-size:18px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}
.ptext.tapping{border-color:var(--yellow);box-shadow:0 0 0 4px var(--hl)}
.plabel{font-family:var(--display);color:var(--leaf);font-weight:800;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
.plabel small{font-family:var(--body);font-weight:400;color:var(--muted)}
.w{cursor:pointer;border-radius:4px}
.w:hover{background:var(--hl)}
.u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;font-weight:700}
.vs{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;font-weight:700}
.vr{border-bottom:2px dotted var(--muted)}
.cn{border:2px solid var(--red);border-radius:5px;padding:0 3px}
.readbtn{font:inherit;font-size:13px;font-weight:700;color:var(--leaf);background:var(--leaf-tint);border:0;border-radius:999px;padding:2px 12px;cursor:pointer}
.readbtn.on{background:var(--leaf);color:var(--paper)}
.w.reading{background:var(--hl);box-shadow:0 2px 0 var(--yellow)}
.w.sel{background:var(--leaf-tint);color:var(--leaf)}
.w.found{background:var(--ok-bg);color:var(--ok)}
.ptext.sentmode .w{border-radius:0}.w.hov{background:var(--hl)}
.w.miss{background:var(--no-bg);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.tapbar{margin-top:8px;background:var(--hl);border-radius:10px;padding:6px 12px;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.tapbar button{font:inherit;font-size:14px;background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer}
.panel{min-width:0;display:grid;gap:10px}
.wordbox{background:var(--paper);border:1.5px solid var(--leaf);border-radius:14px;padding:10px 14px}
.wordbox.empty{border-style:dashed;color:var(--muted);font-size:15px}
.wb-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wb-w{font-family:var(--display);font-size:24px;color:var(--leaf);line-height:1.1}
.wb-pos{color:var(--muted);font-size:14px}
.say{margin-left:auto;font:inherit;font-size:13px;color:var(--leaf);background:var(--leaf-tint);border:0;border-radius:999px;padding:2px 10px;cursor:pointer}
.wb-zh{font-weight:700;margin-top:2px}
.wb-en{color:var(--muted);font-size:15px}
.wb-grow{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:15px}
.wb-grow b{color:var(--leaf)}
.wb-grow .gl{display:block;font-size:12px;letter-spacing:.06em;color:var(--leaf);font-weight:700}
.q{background:var(--panel);border-radius:12px;padding:10px 12px;border:1.5px solid transparent}
.q.active{border-color:var(--yellow)}
.q.done{border-color:var(--ok)}
.qh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.tag{font-size:12px;font-weight:700;letter-spacing:.05em;border-left:4px solid currentColor;padding:1px 8px;border-radius:0 6px 6px 0;background:var(--paper)}
.t-L{color:var(--t-L)}.t-W{color:var(--t-W)}.t-T{color:var(--t-T)}.t-R{color:var(--t-R)}.t-E{color:var(--t-E)}
.qn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:13px}
.qstate{margin-left:auto;font-size:13px;font-weight:700}
.q.done .qstate{color:var(--ok)}
.qp{font-size:16px}
.og{display:inline-flex;flex-wrap:wrap;gap:6px;vertical-align:middle;border:1.5px dashed var(--line);border-radius:14px;padding:4px 6px;margin:2px 0}
.og .opt{margin:0}
.og.vert{display:grid;gap:4px;margin-top:6px;width:100%}
.pair{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:6px 0}
.pair .pl{flex:1 1 200px;min-width:0}
.pair .og{flex:0 1 auto;max-width:100%}
.pair+.pair{border-top:1px dotted var(--line)}
.pl{font-weight:700}
.pl::after{content:"　→ 選一個";font-weight:400;font-size:13px;color:var(--muted)}
.ptail{margin-top:4px}
@media (max-width:560px){.pair .pl{flex-basis:100%}}
.opt{font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:3px 12px;margin:4px 6px 0 0;cursor:pointer;text-align:left;line-height:1.4}
.og.vert .opt,.choice .opt{border-radius:10px;margin:0;width:100%}
.opt:hover{border-color:var(--leaf)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--no);background:var(--no-bg);color:var(--no);text-decoration:line-through}
.opt[disabled]{cursor:default}
.choice{display:grid;gap:6px;margin-top:8px}
.slot{display:inline-block;min-width:2.4em;text-align:center;border-bottom:2px solid var(--ink);padding:0 4px;color:var(--muted)}
.slot.got{color:var(--ok);font-weight:700;border-color:var(--ok)}
.tapbtn,.revealbtn{font:inherit;font-size:14px;font-weight:700;color:var(--ink);background:var(--hl);border:1.5px solid var(--yellow);border-radius:999px;padding:3px 12px;margin-top:8px;cursor:pointer}
.ansline{margin-top:6px;font-size:14px;color:var(--ok)}
.ansline b{margin-right:6px}
.labs{background:var(--paper);border-radius:12px;padding:8px 12px;border:1.5px solid var(--line)}
.labs p{margin:0 0 4px;font-weight:700}
.lab{border-left:5px solid var(--line);border-radius:0 8px 8px 0;padding:4px 10px;margin:6px 0;font-size:15px}
.lab b{display:block;font-size:12px;letter-spacing:.05em}
.lab.green{border-color:var(--t-W)}.lab.green b{color:var(--t-W)}
.lab.orange{border-color:var(--t-L)}.lab.orange b{color:var(--t-L)}
.lab.purple{border-color:var(--t-T)}.lab.purple b{color:var(--t-T)}
.locked{font-size:14px;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px;padding:8px 12px}
.article{margin:0 0 16px;padding:10px 16px;border-radius:12px;background:var(--leaf);color:var(--paper);font-family:var(--display);font-size:22px;font-weight:800;line-height:1.2}
.article span{display:block;font-family:var(--body);font-size:13px;font-weight:400;opacity:.85}
.subhead{font-family:var(--display);font-size:20px;font-weight:800;color:var(--leaf);border-bottom:2px solid var(--leaf-tint);margin:0 0 12px}
.brk{border:2px dashed var(--leaf);color:var(--leaf);text-align:center;border-radius:10px;padding:8px;margin:0 0 22px;font-weight:700}
.mc{display:grid;gap:6px}
.mc .opt{border-radius:10px;margin:0;display:flex;gap:8px;width:100%}
.wl{display:inline-grid;place-items:center;flex:0 0 22px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--leaf);color:var(--leaf);font-size:13px;font-weight:700}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.qz>b{display:block;font-family:var(--display);font-size:20px;margin-bottom:4px}
.score{font-size:18px;margin-top:12px}.score b{color:var(--leaf);font-size:24px;font-family:var(--display)}
.talk{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.talk label{display:flex;gap:8px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.talk input{width:20px;height:20px;accent-color:var(--leaf);margin-top:3px}
details.ex{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;margin-top:10px}
details.ex summary{cursor:pointer;font-weight:700;color:var(--leaf)}
.unext{margin:26px 0 0;text-align:right}
.btn{font:inherit;font-weight:700;color:var(--paper);background:var(--leaf);border:0;border-radius:999px;padding:8px 18px;cursor:pointer;text-decoration:none;display:inline-block}
.foot{font-size:13px;color:var(--muted)}
.reset{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,.w:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
@media (max-width:760px){.desk{grid-template-columns:1fr}.leftcol{position:static}.ptext{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* thinking tools & concept charts: tap a card, then tap the slot it belongs in */
.board [hidden]{display:none!important}
.board{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
.board.done{border-color:var(--ok)}
.board h4{font-family:var(--display);color:var(--leaf);margin:0 0 2px;font-size:19px}
.board .bhow{font-size:15px;color:var(--muted);margin:0 0 8px}
.tbwrap{overflow-x:auto}
.tb{border-collapse:collapse;width:100%;font-size:15px}
.tb th{background:var(--leaf-tint);text-align:left;padding:6px 8px;border:1px solid var(--line);font-weight:700}
.tb td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.tb td.auto{color:var(--ink)}
.tb td.auto.lock{color:var(--muted);font-size:13px;font-style:italic}
.drop{display:block;width:100%;min-height:40px;border:2px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);
  font:inherit;font-size:14px;cursor:pointer;padding:6px 8px;text-align:left}
.drop:hover,.board.picking .drop:not(.filled){border-color:var(--leaf);color:var(--leaf)}
.drop.filled{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ink);cursor:default}
.drop.no{border-color:var(--no);background:var(--no-bg);animation:shake .3s}
.tline{line-height:2.4;margin:4px 0}
.tline .drop{display:inline-block;width:auto;min-width:96px;min-height:0;padding:2px 10px;vertical-align:middle;margin:0 4px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.bin{border:1.5px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.bin h5{margin:0;font-size:15px;color:var(--leaf)}
.bin .chip{background:var(--ok-bg);border:1.5px solid var(--ok);border-radius:10px;padding:4px 8px;font-size:14px}
.bin .drop{min-height:44px;text-align:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding:10px 0 6px;border-top:1px dotted var(--line);
  position:sticky;bottom:0;z-index:2;background:var(--paper);max-height:42vh;overflow-y:auto}
.board.done .bank{position:static}
.bank::before{content:"卡片：先點一張，再點要放的格子";flex-basis:100%;font-size:13px;color:var(--muted)}
.card{font:inherit;font-size:14px;text-align:left;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;
  padding:6px 10px;cursor:pointer;max-width:100%}
.card.picked{border-color:var(--leaf);background:var(--leaf-tint);box-shadow:0 0 0 2px var(--leaf)}
.card.wrong{animation:shake .3s;border-color:var(--no)}
.card.extra{opacity:.45;text-decoration:line-through;cursor:default}
.bdone{display:none;margin:8px 0 0;color:var(--ok);font-weight:700}
.board.done .bdone{display:block}
.board.done .bank::before{content:"劃掉的卡是用不到的"}
.utab.sum b{color:var(--t-T)}
.utab.rev b{color:var(--t-R)}
.utab.skl b{color:var(--t-L)}
.secthead{font-family:var(--display);font-size:22px;color:var(--leaf);margin:26px 0 4px;border-bottom:2px solid var(--leaf-tint)}
.secthead span{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:400;margin-left:8px}
.paraout{display:none;margin:10px 0 0;padding:10px 12px;border-left:4px solid var(--ok);background:var(--ok-bg);border-radius:8px}
.board.done .paraout{display:block}
.paraout p{margin:0 0 6px}
.model{font-size:15px;background:var(--panel);border-radius:10px;padding:8px 10px;margin:0 0 8px}
.stars{font-size:22px;letter-spacing:2px;color:var(--yellow)}
.stars .off{color:var(--line)}
.gres{display:none;margin:8px 0 0;padding:8px 10px;border-radius:10px;background:var(--leaf-tint)}
.board.done .gres{display:block}
.board.game.done .bdone{display:none}
.gres .weak,.scoreboard .weak{color:var(--no);font-weight:700}
.again{font:inherit;font-size:14px;margin-left:8px;border:1.5px solid var(--leaf);color:var(--leaf);background:var(--paper);border-radius:999px;padding:3px 12px;cursor:pointer}
.scoreboard{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
.scoreboard b.big{font-family:var(--display);font-size:22px;color:var(--leaf)}
.tline .num{color:var(--muted)}
@media (max-width:560px){
  .tb tr:first-child{display:none}
  .tb,.tb tbody,.tb tr,.tb td{display:block;width:100%}
  .tb tr{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:4px 2px}
  .tb td{border:0;padding:4px 6px}
  .tb td[data-h]:not([data-h=""])::before{content:attr(data-h);display:block;font-size:12px;color:var(--muted);font-weight:700}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <p style="margin:12px 0 8px"><a href="../" style="color:var(--leaf);font-weight:700;text-decoration:none">← 回到 KCIS G4 Vocabulary</a></p>
    <div class="band"></div>
    <small>myView Literacy · Grade 4 · Week 5 · 第一篇</small>
    <h1>The Weird and Wonderful Echidna</h1>
    <p>點文章裡的字，右邊會出現意思和字族。每一題都用點的，點完馬上知道對不對。</p>
    <nav class="tabs" id="tabs" aria-label="Units"></nav>
    <div class="legend"><span><b style="text-decoration:underline;text-underline-offset:3px">粗體底線</b>＝要會的字（點了有意思、字族、發音）</span><span><span class="cn">紅框</span>＝連接字</span><span><span class="k-rec">灰色點線</span>＝認得就好（點了有意思）</span></div>
  </header>
  <main id="main"></main>

<script>const DATA={"units": [{"n": 1, "title": "Echidna 1｜What Kind of Animal?", "range": "Echidna §1–4", "cards": [{"kind": "article", "text": "The Weird and Wonderful Echidna", "sub": "第一篇｜by Mike Jung"}, {"id": "e1", "kind": "para", "label": "Paragraph 1", "text": "Australia is home to some of the most unique animals on Earth. Kangaroos and koalas live here. A giant bird called the emu does too. Of all the creatures that live in Australia, the echidna is one of the strangest. This small creature makes its home in Australia and also on the island of New Guinea.", "u": [[38, 44], [144, 153], [226, 234]], "conn": [], "vocab": [[0, 9, "r1-0"], [38, 44, "v1-0"], [63, 72, "r1-6"], [77, 83, "r1-6"], [119, 122, "r1-3"], [144, 153, "v9-12"], [167, 176, "r1-0"], [182, 189, "r1-2"], [226, 234, "v9-12"], [253, 262, "r1-0"], [289, 299, "r1-1"]], "qs": [{"id": "e1-3", "tag": "T", "label": "THINKING", "ans": "介紹主題：echidna 是澳洲最奇特的動物之一", "tap": [], "choice": null, "groups": 1, "prompt": "第一段的作用是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">介紹主題：echidna 是澳洲最奇特的動物之一<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">說明 echidna 吃什麼<\/button><\/span>"}, {"id": "e1-4", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ [Australia]　[New Guinea]", "tap": ["Australia", "New Guinea"], "choice": null, "groups": 0, "prompt": "在文章裡點出兩個地名 [ ]。"}], "labs": []}, {"id": "e2", "kind": "para", "label": "Paragraph 2", "text": "The echidna is also known by its common name, the spiny anteater. The name describes two of the echidna's amazing traits. All echidnas have spines. Some eat ants. But those are only two of the traits of this strange and wonderful creature.", "u": [[230, 238]], "conn": [[163, 166]], "vocab": [[4, 11, "r1-2"], [50, 55, "v1-2"], [56, 64, "r1-4"], [96, 103, "r1-2"], [114, 120, "v1-3"], [126, 133, "r1-2"], [140, 146, "v1-4"], [193, 199, "v1-3"], [230, 238, "v9-12"]], "qs": [{"id": "e2-1", "tag": "W", "label": "WORD", "ans": "① have spines（有刺）　② eat ants（吃螞蟻）", "tap": ["have spines", "eat ants"], "choice": null, "groups": 0, "prompt": "<b>spiny anteater<\/b> 這個名字說出 echidna 的哪兩個 traits？① All echidnas <span class=\"slot\" data-s=\"0\">？<\/span> ② Some <span class=\"slot\" data-s=\"1\">？<\/span>"}, {"id": "e2-3", "tag": "T", "label": "THINKING", "ans": "後面還會介紹更多特徵", "tap": [], "choice": null, "groups": 1, "prompt": "<b>But those are only two of the traits<\/b>：作者在暗示 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">後面還會介紹更多特徵<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">echidna 只有兩個特徵<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "unique / creatures / spiny / traits / spines；spine → spiny"], ["purple", "THINKING LAB", "開頭先介紹主題（echidna），再用名字 spiny anteater 預告兩個特徵：有刺、吃螞蟻。"]], "group": ["e1", "e2"]}, {"id": "e3", "kind": "para", "label": "Paragraph 3", "text": "If you met an echidna, you might have a hard time figuring out what kind of animal it is. To begin with, the echidna has a beak. But it doesn't have feathers and it doesn't fly, so it's not a bird. The echidna lays soft eggs like a snake does, but the echidna is not a reptile. The echidna is a mammal.", "u": [[295, 301]], "conn": [[0, 2], [178, 180]], "vocab": [[14, 21, "r1-2"], [50, 62, "v1-5"], [109, 116, "r1-2"], [123, 127, "v1-6"], [149, 157, "r1-7"], [202, 209, "r1-2"], [252, 259, "r1-2"], [269, 276, "v1-7"], [282, 289, "r1-2"], [295, 301, "v6-9"]], "qs": [{"id": "e3-3", "tag": "T", "label": "THINKING", "ans": "a beak；soft eggs；a mammal", "tap": ["a beak", "soft eggs", "a mammal"], "choice": null, "groups": 0, "prompt": "echidna 有 <span class=\"slot\" data-s=\"0\">？<\/span>，像鳥；會生 <span class=\"slot\" data-s=\"1\">？<\/span>，像蛇；但牠其實是 <span class=\"slot\" data-s=\"2\">？<\/span>。"}, {"id": "e3-4", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ The echidna is a mammal.", "tap": ["The echidna is a mammal"], "choice": null, "groups": 0, "mode": "sentence", "prompt": "畫出：這一段的答案句（echidna 到底是什麼動物）。"}], "labs": []}, {"id": "e4", "kind": "para", "label": "Paragraph 4", "text": "The echidna belongs to a group of mammals known as monotremes. They are the only mammals on Earth that lay eggs. There are only two kinds of monotremes. One is the echidna, and the other is the platypus. Monotremes have lived on Earth longer than any other mammals. Several adaptations have helped them to thrive.", "u": [[34, 41], [51, 61], [81, 88], [141, 151], [153, 156], [177, 186], [204, 214], [257, 264], [274, 285]], "conn": [], "vocab": [[4, 11, "r1-2"], [34, 41, "v6-9"], [51, 61, "v1-11"], [81, 88, "v6-9"], [141, 151, "v1-11"], [164, 171, "r1-2"], [194, 202, "r1-5"], [204, 214, "v1-11"], [257, 264, "v6-9"], [274, 285, "v6-7"], [306, 312, "v1-10"]], "qs": [{"id": "e4-1", "tag": "W", "label": "WORD", "ans": "lay eggs（會生蛋的哺乳類）", "tap": ["lay eggs"], "choice": null, "groups": 0, "prompt": "<b>monotremes<\/b> 的定義在下一句：They are the only mammals on Earth that <span class=\"slot\" data-s=\"0\">？<\/span>"}, {"id": "e4-4", "tag": "T", "label": "THINKING", "ans": "echidna 的各種 adaptations", "tap": [], "choice": null, "groups": 1, "prompt": "最後一句 Several adaptations have helped them to thrive：作者接下來會寫 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">echidna 的各種 adaptations<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">echidna 的家人<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "beak / reptile / mammal / monotremes / adaptations / thrive"], ["purple", "THINKING LAB", "作者用「像…但不是…」一步步排除：不是鳥、不是爬蟲類，而是會生蛋的哺乳類 monotreme。"]], "group": ["e3", "e4"]}], "gist": {"opts": ["The echidna is a kind of bird that cannot fly.", "The echidna is a strange egg-laying mammal from Australia, and its adaptations help it thrive.", "Kangaroos and koalas are the most unique animals in Australia."], "ok": 1}, "quiz": [{"w": "unique", "opts": ["to grow strong and do very well", "being the only one of its kind", "living things, especially animals"], "ok": 1}, {"w": "creatures", "opts": ["living things, especially animals", "being the only one of its kind", "to grow strong and do very well"], "ok": 0}, {"w": "spiny", "opts": ["thinking about something until you understand it", "an animal with hair or fur that feeds its babies milk", "covered with sharp spines"], "ok": 2}, {"w": "traits", "opts": ["being the only one of its kind", "special qualities of an animal or a person", "body parts or ways of acting that help an animal live in its home"], "ok": 1}, {"w": "spines", "opts": ["living things, especially animals", "special qualities of an animal or a person", "sharp, pointed parts that stick out of an animal's body"], "ok": 2}, {"w": "figuring out", "opts": ["thinking about something until you understand it", "an animal with dry, scaly skin, like a snake or a turtle", "being the only one of its kind"], "ok": 0}, {"w": "beak", "opts": ["an animal with dry, scaly skin, like a snake or a turtle", "the hard, pointed mouth of a bird", "mammals that lay eggs, like the echidna and the platypus"], "ok": 1}, {"w": "reptile", "opts": ["an animal with hair or fur that feeds its babies milk", "covered with sharp spines", "an animal with dry, scaly skin, like a snake or a turtle"], "ok": 2}, {"w": "mammal", "opts": ["an animal with hair or fur that feeds its babies milk", "thinking about something until you understand it", "mammals that lay eggs, like the echidna and the platypus"], "ok": 0}, {"w": "adaptations", "opts": ["special qualities of an animal or a person", "an animal with dry, scaly skin, like a snake or a turtle", "body parts or ways of acting that help an animal live in its home"], "ok": 2}, {"w": "thrive", "opts": ["body parts or ways of acting that help an animal live in its home", "to grow strong and do very well", "being the only one of its kind"], "ok": 1}, {"w": "monotremes", "opts": ["covered with sharp spines", "mammals that lay eggs, like the echidna and the platypus", "special qualities of an animal or a person"], "ok": 1}], "say": "The echidna is not a bird because it has no feathers and cannot fly.", "pause": ["echidna 是什麼動物：有 beak 但不是鳥，會生蛋但不是爬蟲類，是會生蛋的哺乳類（monotreme）。", "beak、spines、soft eggs；和 platypus 一樣是 monotreme。"], "tools": [{"id": "t1a", "title": "分類偵探：echidna 是什麼動物？", "how": "echidna 有些地方像別的動物，但其實不是。從原文找證據。", "layout": "table", "head": ["Feature", "看起來像…", "但是…", "§"], "rows": [["has a beak", {"s": "a1"}, {"s": "b1"}, {"s": "c1"}], ["lays soft eggs", {"s": "a2"}, {"s": "b2"}, {"s": "c2"}]], "cards": [{"t": "it has no feathers and does not fly", "s": "b1", "w": null}, {"t": "§3", "s": "c2", "w": null}, {"t": "§3", "s": "c1", "w": null}, {"t": "§9", "s": null, "w": null}, {"t": "a snake (a reptile)", "s": "a2", "w": null}, {"t": "a bird", "s": "a1", "w": null}, {"t": "it is not a reptile", "s": "b2", "w": null}]}, {"id": "t1b", "title": "結論", "how": "把三張卡放進句子裡。", "layout": "line", "rows": [["The echidna is a", {"s": "x1"}, ". It belongs to a group called", {"s": "x2"}, ", the only mammals that", {"s": "x3"}, "."]], "cards": [{"t": "lay eggs", "s": "x3", "w": null}, {"t": "mammal", "s": "x1", "w": null}, {"t": "monotremes", "s": "x2", "w": null}, {"t": "can fly", "s": null, "w": null}, {"t": "reptile", "s": null, "w": null}]}], "disp": 1}, {"n": 2, "title": "Echidna 2｜An Amazing Beak", "range": "Echidna §5–9 ＋ 圖說", "cards": [{"id": "e5", "kind": "para", "label": "Paragraph 5", "text": "The echidna's beak is a rare feature among mammals. It's also a fabulously adapted tool for finding food. Echidnas live in forested areas and feed on insects, worms, and other tiny creatures.", "u": [[24, 28], [43, 50], [181, 190]], "conn": [], "vocab": [[24, 28, "v2-0"], [29, 36, "v2-1"], [43, 50, "v1-8"], [64, 74, "r2-0"], [75, 82, "v2-2"], [142, 149, "v2-3"], [150, 157, "r2-2"], [159, 164, "r2-2"], [181, 190, "v1-1"]], "qs": [{"id": "e5-1", "tag": "W", "label": "WORD", "ans": "很少見；沒有 beak", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\">The echidna's beak is a <b>rare<\/b> feature among mammals：rare 是<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">很少見<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很常見<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">因為大部分 mammals<\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">沒有 beak<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">都有 beak<\/button><\/span><\/div>"}, {"id": "e5-3", "tag": "W", "label": "WORD", "ans": "以…為食", "tap": [], "choice": null, "groups": 1, "prompt": "Echidnas … <b>feed on<\/b> insects, worms, and other tiny creatures：feed on = <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">以…為食<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">餵別人<\/button><\/span>"}], "labs": []}, {"id": "e6", "kind": "para", "label": "Paragraph 6", "text": "An echidna's beak is long and pointy. However, the beak doesn't have two halves that open, like a bird's beak. Instead, the echidna uses its beak as a digging tool. It pokes and prods to find its prey. The echidna's beak is tough. In fact, it's strong enough to break open a rotten log or dig into the soil in search of a tasty meal.", "u": [], "conn": [[38, 45], [111, 118], [231, 238]], "vocab": [[30, 36, "v2-4"], [168, 183, "r2-1"], [196, 200, "v2-5"], [224, 229, "v2-6"], [275, 281, "v2-7"], [302, 306, "v2-8"]], "qs": [{"id": "e6-4", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ long；pointy；tough", "tap": ["long", "pointy", "tough"], "choice": null, "groups": 0, "prompt": "畫出：描寫 beak 樣子的三個形容詞。"}], "labs": [["green", "WORD LINKS", "rare / feature / adapted / feed on / pointy / prey / tough / rotten / soil"], ["purple", "THINKING LAB", "這兩段都在描述 beak：它很少見，像一把挖掘工具，用來找食物。"]], "group": ["e5", "e6"]}, {"id": "e7", "kind": "para", "label": "Paragraph 7", "text": "The most amazing thing about the echidna's beak is something you can't see. The beak has sensors inside it. The sensors detect electrical signals given off by living creatures. That means an echidna can locate prey without seeing, hearing, or touching it. It's a kind of mammal superpower!", "u": [[89, 96], [112, 119], [166, 175], [271, 277]], "conn": [[177, 187]], "vocab": [[89, 96, "v8-9"], [112, 119, "v8-9"], [120, 126, "v2-10"], [127, 145, "v2-11"], [146, 155, "v2-12"], [166, 175, "v1-1"], [203, 209, "v2-13"], [210, 214, "v2-5"], [271, 277, "v1-8"], [278, 288, "r2-3"]], "qs": [{"id": "e7-1", "tag": "W", "label": "WORD", "ans": "偵測到", "tap": [], "choice": null, "groups": 1, "prompt": "The sensors <b>detect<\/b> electrical signals：detect = <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">偵測到<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">製造<\/button><\/span>"}, {"id": "e7-4", "tag": "R", "label": "WRITER", "ans": "很厲害、很有趣", "tap": [], "choice": null, "groups": 1, "prompt": "It's a kind of mammal <b>superpower<\/b>!：作者用 superpower，是想讓讀者覺得 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">很厲害、很有趣<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很可怕<\/button><\/span>"}, {"id": "e7-5", "tag": "T", "label": "THINKING", "ans": "beak 裡面有 sensors", "tap": [], "choice": null, "groups": 1, "prompt": "這段是 description：作者先說 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">beak 裡面有 sensors<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">echidna 住在哪裡<\/button><\/span>，再說 sensors 能做什麼。"}], "labs": []}, {"id": "ecap", "kind": "cap", "label": "圖說 Caption", "text": "The three species of long-beaked echidna are found exclusively on the island of New Guinea.", "u": [], "conn": [], "vocab": [[10, 17, "v2-14"], [21, 32, "r2-4"], [51, 62, "v2-15"]], "qs": [{"id": "ecap-1", "tag": "W", "label": "WORD", "ans": "只在新幾內亞", "tap": [], "choice": null, "groups": 1, "prompt": "found <b>exclusively<\/b> on the island of New Guinea：意思是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">只在新幾內亞<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">新幾內亞和澳洲都有<\/button><\/span>"}, {"id": "ecap-2", "tag": "R", "label": "WRITER", "ans": "§9", "tap": [], "choice": {"opts": ["9", "5", "7"], "ok": 0}, "groups": 0, "prompt": "這段圖說和第 <span class=\"slot\">？<\/span> 段的最後一句一模一樣。"}], "labs": [["green", "WORD LINKS", "sensors / detect / electrical signals / given off / locate；species / exclusively"], ["purple", "THINKING LAB", "課本的 description 範例：先介紹特徵（sensors），再說明作用（不用看、聽、摸就能找到獵物）。"]], "group": ["e7", "ecap"]}, {"id": "e8", "kind": "para", "label": "Paragraph 8", "text": "An echidna's mouth is small, and it has no teeth. The echidna uses its beak to crush a worm or insect into tiny pieces. Then it takes the pieces into its mouth and swallows them.", "u": [], "conn": [[120, 124]], "vocab": [[79, 84, "v2-16"], [164, 172, "v2-17"]], "qs": [{"id": "e8-1", "tag": "T", "label": "THINKING", "ans": "small；has no teeth（沒有牙齒）", "tap": ["small", "has no teeth"], "choice": null, "groups": 0, "prompt": "為什麼 echidna 要先用 beak 把蟲壓碎？因為牠的嘴 <span class=\"slot\" data-s=\"0\">？<\/span>，而且 <span class=\"slot\" data-s=\"1\">？<\/span>。"}, {"id": "e8-3", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ ① crush a worm or insect into tiny pieces　② take the pieces into its mouth　③ swallow them", "tap": [], "choice": {"opts": ["① swallow it → ② crush it → ③ take it into its mouth", "① take it into its mouth → ② chew it with its teeth → ③ swallow it", "① crush it into tiny pieces → ② take the pieces into its mouth → ③ swallow them"], "ok": 2}, "groups": 0, "prompt": "用 ① ② ③ 在原文標出 echidna 吃東西的三個步驟。"}], "labs": []}, {"id": "e9", "kind": "para", "label": "Paragraph 9", "text": "Scientists classify echidnas according to beak length. There are short-beaked echidnas and long-beaked echidnas. The one species of short-beaked echidna lives throughout Australia and on New Guinea. The three species of long-beaked echidna are found exclusively on the island of New Guinea.", "u": [], "conn": [], "vocab": [[11, 19, "v2-18"], [29, 41, "v2-19"], [65, 77, "r2-4"], [91, 102, "r2-4"], [121, 128, "v2-14"], [132, 144, "r2-4"], [159, 169, "v2-20"], [209, 216, "v2-14"], [220, 231, "r2-4"], [250, 261, "v2-15"]], "qs": [{"id": "e9-1", "tag": "W", "label": "WORD", "ans": "beak length（嘴的長度）", "tap": ["beak length"], "choice": null, "groups": 0, "prompt": "Scientists <b>classify<\/b> echidnas <b>according to<\/b> beak length：科學家用什麼來分類？<span class=\"slot\" data-s=\"0\">？<\/span>"}, {"id": "e9-2", "tag": "T", "label": "THINKING", "ans": "1 種；3 種", "tap": [], "choice": {"opts": ["2；2", "3；1", "1；3"], "ok": 2}, "groups": 0, "prompt": "short-beaked echidna 有 <span class=\"slot\">？<\/span> 種；long-beaked echidna 有 <span class=\"slot\">？<\/span> 種。"}, {"id": "e9-3", "tag": "T", "label": "THINKING", "ans": "long-beaked echidnas", "tap": [], "choice": null, "groups": 1, "prompt": "哪一種只住在 New Guinea？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">long-beaked echidnas<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">short-beaked echidnas<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "crush / swallows / classify / according to / throughout"], ["purple", "THINKING LAB", "§8 是步驟（sequence），§9 是分類（classification）：資訊文常用這兩種方法整理資訊。"]], "group": ["e8", "e9"]}], "gist": {"opts": ["The echidna's tough beak is a digging tool, and the sensors inside it help the echidna find food.", "The echidna uses sharp teeth to eat insects.", "There is only one kind of echidna in the world."], "ok": 0}, "quiz": [{"w": "rare", "opts": ["makes food go down the throat", "not common; not often found", "a group of the same kind of animals or plants"], "ok": 1}, {"w": "feature", "opts": ["to notice or find something", "strong and hard to break", "an important part or quality of something"], "ok": 2}, {"w": "adapted", "opts": ["changed to be just right for a job or a place", "not common; not often found", "having a sharp end"], "ok": 0}, {"w": "feed on", "opts": ["a group of the same kind of animals or plants", "parts that notice things like heat, light, or movement", "to eat as food"], "ok": 2}, {"w": "pointy", "opts": ["an animal that is hunted for food", "to find where something is", "having a sharp end"], "ok": 2}, {"w": "prey", "opts": ["old and going bad", "an animal that is hunted for food", "having a sharp end"], "ok": 1}, {"w": "tough", "opts": ["to put things into groups", "strong and hard to break", "tiny bits of electricity that living things give off"], "ok": 1}, {"w": "rotten", "opts": ["old and going bad", "a group of the same kind of animals or plants", "to notice or find something"], "ok": 0}, {"w": "soil", "opts": ["in every part of a place", "having a sharp end", "the top layer of earth where plants grow"], "ok": 2}, {"w": "sensors", "opts": ["parts that notice things like heat, light, or movement", "tiny bits of electricity that living things give off", "makes food go down the throat"], "ok": 0}, {"w": "detect", "opts": ["to notice or find something", "based on", "sent out, like light, heat, or a smell"], "ok": 0}, {"w": "electrical signals", "opts": ["tiny bits of electricity that living things give off", "an important part or quality of something", "to press hard and break into small pieces"], "ok": 0}, {"w": "given off", "opts": ["old and going bad", "sent out, like light, heat, or a smell", "to find where something is"], "ok": 1}, {"w": "locate", "opts": ["to find where something is", "old and going bad", "makes food go down the throat"], "ok": 0}, {"w": "species", "opts": ["a group of the same kind of animals or plants", "the top layer of earth where plants grow", "changed to be just right for a job or a place"], "ok": 0}, {"w": "exclusively", "opts": ["to put things into groups", "in every part of a place", "only in one place or for one thing"], "ok": 2}, {"w": "crush", "opts": ["the top layer of earth where plants grow", "to press hard and break into small pieces", "parts that notice things like heat, light, or movement"], "ok": 1}, {"w": "swallows", "opts": ["makes food go down the throat", "to notice or find something", "an animal that is hunted for food"], "ok": 0}, {"w": "classify", "opts": ["to put things into groups", "not common; not often found", "to notice or find something"], "ok": 0}, {"w": "according to", "opts": ["not common; not often found", "a group of the same kind of animals or plants", "based on"], "ok": 2}, {"w": "throughout", "opts": ["an important part or quality of something", "only in one place or for one thing", "in every part of a place"], "ok": 2}], "say": "The echidna can find prey without seeing it because its beak has sensors.", "pause": ["echidna 的 beak：很少見，像挖掘工具，裡面有 sensors，不用看就能找到獵物。", "breaking open rotten logs、digging into the soil、sensors、crushing food。"], "tools": [{"id": "t2a", "title": "描述網：echidna 的 beak", "how": "把 §5–9 的資訊整理起來，每一格配一個段號。", "layout": "table", "head": ["Question", "Answer", "§"], "rows": [["What does the beak look like?", {"s": "a1"}, {"s": "p1"}], ["What is the beak used for?", {"s": "a2"}, {"s": "p2"}], ["What is inside the beak?", {"s": "a3"}, {"s": "p3"}], ["How does the echidna eat?", {"s": "a4"}, {"s": "p4"}]], "cards": [{"t": "§6", "s": "p1", "w": null}, {"t": "sensors that detect electrical signals", "s": "a3", "w": null}, {"t": "§5–6", "s": "p2", "w": null}, {"t": "it crushes food with its beak, then swallows the pieces (no teeth)", "s": "a4", "w": null}, {"t": "long, pointy, and tough; it does not open in two halves", "s": "a1", "w": null}, {"t": "§7", "s": "p3", "w": null}, {"t": "§8", "s": "p4", "w": null}, {"t": "digging: breaking open rotten logs and digging into the soil to find prey", "s": "a2", "w": null}]}, {"id": "t2b", "title": "Cause → Effect", "how": "把兩張卡放進句子裡。", "layout": "line", "rows": [["Because the beak has", {"s": "x1"}, ", the echidna can", {"s": "x2"}, "."]], "cards": [{"t": "sensors", "s": "x1", "w": null}, {"t": "sharp teeth", "s": null, "w": null}, {"t": "fly away from predators", "s": null, "w": null}, {"t": "locate prey without seeing, hearing, or touching it", "s": "x2", "w": null}]}], "disp": 2}, {"n": 3, "title": "Echidna 3｜Spines and Fur", "range": "Echidna §10–13", "cards": [{"id": "e10", "kind": "para", "label": "Paragraph 10", "text": "If you were to see an echidna in person, the first thing you might notice is its coat of spines. The spines are short and hollow. They are made of keratin, the same material that makes up your hair and fingernails.", "u": [], "conn": [], "vocab": [[122, 128, "v3-0"], [147, 154, "r3-0"], [165, 173, "v3-1"], [179, 187, "v3-2"], [202, 213, "r3-3"]], "qs": [{"id": "e10-1", "tag": "R", "label": "WRITER", "ans": "像外套一樣蓋滿全身", "tap": [], "choice": null, "groups": 1, "prompt": "its <b>coat<\/b> of spines：coat 在這裡是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">像外套一樣蓋滿全身<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">真的外套<\/button><\/span>"}, {"id": "e10-2", "tag": "W", "label": "WORD", "ans": "中空的", "tap": [], "choice": null, "groups": 1, "prompt": "The spines are short and <b>hollow<\/b>：hollow = <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">中空的<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很重的<\/button><\/span>"}, {"id": "e10-4", "tag": "T", "label": "THINKING", "ans": "用讀者熟悉的東西，讓 keratin 容易懂", "tap": [], "choice": null, "groups": 1, "prompt": "作者為什麼提到 your hair and fingernails？<span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">用讀者熟悉的東西，讓 keratin 容易懂<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">說明人也有刺<\/button><\/span>"}], "labs": []}, {"id": "e11", "kind": "para", "label": "Paragraph 11", "text": "An echidna's spines are like a coat of armor. They protect the echidna from predators such as the dingo, a kind of wild dog. When a predator approaches, an echidna rolls itself up into a ball. The ball appears to be nothing but spines. Predators usually think twice before chomping down.", "u": [], "conn": [[24, 28], [86, 93], [125, 129]], "vocab": [[39, 44, "v3-3"], [76, 85, "v3-4"], [98, 103, "r3-1"], [141, 151, "v3-5"], [236, 245, "v3-4"], [254, 265, "v3-6"], [273, 286, "r3-2"]], "qs": [{"id": "e11-1", "tag": "R", "label": "WRITER", "ans": "比喻（simile）；保護", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\">spines are <b>like a coat of armor<\/b>：這是<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">比喻（simile）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">事實<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">armor 的作用是<\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">保護<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">裝飾<\/button><\/span><\/div>"}, {"id": "e11-4", "tag": "W", "label": "WORD", "ans": "猶豫要不要咬", "tap": [], "choice": null, "groups": 1, "prompt": "Predators usually <b>think twice<\/b> before chomping down：掠食者會 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">猶豫要不要咬<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">馬上咬下去<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "hollow / material / makes up / armor / predators / approaches / think twice"], ["purple", "THINKING LAB", "spines 的第一個作用像盔甲：掠食者靠近 → 捲成球 → 掠食者不敢咬（cause → effect）。"]], "group": ["e10", "e11"]}, {"id": "e12", "kind": "para", "label": "Paragraph 12", "text": "In addition, the echidna's spines play another important role. They serve as camouflage to help the animal hide from predators. The spines are colored with sections of white, black, and brown. The spines blend well with the surrounding colors of rocks, soil, and dead leaves.", "u": [], "conn": [[0, 11]], "vocab": [[77, 87, "v3-8"], [117, 126, "v3-4"], [204, 209, "v3-9"], [224, 235, "v3-10"]], "qs": [{"id": "e12-2", "tag": "W", "label": "WORD", "ans": "幫動物躲起來", "tap": [], "choice": null, "groups": 1, "prompt": "They serve as <b>camouflage<\/b>：camouflage 的作用是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">幫動物躲起來<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">幫動物變大<\/button><\/span>"}, {"id": "e12-3", "tag": "T", "label": "THINKING", "ans": "armor（保護）；camouflage（偽裝）", "tap": [], "choice": {"opts": ["food（食物）；armor（保護）", "armor（保護）；camouflage（偽裝）", "camouflage（偽裝）；armor（保護）"], "ok": 1}, "groups": 0, "prompt": "spines 的第一個作用（§11）是 <span class=\"slot\">？<\/span>；第二個作用（§12）是 <span class=\"slot\">？<\/span>。"}, {"id": "e12-4", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ rocks, soil, and dead leaves", "tap": ["rocks, soil, and dead leaves"], "choice": null, "groups": 0, "prompt": "畫出：spines 和哪些東西的顏色 blend？"}], "labs": []}, {"id": "e13", "kind": "para", "label": "Paragraph 13", "text": "Like all other mammals, the echidna also has fur, though some echidnas are furrier than others. The amount of fur depends upon where the echidnas live. Echidnas occupy a range of habitats, from the chillier regions of Australia to warmer, drier places in New Guinea. The ones in colder areas tend to have more fur. Those in warmer climates have less.", "u": [[15, 22]], "conn": [[0, 4], [50, 56]], "vocab": [[15, 22, "v1-8"], [75, 82, "r3-4"], [114, 126, "v3-11"], [161, 167, "v3-12"], [168, 178, "v3-13"], [179, 187, "v3-14"], [198, 206, "r3-5"], [207, 214, "v3-15"], [331, 339, "v3-16"]], "qs": [{"id": "e13-3", "tag": "T", "label": "THINKING", "ans": "where the echidnas live（住在哪裡）；比較多", "tap": [], "choice": {"opts": ["how old they are", "what they eat", "where they live"], "ok": 2}, "groups": 1, "prompt": "毛的多少取決於 <span class=\"slot\">？<\/span>。住在比較冷的地方，毛 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">比較多<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">比較少<\/button><\/span>。"}], "labs": [["green", "WORD LINKS", "play a role / camouflage / blend / surrounding / depends upon / occupy / a range of / habitats / regions / climates"], ["purple", "THINKING LAB", "spines 的第二個作用是偽裝；毛的多少跟著氣候變：這也是 adaptation。"]], "group": ["e12", "e13"]}], "gist": {"opts": ["The echidna's spines are soft, so dingoes like to eat them.", "Echidnas grow new spines every winter.", "The echidna's spines protect it like armor and help it hide, and its fur changes with the climate."], "ok": 2}, "quiz": [{"w": "hollow", "opts": ["the natural homes of animals or plants", "many different kinds of", "empty inside"], "ok": 2}, {"w": "material", "opts": ["a hard covering that protects the body", "what something is made of", "to have a job or a part in something"], "ok": 1}, {"w": "makes up", "opts": ["forms the parts of something", "to live in or fill a place", "a hard covering that protects the body"], "ok": 0}, {"w": "armor", "opts": ["a hard covering that protects the body", "empty inside", "colors or shapes that help an animal hide"], "ok": 0}, {"w": "predators", "opts": ["animals that hunt and eat other animals", "to mix in so you cannot tell things apart", "empty inside"], "ok": 0}, {"w": "approaches", "opts": ["large areas of land", "comes near", "is decided by"], "ok": 1}, {"w": "think twice", "opts": ["to think carefully before doing something", "forms the parts of something", "is decided by"], "ok": 0}, {"w": "play a role", "opts": ["to have a job or a part in something", "animals that hunt and eat other animals", "is decided by"], "ok": 0}, {"w": "camouflage", "opts": ["colors or shapes that help an animal hide", "large areas of land", "what something is made of"], "ok": 0}, {"w": "blend", "opts": ["large areas of land", "is decided by", "to mix in so you cannot tell things apart"], "ok": 2}, {"w": "surrounding", "opts": ["what something is made of", "all around something", "to mix in so you cannot tell things apart"], "ok": 1}, {"w": "depends upon", "opts": ["the usual weather in a place over a long time", "is decided by", "the natural homes of animals or plants"], "ok": 1}, {"w": "occupy", "opts": ["large areas of land", "to live in or fill a place", "colors or shapes that help an animal hide"], "ok": 1}, {"w": "a range of", "opts": ["to live in or fill a place", "many different kinds of", "the usual weather in a place over a long time"], "ok": 1}, {"w": "habitats", "opts": ["to have a job or a part in something", "the natural homes of animals or plants", "all around something"], "ok": 1}, {"w": "regions", "opts": ["large areas of land", "the usual weather in a place over a long time", "colors or shapes that help an animal hide"], "ok": 0}, {"w": "climates", "opts": ["what something is made of", "to have a job or a part in something", "the usual weather in a place over a long time"], "ok": 2}], "say": "Predators leave the echidna alone because its spines are like armor.", "pause": ["spines 的兩個作用（盔甲、偽裝），以及毛的多少跟著氣候變。", "rolling into a ball、the dingo、white, black, and brown spines、more fur in colder places。"], "tools": [{"id": "t3a", "title": "特徵 → 作用（cause and effect）", "how": "每一個特徵，都幫 echidna 做一件事。", "layout": "table", "head": ["Feature（Cause）", "How it helps（Effect）", "§"], "rows": [["spines like a coat of armor", {"s": "a1"}, {"s": "p1"}], ["rolling up into a ball", {"s": "a2"}, {"s": "p2"}], ["white, black, and brown spines", {"s": "a3"}, {"s": "p3"}], ["fur", {"s": "a4"}, {"s": "p4"}]], "cards": [{"t": "only spines show, so predators think twice before biting", "s": "a2", "w": null}, {"t": "§12", "s": "p3", "w": null}, {"t": "§11", "s": "p2", "w": null}, {"t": "§11", "s": "p1", "w": null}, {"t": "it keeps the echidna warm; colder places, more fur", "s": "a4", "w": null}, {"t": "they protect it from predators such as the dingo", "s": "a1", "w": null}, {"t": "§13", "s": "p4", "w": null}, {"t": "they blend with rocks, soil, and dead leaves (camouflage)", "s": "a3", "w": null}]}, {"id": "t3b", "title": "毛和氣候", "how": "住在比較冷或比較暖的地方，毛會怎樣？", "layout": "line", "rows": [["colder place →", {"s": "x1"}, "fur　｜　warmer place →", {"s": "x2"}, "fur"]], "cards": [{"t": "less", "s": "x2", "w": null}, {"t": "more", "s": "x1", "w": null}]}], "disp": 3}, {"n": 4, "title": "Echidna 4｜Tongue and Claws", "range": "Echidna §14–21", "cards": [{"id": "e14", "kind": "para", "label": "Paragraph 14", "text": "If you think the echidna's beak and spines are incredible, wait until you see its tongue! The echidna's tongue is a simply amazing tool. And it's perfectly adapted to capture the kinds of prey the echidna needs.", "u": [], "conn": [[0, 2]], "vocab": [[47, 57, "v4-0"], [167, 174, "v4-1"]], "qs": [{"id": "e14-1", "tag": "R", "label": "WRITER", "ans": "吸引讀者繼續讀下一個特徵", "tap": [], "choice": null, "groups": 1, "prompt": "<b>If you think … wait until you see its tongue!<\/b>：作者用這句 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">吸引讀者繼續讀下一個特徵<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">結束文章<\/button><\/span>"}, {"id": "e14-2", "tag": "T", "label": "THINKING", "ans": "its tongue（舌頭）", "tap": ["its tongue"], "choice": null, "groups": 0, "prompt": "前面介紹了 beak 和 spines，這一段開始介紹 <span class=\"slot\" data-s=\"0\">？<\/span>。"}, {"id": "e14-3", "tag": "W", "label": "WORD", "ans": "抓住", "tap": [], "choice": null, "groups": 1, "prompt": "perfectly adapted to <b>capture<\/b> the kinds of prey：capture = <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">抓住<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">放走<\/button><\/span>"}], "labs": []}, {"id": "e15", "kind": "para", "label": "Paragraph 15", "text": "There are two different kinds of echidna tongues. That's because different kinds of echidnas eat different kinds of food. One type of echidna has a long sticky tongue; the other type has a short tongue that is covered with hooks.", "u": [[168, 177]], "conn": [[50, 64]], "vocab": [[153, 159, "v4-2"], [223, 228, "v4-3"]], "qs": [{"id": "e15-3", "tag": "T", "label": "THINKING", "ans": "① a long sticky tongue　② a short tongue covered with hooks", "tap": [], "choice": {"opts": ["a short tongue；a tongue with teeth", "a forked tongue；a hard tongue", "a long sticky tongue；a short tongue covered with hooks"], "ok": 2}, "groups": 0, "prompt": "兩種舌頭：① <span class=\"slot\">？<\/span>　② <span class=\"slot\">？<\/span>"}], "labs": [["green", "WORD LINKS", "incredible / capture / sticky / hooks"], ["purple", "THINKING LAB", "新特徵：舌頭。不同的 echidna 吃不同的食物，所以舌頭也不同（cause → effect）。"]], "group": ["e14", "e15"]}, {"id": "e16", "kind": "para", "label": "Paragraph 16", "text": "It may seem backward, but the short-beaked echidna has a long, sticky tongue. The tongue is extremely flexible. It's great for grabbing ants, termites, and other tiny prey. The short-beaked echidna is expert at flicking its tongue into the nooks and crannies where those animals live.", "u": [], "conn": [[22, 25]], "vocab": [[63, 69, "v4-2"], [102, 110, "v4-4"], [127, 135, "v4-5"], [142, 150, "r4-0"], [211, 219, "r4-1"], [240, 258, "v4-6"]], "qs": [{"id": "e16-2", "tag": "W", "label": "WORD", "ans": "很容易彎曲", "tap": [], "choice": null, "groups": 1, "prompt": "The tongue is extremely <b>flexible<\/b>：flexible = <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">很容易彎曲<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很硬<\/button><\/span>"}, {"id": "e16-3", "tag": "T", "label": "THINKING", "ans": "ants, termites, and other tiny prey", "tap": ["ants, termites, and other tiny prey"], "choice": null, "groups": 0, "prompt": "short-beaked echidna 吃什麼？<span class=\"slot\" data-s=\"0\">？<\/span>"}], "labs": []}, {"id": "e17", "kind": "para", "label": "Paragraph 17", "text": "The long-beaked echidna doesn't eat ants at all. In fact, worms are its only prey. But its tongue is perfectly adapted for worm catching. The long-beaked echidna probes the soil with its beak. When it finds a worm, it sticks out its tongue. The tiny hooks on the tongue hook into the earthworm. Then the echidna pulls its tongue back into its mouth, and the earthworm becomes lunch!", "u": [], "conn": [[49, 56], [193, 197], [295, 299]], "vocab": [[162, 168, "r4-2"], [218, 228, "v4-7"], [250, 255, "v4-3"], [284, 293, "r4-3"], [358, 367, "r4-3"]], "qs": [{"id": "e17-2", "tag": "W", "label": "WORD", "ans": "hooks 是名詞（鉤子）；hook 是動詞（鉤住）", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\">The tiny <b>hooks<\/b> on the tongue <b>hook<\/b> into the earthworm：第一個字是<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">hooks 是名詞（鉤子）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">hooks 是動詞<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">第二個字是<\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">hook 是動詞（鉤住）<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">hook 是名詞<\/button><\/span><\/div>"}, {"id": "e17-3", "tag": "T", "label": "THINKING", "ans": "sticks out its tongue；pulls its tongue back into its mouth", "tap": ["sticks out its tongue", "pulls its tongue back into its mouth"], "choice": null, "groups": 0, "prompt": "long-beaked echidna 抓蟲的順序：probes the soil → <span class=\"slot\" data-s=\"0\">？<\/span> → the hooks hook into the earthworm → <span class=\"slot\" data-s=\"1\">？<\/span>"}], "labs": [["green", "WORD LINKS", "flexible / grabbing / nooks and crannies / sticks out"], ["purple", "THINKING LAB", "短嘴配長舌（吃螞蟻）；長嘴配有鉤的短舌（只吃蟲）。兩種 adaptation 的比較。"]], "group": ["e16", "e17"]}, {"kind": "brk", "text": "☕ 休息點｜可以在這裡分兩次做。下次從 Paragraph 18 開始。"}, {"id": "e18", "kind": "para", "label": "Paragraph 18", "text": "When it comes to predators, the echidna has another secret weapon: its claws. When an echidna is startled or attacked, it hides by doing something no other mammal in the world can do. It digs itself straight down into the ground.", "u": [[156, 162]], "conn": [[78, 82]], "vocab": [[52, 65, "r4-5"], [71, 76, "v4-8"], [97, 105, "v4-9"], [156, 162, "v1-8"]], "qs": [{"id": "e18-2", "tag": "R", "label": "WRITER", "ans": "武器", "tap": [], "choice": null, "groups": 1, "prompt": "<b>secret weapon<\/b>：作者把 claws 比成 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">武器<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">食物<\/button><\/span>"}, {"id": "e18-3", "tag": "T", "label": "THINKING", "ans": "It digs itself straight down into the ground.", "tap": ["digs itself straight down into the ground"], "choice": null, "groups": 0, "prompt": "echidna 被嚇到時，做了一件別的 mammal 都做不到的事：<span class=\"slot\" data-s=\"0\">？<\/span>"}], "labs": []}, {"id": "e19", "kind": "para", "label": "Paragraph 19", "text": "How does the echidna pull off this trick? The claws play a big role. Tough and heavy, they can move a lot of dirt in a short amount of time. Other adaptations help the claws do their job.", "u": [[147, 158]], "conn": [], "vocab": [[21, 29, "v4-10"], [46, 51, "v4-8"], [109, 113, "r4-4"], [147, 158, "v1-9"], [168, 173, "v4-8"]], "qs": [{"id": "e19-1", "tag": "R", "label": "WRITER", "ans": "帶出下面的解釋", "tap": [], "choice": null, "groups": 1, "prompt": "<b>How does the echidna pull off this trick?<\/b>：作者用問句 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">帶出下面的解釋<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">考讀者<\/button><\/span>"}, {"id": "e19-3", "tag": "T", "label": "THINKING", "ans": "其他幫忙挖洞的特徵", "tap": [], "choice": null, "groups": 1, "prompt": "Other adaptations help the claws：下一段會介紹 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">其他幫忙挖洞的特徵<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">echidna 的食物<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "claws / startled / pull off"], ["purple", "THINKING LAB", "claws 是祕密武器：被嚇到 → 直直挖進土裡。"]], "group": ["e18", "e19"]}, {"id": "e20", "kind": "para", "label": "Paragraph 20", "text": "First of all, the echidna has a strong skeleton. Second, the echidna might be small, but it's incredibly muscular. Those muscles can pull hard to dig very fast!", "u": [], "conn": [[0, 12], [49, 55], [85, 88]], "vocab": [[39, 47, "v4-11"], [105, 113, "v4-12"], [121, 128, "v4-13"]], "qs": [{"id": "e20-2", "tag": "T", "label": "THINKING", "ans": "① a strong skeleton　② strong muscles（incredibly muscular）", "tap": [], "choice": {"opts": ["soft spines；a sticky tongue", "sharp teeth；a long tail", "a strong skeleton；strong muscles"], "ok": 2}, "groups": 0, "prompt": "幫 claws 挖洞的兩個 adaptations：① <span class=\"slot\">？<\/span>　② <span class=\"slot\">？<\/span>"}], "labs": []}, {"id": "e21", "kind": "para", "label": "Paragraph 21", "text": "When a predator approaches, the claws, skeleton, and muscles of the echidna go to work. In seconds, the small mammal can burrow almost completely into the earth! Once the echidna is dug in, its camouflage spines make it very hard to see. And because the only part that's exposed is spines, many predators will pass it by.", "u": [[110, 116], [121, 127]], "conn": [[0, 4], [242, 249]], "vocab": [[32, 37, "v4-8"], [39, 47, "v4-11"], [53, 60, "v4-13"], [110, 116, "v1-8"], [121, 127, "v7-1"], [271, 278, "v4-15"], [310, 320, "v4-16"]], "qs": [{"id": "e21-1", "tag": "W", "label": "WORD", "ans": "開始動起來", "tap": [], "choice": null, "groups": 1, "prompt": "the claws, skeleton, and muscles <b>go to work<\/b>：go to work 在這裡是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">開始動起來<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">去上班<\/button><\/span>"}, {"id": "e21-4", "tag": "T", "label": "THINKING", "ans": "cause-and-effect 結構；發生什麼事、造成什麼結果", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\">課本說 §21 用的是<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">cause-and-effect 結構<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">description 結構<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">因為它一步一步說明<\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">發生什麼事、造成什麼結果<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">echidna 長什麼樣子<\/button><\/span><\/div>"}], "labs": [["green", "WORD LINKS", "skeleton / muscular / muscles / burrow / exposed / pass it by"], ["purple", "THINKING LAB", "§21 是 cause and effect：掠食者靠近 → 挖進土裡 → 只露出 spines → 掠食者走開。"]], "group": ["e20", "e21"]}], "gist": {"opts": ["All echidnas have the same short tongue with hooks.", "The echidna's tongue fits the food it eats, and its strong claws let it dig into the ground to escape.", "The echidna fights predators with its sharp teeth."], "ok": 1}, "quiz": [{"w": "incredible", "opts": ["so amazing that it is hard to believe", "sharp, curved nails on an animal's feet", "to catch"], "ok": 0}, {"w": "capture", "opts": ["all the bones of a body", "to catch", "taking hold of something quickly"], "ok": 1}, {"w": "sticky", "opts": ["suddenly surprised or scared", "able to stick to things", "able to bend easily"], "ok": 1}, {"w": "hooks", "opts": ["having big, strong muscles", "curved pieces that catch and hold things", "taking hold of something quickly"], "ok": 1}, {"w": "flexible", "opts": ["taking hold of something quickly", "curved pieces that catch and hold things", "able to bend easily"], "ok": 2}, {"w": "grabbing", "opts": ["curved pieces that catch and hold things", "to dig a hole and go into it", "taking hold of something quickly"], "ok": 2}, {"w": "nooks and crannies", "opts": ["curved pieces that catch and hold things", "small, hidden spaces", "so amazing that it is hard to believe"], "ok": 1}, {"w": "sticks out", "opts": ["small, hidden spaces", "pushes out from the body", "curved pieces that catch and hold things"], "ok": 1}, {"w": "claws", "opts": ["to manage to do something hard", "sharp, curved nails on an animal's feet", "having big, strong muscles"], "ok": 1}, {"w": "startled", "opts": ["to go past without stopping", "small, hidden spaces", "suddenly surprised or scared"], "ok": 2}, {"w": "pull off", "opts": ["to manage to do something hard", "to dig a hole and go into it", "to catch"], "ok": 0}, {"w": "skeleton", "opts": ["all the bones of a body", "curved pieces that catch and hold things", "able to bend easily"], "ok": 0}, {"w": "muscular", "opts": ["so amazing that it is hard to believe", "to catch", "having big, strong muscles"], "ok": 2}, {"w": "muscles", "opts": ["small, hidden spaces", "body parts that help you move and pull", "curved pieces that catch and hold things"], "ok": 1}, {"w": "burrow", "opts": ["taking hold of something quickly", "small, hidden spaces", "to dig a hole and go into it"], "ok": 2}, {"w": "exposed", "opts": ["to go past without stopping", "not covered; easy to see", "so amazing that it is hard to believe"], "ok": 1}, {"w": "pass it by", "opts": ["suddenly surprised or scared", "taking hold of something quickly", "to go past without stopping"], "ok": 2}], "say": "Many predators pass the echidna by because only its spines are showing.", "pause": ["兩種舌頭配合不同的食物；claws、skeleton、muscles 讓 echidna 很快挖進土裡躲起來。", "sticky tongue（ants, termites）、hooked tongue（worms）、digging straight down。"], "tools": [{"id": "t4a", "title": "兩種舌頭比較", "how": "short-beaked 和 long-beaked echidna 的舌頭、食物、抓法有什麼不同？", "layout": "table", "head": ["", "short-beaked echidna", "long-beaked echidna"], "rows": [["Tongue", {"s": "a1"}, {"s": "a2"}], ["Food", {"s": "b1"}, {"s": "b2"}], ["How it catches food", {"s": "c1"}, {"s": "c2"}]], "cards": [{"t": "ants, termites, and other tiny prey", "s": "b1", "w": null}, {"t": "short and covered with hooks", "s": "a2", "w": null}, {"t": "probes the soil, sticks out its tongue, and hooks the worm", "s": "c2", "w": null}, {"t": "long, sticky, and flexible", "s": "a1", "w": null}, {"t": "flicks its tongue into nooks and crannies", "s": "c1", "w": null}, {"t": "worms only", "s": "b2", "w": null}]}, {"id": "t4b", "title": "挖洞因果鏈（§21）", "how": "掠食者靠近時，echidna 會怎麼做？", "layout": "table", "head": ["A predator approaches →", "The echidna…", "Only … is showing", "So predators…"], "rows": [["（開始）", {"s": "k1"}, {"s": "k2"}, {"s": "k3"}]], "cards": [{"t": "pass it by", "s": "k3", "w": null}, {"t": "uses its claws, skeleton, and muscles to dig into the earth", "s": "k1", "w": null}, {"t": "its camouflage spines", "s": "k2", "w": null}, {"t": "attack it", "s": null, "w": null}]}], "disp": 4}, {"n": 5, "title": "Echidna 5｜Hidden Muscles and a Cool Body", "range": "Echidna §22–28", "cards": [{"id": "e22", "kind": "para", "label": "Paragraph 22", "text": "What's the echidna's most amazing adaptation? Some people might think it is the beak. Others might vote for the spines or the echidna's digging ability. But the echidna has another amazing adaptation that you can't see. It's a special layer of muscle that wraps around the echidna's whole body.", "u": [[34, 44], [46, 50], [86, 92], [189, 199]], "conn": [], "vocab": [[34, 44, "v1-9"], [144, 151, "v5-0"], [189, 199, "v1-9"], [235, 240, "v5-1"], [256, 268, "v5-2"]], "qs": [{"id": "e22-1", "tag": "R", "label": "WRITER", "ans": "帶出新的特徵", "tap": [], "choice": null, "groups": 1, "prompt": "<b>What's the echidna's most amazing adaptation?<\/b>：作者用問句開頭，是為了 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">帶出新的特徵<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">結束文章<\/button><\/span>"}, {"id": "e22-3", "tag": "T", "label": "THINKING", "ans": "a special layer of muscle that wraps around its whole body", "tap": [], "choice": {"opts": ["a special layer of muscle around its whole body", "a hidden second tongue", "sensors inside its spines"], "ok": 0}, "groups": 0, "prompt": "作者說的那個看不到的 adaptation 是 <span class=\"slot\">？<\/span>"}], "labs": []}, {"id": "e23", "kind": "para", "label": "Paragraph 23", "text": "This muscle layer makes the echidna's body very strong. And even more important, it allows the echidna to change its shape. It can roll itself up into a ball. Or it can flatten itself to the thickness of a spiny pancake.", "u": [], "conn": [[60, 79], [159, 161]], "vocab": [[12, 17, "v5-1"], [84, 90, "v5-3"], [169, 176, "v5-4"], [191, 200, "v5-5"], [212, 219, "r5-5"]], "qs": [{"id": "e23-3", "tag": "R", "label": "WRITER", "ans": "有刺的鬆餅；容易想像", "tap": [], "choice": null, "groups": 2, "prompt": "<div class=\"pair\"><span class=\"pl\">the thickness of a <b>spiny pancake<\/b>：作者把扁扁的 echidna 比成<\/span><span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">有刺的鬆餅<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">一顆球<\/button><\/span><\/div><div class=\"pair\"><span class=\"pl\">讓讀者<\/span><span class=\"og\" data-g=\"1\"><button type=\"button\" class=\"opt\" data-ok=\"1\">容易想像<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">覺得害怕<\/button><\/span><\/div>"}], "labs": []}, {"id": "e24", "kind": "para", "label": "Paragraph 24", "text": "That extreme flexibility comes in handy. The echidna can squish itself flat to squeeze into a hiding spot when a predator lurks. It can turn itself into a ball of spines to protect itself from a hungry dingo.", "u": [[0, 4]], "conn": [], "vocab": [[5, 12, "v5-6"], [13, 24, "v5-7"], [25, 39, "v5-8"], [57, 63, "r5-0"], [79, 91, "v5-9"], [122, 127, "r5-1"]], "qs": [{"id": "e24-2", "tag": "W", "label": "WORD", "ans": "派得上用場", "tap": [], "choice": null, "groups": 1, "prompt": "comes in handy = <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">派得上用場<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">拿在手上<\/button><\/span>"}, {"id": "e24-3", "tag": "T", "label": "THINKING", "ans": "① squeeze into a hiding spot　② protect itself from a hungry dingo", "tap": ["squeeze into a hiding spot", "protect itself from a hungry dingo"], "choice": null, "groups": 0, "prompt": "flexibility 的兩個用處：① 壓扁 → <span class=\"slot\" data-s=\"0\">？<\/span>　② 捲成球 → <span class=\"slot\" data-s=\"1\">？<\/span>"}], "labs": [["green", "WORD LINKS", "ability / layer / wraps around / allows / flatten / thickness / extreme / flexibility / comes in handy / squeeze into"], ["purple", "THINKING LAB", "看不到的 adaptation：肌肉層 → 能改變形狀 → 擠進洞裡或捲成球保護自己（cause → effect）。"]], "group": ["e22", "e23", "e24"]}, {"id": "e25", "kind": "para", "label": "Paragraph 25", "text": "The echidna has one more unique feature. The echidna's body temperature is about 85 to 89 degrees Fahrenheit. (In case you are wondering, your own body temperature is a toasty 98.6 degrees Fahrenheit.) That means the echidna has a lower body temperature than any other mammal.", "u": [[25, 31], [269, 275]], "conn": [[16, 24], [202, 212]], "vocab": [[25, 31, "v1-0"], [55, 71, "v5-10"], [98, 108, "r5-2"], [147, 163, "v5-10"], [169, 175, "r5-3"], [189, 199, "r5-2"], [237, 253, "v5-10"], [269, 275, "v1-8"]], "qs": [{"id": "e25-2", "tag": "R", "label": "WRITER", "ans": "補充：用讀者自己的體溫來比較", "tap": [], "choice": null, "groups": 1, "prompt": "括號 ( ) 裡的句子是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">補充：用讀者自己的體溫來比較<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">新的重點<\/button><\/span>"}, {"id": "e25-3", "tag": "T", "label": "THINKING", "ans": "85–89；98.6；低", "tap": [], "choice": {"opts": ["98.6；85–89", "70–75；98.6", "85–89；98.6"], "ok": 2}, "groups": 1, "prompt": "echidna 的體溫約 <span class=\"slot\">？<\/span>°F；你的體溫是 <span class=\"slot\">？<\/span>°F。所以 echidna 的體溫比所有 mammals 都 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">低<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">高<\/button><\/span>"}], "labs": []}, {"id": "e26", "kind": "para", "label": "Paragraph 26", "text": "Scientists think that a cool body temperature might help the echidna live longer. Surprisingly, echidnas live as long as 45 years in the wild. Other small mammals don't live nearly as long. When they need to, echidnas can turn down their body temperature even lower than normal. When they do this, all their body functions, such as breathing, heart rate, and digestion, slow down too. This state is called torpor, and it's a bit like hibernation.", "u": [[155, 162]], "conn": [[82, 94], [324, 331]], "vocab": [[29, 45, "v5-10"], [130, 141, "v5-11"], [155, 162, "v1-8"], [238, 254, "v5-10"], [313, 322, "v5-12"], [343, 353, "v5-13"], [359, 368, "v5-14"], [390, 395, "v5-15"], [406, 412, "r5-4"], [434, 445, "v5-16"]], "qs": [{"id": "e26-2", "tag": "W", "label": "WORD", "ans": "這件事讓人驚訝", "tap": [], "choice": null, "groups": 1, "prompt": "<b>Surprisingly<\/b>, echidnas live as long as 45 years：Surprisingly 表示 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">這件事讓人驚訝<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">這件事很普通<\/button><\/span>"}, {"id": "e26-4", "tag": "W", "label": "WORD", "ans": "slow down；hibernation（冬眠）", "tap": ["slow down", "hibernation"], "choice": null, "groups": 0, "prompt": "This state is called <b>torpor<\/b>：體溫降低，身體功能都 <span class=\"slot\" data-s=\"0\">？<\/span>，有點像 <span class=\"slot\" data-s=\"1\">？<\/span>"}], "labs": [["green", "WORD LINKS", "body temperature / in the wild / functions / heart rate / digestion / state / hibernation"], ["purple", "THINKING LAB", "最後一個特徵：體溫低。科學家推測這讓 echidna 活得久（可以到 45 年）。"]], "group": ["e25", "e26"]}, {"id": "e27", "kind": "para", "label": "Paragraph 27", "text": "When in torpor, the echidna uses less energy. So it needs less food. This is useful during the winter, when prey is harder to find. It's also helpful during times of crisis, such as when a forest fire occurs.", "u": [], "conn": [[46, 48], [174, 181]], "vocab": [[8, 14, "r5-4"], [38, 44, "v5-17"], [166, 172, "v5-18"], [189, 200, "r5-6"], [201, 207, "v5-19"]], "qs": [{"id": "e27-2", "tag": "T", "label": "THINKING", "ans": "① during the winter, when prey is harder to find　② during times of crisis, such as a forest fire", "tap": [], "choice": {"opts": ["in summer, when food is everywhere；when it is very hungry", "in winter, when prey is harder to find；in a crisis, such as a forest fire", "in the morning；when it lays eggs"], "ok": 1}, "groups": 0, "prompt": "torpor 在哪兩種時候有用？① <span class=\"slot\">？<\/span>　② <span class=\"slot\">？<\/span>"}, {"id": "e27-3", "tag": "E", "label": "✎ EVIDENCE", "ans": "✎ When in torpor, the echidna uses less energy. So it needs less food.", "tap": ["When in torpor, the echidna uses less energy. So it needs less food"], "choice": null, "groups": 0, "mode": "sentence", "prompt": "畫出 §27 的因果：torpor → less energy → less food。"}], "labs": []}, {"id": "e28", "kind": "para", "label": "Paragraph 28", "text": "Scientists think this trait is one reason that the echidna has managed to survive. But it's just one of the adaptations that makes the tiny, spiny echidna one of the most amazing creatures on Earth.", "u": [[17, 27], [108, 119], [179, 188]], "conn": [[83, 86]], "vocab": [[63, 73, "v5-20"], [74, 81, "v5-21"], [108, 119, "v1-9"], [179, 188, "v1-1"]], "qs": [{"id": "e28-2", "tag": "T", "label": "THINKING", "ans": "結論：很多 adaptations 讓 echidna 活下來", "tap": [], "choice": null, "groups": 1, "prompt": "最後一段是 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">結論：很多 adaptations 讓 echidna 活下來<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">另一個新的特徵<\/button><\/span>"}, {"id": "e28-3", "tag": "R", "label": "WRITER", "ans": "好記又有趣", "tap": [], "choice": null, "groups": 1, "prompt": "結尾的 the <b>tiny, spiny<\/b> echidna：這兩個押韻的字讓結尾 <span class=\"og\" data-g=\"0\"><button type=\"button\" class=\"opt\" data-ok=\"1\">好記又有趣<\/button><button type=\"button\" class=\"opt\" data-ok=\"0\">很嚴肅<\/button><\/span>"}], "labs": [["green", "WORD LINKS", "energy / crisis / occurs / managed to / survive"], ["purple", "THINKING LAB", "torpor → 少用能量 → 少吃東西 → 冬天和災難時也活得下來。結論：很多 adaptations 讓 echidna survive。"]], "group": ["e27", "e28"]}], "gist": {"opts": ["A hidden muscle layer and a low ng uses <b>description<\/b> text structure to explain how the echidna uses its beak. Conclude: The description supports the author's purpose by organizing information in a way that is easy to understand.", "layout": "line", "rows": [["Identify: Mike Jung uses", {"s": "a1"}, "text structure to explain", {"s": "a2"}, "."], ["Conclude: This structure supports the author's purpose because it", {"s": "a3"}, "."]], "cards": [{"t": "description", "s": null, "w": null}, {"t": "cause-and-effect", "s": "a1", "w": null}, {"t": "what happens when a predator approaches", "s": "a2", "w": null}, {"t": "shows how one event leads to another", "s": "a3", "w": null}, {"t": "what the echidna's beak looks like", "s": null, "w": null}], "section": "Reading Skills 閱讀技巧", "sub": "每個 Unit 的 Close Read 都在練這些"}, {"id": "s3", "title": "2　Monitor Comprehension 哪裡看不懂？", "how": "讀到卡住時，照這個順序做。", "layout": "table", "head": ["Step", "What I do"], "rows": [["1", {"s": "m1"}], ["2", {"s": "m2"}], ["3", {"s": "m3"}], ["4", {"s": "m4"}]], "cards": [{"t": "Find where my confusion began.", "s": "m1", "w": null}, {"t": "Go back and reread the paragraph before it.", "s": "m2", "w": null}, {"t": "Ask how this paragraph connects to the ones around it.", "s": "m3", "w": null}, {"t": "Skip the hard part and never come back.", "s": null, "w": null}, {"t": "Say what I learned after rereading.", "s": "m4", "w": null}]}, {"id": "s4", "title": "3　Parts of Speech 同一個字根，不同詞性", "how": "把動詞變成名詞。課本例子：organize → organization。", "layout": "table", "head": ["Verb", "Noun", "Verb", "Noun"], "rows": [["adapt", {"s": "n1"}, "survive", {"s": "n2"}], ["classify", {"s": "n3"}, "collect", {"s": "n4"}], ["digest", {"s": "n5"}, "reproduce", {"s": "n6"}]], "cards": [{"t": "classification", "s": "n3", "w": null}, {"t": "digestion", "s": "n5", "w": null}, {"t": "reproduction", "s": "n6", "w": null}, {"t": "digestive", "s": null, "w": null}, {"t": "adaptation", "s": "n1", "w": null}, {"t": "survival", "s": "n2", "w": null}, {"t": "colle
